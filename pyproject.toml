[project]
name = "visual-language-model-spark"
version = "0.1.0"
description = "Repository For Vision and Language Models : Will Combine Detection/Segmentation Models with Language Models"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.14.0",
    "pytest>=9.1.1",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "opencv-python>=5.0.0.93",
    "torchvision>=0.29.0",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "object_detection"
]
