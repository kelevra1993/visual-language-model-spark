[project]
name = "visual-language-model-spark"
version = "0.1.0"
description = "Repository For Vision-Language Models : Initially started as a vision repository, it is expanding to cover language, through CLIP like training"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.14.0",
    "pytest>=9.1.1",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "torchvision>=0.29.0",
    "fiftyone>=1.22.0",
    "tensorboard>=2.21.0",
    "opencv-python>=5.0.0.93",
    "nvidia-dali-cuda120>=2.3.0",
    "kornia>=0.8.3",
    "onnx>=1.23.1",
    "onnxscript>=0.7.2",
    "tritonclient[grpc]>=2.72.0",
    "onnxruntime>=1.30.0",
    "tqdm>=4.70.1",
    "huggingface-hub>=2.1.1",
    "pyarrow>=25.0.1",
    "matplotlib>=3.11.2",
    "gdown>=6.4.1",
    "boto3>=1.43.93",
]

[tool.pytest.ini_options]
# Every import is package-qualified (vision_training..., tests..., scripts...), resolved from the repository root
pythonpath = [
  "."
]
# Import the test files by their path, so that two test files can share a name in different folders
addopts = "--import-mode=importlib"

[dependency-groups]
dev = []
