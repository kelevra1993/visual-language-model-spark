  # scripts/evaluation/evaluate_checkpoint.py into the Checkpoint_Evaluation folder of the run
  classification_evaluation:
    folder: readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9/Checkpoint_Evaluation
    trained_with: "scripts/evaluation/evaluate_checkpoint.py on iteration 1500 of the classification run, with at most 10 error images per pair of classes (maximum_error_images_per_class_pair 10) and track_evaluation False, run again with the current code on 2026-11-15 (first evaluation 2026-10-23)"
