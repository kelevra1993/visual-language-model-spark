# Real runs read by the figure scripts of the tutorials (tutorials/figures/<series>/figures.py), relative to the
# experiments folder of the build (--experiments-folder, ~/Data/tutorial_runs of tutorial_project.yaml by default,
# outside the repository so that cleaning its experiments/ keeps them; the runs trained before were copied there). The runs
# are not in git: a build on another machine first trains them again with the configuration and changes given under
# every run, then updates the run folder here when its run name changed (the run name follows the configuration).
# Every run is read as it is: its checkpoints (on the CPU), its TensorBoard logs, its Results.txt and Evaluation folder,
# and its training_configuration.yaml, which also gives its dataset.
runs:
  classification:
    folder: readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9
    trained_with: "vision_training/configurations/classification/configuration_synthetic_shapes.yaml on the 9-class synthetic shapes dataset, 1500 iterations, learning rate 0.0002, a checkpoint every 250 iterations (intermediate_weight_saving_iterations 250) evaluated every 500 (weight_saving_iterations 500), MLflow tracking on, with the augmentation probabilities the file had then (0.3 for most types, 0.25 now)"
  # Standalone evaluation of the classification run, whose error images the classification figures show; written by
  # scripts/evaluation/evaluate_checkpoint.py into the Checkpoint_Evaluation folder of the run
  classification_evaluation:
    folder: readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9/Checkpoint_Evaluation
    trained_with: "scripts/evaluation/evaluate_checkpoint.py on iteration 1500 of the classification run, with at most 10 error images per pair of classes (maximum_error_images_per_class_pair 10) and track_evaluation False, run again with the current code on 2026-11-15 (first evaluation 2026-10-23)"
  classification_learning_rates:
    folders:
      - readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9_lr-0.001
      - readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9_lr-0.0005
      - readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9_lr-0.0001
    trained_with: "the classification run with learning rates of 0.001, 0.0005 and 0.0001, told apart by run_name_suffix"
  object_detection:
    folder: tutorials/DET_IN-KAR-512_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L567-NFPN32BN_A6.32-256.e7b72c_RBN-R2x32-RPL_DSE-DRES-DBN-D7.2x32.64.32_MC20
    trained_with: "tutorials/run_configurations/object_detection_synthetic_shapes_tutorial.yaml (vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml as shipped, experiment_folder ~/Data/tutorial_runs/tutorials) on the instance segmentation synthetic dataset, 2000 iterations, trained on 2026-11-15 on a GPU shared with two other trainings (its throughput is not that of a lone run), its console output saved as tutorials/object_detection.log"
  # Stage 7 of the detection benchmark, read by tutorials/figures/object_detection/proposal_selection.py: the two
  # launches of each proposal selection and the inference-only preview of the per-level selection on run_9, copied from
  # hyperparameter_experiments/ of the repository into hyperparameter_experiments/ of the experiments folder of the build
  object_detection_benchmark_joint_a:
    folder: hyperparameter_experiments/object_detection/run_9/DET_IN-KAR-1024_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L4567-NFPN32BN_A6.16-768.d8ffba_RBN-R2x32_DSE-DRES-DBN-D7.2x32.64.32_MC35
    trained_with: "run-1.yaml of the detection benchmark (its fixed settings and starting values in documentation/architecture_benchmarking/object_detection_experiment_plan.md) with learning rate 1e-3, background IoU minimum 0.1 and the feature pyramid neck (stage 3 of the plan), RegionProposal.proposal_selection joint, 15,000 iterations, two launches side by side (run_9)"
  object_detection_benchmark_joint_b:
    folder: hyperparameter_experiments/object_detection/run_10/DET_IN-KAR-1024_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L4567-NFPN32BN_A6.16-768.d8ffba_RBN-R2x32_DSE-DRES-DBN-D7.2x32.64.32_MC35
    trained_with: "run-1.yaml of the detection benchmark (its fixed settings and starting values in documentation/architecture_benchmarking/object_detection_experiment_plan.md) with learning rate 1e-3, background IoU minimum 0.1 and the feature pyramid neck (stage 3 of the plan), RegionProposal.proposal_selection joint, 15,000 iterations, two launches side by side (run_10)"
  object_detection_benchmark_per_level_a:
    folder: hyperparameter_experiments/object_detection/run_21/DET_IN-KAR-1024_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L4567-NFPN32BN_A6.16-768.d8ffba_RBN-R2x32-RPL_DSE-DRES-DBN-D7.2x32.64.32_MC35
    trained_with: "the settings of run_9 and run_10 with RegionProposal.proposal_selection per_level (stage 7 of documentation/architecture_benchmarking/object_detection_experiment_plan.md), 15,000 iterations, two launches side by side (run_21)"
  object_detection_benchmark_per_level_b:
    folder: hyperparameter_experiments/object_detection/run_22/DET_IN-KAR-1024_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L4567-NFPN32BN_A6.16-768.d8ffba_RBN-R2x32-RPL_DSE-DRES-DBN-D7.2x32.64.32_MC35
    trained_with: "the settings of run_9 and run_10 with RegionProposal.proposal_selection per_level (stage 7 of documentation/architecture_benchmarking/object_detection_experiment_plan.md), 15,000 iterations, two launches side by side (run_22)"
  object_detection_benchmark_per_level_preview:
    folder: hyperparameter_experiments/object_detection/run_9/evaluations/DET_IN-KAR-1024_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L4567-NFPN32BN_A6.16-768.d8ffba_RBN-R2x32_DSE-DRES-DBN-D7.2x32.64.32_MC35_proposal_selection_per_level
    trained_with: "scripts/evaluation/evaluate_checkpoint.py on iteration 15,000 of run_9 with RegionProposal.proposal_selection per_level and the greedy final NMS of the run (the stage 7 preview of the plan)"
  instance_segmentation:
    folder: readme_screenshots/INS_IN-KAR-512_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L567_A6.32-256.e7b72c_RBN-R2x32_DSE-DRES-DBN-D7.2x32.64.32_MRES-MBN-MUTC-M14.3x32-MR28_MC20
    trained_with: "vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml, shortened, resumed to 5000 iterations"
  keypoint_detection:
    folder: keypoint_focal_synthetic/experiments/KPT_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x64_HRSE-HRRES-HRBN-HR16.1.2.2x2_K243-KH256-HH_MC33
    trained_with: "vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml of 2026-10-17 with the focal heatmap loss, number_iterations 6000, decay_iterations 5500, the augmentation probabilities of that time (0.3 for most types, 0.5 for random_translation and random_hue, 0.2 for random_solarize, random_haze off), evaluated in training on the first 1024 images of the synthetic test split (a temporary copy, since removed), its checkpoints 2000, 4000 and 6000 evaluated again on 2026-11-15 with the current code by scripts/evaluation/evaluate_checkpoint.py on the same first 1024 images (validation_data_folder set to synthetic_shapes/validation)"
  semantic_segmentation:
    folder: readme_screenshots/SEG_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_UTC-DBN-D2x64.2x64.2x32.2x32.1x16_MC9
    trained_with: "vision_training/configurations/semantic_segmentation/configuration_synthetic_shapes.yaml with experiment_folder experiments/readme_screenshots, number_iterations 2000 and the augmentation probabilities of that time (0.3 for most types, 0.5 for random_hue and random_translation, 0.2 for random_solarize; 0.25 now), its checkpoints 1000 and 2000 evaluated again on 2026-11-15 with the current code by scripts/evaluation/evaluate_checkpoint.py (Checkpoint_Evaluation)"
  # The current synthetic configuration (flatten pooling at 128 pixels), and the two runs it is compared with in the
  # sequence classification tutorials, read by tutorials/figures/sequence_classification (comparison_runs), each with
  # the console log of its training (console_log)
  sequence_classification:
    folder: readme_screenshots/M2O_IN-KAR-128_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128-BI_HFLAT.64_MC4
    trained_with: "vision_training/configurations/sequence_classification/configuration_synthetic_sequences.yaml on the moving shapes dataset, 1000 iterations, a checkpoint evaluated every 500 (weight_saving_iterations 500, intermediate_weight_saving_iterations 250), MLflow tracking on, the augmentation probabilities of that time (0.3 for most types, 0.5 for random_hue and random_translation, 0.2 for random_solarize, shuffle_frames 0.5); its checkpoints of iterations 500 and 1000 evaluated again with the current code on 2026-11-15 by scripts/evaluation/evaluate_checkpoint.py (batch size 16, predictions saved, MLflow tracking off) into its Checkpoint_Evaluation folder, which the figures read"
    console_log: readme_screenshots/sequence_classification_flatten.log
    comparison_runs:
      # The former average pooling of the configuration, at 512 pixels, which stays at chance
      average_pooling_512:
        folder: readme_screenshots/M2O_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128-BI_HAVG.64_MC4
        trained_with: "the synthetic configuration with ClassificationHead.global_pooling average and Data.image_settings.size 512, 2000 iterations, the augmentation probabilities of the sequence classification run; its checkpoints of iterations 1000 and 2000 evaluated again with the current code on 2026-11-15 by scripts/evaluation/evaluate_checkpoint.py (batch size 16, predictions saved, MLflow tracking off) into its Checkpoint_Evaluation folder, which the figures read"
        console_log: readme_screenshots/sequence_classification.log
      # The flatten pooling at 512 pixels, 65,536 features per frame, also at chance after 500 iterations
      flatten_512:
        folder: readme_screenshots/M2O_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128-BI_HFLAT.64_MC4_verification
        trained_with: "the synthetic configuration with Data.image_settings.size 512 and run_name_suffix verification, 500 iterations"
        console_log: readme_screenshots/sequence_classification_flatten_512.log
  sequence_labelling:
    folder: tutorials/M2M_IN-KAR-256_SE-RES-BN-B1x16.2x16.2x16.4x32.5x32.5x32-PT_T50_LSTM2x96-BI_HFLAT.96.96-HLN-CWB_MC71
    trained_with: "tutorials/run_configurations/sequence_labelling_pretrained_tutorial.yaml (the training_configuration.yaml of run_49 of the sequence labelling benchmark: balanced class weights, bidirectional LSTM 2x96, flatten pooling, head [96, 96] with layer normalization, batch 64 at 256 pixels, test_10000; backbone loaded from the averaged weights at iteration 10000 of the multi-label shape classifier of the experiment plan, trained with classification/configuration_synthetic_counted_shapes.yaml, test macro F1 0.718, kept as the shape pretrainer ~/Data/tutorial_runs/pretrained/SE-RES-BN-B1x16.2x16.2x16.4x32.5x32.5x32, fine-tuned at learning_rate_multiplier 1.0) with experiment_folder ~/Data/tutorial_runs/tutorials, number_iterations 2000, weight_saving_iterations 500 and intermediate_weight_saving_iterations 250, trained on 2026-11-15; checkpoint 2000 evaluated again on 2026-11-15 with the per-class report and the predictions file by scripts/evaluation/evaluate_checkpoint.py (Checkpoint_Evaluation)"
  # The synthetic comparison configuration, read by tutorials/figures/sequence_comparison
  sequence_comparison:
    folder: readme_screenshots/CMP_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_MEAN_FDIF_HAVG.64_MC2
    trained_with: "vision_training/configurations/sequence_comparison/configuration_synthetic_pairs.yaml on the object loss pairs dataset, number_iterations 1000 (a checkpoint evaluated every 500), MLflow tracking on, the augmentation probabilities of 2026-10-23 (0.3 for most types; see the training_configuration.yaml of the run), its checkpoints 500 and 1000 evaluated again on 2026-11-15 with the current code by scripts/evaluation/evaluate_checkpoint.py (Checkpoint_Evaluation)"
    console_log: readme_screenshots/sequence_comparison.log
  frame_selection:
    folder: readme_screenshots/SEL_IN-KAR-256_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128-BI_HAVG.64_MC4_FPC1-SLW1
    trained_with: "vision_training/configurations/frame_selection/configuration_synthetic_sequences.yaml on 256 pixel frames, number_iterations 2000 (checkpoint and evaluation every 1000, intermediate checkpoint every 500), MLflow tracking on, the augmentation probabilities of 2026-10-23 (0.3 for most types; see the training_configuration.yaml of the run)"
  self_supervised:
    folder: tutorials/SSL_IN-KAR-256_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_PAVG.512.128-PBN_SIMCLR-T0.2
    trained_with: "tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml (SimCLR on the 9-class synthetic shapes, 256 px, batch 128, 2000 iterations, a checkpoint evaluated every 500 against 50 reference training images per class), first trained on 2026-10-24, deleted on 2026-11-11, trained again with the launch file on 2026-11-15 into the experiments folder, its console output redirected to tutorials/self_supervised_tutorial.log"

# Files of the repository read by the figure scripts
repository_files:
  benchmark_results: documentation/architecture_benchmarking/results.csv
  benchmark_plan: documentation/architecture_benchmarking/experiment_plan.md
  # Results of the detection benchmark, whose stage 7 curves the proposal selection scenes draw
  object_detection_benchmark_results: documentation/architecture_benchmarking/object_detection_results.csv
  # Results of the sequence labelling benchmark, whose pretrained launches the evaluation chapter compares with the run
  sequence_labelling_benchmark_results: documentation/architecture_benchmarking/sequence_labelling_results.csv
  # Configuration whose learning rate schedule (warm-up, then cosine decay) the optimization figure draws
  learning_rate_schedule_configuration: vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml
  # Configuration whose data augmentation (activated types and probabilities) the data pipeline chapter shows and draws
  data_pipeline_configuration: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
