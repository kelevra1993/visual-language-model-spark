# Files of the repository read by the figure scripts
repository_files:
  benchmark_results: documentation/architecture_benchmarking/results.csv
  # Plan of the classification benchmark, whose stage 13 section gives the decay of the moving average launches, the
  # window 1 / (1 - decay) of which the foundations moving average chart shades
  benchmark_plan: documentation/architecture_benchmarking/experiment_plan.md
  # Results of the detection benchmark, whose stage 7 curves the proposal selection scenes draw
  object_detection_benchmark_results: documentation/architecture_benchmarking/object_detection_results.csv
  # Results of the sequence labelling benchmark, whose pretrained launches the evaluation chapter compares with the run
  sequence_labelling_benchmark_results: documentation/architecture_benchmarking/sequence_labelling_results.csv
  # Configuration whose learning rate schedule (warm-up, then cosine decay) the optimization figure draws
  learning_rate_schedule_configuration: vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml
  # Configuration whose data augmentation (activated types and probabilities) the data pipeline chapter shows and draws
  data_pipeline_configuration: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
  # Serving benchmark of documentation/architecture_benchmarking/serving_benchmark_plan.md (committed copies of its two
  # results files next to it), whose speed, test metrics and table of false positives the deployment figures read
  serving_benchmark_results: documentation/architecture_benchmarking/serving_benchmark_results.csv
  serving_benchmark_test_metrics: documentation/architecture_benchmarking/serving_benchmark_test_metrics.csv
  serving_benchmark_plan: documentation/architecture_benchmarking/serving_benchmark_plan.md
  # Tree of model_repositories/onnxruntime_cuda of ~/Data/serving_benchmark (the export of the README classifier in
  # TorchScript and ONNX and of the run_9 detector in ONNX), one file path per line, written from that folder on
  # 2026-11-18; the serving chapter draws it as the layout of a model repository
  serving_benchmark_model_repository_files: documentation/architecture_benchmarking/serving_benchmark_model_repository_files.txt
  # The run_9 detector exported again on 2026-11-17 from 18:10 to 19:10 with its NMS without offsets
  # (suppress_stacked_groups) and DIoU-NMS on boxes in fractions of the image (section Detector NMS Without Offsets of
  # serving_benchmark_plan.md): committed copies of its test_metrics.csv (eager, TensorRT FP32 and FP16 on the
  # 10,000 test images, by scripts/deployment/evaluate_served_formats.py) and of the perf_analyzer reports of its loads/
  # over system shared memory (batch 1 and 16 with one client, single images at 1, 4 and 16 requests in flight, batching
  # on and off), kept in ~/Data/serving_benchmark_nms_fix
  serving_benchmark_nms_fix_test_metrics: documentation/architecture_benchmarking/serving_benchmark_nms_fix_test_metrics.csv
  serving_benchmark_nms_fix_loads: documentation/architecture_benchmarking/serving_benchmark_nms_fix_loads

# Committed snapshots of the runs (tutorials/MAINTAINING.md, section Run Snapshots): the small files the figure scripts
# and the storyboards read from every run, copied by tutorials/make_run_snapshots.py from the experiments folder into
# the snapshot folder at the same relative paths (so that `tutorials/build_tutorials.sh --experiments-folder
# tutorials/run_snapshots` builds every series on a machine without the runs), the dataset files they read under
# datasets/, and the outputs of the figures that need a checkpoint under figure_reuse/<series>/; every series lists what
# it needs in tutorials/figures/<series>/snapshot_files.yaml
snapshots:
  # Snapshot folder, relative to the repository root
  folder: tutorials/run_snapshots
  # Name the run labels drawn on the figures give to the experiments folder, the same whichever folder the build reads
  experiments_label: tutorial_runs
  # Dataset root written in the saved configurations of the runs: under the snapshot folder, the figure scripts read
  # the dataset files of a path starting with it from datasets/ of the snapshot folder instead
  recorded_data_root: /home/robert_kelevra/Data
  # Largest file of a snapshot, and the total the snapshot folder should stay under, in megabytes (git-friendly sizes)
  maximum_file_megabytes: 5
  maximum_total_megabytes: 200
