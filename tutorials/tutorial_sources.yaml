# Real runs read by the figure scripts of the tutorials (tutorials/figures/<series>/figures.py), relative to the
# experiments folder of the build (--experiments-folder, the experiments folder of the repository by default). The runs
# are not in git: a build on another machine first trains them again with the configuration and changes given under
# every run, then updates the run folder here when its run name changed (the run name follows the configuration).
# Every run is read as it is: its checkpoints (on the CPU), its TensorBoard logs, its Results.txt and Evaluation folder,
# and its training_configuration.yaml, which also gives its dataset.
runs:
  classification:
    folder: readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9
    trained_with: "vision_training/configurations/classification/configuration_synthetic_shapes.yaml on the 9-class synthetic shapes dataset, 1500 iterations, learning rate 0.0002, a checkpoint every 250 iterations (intermediate_weight_saving_iterations 250) evaluated every 500 (weight_saving_iterations 500), MLflow tracking on, with the augmentation probabilities the file had then (0.3 for most types, 0.25 now)"
  # Standalone evaluation of the classification run, whose error images the classification figures show; written by
  # scripts/evaluation/evaluate_checkpoint.py into the evaluations folder next to the run
  classification_evaluation:
    folder: readme_screenshots/evaluations/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9
    trained_with: "scripts/evaluation/evaluate_checkpoint.py on iteration 1500 of the classification run, with at most 10 error images per pair of classes (maximum_error_images_per_class_pair 10)"
  classification_learning_rates:
    folders:
      - readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9_lr-0.001
      - readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9_lr-0.0005
      - readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9_lr-0.0001
    trained_with: "the classification run with learning rates of 0.001, 0.0005 and 0.0001, told apart by run_name_suffix"
  object_detection:
    folder: readme_screenshots/DET_IN-KAR-512_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L567_A6.32-256.e7b72c_RBN-R2x32_DSE-DRES-DBN-D7.2x32.64.32_MC20
    trained_with: "vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml on the instance segmentation synthetic dataset"
  instance_segmentation:
    folder: readme_screenshots/INS_IN-KAR-512_SE-RES-BN-B1x16.2x16.2x16.3x32.3x32.5x32.5x32_L567_A6.32-256.e7b72c_RBN-R2x32_DSE-DRES-DBN-D7.2x32.64.32_MRES-MBN-MUTC-M14.3x32-MR28_MC20
    trained_with: "vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml, shortened, resumed to 5000 iterations"
  keypoint_detection:
    folder: keypoint_focal_synthetic/experiments/KPT_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x64_HRSE-HRRES-HRBN-HR16.1.2.2x2_K243-KH256-HH_MC33
    trained_with: "vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml with the focal heatmap loss"
  semantic_segmentation:
    folder: readme_screenshots/SEG_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_UTC-DBN-D2x64.2x64.2x32.2x32.1x16_MC9
    trained_with: "vision_training/configurations/semantic_segmentation/configuration_synthetic_shapes.yaml"
  # The current synthetic configuration (flatten pooling at 128 pixels), and the two runs it is compared with in the
  # sequence classification tutorials, read by tutorials/figures/sequence_classification (comparison_runs), each with
  # the console log of its training (console_log)
  sequence_classification:
    folder: readme_screenshots/M2O_IN-KAR-128_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128-BI_HFLAT.64_MC4
    trained_with: "vision_training/configurations/sequence_classification/configuration_synthetic_sequences.yaml on the moving shapes dataset, 1000 iterations, a checkpoint evaluated every 500 (weight_saving_iterations 500)"
    console_log: readme_screenshots/sequence_classification_flatten.log
    comparison_runs:
      # The former average pooling of the configuration, at 512 pixels, which stays at chance
      average_pooling_512:
        folder: readme_screenshots/M2O_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128-BI_HAVG.64_MC4
        trained_with: "the synthetic configuration with ClassificationHead.global_pooling average and Data.image_settings.size 512, 2000 iterations"
        console_log: readme_screenshots/sequence_classification.log
      # The flatten pooling at 512 pixels, 65,536 features per frame, also at chance after 500 iterations
      flatten_512:
        folder: readme_screenshots/M2O_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128-BI_HFLAT.64_MC4_verification
        trained_with: "the synthetic configuration with Data.image_settings.size 512 and run_name_suffix verification, 500 iterations"
        console_log: readme_screenshots/sequence_classification_flatten_512.log
  sequence_labelling:
    folder: readme_screenshots/M2M_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128_HAVG.64_MC71
    trained_with: "vision_training/configurations/sequence_labelling/configuration_synthetic_sequences.yaml"
  # Launch run_1 of the sequence labelling experiment plan, whose training_configuration.yaml chapter 3 of the series
  # shows; in hyperparameter_experiments at the repository root, next to the experiments folder
  sequence_labelling_plan_launch:
    folder: ../hyperparameter_experiments/sequence_labelling/run_1/M2M_IN-KAR-256_SE-RES-BN-B1x16.2x16.2x16.4x32.5x32.5x32_T50_LSTM1x96_HFLAT.96.96-HLN-CWB_MC71
    trained_with: "stage 1 of documentation/architecture_benchmarking/sequence_labelling_experiment_plan.md (learning rate 1e-3, launch A, 2000 iterations), with the settings of the training_configuration.yaml of its run folder, its launch file sequence_labelling/run-1.yaml having been deleted on 2026-11-11"
  # The synthetic comparison configuration, read by tutorials/figures/sequence_comparison
  sequence_comparison:
    folder: readme_screenshots/CMP_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_MEAN_FDIF_HAVG.64_MC2
    trained_with: "vision_training/configurations/sequence_comparison/configuration_synthetic_pairs.yaml on the object loss pairs dataset, 1000 iterations, a checkpoint evaluated every 500"
    console_log: readme_screenshots/sequence_comparison.log
  frame_selection:
    folder: readme_screenshots/SEL_IN-KAR-256_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128-BI_HAVG.64_MC4_FPC1-SLW1
    trained_with: "vision_training/configurations/frame_selection/configuration_synthetic_sequences.yaml on 256 pixel frames"
  self_supervised:
    folder: tutorials/SSL_IN-KAR-256_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_PAVG.512.128-PBN_SIMCLR-T0.2
    trained_with: "tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml (SimCLR on the 9-class synthetic shapes, 256 px, batch 128, 2000 iterations), trained on 2026-10-24"

# Files of the repository read by the figure scripts
repository_files:
  benchmark_results: documentation/architecture_benchmarking/results.csv
  benchmark_plan: documentation/architecture_benchmarking/experiment_plan.md
  # Configuration whose learning rate schedule (warm-up, then cosine decay) the optimization figure draws
  learning_rate_schedule_configuration: vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml
  # Configuration whose data augmentation (activated types and probabilities) the data pipeline chapter shows and draws
  data_pipeline_configuration: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
