# Real runs read by the figure scripts of the tutorials (tutorials/figures/<series>/figures.py), relative to the
# experiments folder of the build (--experiments-folder, ~/Data/tutorial_runs of tutorial_project.yaml by default,
# outside the repository so that cleaning its experiments/ keeps them; the runs trained before were copied there). The runs
# are not in git: a build on another machine first trains them again with the configuration and changes given under
# every run, then updates the run folder here when its run name changed (the run name follows the configuration).
# Every run is read as it is: its checkpoints (on the CPU), its TensorBoard logs, its Results.txt and Evaluation folder,
# and its training_configuration.yaml, which also gives its dataset.
runs:
  classification:
    folder: readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9
    trained_with: "vision_training/configurations/classification/configuration_synthetic_shapes.yaml on the 9-class synthetic shapes dataset, 1500 iterations, learning rate 0.0002, a checkpoint every 250 iterations (intermediate_weight_saving_iterations 250) evaluated every 500 (weight_saving_iterations 500), MLflow tracking on, with the augmentation probabilities the file had then (0.3 for most types, 0.25 now); the dataset, ~/Data/classifier_data/synthetic_shapes (9 classes, 500,000/50,000/50,000 images at 512 pixels), was generated on 2026-10-11 by vision_training/data/synthetic/create_synthetic_dataset.py at commit fbc3d0b (task classification), before d9c1b90 grew SHAPE_CATEGORIES (35 classes now); the generator draws without a seed (np.random.default_rng()), so a dataset generated again holds other images and the file names the figures name show other shapes (test_005452.png, the test star of the foundations and classification model figures, STAR_IMAGE_NAME of tutorials/figures/figure_utilities.py; test_000000/06/08/12.png; the error images); the files the figures read are committed under tutorials/run_snapshots/datasets"
