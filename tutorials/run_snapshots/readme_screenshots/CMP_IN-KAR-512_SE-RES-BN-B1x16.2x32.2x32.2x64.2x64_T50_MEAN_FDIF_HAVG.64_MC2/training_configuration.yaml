# Launch configuration of the tutorial retrain of 2026-11-18 (harder synthetic datasets), written by
# analysis/write_configurations.py from vision_training/configurations/sequence_comparison/configuration_synthetic_pairs.yaml of origin/main f1408fd.
# Deliberate settings of the recipe applied: ExperimentConfiguration.experiment_folder /home/robert_kelevra/Data/tutorial_runs/readme_screenshots; ExperimentConfiguration.number_iterations 1000; ExperimentConfiguration.tracking.activated True.
# Rerun of 2026-11-19 (tmp/retrain/plan_after_ins.md): none, the recipe as it is (1,000 iterations of 16 pairs).
# Synthetic object loss pairs dataset (create_synthetic_dataset.py "sequence_comparison"): before and after views of 2
# to 6 objects, labelled with whether the after member lost one.
ExperimentConfiguration:
  # Task trained, selecting the trainer, model and checks. "sequence_comparison": sequence comparator (one class per
  # before and after sequence pair); needs Data.sequence_settings, TemporalModel, Fusion and ClassificationHead.
  task: "sequence_comparison"
  # Root of the runs, a subfolder per model, data and optimizer settings (run_name.py), resumed if equal; augmentation,
  # batch size, learning rate, schedule, dropout can change on resume.
  experiment_folder: /home/robert_kelevra/Data/tutorial_runs/readme_screenshots
  # Last run name section, e.g. "v1" giving <run name>_v1, to start a new folder for the same settings with another
  # batch size, augmentation or learning rate. Letters, digits, '-' and '.', null for none.
  run_name_suffix: null
  # Training pairs (frames in data/<pair name>/before/ and .../after/) and labels.json manifest.
  train_data_folder: "/home/robert_kelevra/Data/sequence_data/synthetic_object_loss_pairs/train"
  # Validation pairs and labels.json manifest.
  validation_data_folder: "/home/robert_kelevra/Data/sequence_data/synthetic_object_loss_pairs/validation"
  # Test pairs and labels.json manifest.
  test_data_folder: "/home/robert_kelevra/Data/sequence_data/synthetic_object_loss_pairs/test"
  # Pairs per forward/backward pass; a step runs the backbone on up to 2 x batch_size x maximum_sequence_length frames.
  batch_size: 16
  # Metric logging interval, in iterations.
  information_dump: 100
  # Checkpoint and test evaluation interval, in iterations.
  weight_saving_iterations: 500
  # Interval (iterations) of extra checkpoints without test evaluation, below weight_saving_iterations, 0 for none.
  intermediate_weight_saving_iterations: 250
  # Total training iterations.
  number_iterations: 1000
  # Validation interval in iterations: 0 never, 1 every iteration, N every Nth.
  validation_iteration_ratio: 25
  # Test evaluation at every weight_saving_iterations checkpoint on every test pair: accuracy, balanced accuracy, macro
  # F1, top-k, per-class metrics, confusion matrix, thresholds in <run folder>/Evaluation/Iteration_<iteration>/.
  evaluation:
    # Reports every class: per-class and recall tables (console, Results.txt), TensorBoard scalars, confusion matrix,
    # ROC and precision-recall curves. False: global metrics only; CSV and JSON files always saved.
    per_class_report: True
    # Test pairs drawn once, shown at every evaluation as frame grids (before above after) captioned with true and
    # predicted class, in Evaluation/Iteration_<n>/Samples/ and TensorBoard, spread over the classes. 0 disables.
    number_sample_images: 8
    # Precision every class threshold must reach (highest recall threshold saved for deployment), in [0, 1]; a list of
    # distinct precisions, e.g. [0.99, 0.95], deploys the first and reports the others (additional_targets).
    target_precision: 0.99
    # Saves 'predictions.csv' at every evaluation: true and predicted classes and every class probability per test
    # sample (labelled frame in sequence labelling). Grows with samples x classes.
    save_predictions: True
    # Saves every misclassified sample (image, sequence or pair frame grid) at every evaluation, multi-class only, as
    # 'Evaluation/Iteration_<n>/Errors/<TRUE>-TO-<PREDICTED>/<sample>_<score>.png', score: predicted class probability.
    error_dumps:
      # Saves error images.
      activated: False
      # Most images saved per (true, predicted) class pair.
      maximum_per_class_pair: 20
  # MLflow tracking next to TensorBoard: hyperparameters, metric averages, learning rate, test metrics, small artifacts
  # (configuration, confusion matrices, class metrics and thresholds, Results.txt); MLflow errors only warn.
  tracking:
    # Turns MLflow tracking on.
    activated: True
    # MLflow server address (e.g. "http://192.168.1.20:5000"), null for <experiment_folder>/mlflow.db; credentials from
    # MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD; browse: mlflow ui --backend-store-uri sqlite:///<that file>
    tracking_uri: null
    # MLflow experiment, null for the task name ("sequence_comparison").
    experiment_name: null
  # Base learning rate.
  learning_rate: 1.0e-3
  # Lets a resumed run train on a changed labels.json (the previous data.json kept as data_until_iteration_<n>.json);
  # False refuses it, a new run (run_name_suffix) being needed. A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Computes the receptive field
      compute_receptive_field: True
      # Shows the network input: Training and Validation windows, before member above after member, with the pair class.
      # SPACE: next pairs, ENTER: exit without training (False to train); needs a display, creates no run folder.
      view_input_images: False
      # Times the training step and the inference (PyTorch, TorchScript, ONNX Runtime, TensorRT) on one training batch,
      # at the configured and largest batch sizes that fit, then exits without training; no run folder is created.
      benchmark_speed: False

Optimization:
  # Optimizer: "adam", "adamw" (decoupled weight decay) or "sgd" (Nesterov momentum 0.9), at
  # ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Optimizer weight decay, 0 to disable.
  weight_decay: 0.0
  # After the warm-up: "constant", or "cosine" (to minimum_learning_rate_ratio x learning rate over decay_iterations,
  # then constant).
  learning_rate_schedule: "constant"
  # Linear learning rate warm-up iterations from 0, 0 to disable.
  warmup_iterations: 0
  # Cosine decay iterations after the warm-up (cosine schedule only).
  decay_iterations: 100000
  # Final cosine learning rate, as a fraction of the learning rate (cosine only).
  minimum_learning_rate_ratio: 0.01
  # Exponential moving average of the weights, ema = decay x ema + (1 - decay) x weights per step (about 1 / (1 - decay)
  # iterations); scored at every test (Test_EMA), can change on resume; when on, 'pretrained' prefers the source EMA.
  exponential_moving_average:
    # Turns the weight moving average on.
    activated: False
    # Share of the average kept per update, strictly between 0 and 1: the average looks back about 1 / (1 - decay)
    # iterations (1,000 at 0.999, 5,000 at 0.9998), reached after a warm-up of about 9 / (1 - decay) iterations.
    decay: 0.9998

Data:
  image_settings:
    # Input resolution of every frame.
    size: 512
    # Keeps the original aspect ratio when resizing.
    keep_ratio: True
  sequence_settings:
    # Most frames of a sequence or pair member, fed whole and padded with masked black frames to the longest of the
    # batch; a longer one is left out with its pair (red warning). Also the transformer positional embedding size.
    maximum_sequence_length: 50
  label_mapping:
    # Must be "multi_class" (sequence tasks): the mapping file gives the class index, 0 to K-1 (no background), of every
    # labels.json category.
    mode: "multi_class"
    # JSON file mapping the dataset category IDs to sequential class IDs.
    mapping_file_path: "/home/robert_kelevra/Data/sequence_data/synthetic_object_loss_pairs/label_mapping.json"
  data_augmentation:
    # Global switch of the data augmentation (on the GPU, training batches only).
    activated: True
    # Probability that a training pair is augmented; every activated type is then applied with its own probability, the
    # frames of both members sharing it.
    probability: 0.4
    # Sequence tasks only: draws the photometric types frame by frame (own brightness, noise, colour...), the geometric
    # ones staying shared, as a crop or rotation per frame makes objects jump.
    independent_frames: False
    # Sequence tasks only: shuffles the real frames of a training sequence with this probability (independent of the one
    # above), padding staying last, each pair member on its own; for sequences whose order carries no information.
    shuffle_frames: { activated: False, probability: 0.25 }
    types:
      # Geometric augmentations : crops and small rotations can cut a border object, changing the object count: off.
      # Random Crop : 75% to 100% of each side (same ratio), resized back
      random_crop: { activated: False, probability: 0.25 }
      # Random Aspect Crop : 75% to 100% of the width and, separately, of the height, resized back (x0.75 to x1.33
      # stretch; other camera proportions, for keep_ratio False)
      random_aspect_crop: { activated: False, probability: 0.25 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side on a black canvas, objects appearing smaller
      random_zoom_out: { activated: False, probability: 0.25 }
      # Random Translation : shift of up to 25% along x, y or both, border filled black
      random_translation: { activated: False, probability: 0.25 }
      # Random Left-Right Flip
      random_left_right_flip: { activated: True, probability: 0.5 }
      # Random Up-Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation of -5° to 5°
      random_rotation: { activated: False, probability: 0.25 }
      # Random +-90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.25 }
      # Random Perspective : corners moved inwards by up to 5% of half the width and height, border filled black;
      # refused for tasks with boxes, masks or keypoints
      random_perspective: { activated: False, probability: 0.25 }
      # Random Jigsaw : 2x2 pieces shuffled, breaking the global layout; refused for tasks with boxes, masks or
      # keypoints
      random_jigsaw: { activated: False, probability: 0.25 }

      # Photometric augmentations. Grayscale stays off: an object could match the background luminance and vanish.
      # Brightness (+-40 levels), contrast and saturation (x0.7 to x1.0)
      brightness_contrast_saturation: { activated: True, probability: 0.25 }
      # Random Hue : hue turned by up to 18 degrees (5% of the circle) either way
      random_hue: { activated: False, probability: 0.25 }
      # CLAHE, clip limit 2.0 on a 4x4 tile grid
      clahe_augment: { activated: False, probability: 0.25 }
      # Laplacian of Gaussian unsharp mask sharpening (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.25 }
      # Histogram equalization of the luminance (Y of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.25 }
      # Histogram equalization of one random channel (B, G or R) or all three
      equalize_bgr_histogram_augment: { activated: False, probability: 0.25 }
      # Random Noise : Gaussian noise, standard deviation 20 levels
      random_noise: { activated: True, probability: 0.25 }
      # Grayscale, kept on three channels
      gray_scale_augment: { activated: False, probability: 0.25 }
      # Random Colour augmentation : BGR to RGB channel swap
      random_colour_augmentation: { activated: False, probability: 0.25 }
      # Random Gamma : gamma 0.8 to 1.25, darkening or lightening the mid-tones
      random_gamma: { activated: False, probability: 0.25 }
      # Random Linear Illumination : 13 to 38 level ramp across the image, brightening or darkening one side
      random_linear_illumination: { activated: False, probability: 0.25 }
      # Random Plasma Shadow : irregular fractal shadows darkening by up to 77 levels
      random_plasma_shadow: { activated: False, probability: 0.25 }
      # Random Blur : 9x9 Gaussian kernel, sigma 2.5
      random_blur: { activated: False, probability: 0.25 }
      # Random Motion Blurring : 5 to 15 pixel streak at 0 to 180 degrees (camera or object motion)
      random_motion_blur: { activated: False, probability: 0.25 }
      # Random Haze : uniform grey airlight of 180 to 255 levels taking 20% to 60% of every pixel, a camera fog (after
      # the blurs, before solarization, black-out and erasing)
      random_haze: { activated: True, probability: 0.25 }
      # Random Solarize : pixels at or above 128 levels inverted
      random_solarize: { activated: False, probability: 0.25 }
      # Random Black Out : grid_size x grid_size cells, each blacked out with probability 0.2 (after the other
      # photometric types but the erasing); labels unchanged, so a hidden object keeps its label
      random_black_out: { activated: False, probability: 0.25, grid_size: 8 }
      # Random Erasing : one black rectangle of 2% to 15% of the image, height / width 0.3 to 3.3, applied last; labels
      # unchanged
      random_erasing: { activated: False, probability: 0.25 }

Backbone:
  # Input channels of the first convolution block: 3, the loaders giving BGR images
  input_channels : 3

  # [convolutions, output filters] of every block.
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 32 ],
      "3": [ 2, 32 ],
      "4": [ 2, 64 ],
      "5": [ 2, 64 ],
    }

  # Max pooling after the last block.
  last_max_pooling: False

  normalization:
    # Scales the inputs to [-0.5, 0.5].
    input_normalization: True

    # Normalizes every image to zero mean and unit variance (after input_normalization).
    per_sample_normalization: False

    # Feature map normalization: "batch", "layer" (over channels), "none" or "sequence" (statistics of each sequence, in
    # training and inference).
    feature_map_normalization: "batch"

  modules:
    # Residual shortcuts every two convolutions from block 2 (https://arxiv.org/abs/1512.03385).
    residual_nets: True

    # Pre-activation shortcuts (https://arxiv.org/abs/1603.05027): normalization and ReLU before every convolution.
    # Requires residual_nets; RES2 token instead of RES.
    residual_nets_v2: False

    # Inception modules (https://arxiv.org/abs/1409.4842), output channels multiples of 8.
    inception: False

    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True

  # Backbone of another run (any task) initialising this one: input_channels, convolutions, modules, normalization and
  # last_max_pooling match, or one backbone has more blocks (extras random); detection levels, image size may differ.
  pretrained:
    # Run folder of the loaded backbone, null for random weights (not reloaded on resume).
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded backbone (no gradient, frozen batch statistics); needs experiment_folder.
    freeze: False
    # Freezes the scale and shift of the loaded backbone normalizations while its convolutions learn; needs
    # experiment_folder, freeze False and a normalization.
    freeze_normalization_parameters: False
    # Learning rate factor of the loaded backbone, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

TemporalModel:
  # Pair member summary, shared by both: "mean_pooling", "max_pooling", "attention_pooling" (order-blind), or "gru",
  # "lstm", "transformer", "temporal_convolution" (order-aware); mean pooling here, synthetic views being independent.
  type: "mean_pooling"
  # Recurrent state size (GRU, LSTM), model size (transformer, a multiple of number_heads), channels (temporal
  # convolution) or hidden units of the frame scoring network (attention pooling).
  hidden_size: 128
  # Stacked layers (GRU, LSTM, transformer, temporal convolution).
  number_layers: 1
  # Attention heads per transformer layer.
  number_heads: 4
  # Odd frame span of a temporal convolution kernel, its dilation doubling every layer.
  kernel_size: 3
  # Dropout between stacked layers (GRU, LSTM), in attention and feed forward layers (transformer) or after every
  # convolution (temporal convolution), within [0, 1).
  dropout_rate: 0.0
  # Reads the members both ways (GRU, LSTM).
  bidirectional: True
  # Every frame only sees the earlier frames (transformer, temporal convolution). False for the comparison task, which
  # summarises whole members.
  causal: False
  # Learned position embedding added to every frame vector, so the transformer uses the frame order. False treats a
  # sequence as a set (weights independent of maximum_sequence_length); a causal transformer still sees the order.
  positional_embedding: True
  # Temporal module of a sequence run (sequence classification too) initialising both members; must match: type, weight
  # settings, last block channels, pooling and image size if flattening, maximum_sequence_length (positional embedding).
  pretrained:
    # Run folder of the loaded temporal module, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded temporal module (no gradient). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded temporal module, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

Fusion:
  # Before (a) and after (b) member fusion: "concatenation" ([a, b]), "difference" ([a, b, b - a]) or "cross_attention"
  # (the frames of each member attend to the other before the temporal module, then [a, b, b - a]).
  type: "difference"
  # Cross attention heads, dividing the channels of the last backbone block.
  number_heads: 4
  # Cross attention weight dropout, within [0, 1).
  dropout_rate: 0.0
  # Frames sharing the sequence normalization statistics (feature_map_normalization "sequence" only): "member" (each
  # member by its own frames, removing e.g. lighting changes) or "pair" (both together, keeping global differences).
  sequence_normalization_scope: "member"

ClassificationHead:
  # Frame feature map reduction: "average", "max" or "flatten" (C x H x W values, keeping positions). The average keeps
  # the object count of a frame, the maximum does not.
  global_pooling: "average"
  # Hidden layer units between the fused pair vector and the logits, [] for none.
  fully_connected: [64]
  # Hidden layer normalization before ReLU: "batch", "layer" or "none" (needs a hidden layer unless "none"); HBN or HLN
  # token.
  fully_connected_normalization: "none"
  # Dropout before every fully connected layer, in [0, 1).
  dropout_rate: 0.2
  # "multi_class" only (sequence tasks): one class per pair.
  output_mode: "multi_class"
  # Label smoothing, in [0, 1), 0 to disable.
  label_smoothing: 0.0
  # Loss class weights: "none" or "balanced" (inverse to the training pairs of each class).
  class_weighting: "none"
  # Classification head of another run initialising this one: fully_connected, its normalization and the input size must
  # match; source classes first in this run, appended ones random. A comparison head only fits a comparison run.
  pretrained:
    # Run folder of the loaded head, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded head (no gradient). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded head, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0
