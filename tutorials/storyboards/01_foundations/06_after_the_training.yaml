# Foundations, chapter 6: what comes after a training, shared by every task: evaluating checkpoints again, the evaluation
# curves every evaluation draws, comparing launches and runs, clustering the image embeddings of a trained run, an
# overview of the export to Triton (the deployment series covers the export, its checks, the Triton serving and the
# serving benchmark), the tests and the map of the repository. The settings shown are the live main blocks of the
# scripts; the spread between launches is the one of benchmark.py, the evaluation curves those of the detection run
# drawn by evaluation_curves.py, and the counts of the repository those of listings.py of tutorials/figures/foundations.
series: foundations
series_title: "Foundations"
chapter: 6
title: "After the training"
output_name: foundations_06_after_the_training
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [foundations]
references:
  - "scripts/evaluation/evaluate_checkpoint.py"
  - "vision_training/evaluation/checkpoint_evaluation.py · evaluate_checkpoints"
  - "vision_training/evaluation/evaluation_curves.py · draw_summary_curves"
  - "scripts/evaluation/collect_experiment_results.py"
  - "scripts/evaluation/compare_best_evaluations.py · compare_best_evaluations"
  - "scripts/evaluation/plot_experiment_comparisons.py"
  - "documentation/architecture_benchmarking/experiment_comparisons.yaml"
  - "scripts/embedding/cluster_image_embeddings.py · embed_and_cluster_sources"
  - "vision_training/deployment/export_model.py · parse_export_arguments"
  - "vision_training/deployment/export_model.py · export_experiment"
  - "vision_training/deployment/input_contract.py · write_preprocessing_file"
  - "vision_training/deployment/export_size_estimates.py · estimate_export_sizes"
scenes:
  - kind: title_card
    heading: "After the training"
    subheading: "Evaluating, comparing, clustering, exporting"
    footnote: "Foundations · chapter 6"
    # The number of the chapter, the chapter key of this storyboard
    literal_numbers: ["6"]
    narration:
      - "Every task shares the tools that come after a training: the evaluation of checkpoints, the comparison of launches and runs, the clustering of image embeddings and the export to Triton."
      - "This last foundations chapter covers them, then the tests and the map of the repository."

  - kind: code
    title: "Evaluating checkpoints"
    code_reference: "scripts/evaluation/evaluate_checkpoint.py"
    source:
      file: scripts/evaluation/evaluate_checkpoint.py
      start: "^if __name__ == \"__main__\":"
      end: "^    track_evaluation = "
    highlights:
      - {match: "^    run_name = |^    experiment_folder = ", sentences: [0]}
      - {match: "^    iteration = |^    test_data_folder = |^    batch_size = |^    track_evaluation = ", sentences: [1]}
    narration:
      - "Imagine you want to evaluate a trained run again, on another labelled split or with a larger batch: set the run name and its folder in the main block of the evaluate checkpoint script; the files of the run are only read."
      - "The iteration is None for the last checkpoint, a number, or all for every checkpoint, and the evaluation can be tracked in an MLflow run of its own, tagged with its training run."

  - kind: code
    title: "Error images and thresholds"
    code_reference: "scripts/evaluation/evaluate_checkpoint.py · apply_target_precisions"
    source:
      file: scripts/evaluation/evaluate_checkpoint.py
      start: "^    # Largest number of error images saved"
      end: "^    target_precisions = "
    highlights:
      - {match: "^    maximum_error_images_per_class_pair = ", sentences: [0]}
      - {match: "^    target_precisions = ", sentences: [1]}
    narration:
      - "The maximum number of error images per pair of classes turns the error images on, and the tasks without error images skip it with a yellow warning."
      - "Target precisions replaces the precision of the class thresholds, a list giving the classifiers the threshold of every class at each precision; then run the script as a module with uv."

  - kind: html
    page: diagram
    title: "What the evaluation writes"
    code_reference: "vision_training/evaluation/checkpoint_evaluation.py · summarise_checkpoint_evaluations"
    # The indentation of the tree written with non-breaking spaces, the leading spaces of a text being dropped
    elements:
      - {type: text, position: [30, 60], text: "<experiments>/<run name>/", font: diagram_monospace, anchor: ls}
      - {type: text, position: [30, 115], text: "├── Evaluation/   of the training", font: diagram_monospace, colour: dim, anchor: ls}
      - {type: text, position: [30, 170], text: "└── Checkpoint_Evaluation/", font: diagram_monospace, anchor: ls, highlight: [0]}
      - {type: text, position: [30, 225], text: "\u00a0\u00a0\u00a0\u00a0├── Results.txt", font: diagram_monospace, anchor: ls, highlight: [0]}
      - {type: text, position: [30, 280], text: "\u00a0\u00a0\u00a0\u00a0├── Tensorboard/Test/", font: diagram_monospace, anchor: ls, highlight: [0]}
      - {type: text, position: [30, 335], text: "\u00a0\u00a0\u00a0\u00a0├── Iteration_<n>/", font: diagram_monospace, anchor: ls, highlight: [0]}
      - {type: text, position: [30, 390], text: "\u00a0\u00a0\u00a0\u00a0│\u00a0\u00a0\u00a0└── the files of the task, Errors/ when on", font: diagram_monospace, colour: dim, anchor: ls}
      - {type: text, position: [30, 445], text: "\u00a0\u00a0\u00a0\u00a0└── evaluation_summary.csv", font: diagram_monospace, anchor: ls, highlight: [1]}
      - {type: box, box: [1000, 150, 1740, 330], text: "every checkpoint scored on the whole\ntest split, with the trained weights\nand the averaged ones when kept", font: diagram_text, outline: aqua, appear: 0, highlight: [0]}
      - {type: box, box: [1000, 380, 1740, 560], text: "iteration = \"all\": one row per checkpoint,\nthe best checkpoint printed\nfor the trained and averaged weights", font: diagram_text, outline: violet, appear: 1, highlight: [1]}
    narration:
      - "The evaluation writes the results file, the test curves and one folder per checkpoint like a training does, in the checkpoint evaluation folder of the run, next to the evaluation folder of the training."
      - "With all the checkpoints, the evaluation summary compares their metrics in one table, and the best checkpoint is printed for the trained and for the averaged weights."

  # The evaluation curves of the detection run, drawn again by evaluation_curves.py from the evaluation summary of its
  # training with the code that drew them after its last evaluation
  - kind: image
    title: "The evaluation curves"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.update_evaluation_curves"
    image: "figures:foundations/evaluation_curves/evaluation_curves.png"
    narration:
      - "Every evaluation, during a training or by this script, adds its row to the evaluation summary and draws the evaluation curves again next to the results file, so the test results read at a glance without TensorBoard."
      - "Here the box mAP of the detection run of the object detection series, the best evaluation of each weights ringed: {{foundations.evaluation_curves.trained_best_value:percent}} at iteration {{foundations.evaluation_curves.trained_best_iteration:,d}} for the trained weights, {{foundations.evaluation_curves.averaged_best_value:percent}} at iteration {{foundations.evaluation_curves.averaged_best_iteration:,d}} for the averaged ones."
      - "The shaded spans are what the last averaged weights look back over: the configured window of {{foundations.evaluation_curves.configured_window:,d}} iterations and, during the warm-up of the decay, the shorter window of their last update, {{foundations.evaluation_curves.last_update_window:,d}} iterations."

  - kind: code
    title: "Comparing launches"
    code_reference: "scripts/evaluation/collect_experiment_results.py"
    source:
      file: scripts/evaluation/collect_experiment_results.py
      start: "^    # Folder of the hyperparameter experiment of every task"
      end: "output_path = experiment_folder"
    highlights:
      - {match: "^    experiments_root_folder = ", sentences: [0]}
      - {match: "^    metrics = |^    number_last_evaluations = ", sentences: [1]}
      - {match: "^    output_path = ", sentences: [1]}
    # The folder names run_2 and run_23b read aloud, and the advice of two launches per setting
    literal_numbers: [two, twenty three]
    narration:
      - "To compare settings, train every launch in its own run folder of one experiment folder, run one, run two, and run twenty three b for a repeat launch of the same settings, then run the collect experiment results script."
      - "It writes one row per launch with the test metric at every evaluation, its mean and the mean of the last evaluations, then a mean row for the launches of the same settings."
      - "Compare settings by their mean and the mean of their last evaluations, with at least two launches each: in the benchmark, {{foundations.benchmark.launch_noise.launches_per_setting:words}} launches of the same settings went from {{foundations.benchmark.launch_noise.squeeze_excitation_on_whole_mean_minimum:percent}} to {{foundations.benchmark.launch_noise.squeeze_excitation_on_whole_mean_maximum:percent}} in mean test accuracy."
      - "To see a stage at a glance, the plot experiment comparisons script draws every launch and the mean of every setting from a copy of this file, for the stages listed in experiment comparisons yaml."

  - kind: code
    title: "Comparing runs"
    code_reference: "scripts/evaluation/compare_best_evaluations.py · parse_comparison_arguments"
    source:
      file: scripts/evaluation/compare_best_evaluations.py
      start: "^    # The runs compared, and the evaluation kept for every run"
      end: 'join\(TEST_FOLDERS\)'
    highlights:
      - {match: 'add_argument\("--experiment_folders"', sentences: [0]}
      - {match: 'add_argument\("--best_metric"|add_argument\("--lower_is_better"|add_argument\("--evaluated_weights"', sentences: [1]}
    narration:
      - "To compare finished runs, the compare best evaluations script reads every run folder of some experiment folders."
      - "It picks the best evaluation of every run by one test curve, over the trained weights, the averaged weights or both, and prints markdown tables with any setting of the configurations and the image counts of every split as columns."

  - kind: html
    page: diagram
    title: "Clustering image embeddings"
    code_reference: "scripts/embedding/cluster_image_embeddings.py · embed_and_cluster_sources"
    elements:
      - {type: box, box: [10, 140, 250, 270], text: "images of\ndata sets\nor folders", font: diagram_small}
      - {type: arrow, points: [[258, 205], [302, 205]], appear: 0}
      - {type: box, box: [310, 140, 560, 270], text: "trained run:\nthe embedding", font: diagram_small, outline: blue, appear: 0, highlight: [0]}
      - {type: arrow, points: [[568, 205], [612, 205]], appear: 0}
      - {type: box, box: [620, 140, 880, 270], text: "features of a block\nor a hidden layer", font: diagram_small, outline: blue, appear: 0, highlight: [0]}
      - {type: arrow, points: [[888, 205], [932, 205]], appear: 1}
      - {type: box, box: [940, 140, 1130, 270], text: "PCA\n{{foundations.scripts.cluster_pca_dimensions}} dimensions", font: diagram_small, outline: yellow, appear: 1, highlight: [1]}
      - {type: arrow, points: [[1138, 205], [1182, 205]], appear: 1}
      - {type: box, box: [1190, 140, 1460, 270], text: "HDBSCAN, DBSCAN\nor k-means,\nper category", font: diagram_small, outline: magenta, appear: 1, highlight: [1]}
      - {type: arrow, points: [[1468, 205], [1512, 205]], appear: 1}
      - {type: box, box: [1520, 140, 1750, 270], text: "clusters and\nisolated images", font: diagram_small, outline: violet, appear: 1}
      - {type: arrow, points: [[1635, 278], [1635, 340], [380, 340], [380, 402]], appear: 2}
      - {type: arrow, points: [[1635, 340], [920, 340], [920, 402]], appear: 2}
      - {type: arrow, points: [[1635, 340], [1460, 340], [1460, 402]], appear: 2}
      - {type: box, box: [120, 410, 640, 560], text: "kept_images_by_clustering/\nclosest to every centre,\nand the isolated images", font: diagram_small, outline: aqua, appear: 2, highlight: [2]}
      - {type: box, box: [690, 410, 1150, 560], text: "kept_images_at_random/", font: diagram_small, appear: 2}
      - {type: box, box: [1200, 410, 1720, 560], text: "kept_images_evenly_spaced\n_per_group/", font: diagram_small, appear: 2}
      - {type: text, position: [880, 620], text: "the same number of images per category, to compare by training a smaller model on each", font: diagram_small, colour: dim, anchor: mm, appear: 2}
      - {type: text, position: [880, 690], text: "features stored · clusters.csv · cluster_summary.csv · links and mosaics of every cluster", font: diagram_small, anchor: mm, appear: 3, highlight: [3]}
    narration:
      - "To pick diverse images from a data set of video frames, many of them nearly identical, the cluster image embeddings script embeds the images with a trained run: the output of a convolution block, or of a hidden layer of a classification head."
      - "Every layer is normalized and reduced by a PCA, then clustered category by category with HDBSCAN, DBSCAN or k-means, the images in no cluster being the isolated images."
      - "It keeps the images closest to the centre of every cluster and the isolated images, and as many images drawn at random or spread over the groups of the file names, to compare by training a smaller model on each."
      - "One might want to try other clustering settings: the features are stored, so the relaunch skips the model, and the clusters get their tables, their links and a mosaic of their images."

  - kind: code
    title: "Exporting a model"
    code_reference: "vision_training/deployment/export_model.py · parse_export_arguments"
    source:
      file: vision_training/deployment/export_model.py
      start: "^    # The run and the checkpoint to export"
      end: "needed for a keypoint detector"
    highlights:
      - {match: 'add_argument\("--formats"|add_argument\("--repository"', sentences: [0]}
      - {match: 'add_argument\("--experiment_folder"|add_argument\("--iteration"|add_argument\("--use_averaged_weights"|add_argument\("--maximum_batch_size"|add_argument\("--tensorrt_precision"', sentences: [1]}
    narration:
      - "Once a run is trained, the export model script writes it to the Triton model repository, in TorchScript and in ONNX, with the Triton configuration of every model."
      - "Its arguments give the run folder, the iteration, the averaged or the trained weights, the largest batch size and the TensorRT precision; without any, it prints its help."
      - "Every format is checked against the PyTorch model before the served models are replaced, and carries the preprocessing of the run, so that a server builds its inputs as the training did."
      - "Their sizes are known before any export: every launch estimates them in its Export Sizes panel, with those of the PyTorch weights, the TensorRT engines Triton builds and the checkpoints."
      - "The deployment series takes it from there: the export and its checks, the serving with Triton, and what the serving benchmark measured for every format."

  - kind: terminal
    title: "The tests"
    lines:
      - {role: command, text: "uv run pytest tests"}
      - {role: comment, text: "# every test, short trainings of every task included"}
      - {role: command, text: "uv run pytest tests/models"}
      - {role: comment, text: "# one folder only, e.g. after changing a model"}
    narration:
      - "The tests mirror the folders of the training framework: {{foundations.repository.test_file_count}} test files, short trainings of every task on tiny synthetic data sets included."
      - "Assuming you changed a model, run only its folder with the second command, or them all with the first, and compare with the results from before the change."

  - kind: html
    page: diagram
    title: "The map of the repository"
    elements:
      - {type: text, position: [40, 50], text: ".", font: diagram_monospace, anchor: ls}
      - {type: text, position: [40, 100], text: "├── vision_training/", font: diagram_monospace, anchor: ls, highlight: [0]}
      - {type: text, position: [40, 150], text: "│   ├── main.py · configurations/ · configuration_processing/ · core/", font: diagram_monospace, anchor: ls, highlight: [0]}
      - {type: text, position: [40, 200], text: "│   ├── data/ · models/ · losses/ · trainers/", font: diagram_monospace, anchor: ls, highlight: [0]}
      - {type: text, position: [40, 250], text: "│   └── evaluation/ · tracking/ · deployment/ · utilities/", font: diagram_monospace, anchor: ls, highlight: [0]}
      - {type: text, position: [40, 300], text: "├── scripts/", font: diagram_monospace, anchor: ls, highlight: [1]}
      - {type: text, position: [40, 350], text: "│   └── evaluation/ · embedding/ · deployment/ · data/ · models/ · configuration_processing/", font: diagram_monospace, anchor: ls, highlight: [1]}
      - {type: text, position: [40, 400], text: "├── tests/", font: diagram_monospace, anchor: ls, highlight: [1]}
      - {type: text, position: [40, 450], text: "├── documentation/", font: diagram_monospace, anchor: ls, highlight: [1]}
      - {type: text, position: [40, 500], text: "│   └── architecture_benchmarking/ · reference/ · task workflows/", font: diagram_monospace, anchor: ls, highlight: [1]}
      - {type: text, position: [40, 550], text: "├── tutorials/", font: diagram_monospace, anchor: ls, highlight: [2]}
      - {type: text, position: [40, 600], text: "└── README.md · pyproject.toml · uv.lock · Dockerfile", font: diagram_monospace, anchor: ls}
    narration:
      - "To find your way, the training framework holds the entry point, the configurations, the data, the models and losses, the trainers, the evaluation, the tracking and the deployment."
      - "Next to it, the scripts folder holds the evaluation, comparison, clustering and serving benchmark scripts, the tests mirror the framework, and the documentation keeps the reference documents, the benchmark and one run of every task followed function by function."
      - "And the tutorials folder rebuilds these videos from the repository alone, small copies of their runs included, so that they follow the code."

  - kind: summary
    title: "The foundations"
    items:
      - {text: "One configuration file per run, its name and folder written by the run", sentences: [0]}
      - {text: "One training loop, scheduled in iterations", sentences: [1]}
      - {text: "One data pipeline and one augmentation code", sentences: [2]}
      - {text: "One backbone with its modules, shared by the {{foundations.repository.task_count}} tasks", sentences: [3]}
      - {text: "One optimization step, its schedule and averaged weights", sentences: [4]}
      - {text: "Evaluation, comparison, clustering and export scripts", sentences: [5]}
    narration:
      - "To recap the foundations: one configuration file defines a run, the settings that shape the model name it, and its folder holds everything it writes."
      - "One training loop trains every task, its summaries, checkpoints and evaluations scheduled in iterations, and a relaunch always resumes the run."
      - "One data pipeline loads, resizes and normalizes the images, and one augmentation code changes the training images only, its strengths fixed in the code."
      - "The {{foundations.repository.task_count:words}} tasks build their feature extractor from the same backbone section and modules, so a backbone trained for one task can start another."
      - "One optimization step applies the learning rate and its schedule in mixed precision, with an optional moving average of the weights."
      - "After the training, the scripts evaluate checkpoints again, compare launches and runs, cluster image embeddings and export a model to Triton."
      - "Every task series then covers what is its own: its data, its model, its targets and losses, its evaluation and its export, starting with classification."
