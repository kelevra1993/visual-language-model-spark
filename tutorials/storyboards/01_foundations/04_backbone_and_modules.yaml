      - {type: box, box: [720, 240, 980, 330], text: "3×3 conv\n32 filters", font: diagram_small, outline: blue, appear: 0, highlight: [1]}
      - {type: box, box: [380, 410, 640, 500], text: "1×1 conv\nreduction", font: diagram_small, outline: blue, appear: 0}
      - {type: arrow, points: [[648, 455], [712, 455]], appear: 0}
      - {type: box, box: [720, 410, 980, 500], text: "5×5 conv\n8 filters", font: diagram_small, outline: blue, appear: 0, highlight: [1]}
      - {type: box, box: [380, 580, 640, 670], text: "3×3 max\npooling", font: diagram_small, appear: 0}
      - {type: arrow, points: [[648, 625], [712, 625]], appear: 0}
      - {type: box, box: [720, 580, 980, 670], text: "3×3 conv\n8 filters", font: diagram_small, outline: blue, appear: 0, highlight: [1]}
      - {type: arrow, points: [[648, 115], [1352, 260]], appear: 1}
      - {type: arrow, points: [[988, 285], [1352, 330]], appear: 1}
      - {type: arrow, points: [[988, 455], [1352, 410]], appear: 1}
      - {type: arrow, points: [[988, 625], [1352, 480]], appear: 1}
      - {type: box, box: [1360, 220, 1560, 520], text: "concatenate\n16 + 32 + 8 + 8\n= 64 channels", font: diagram_small, outline: aqua, appear: 1, highlight: [1]}
      - {type: arrow, points: [[1568, 370], [1612, 370]], appear: 1}
      - {type: box, box: [1620, 320, 1750, 420], text: "layer\noutput", font: diagram_small, appear: 1}
      - {type: text, position: [1180, 690], text: "INCEPTION_STARTING_BLOCK = {{constant:vision_training/models/backbones/backbone.py#INCEPTION_STARTING_BLOCK}}", font: diagram_monospace, anchor: lm, appear: 2, highlight: [2]}
    narration:
      - "With inception on, every layer replaces its convolution with four branches side by side: a one by one convolution, a three by three and a five by five convolution after a one by one reduction, and a max pooling followed by a three by three convolution."
      - "The branches share the filters of the layer, a quarter, a half, an eighth and an eighth, and their outputs are concatenated, so the number of filters must be a multiple of eight."
      - "Inception always starts at block {{constant:vision_training/models/backbones/backbone.py#INCEPTION_STARTING_BLOCK}}, the blocks before it keeping their plain convolutions, and it adds the token INC{{constant:vision_training/models/backbones/backbone.py#INCEPTION_STARTING_BLOCK}} to the run name."

  - kind: html
    page: 01_foundations/receptive_field
    title: "The receptive field"
    code_reference: "vision_training/models/backbones/backbone.py · Backbone.compute_receptive_field_information"
    # Two neighbouring values of a feature map
    literal_numbers: [two]
    data:
      image_box: [40, 40, 700, 700]
      input_size: "{{foundations.listings.input_size}}"
      centre_x: "{{foundations.feature_maps.strongest_final_position.receptive_field_centre_x}}"
      centre_y: "{{foundations.feature_maps.strongest_final_position.receptive_field_centre_y}}"
      receptive_fields: "{{foundations.listings.receptive_fields}}"
    elements:
      - {type: image, path: "figures:foundations/model/input_star.png", box: [40, 40, 700, 700], border: border}
      - {type: text, position: [1260, 70], text: "receptive field after the last convolution of every block,\nin pixels of the {{foundations.listings.input_size}} pixel input", font: diagram_small, colour: dim, anchor: mm, align: center, appear: 1}
      - {type: bars, box: [820, 160, 1700, 600], values: "{{foundations.listings.receptive_fields}}", maximum: "{{foundations.listings.input_size}}", gap: 24, colour: blue, labels: "{{foundations.listings.block_labels}}", value_labels: "{{foundations.listings.receptive_field_labels}}", appear: 1, highlight: [2]}
      - {type: text, position: [1260, 690], text: "diagnosis_modes: compute_receptive_field: True", font: diagram_monospace, anchor: mm, appear: 3, highlight: [3]}
    narration:
      - "The receptive field of a value of a feature map is the square of input pixels it depends on: every {{foundations.listings.kernel_size:words}} by {{foundations.listings.kernel_size:words}} convolution widens it, and every pooling doubles the step between two neighbouring values."
      - "The squares are drawn around the strongest value of the final map for the test star, one per block, and the bars give their sides."
      - "After the last block, one value sees {{foundations.listings.final_receptive_field}} pixels a side, enough to hold the whole star, and squeeze and excitation adds the context of the whole image through its averages."
      - "Suppose your objects fill much of the image: with compute receptive field in the diagnosis modes, the launch prints it for every layer, to check that the last blocks see them as a whole."

