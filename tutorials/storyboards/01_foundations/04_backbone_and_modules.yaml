      - {type: arrow, points: [[70, 520], [70, 475], [1349, 475], [1349, 530]], colour: aqua, label: "identity path", label_position: [710, 462], label_anchor: md, appear: 2, highlight: [2], flow: true}
    narration:
      - "A residual shortcut adds the input of a pair of layers to their output, so the pair only learns a correction, and the gradient reaches the first blocks through the additions."
      - "In the original placement, the sum comes before the activation of the second layer, and squeeze and excitation rescales the layer output before the addition, never the shortcut."
      - "With residual nets v two, the pre-activation placement, every layer normalizes and activates its input before its convolution and nothing follows the addition, so the shortcuts form an identity path, and the block ends with a normalization and a ReLU."

  - kind: html
    page: 01_foundations/residual_pairs
    title: "The shortcuts of this run"
    code_reference: "vision_training/models/components/convolution_block.py · ConvolutionBlock.count_residual_additions"
    # The two maps a shortcut adds, the two layers of the blocks without a pair, and the example block of three layers
    literal_numbers: [two, three]
    data:
      blocks: "{{foundations.listings.block_table}}"
      example:
        number: 0
        layer_count: 3
        input_channels: 32
        output_channels: 64
        pairs: [[1, 2]]
        label: "3 layers · 32 → 64"
        caption: "example: a block of three layers changing the channels"
    elements:
      - {type: text, position: [968, 14], text: "the backbone summary printed at launch", font: diagram_tiny, colour: dim}
      - type: listing
        box: [960, 46, 1750, 730]
        font: diagram_monospace_tiny
        source: {file: "figures:foundations/listings/backbone_summary.txt", start: "Convolution Block 1", end: "^╰"}
        highlights:
          - {match: "Residual Shortcuts", sentences: [1, 3]}
    narration:
      - "A shortcut can only add two maps with the same channels, so in a block whose first layer changes the channels, the pairs start one layer later, from the output of that first layer."
      - "The first block never has one, and blocks {{foundations.listings.non_residual_blocks}} change the channels with only two layers, so only blocks {{foundations.listings.residual_blocks}} add a shortcut in this run."
      - "A block of three layers that changes the channels keeps one pair, over its last two layers."
      - "Think of the log of an older run: it names shortcuts in every block from the second, while the summary printed at launch names those of these blocks only, so trust this count."

