      - {type: box, box: [538, 245, 748, 345], text: "linear C → C/2\nReLU", font: diagram_small, outline: magenta, appear: 1, highlight: [1]}
      - {type: arrow, points: [[756, 295], [806, 295]], appear: 1}
      - {type: box, box: [816, 245, 1026, 345], text: "linear C/2 → C\nsigmoid", font: diagram_small, outline: magenta, appear: 1, highlight: [1]}
      - {type: arrow, points: [[921, 353], [921, 425]], appear: 2}
      - {type: text, position: [730, 450], text: "the {{foundations.squeeze_excitation.gate_count}} gates of layer {{foundations.squeeze_excitation.layer}} of block {{foundations.squeeze_excitation.block}} for the test star: {{foundations.squeeze_excitation.minimum_gate:.2f}} to {{foundations.squeeze_excitation.maximum_gate:.2f}}", font: diagram_small, anchor: mm, appear: 2}
      - {type: text, position: [48, 482], text: "1", font: diagram_small, colour: dim, anchor: rm, appear: 2}
      - {type: text, position: [48, 690], text: "0", font: diagram_small, colour: dim, anchor: rm, appear: 2}
      - {type: bars, box: [60, 482, 1400, 690], values: "{{foundations.squeeze_excitation.gates}}", maximum: 1.0, gap: 2, colour: magenta, appear: 2, highlight: [2]}
      - {type: arrow, points: [[105, 160], [105, 110], [1585, 110], [1585, 165]], label: "every channel × its gate", label_position: [845, 92], label_anchor: md, appear: 3}
      - {type: arrow, points: [[1034, 295], [1495, 295]], label: "gates", label_position: [1265, 280], label_anchor: md, appear: 3}
      - {type: stack, box: [1520, 230, 1650, 360], count: 8, offset: 8, fill: blue, layer_opacities: [0.6, 0.75, 0.15, 0.95, 0.5, 0.35, 0.8, 0.25], label: "rescaled channels", appear: 3, highlight: [3]}
      - {type: text, position: [1560, 450], text: "{{foundations.listings.squeeze_excitation_parameter_count:,}} parameters\nin this backbone", font: diagram_small, anchor: mm, align: center, appear: 4, highlight: [4]}
    narration:
      - "Squeeze and excitation weighs the channels of every layer output: it first averages every channel over the whole map, one number per channel."
      - "Two linear layers without bias, with half as many units in between, turn these numbers into one gate per channel, between zero and one after a sigmoid."
      - "Here are the {{foundations.squeeze_excitation.gate_count}} real gates of one layer of the last block of the trained model for the test star, from {{foundations.squeeze_excitation.minimum_gate:.2f}} to {{foundations.squeeze_excitation.maximum_gate:.2f}}."
      - "Every channel is multiplied by its gate, so the network strengthens the channels that matter for this image and mutes the others, a context taken from the whole image."
      - "With C squared weights per layer, the module adds {{foundations.listings.squeeze_excitation_parameter_count:,}} parameters to this backbone."

