    narration:
      - "Here is what the trained classification model computes for a test star: after the first block, at {{foundations.feature_maps.block_1.output_height}} pixels a side, the most active channels respond to the flat colours of the star and of the background."
      - "After the third block, at {{foundations.feature_maps.block_3.output_height}} pixels a side, the channels trace the outline of the star."
      - "After the sixth block, the map is {{foundations.feature_maps.block_6.output_height}} by {{foundations.feature_maps.block_6.output_width}}, and every channel lights up where the star is: these are the values the head of the task reads."
      - "Every tile is scaled to its own strongest response, from dark for zero to white, the ReLU leaving no negative value."

  - kind: html
    page: diagram
    title: "Squeeze and excitation"
