  - kind: summary
    title: "Recap"
    # The four branches of Inception
    literal_numbers: [four]
    items:
      - {text: "The backbone section lists the blocks: layers and filters, a max pooling after every block"}
      - {text: "A layer: convolution, normalization, ReLU, then squeeze and excitation"}
      - {text: "Shortcuts add the input of a pair of layers, shifted when the channels change"}
      - {text: "Inception splits every layer into four branches from block {{constant:vision_training/models/backbones/backbone.py#INCEPTION_STARTING_BLOCK}}"}
      - {text: "Model size printed at every launch, receptive field by the diagnosis modes"}
      - {text: "A trained backbone starts another task through its pretrained settings"}
    narration:
      - "To sum up: the backbone stacks the blocks of its section, with squeeze and excitation, the residual shortcuts and inception as options, the shortcuts following pairs of layers with the same channels."
      - "The next chapter covers the optimization: the optimizer, the learning rate and its schedule, mixed precision and the moving average of the weights."
