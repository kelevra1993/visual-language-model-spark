# Foundations, chapter 4: the backbone shared by every task: its configuration section, the layers of a convolution
# block, what the trained blocks compute, the modules (squeeze and excitation, residual shortcuts and their pairs,
# inception), the receptive field, where the parameters are, the transfer of a trained backbone, and what the benchmark
# measured. The model is the one of the classification run of tutorial_sources.yaml, read by tutorials/figures/foundations
# (listings.py for its blocks and summaries, backbone_activations.py for its feature maps and gates, benchmark.py for
# the benchmark charts); the block drawn layer by layer is its third block (listings.example_block).
series: foundations
series_title: "Foundations"
chapter: 4
title: "The backbone and its modules"
output_name: foundations_04_backbone_and_modules
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [foundations]
references:
  - "vision_training/models/backbones/backbone.py · Backbone"
  - "vision_training/models/backbones/backbone.py · Backbone.compute_receptive_field_information"
  - "vision_training/models/components/convolution_block.py · ConvolutionBlock.compute_layers"
  - "vision_training/models/components/convolution_block.py · ConvolutionBlock.count_residual_additions"
  - "vision_training/models/components/squeeze_and_excitation.py · SqueezeAndExcitation"
  - "vision_training/models/components/inception.py · InceptionConvolution"
  - "vision_training/models/model_transfer.py · compare_backbone_architectures"
  - "documentation/architecture_benchmarking/experiment_plan.md"
scenes:
  - kind: title_card
    heading: "The backbone and its modules"
    subheading: "Blocks, gates, shortcuts, receptive field"
    footnote: "Foundations · chapter 4"
    # The number of the chapter, the chapter key of this storyboard
    literal_numbers: ["4"]
    narration:
      - "Every task of the repository builds its feature extractor from the same backbone section, so a backbone trained for one task can start another."
      - "This chapter opens it: the blocks, the modules that can be switched on, what the trained blocks compute, and what the benchmark measured for each setting."

  - kind: yaml
    title: "The backbone section"
    code_reference: "vision_training/models/backbones/backbone.py · build_backbone"
    source:
      file: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
      keys: [Backbone.convolutions, Backbone.last_max_pooling, Backbone.normalization, Backbone.modules]
      comments: false
    highlights:
      - {match: "\"\\d+\": \\[", sentences: [0]}
      - {match: "last_max_pooling", sentences: [1]}
      - {match: "input_normalization|feature_map_normalization", sentences: [2]}
      - {match: "residual_nets|inception|squeeze_and_excite", sentences: [3]}
    narration:
      - "The convolutions list the blocks in order: every entry gives the number of convolution layers of a block, then the filters of each of its layers."
      - "Every block ends with a {{foundations.listings.pooling_size:words}} by {{foundations.listings.pooling_size:words}} max pooling, but the last one while last max pooling is false, which gives this backbone a stride of {{foundations.listings.final_stride}}."
      - "The input normalization maps the pixels to minus one half to one half, and the feature map normalization follows every convolution: batch, layer or none, the batch statistics following the training batches at a fixed momentum of {{constant:vision_training/models/components/convolution_block.py#BATCH_NORMALIZATION_MOMENTUM}}."
      - "The modules switch on the residual shortcuts, their pre-activation placement, inception from the third block, and squeeze and excitation; every one of them enters the run name."

