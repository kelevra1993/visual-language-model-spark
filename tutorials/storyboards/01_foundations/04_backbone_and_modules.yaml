    code_reference: "vision_training/models/components/convolution_block.py · ConvolutionBlock.compute_layers"
    # The first and second layers of the pair drawn
    literal_numbers: ["1", "2"]
    elements:
      - {type: text, position: [95, 120], text: "block {{foundations.listings.example_block.number}} input", font: diagram_small, colour: dim, anchor: mm}
      - {type: stack, box: [50, 165, 140, 255], count: 5, offset: 7, fill: blue, label: "{{foundations.listings.example_block.input_size}}×{{foundations.listings.example_block.input_size}}×{{foundations.listings.example_block.input_channels}}"}
      - {type: text, position: [215, 145], text: "layer 1", font: diagram_small, colour: dim, anchor: ls, appear: 0}
      - {type: arrow, points: [[170, 210], [205, 210]], appear: 0}
      - {type: box, box: [215, 160, 385, 260], text: "conv {{foundations.listings.kernel_size}}×{{foundations.listings.kernel_size}}\n{{foundations.listings.example_block.output_channels}} filters", font: diagram_small, outline: blue, appear: 0, highlight: [0, 1]}
      - {type: arrow, points: [[393, 210], [440, 210]], appear: 0}
      - {type: box, box: [450, 160, 620, 260], text: "batch\nnorm", font: diagram_small, outline: yellow, appear: 0, highlight: [0]}
      - {type: arrow, points: [[628, 210], [675, 210]], appear: 0}
      - {type: box, box: [685, 160, 795, 260], text: "ReLU", font: diagram_small, outline: violet, appear: 0, highlight: [0]}
      - {type: arrow, points: [[803, 210], [850, 210]], appear: 0}
      - {type: box, box: [860, 160, 1030, 260], text: "squeeze and\nexcitation", font: diagram_small, outline: magenta, appear: 0, highlight: [0]}
      - {type: text, position: [1390, 210], text: "each layer: {{foundations.listings.kernel_size}} × {{foundations.listings.kernel_size}} × {{foundations.listings.example_block.output_channels}} × {{foundations.listings.example_block.output_channels}}\n= {{foundations.listings.example_block.layer_weight_count:,}} weights + {{foundations.listings.example_block.output_channels}} biases", font: diagram_text, anchor: mm, align: center, appear: 1, highlight: [1]}
      - {type: arrow, points: [[945, 268], [945, 330], [300, 330], [300, 412]], appear: 1}
      - {type: text, position: [320, 400], text: "layer 2 · closes the pair", font: diagram_small, colour: dim, anchor: ls, appear: 1}
      - {type: box, box: [215, 420, 385, 520], text: "conv {{foundations.listings.kernel_size}}×{{foundations.listings.kernel_size}}\n{{foundations.listings.example_block.output_channels}} filters", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: arrow, points: [[393, 470], [440, 470]], appear: 1}
      - {type: box, box: [450, 420, 620, 520], text: "batch\nnorm", font: diagram_small, outline: yellow, appear: 1}
      - {type: arrow, points: [[628, 470], [675, 470]], appear: 1}
      - {type: box, box: [685, 420, 855, 520], text: "squeeze and\nexcitation", font: diagram_small, outline: magenta, appear: 2, highlight: [2]}
      - {type: arrow, points: [[863, 470], [910, 470]], appear: 2}
      - {type: box, box: [920, 435, 990, 505], text: "+", font: diagram_heading, outline: aqua, appear: 2, highlight: [2]}
      - {type: arrow, points: [[95, 305], [95, 600], [955, 600], [955, 513]], colour: aqua, label: "shortcut: the block input", label_position: [510, 625], label_anchor: ma, appear: 2, highlight: [2]}
      - {type: arrow, points: [[998, 470], [1045, 470]], appear: 2}
      - {type: box, box: [1055, 420, 1165, 520], text: "ReLU", font: diagram_small, outline: violet, appear: 2, highlight: [2]}
      - {type: arrow, points: [[1173, 470], [1220, 470]], appear: 3}
      - {type: box, box: [1230, 420, 1400, 520], text: "max pooling\n{{foundations.listings.pooling_size}}×{{foundations.listings.pooling_size}}", font: diagram_small, appear: 3, highlight: [3]}
      - {type: arrow, points: [[1408, 470], [1455, 470]], appear: 3}
      - {type: stack, box: [1470, 425, 1560, 515], count: 5, offset: 7, fill: blue, label: "{{foundations.listings.example_block.output_size}}×{{foundations.listings.example_block.output_size}}×{{foundations.listings.example_block.output_channels}}", appear: 3, highlight: [3]}
    narration:
      - "Inside a block, every layer is a {{foundations.listings.kernel_size:words}} by {{foundations.listings.kernel_size:words}} convolution padded to keep the map size, its normalization and a ReLU, then squeeze and excitation when it is on."
      - "In block {{foundations.listings.example_block.number}}, each of the {{foundations.listings.example_block.output_channels}} filters reads all {{foundations.listings.example_block.input_channels}} input channels: {{foundations.listings.example_block.layer_weight_count:,}} weights per layer."
      - "The layer closing a residual pair recalibrates its normalized output first, adds the shortcut, and only then applies its ReLU, so the gates never rescale the shortcut."
      - "The block ends with its max pooling: {{foundations.listings.example_block.input_size}} pixels a side become {{foundations.listings.example_block.output_size}}."

