      - "The weights of a layer grow with the product of its input and output channels, so {{foundations.listings.last_block_parameter_percent}} percent of the backbone sits in its last block."
      - "The head of every task adds its own, {{foundations.listings.head_parameter_count:,}} parameters for the classification head of this run, which reads the flattened map: the classification series comes back to it."

  - kind: yaml
    title: "Starting from a trained run"
    font_size: 34
    code_reference: "vision_training/models/model_transfer.py · load_pretrained_component"
    source:
      file: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
      keys: [Backbone.pretrained]
      comments: false
    highlights:
      - {match: "experiment_folder|iteration", sentences: [0]}
      - {match: "freeze:|freeze_normalization_parameters|learning_rate_multiplier", sentences: [2]}
    narration:
      - "Say you want to reuse another run: every component can start from its weights, the experiment folder naming that run folder, and the iteration the checkpoint, null taking the last one."
      - "The backbone needs the same blocks, modules and normalization as the source, or the first blocks of the source backbone; the image size and the task may differ."
      - "Freeze keeps its weights and batch statistics fixed, freeze normalization parameters fixes only the scale and shift of its normalization layers, and the learning rate multiplier lets it learn at another speed than the new layers."
      - "The transfer adds PT to the run name, with FRZ when frozen and FBN for the fixed normalization; the multiplier gives no token, so it can change when the run resumes."

