      - {type: image, path: "figures:foundations/model/feature_maps_block_1.png", box: [440, 115, 1740, 735], appear: 0, until: 0}
      - {type: text, position: [1090, 85], text: "block {{foundations.feature_maps.shown_blocks[1]}} output · {{foundations.feature_maps.block_3.output_height}}×{{foundations.feature_maps.block_3.output_width}}×{{foundations.feature_maps.block_3.output_channels}} · the {{foundations.feature_maps.shown_channel_count}} most active of {{foundations.feature_maps.block_3.output_channels}} channels", font: diagram_bold, anchor: mm, appear: 1, until: 1}
      - {type: image, path: "figures:foundations/model/feature_maps_block_3.png", box: [440, 115, 1740, 735], scaling: pixel, appear: 1, until: 1}
      - {type: text, position: [1090, 85], text: "block {{foundations.feature_maps.shown_blocks[2]}} output · {{foundations.feature_maps.block_6.output_height}}×{{foundations.feature_maps.block_6.output_width}}×{{foundations.feature_maps.block_6.output_channels}} · the {{foundations.feature_maps.shown_channel_count}} most active of {{foundations.feature_maps.block_6.output_channels}} channels", font: diagram_bold, anchor: mm, appear: 2}
