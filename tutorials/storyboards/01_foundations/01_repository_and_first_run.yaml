# Foundations, chapter 1: what the repository is, where its parts live, how a run is installed (with uv, or in the
# trainer image of the Dockerfile) with the ImageNet-22k download of the pre-trained backbones, configured, checked
# without training, converted after a removed setting, named and launched, and what it prints and writes. Coordinates
# of the html scenes are in pixels of the content area (1760 x 740, origin at its top left corner); the figures named
# figures:foundations/... are made by tutorials/figures/foundations.
series: foundations
series_title: "Foundations"
chapter: 1
title: "The repository and a first run"
output_name: foundations_01_repository_and_first_run
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [foundations]
references:
  - "vision_training/main.py · main"
  - "vision_training/configuration_processing/configuration_loader.py · load_experiment_configuration"
  - "vision_training/configuration_processing/run_name.py"
  - "vision_training/data/synthetic/create_synthetic_dataset.py"
  - "vision_training/data/classification/imagenet_download.py"
  - "vision_training/check_configuration.py · main"
  - "scripts/configuration_processing/convert_fixed_settings.py"
  - "scripts/evaluation/evaluate_checkpoint.py"
  - "documentation/task workflows/classification_workflow.md"
scenes:
  - kind: title_card
    heading: "The repository and a first run"
    subheading: "{{foundations.repository.task_count}} tasks, one backbone, one training loop"
    footnote: "Foundations · chapter 1"
    # The number of the chapter, the chapter key of this storyboard
    literal_numbers: ["1"]
    narration:
      - "This series is for engineers who know deep learning and need to know this repository: what it decides for you, where the code lives, and which settings matter."
      - "This first chapter maps the {{foundations.repository.task_count:words}} tasks, installs the environment or builds its container image, and follows one synthetic run from its configuration file to its run folder."

  - kind: html
    page: diagram
    title: "{{foundations.repository.task_count}} tasks on one backbone"
    code_reference: "vision_training/models/backbones/backbone.py · Backbone"
    elements:
      # Inputs on the left, the image from the start, the sequences and pairs with the sequence tasks
      - {type: box, box: [40, 90, 330, 200], text: "Image", font: diagram_bold, outline: blue}
      - {type: box, box: [40, 320, 330, 430], text: "Sequence\nof frames", font: diagram_bold, outline: aqua, appear: 2}
      - {type: box, box: [40, 550, 330, 660], text: "Pair\nbefore, after", font: diagram_bold, outline: aqua, appear: 2}
      # Shared backbone: blocks halving the resolution while the channels grow
      - {type: cuboid, box: [430, 255, 520, 495], depth: 12, fill: blue}
      - {type: cuboid, box: [565, 285, 635, 465], depth: 22, fill: blue}
      - {type: cuboid, box: [680, 310, 730, 440], depth: 32, fill: blue}
      - {type: cuboid, box: [770, 330, 805, 420], depth: 42, fill: blue}
      - {type: cuboid, box: [845, 345, 870, 405], depth: 52, fill: blue}
      - {type: text, position: [665, 530], text: "Shared backbone", font: diagram_bold, anchor: ma}
      - {type: text, position: [665, 572], text: "convolution blocks with optional\nsqueeze-and-excitation, residual\nand inception modules", font: diagram_small, colour: dim, anchor: ma, align: center}
      - {type: arrow, points: [[330, 145], [420, 320]], colour: blue}
      - {type: arrow, points: [[330, 375], [420, 375]], colour: aqua, appear: 2}
      - {type: arrow, points: [[330, 605], [420, 430]], colour: aqua, appear: 2}
      # Image tasks on the right
      - {type: text, position: [1050, 22], text: "Image tasks: a head on the backbone", font: diagram_small, colour: dim, appear: 1}
      - {type: arrow, points: [[915, 350], [1040, 175]], colour: blue, appear: 1, highlight: [1]}
      - {type: box, box: [1050, 60, 1380, 130], text: "CLS · classification", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [1400, 60, 1730, 130], text: "DET · object detection", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [1050, 145, 1380, 215], text: "INS · instance masks", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [1400, 145, 1730, 215], text: "KPT · keypoints", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [1050, 230, 1380, 300], text: "SEG · segmentation", font: diagram_small, outline: blue, appear: 1}
      # Sequence tasks, the backbone run on every frame
      - {type: text, position: [1050, 372], text: "Sequence tasks: the backbone on every frame", font: diagram_small, colour: dim, appear: 2}
      - {type: arrow, points: [[915, 400], [1040, 480]], colour: aqua, appear: 2, highlight: [2]}
      - {type: box, box: [1050, 410, 1380, 480], text: "M2O · class per sequence", font: diagram_small, outline: aqua, appear: 2}
      - {type: box, box: [1400, 410, 1730, 480], text: "M2M · class per frame", font: diagram_small, outline: aqua, appear: 2}
      - {type: box, box: [1050, 495, 1380, 565], text: "CMP · class per pair", font: diagram_small, outline: aqua, appear: 2}
      - {type: box, box: [1400, 495, 1730, 565], text: "SEL · frames to select", font: diagram_small, outline: aqua, appear: 2}
      # Self-supervised task, training the backbone the others start from
      - {type: box, box: [1050, 630, 1730, 700], text: "SSL · self-supervised: the backbone without labels", font: diagram_small, outline: violet, appear: 3, highlight: [3]}
      - {type: arrow, points: [[1050, 665], [880, 665], [880, 425]], colour: violet, appear: 3, highlight: [3], label: "pre-trained\nweights", label_position: [965, 610]}
    narration:
      - "Every task of the repository shares one convolutional backbone, one training loop, one configuration format, one evaluation report and one export to Triton."
      - "The image tasks put a head on that backbone: pooling and a fully connected head for classification, region proposals and ROI Align for detection and instance masks, a high resolution network for keypoints, and a U-Net decoder for segmentation."
      - "The sequence tasks run the backbone on every frame, then a temporal module: one class per sequence, per frame, per pair of sequences, or the frames to select."
      - "And the self-supervised task trains the backbone without any label, so that every other task can start from its weights."

  - kind: text_panel
    title: "Where things live"
    columns:
      - heading: "vision_training/"
        lines:
          - "main.py                   entry point"
          - "configurations/           one folder per task"
          - "configuration_processing/ load, check, name"
          - "data/                     datasets, augmentation"
          - "models/                   backbone, task heads"
          - "losses/                   losses of every task"
          - "trainers/                 base trainer, one per task"
          - "evaluation/               metrics and reports"
          - "deployment/               export, Triton"
      - heading: "around it"
        lines:
          - "scripts/        evaluation and tools"
          - "tests/          mirrors the package"
          - "documentation/  benchmark, workflows, suggestions"
          - "  reference/    the details of the README"
          - "tutorials/      these videos"
          - "Dockerfile      trainer image"
          - "README.md       commands, main settings"
    narration:
      - "The training framework is one package: its main module is the entry point of every training, and every task adds its trainer, dataset, model, loss and metrics to the matching folders."
      - "Around it, the scripts evaluate and compare runs and hold the other tools, the tests mirror the package, and the documentation holds the benchmark results, the suggested improvements not made yet, and one workflow document per task that follows a real run function by function."
      - "The README keeps the commands and the main settings of every task, and the reference documents of the documentation folder give the details: the keys and their values, the outputs, the tools."

  - kind: terminal
    title: "Install, generate, train"
    code_reference: "vision_training/main.py · main"
    lines:
      - {role: comment, text: "# The environment pinned by uv.lock"}
      - {role: command, text: "uv sync"}
      - {role: comment, text: "# A synthetic dataset: task set in the main block, its folder given as an argument"}
      - {role: command, text: "uv run python -m vision_training.data.synthetic.create_synthetic_dataset --output_folder=~/Data/classifier_data/synthetic_shapes"}
      - {role: comment, text: "# A training: its only argument is the path of its configuration"}
      - {role: command, text: "uv run python -m vision_training.main --configuration_path=\"vision_training/configurations/classification/configuration_synthetic_shapes.yaml\""}
    narration:
      - "uv sync installs the environment pinned by the lock file, and every script then runs as a module from the repository root."
      - "Say you want to try a task before any data is at hand: the synthetic data set script draws a shapes data set for it, with nothing to download; its task is set in its main block, like the settings of almost every script but the training, and its folder is its one argument."
      - "The training takes a single argument, the path of its configuration file, and that file alone defines the run."

  # The download prints nothing before it reaches the gated data set of Hugging Face, so the scene shows its commands
  # alone; the settings quoted are those of its main block (code_values.py)
  - kind: terminal
    title: "ImageNet-22k for the pre-trained backbones"
    code_reference: "vision_training/data/classification/imagenet_download.py · download_imagenet_22k"
    lines:
      - {role: comment, text: "# Once: accept the terms of {{constant:vision_training/data/classification/imagenet_download.py#IMAGENET_22K_REPOSITORY}} on Hugging Face, then log in"}
      - {role: command, text: "uv run hf auth login"}
      - {role: comment, text: "# Settings in its main block: dataset folder, free space margin, held-out images, workers"}
      - {role: command, text: "uv run python -m vision_training.data.classification.imagenet_download"}
    narration:
      - "The example configurations of classification and of the self-supervised task train on ImageNet-22k, which the ImageNet download script fetches from a gated Hugging Face data set at a pinned revision."
      - "Accept its terms once and log in; the script checks the access before its first shard, starts no shard below {{foundations.scripts.imagenet_minimum_free_gigabytes}} gigabytes free, and resumes shard by shard when launched again."
      - "Its held-out images, {{foundations.scripts.imagenet_held_out_images_per_class:words}} per class of at least {{foundations.scripts.imagenet_minimum_held_out_class_size}} images, are both the validation and the test split, so a setting chosen on the validation curves is chosen on the test images."

  # The header of the Dockerfile lists its stages and its build and run commands, so that the excerpt follows the file
  - kind: code
    title: "The trainer image"
    code_reference: "Dockerfile"
    syntax: plain
    source:
      file: Dockerfile
      start: "^# Multi-stage build"
      end: "^#   args:"
    highlights:
      - {match: "^# Multi-stage build", sentences: [0]}
      - {match: "^#   (uv|base|builder) ", sentences: [1]}
      - {match: "^#   (test|runtime) ", sentences: [2]}
      - {match: "docker buildx build", sentences: [3]}
      - {match: "^# Start a training|^#   args:", sentences: [4]}
    narration:
      - "Should a training run in a container, on the GPU pods of a cloud Kubernetes cluster or on the DGX Spark, the Dockerfile of the repository root builds the trainer in named stages."
      - "The base stage holds Ubuntu, the libraries OpenCV loads and an unprivileged user, and the builder stage adds Python and the locked environment, without the development and data set groups."
      - "The test stage adds pytest and the tests, built only when targeted, and the runtime stage, the default, keeps the interpreter, the environment and the code, without uv nor the tests."
      - "There is no CUDA image underneath: the CUDA libraries come with the torch wheels and the driver from the machine, and each machine builds the image for its own architecture."
      - "A pod passes the training command as the arguments of the container, so that its init process stays first and forwards the stop signal, which the trainer handles as Control C."

  - kind: yaml
    title: "One file defines the run"
    code_reference: "vision_training/configuration_processing/configuration_loader.py · load_experiment_configuration"
    source:
      file: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
      keys: [ExperimentConfiguration.task, ExperimentConfiguration.weight_saving_iterations,
             ExperimentConfiguration.number_iterations, ExperimentConfiguration.validation_iteration_ratio, Optimization.optimizer,
             Data.image_settings, Backbone.input_channels, ClassificationHead.output_mode]
      comments: false
    highlights:
      - {match: "^(ExperimentConfiguration|Optimization|Data|Backbone|ClassificationHead):", sentences: [0]}
      - {key: ExperimentConfiguration.task, sentences: [0, 2]}
      - {key: ExperimentConfiguration.number_iterations, sentences: [3]}
      - {key: ExperimentConfiguration.weight_saving_iterations, sentences: [3]}
      - {key: ExperimentConfiguration.validation_iteration_ratio, sentences: [3]}
    narration:
      - "A configuration has one section for the experiment, one for the optimization, one for the data, one for the backbone, and the sections of the task, here the classification head."
      - "Detection and instance segmentation also have a Neck section between the backbone and their heads, whose type picks a feature pyramid, a path aggregation, or no neck."
      - "There are no defaults, the file of a task holding every key the task reads: if, for instance, you forget a key, the launch stops on it with its path, while the checks gather every inconsistent value before stopping, so one launch lists them all."
      - "The training is counted in iterations, not epochs: checkpoints, evaluations and summaries are all set in iterations."

  # Consoles of configuration_consoles.py, which runs the check on copies of the synthetic configuration written at
  # build time; the copy is given with a space after --configuration_path, so that the reference check, which looks up
  # every --configuration_path= file in the repository, checks the repository file alone
  - kind: terminal
    title: "Checking without training"
    code_reference: "vision_training/check_configuration.py · check_configuration_file"
    lines:
      - {role: command, text: "uv run python -m vision_training.check_configuration --configuration_path=\"vision_training/configurations/classification/configuration_synthetic_shapes.yaml\" --configuration_path {{foundations.configuration_check.mistaken_file_name}}"}
      - {role: output, text: "{{foundations.configuration_check.valid_line}}"}
      - {role: output, text: "{{foundations.configuration_check.invalid_line}}"}
      - {role: output, text: "{{foundations.configuration_check.problem_lines[0]}}"}
      - {role: output, text: "{{foundations.configuration_check.problem_lines[1]}}"}
    narration:
      - "The same checks run without training: the check configuration module loads every file it is given as a training does, here the synthetic configuration and a copy holding {{foundations.configuration_check.problem_count:words}} mistakes."
      - "A valid file prints the run folder it would train in, an invalid one every problem, and the command exits with {{foundations.configuration_check.exit_code:words}} when a file is invalid, so that a pipeline stops before the training."
      - "With check paths, the data folders, the label mapping file and the pre-trained runs a new training reads must exist too."

  # The copy writes ExperimentConfiguration.batch_size without its underscore (MISSPELLED_KEY of
  # configuration_consoles.py); the check refuses unknown keys alone, before the other checks
  - kind: terminal
    title: "A misspelled key"
    code_reference: "vision_training/configuration_processing/configuration_keys.py · check_unknown_keys"
    lines:
      - {role: command, text: "uv run python -m vision_training.check_configuration --configuration_path {{foundations.configuration_check.misspelled_file_name}}"}
      - {role: output, text: "{{foundations.configuration_check.misspelled_invalid_line}}"}
      - {role: output, text: "{{foundations.configuration_check.misspelled_problem_line}}"}
    narration:
      - "A misspelled key, like the batch size of this copy written without its underscore, is read by no code, so its value would be silently ignored."
      - "The check refuses every key the code of the task does not read, alone and before the checks of the values, with its path and the closest known key."

  # The old copy holds a removed setting (OLD_REMOVED_SETTING of configuration_consoles.py) with the value the code now
  # always uses; the conversion searches a launch folder holding it alone, the folders of the main block being those
  # of the machine
  - kind: terminal
    title: "Converting older configurations"
    code_reference: "scripts/configuration_processing/convert_fixed_settings.py · convert_fixed_settings"
    lines:
      - {role: command, text: "uv run python -m vision_training.check_configuration --configuration_path {{foundations.configuration_conversion.old_file_name}}"}
      - {role: output, text: "{{foundations.configuration_conversion.invalid_line}}"}
      - {role: output, text: "{{foundations.configuration_conversion.problem_line}}"}
      - {role: comment, text: "# Main block: the run and launch folders searched; write_files = False only lists"}
      - {role: command, text: "uv run python -m scripts.configuration_processing.convert_fixed_settings"}
      - {role: output, text: "{{foundations.configuration_conversion.listing_line}}"}
    narration:
      - "A configuration written before a setting was removed is refused before any other check, the message naming the behaviour the code now fixes in its place."
      - "The convert fixed settings script removes such settings from the saved run configurations and launch files of the folders of its main block, adds the settings a task now requires, and backs up every file it converts."
      - "With write files set to False, it only lists the files to convert, here that old configuration."

  - kind: html
    page: diagram
    title: "The run name"
    code_reference: "vision_training/configuration_processing/run_name.py · build_run_name"
    elements:
      # The run name centred, its arrows leaving from the middle of each section (a character of code_text being about
      # 15.4 pixels wide), so a run of another name needs their x moved
      - {type: text, position: [232, 110], font: code_text, segments: [{text: "{{foundations.listings.run_name_sections[0]}}", highlight: [1]}, {text: "_", colour: dim}, {text: "{{foundations.listings.run_name_sections[1]}}", highlight: [1]}, {text: "_", colour: dim}, {text: "{{foundations.listings.run_name_sections[2]}}", highlight: [2]}, {text: "_", colour: dim}, {text: "{{foundations.listings.run_name_sections[3]}}", highlight: [3]}, {text: "_", colour: dim}, {text: "{{foundations.listings.run_name_sections[4]}}", highlight: [3]}]}
      # Boxes 304 pixels wide, 40 pixels apart and from the card edges, each arrow ending above the middle of its box
      - {type: arrow, points: [[255, 130], [192, 240]], appear: 1}
      - {type: box, box: [40, 245, 344, 475], text: "{{foundations.listings.run_name_sections[0]}}\n\ntask:\nclassification", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: arrow, points: [[371, 130], [536, 240]], appear: 1}
      - {type: box, box: [384, 245, 688, 475], text: "{{foundations.listings.run_name_sections[1]}}\n\ninput normalization,\nkept aspect ratio,\n{{foundations.listings.input_size}} pixel images", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: arrow, points: [[811, 130], [880, 240]], appear: 2}
      - {type: box, box: [728, 245, 1032, 475], text: "{{foundations.listings.run_name_backbone_modules}}-B...-{{foundations.listings.run_name_backbone_transfer}}\n\nsqueeze-and-excitation,\nresidual shortcuts,\nbatch normalization,\nlayers x filters per block,\npre-trained weights", font: diagram_small, outline: magenta, appear: 2, highlight: [2]}
      - {type: arrow, points: [[1304, 130], [1224, 240]], appear: 3}
      - {type: box, box: [1072, 245, 1376, 475], text: "{{foundations.listings.run_name_sections[3]}}\n\nflatten pooling,\n{{foundations.run.hidden_units}} hidden units,\nlayer normalization,\nbalanced class weights", font: diagram_small, outline: violet, appear: 3, highlight: [3]}
      - {type: arrow, points: [[1482, 130], [1568, 240]], appear: 3}
      - {type: box, box: [1416, 245, 1720, 475], text: "{{foundations.listings.run_name_sections[4]}}\n\nmulti-class output,\n{{foundations.run.class_count}} classes", font: diagram_small, outline: aqua, appear: 3, highlight: [3]}
      - {type: box, box: [130, 520, 1630, 700], text: "No token: batch size, learning rate and its schedule, augmentation, dropout,\nmoving average of the weights\nrun_name_suffix: \"v1\"  →  <run name>_v1, a new run of the same settings", font: diagram_text, outline: yellow, appear: 4, highlight: [4]}
    narration:
      - "The run folder is named after the settings that shape the model, so that the same settings resume in the same folder and changed ones start a new run."
      - "Here: the task, then the input, normalized, with its aspect ratio kept, at {{foundations.listings.input_size}} pixels."
      - "Then the backbone, with squeeze and excitation, residual shortcuts and batch normalization, the layers by channels of its {{foundations.listings.block_count:words}} blocks, and PT, since it starts from the weights of a pre-trained run."
      - "Then the head: flattened features, a hidden layer of {{foundations.run.hidden_units}} units with layer normalization, balanced class weights, and {{foundations.run.class_count:words}} classes."
      - "Settings that may change when a run resumes, like the learning rate, the augmentation or the moving average, leave no token; should you need a second run of the same settings, a run name suffix starts it."

  - kind: image
    title: "What the launch prints"
    image: "repository:README/experiment_launch_information.png"
    # Boxes measured on the 1300 x 592 capture, every console line 20 pixels high from y 16: the run name, the folders
    # and files, the pre-trained backbone block, the splits, the epoch length, then the batch size to the schedule
    views:
      - {box: [0, 40, 960, 300], from_sentence: 0}
      - {box: [0, 280, 700, 380], from_sentence: 1}
      - {box: [0, 362, 620, 592], from_sentence: 2}
    highlights:
      - {box: [10, 77, 950, 95], sentences: [0]}
      - {box: [10, 97, 950, 195], sentences: [0]}
      - {box: [10, 197, 610, 295], sentences: [0]}
      - {box: [10, 297, 600, 355], sentences: [1]}
      - {box: [10, 357, 330, 375], sentences: [1]}
      - {box: [10, 377, 520, 495], sentences: [2]}
    narration:
      - "At launch, the trainer prints the run name, then its folders and files as clickable links, and the pre-trained backbone the run starts from."
      - "Then every split with its images and categories, and the length of one epoch in iterations, the only place where epochs appear."
      - "Then the training settings: the batch size, the iterations, how often checkpoints are saved and evaluated, the learning rate and the optimizer."
      - "Below this panel come the architecture of the model, the parameters of each of its parts, and the Export Sizes panel: the size of every file the model is turned into, from its exports to its checkpoints, estimated without exporting it."

  - kind: html
    page: diagram
    title: "The run folder"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.setup_training_paths"
    # The three splits of every run: training, validation and test
    literal_numbers: [three]
    elements:
      # The tree of the run folder in the small monospace font, its 27 lines (the input samples, the evaluation summary
      # and curves included) taller than the card in the larger one
      - type: listing
        box: [40, 6, 1040, 740]
        font: diagram_monospace_small
        source: {file: "figures:foundations/listings/run_folder_tree.txt"}
        highlights:
          - {match: "training_configuration.yaml|data.json|label_dictionary.json", sentences: [0]}
          - {match: "Input_Samples/|samples.json", sentences: [1]}
          - {match: "Weights/|model_\\d+\\.pt|full-checkpoint", sentences: [2]}
          # The split folders of Tensorboard/ left out, Test/ and Validation/ being also lines of Input_Samples/
          - {match: "Tensorboard/|Results.txt|evaluation_curves.png|evaluation_summary.csv|mlflow_run.json", sentences: [3]}
          - {match: "Evaluation/", sentences: [4]}
      - {type: text, position: [1100, 60], text: "Every evaluated checkpoint", font: diagram_bold, appear: 4}
      - type: listing
        box: [1100, 120, 1720, 420]
        font: diagram_monospace
        appear: 4
        source: {file: "figures:foundations/listings/evaluation_folder_tree.txt"}
    narration:
      - "Everything a run writes stays in its folder: the copy of its configuration, the record of its data with the classes counted in every split, and the class index of every category."
      - "Before its first iteration, a launch also draws the first {{constant:vision_training/trainers/input_samples.py#NUMBER_INPUT_SAMPLES:words}} samples of every split as the network receives them, the training ones augmented, so that its inputs can be checked without a display."
      - "Then the checkpoints of every saved iteration, each holding the weights, the optimizer state and the classes."
      - "Then the TensorBoard logs of the three splits, the report of every evaluated checkpoint in the results file, the test scores of every evaluation in a summary table and a curve, and the MLflow run when tracking is on."
      - "And for every evaluated checkpoint, a folder with the metrics, curves, predictions and sample images of the test split; every task writes its own files there."

  - kind: image
    title: "TensorBoard"
    image: "repository:README/tensorboard.png"
    narration:
      - "TensorBoard reads the logs of the run folder: the training and validation curves at every iteration, and the test metrics of every evaluated checkpoint."

  - kind: image
    title: "MLflow"
    code_reference: "vision_training/tracking"
    image: "repository:README/mlflow_runs.png"
    # The four launches of the situation, those of the screenshot
    literal_numbers: [four]
    views:
      - {box: [470, 95, 1500, 265], from_sentence: 0}
    narration:
      - "Suppose you launch four learning rates of the same configuration, each with its run name suffix: with tracking on, every run is also an MLflow run with its parameters, metrics and artifacts, so the four are compared in one table."

  - kind: summary
    title: "Recap"
    items:
      - {text: "{{foundations.repository.task_count}} tasks: one backbone, one loop, one configuration format, one report", sentences: [0]}
      - {text: "uv sync, then every script as a module from the repository root", sentences: [1]}
      - {text: "The Dockerfile builds the trainer image for the cloud and the Spark", sentences: [2]}
      - {text: "One YAML file per run, checked at launch or by check_configuration", sentences: [3]}
      - {text: "Iterations, not epochs", sentences: [4]}
      - {text: "The run name encodes the model; run_name_suffix starts a new run", sentences: [5]}
      - {text: "Everything a run writes stays in its run folder", sentences: [6]}
    narration:
      - "To recap: the {{foundations.repository.task_count:words}} tasks share the same backbone code, training loop, configuration format, evaluation report and export, so this series holds for each of them."
      - "uv sync installs the environment pinned by the lock file, and every script runs as a module from the repository root, most of them set in their main block."
      - "The Dockerfile builds the trainer image in named stages, with no CUDA image underneath, so each machine, a cloud pod or the DGX Spark, builds it for its own architecture."
      - "One YAML file defines the run, without defaults; its checks run at launch, or alone with the check configuration module, which lists every problem and refuses unknown keys."
      - "The length of a run, its checkpoints, evaluations and summaries are all counted in iterations; epochs only appear in the launch information."
      - "The run name is built from the settings that shape the model, so the same settings resume in the same folder, and a run name suffix starts another run of them."
      - "Everything a run writes stays in its folder: the copy of its configuration, the record of its data, its input samples, checkpoints, logs and evaluations."
      - "The next chapter follows the training loop itself: the iterations, the validation, the checkpoints, and how a run stops and resumes."
