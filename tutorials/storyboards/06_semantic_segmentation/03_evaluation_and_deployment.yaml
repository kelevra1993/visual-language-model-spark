# Semantic segmentation, chapter 3: the evaluation of the checkpoints of the synthetic segmentation run (the counts
# accumulated on the device, the pixel confusion matrix, the region metrics and their caveats, the boundary metrics,
# the curves of the pixel probabilities, the sample images and the files of an evaluation), then the commands and the
# export. Coordinates of the html scenes are in pixels of the content area (1760 x 740); the figures and facts are made
# by tutorials/figures/semantic_segmentation.
series: semantic_segmentation
series_title: "Semantic Segmentation (SEG)"
chapter: 3
title: "Evaluation and deployment"
output_name: semantic_segmentation_03_evaluation_and_deployment
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [semantic_segmentation]
references:
  - "vision_training/evaluation/segmentation/boundary_metrics.py · compute_boundary_metrics"
  - "vision_training/evaluation/segmentation/segmentation_metrics.py · compute_pixel_score_histograms"
  - "vision_training/evaluation/classification/score_curves.py · compute_histogram_score_curves"
  - "vision_training/utilities/visualization.py · build_segmentation_error_map"
  - "vision_training/data/preprocessing.py · restore_prediction_to_original_image"
  - "vision_training/models/segmentation/sliding_window.py · segment_image_by_tiles"
  - "vision_training/deployment/export_specifications.py · compare_segmentations"
  - "documentation/bug_standards.md"
scenes:
  - kind: title_card
    heading: "Evaluation and deployment"
    subheading: "Confusion, contours, pixel curves, samples and export"
    footnote: "Semantic Segmentation (SEG) · chapter 3"
    narration:
      - "This last chapter of the series evaluates the checkpoints of the synthetic run, then exports the segmenter."
      - "An evaluation runs on the {{semantic_segmentation.manifest_samples}} test images, {{semantic_segmentation.confusion_total_pixels:,}} labelled pixels at the network resolution, and keeps counts on the device rather than any pixel."

  - kind: code
    title: "Counts, not pixels"
    code_reference: "vision_training/trainers/segmentation_trainer.py · SegmentationTrainer.create_evaluation_accumulator"
    source:
      file: vision_training/trainers/segmentation_trainer.py
      function: SegmentationTrainer.create_evaluation_accumulator
    highlights:
      - {match: "\"confusion_matrix\": torch.zeros", sentences: [0]}
      - {match: "\"boundary_counts\": torch.zeros", sentences: [0]}
      - {match: "image_true_positive_pixels", sentences: [1]}
      - {match: "score_histograms", sentences: [2]}
    narration:
      - "The accumulator holds the ten by ten confusion matrix of the labelled pixels and six boundary counts per class, summed batch after batch on the device."
      - "It also keeps, for every test image, the pixels of every class and those predicted right: the 95% Korn-Graubard interval of every recall is then taken over whole images, whose pixels are correlated."
      - "The per-class report adds, for every class, two histograms of ten thousand bins of the probability of that class, for its pixels and for the others: every curve and metric comes from these counts."

  - kind: html
    page: diagram
    title: "The pixel confusion matrix"
    code_reference: "vision_training/evaluation/segmentation/segmentation_metrics.py · compute_pixel_confusion_matrix"
    elements:
      - type: grid
        box: [300, 70, 1300, 690]
        values: "{{semantic_segmentation.confusion_values}}"
        show_values: true
        decimals: 1
        font: diagram_monospace_tiny
        row_labels: "{{semantic_segmentation.confusion_labels}}"
        column_labels: "{{semantic_segmentation.confusion_labels}}"
        label_font: diagram_tiny
        low_colour: box
        high_colour: blue
        maximum: 100
        minimum: 0
        marks:
          - {row: "{{semantic_segmentation.confusion_hexagon_to_pentagon_row}}", column: "{{semantic_segmentation.confusion_hexagon_to_pentagon_column}}", sentences: [1]}
          - {row: "{{semantic_segmentation.confusion_hexagon_to_hexagon_row}}", column: "{{semantic_segmentation.confusion_hexagon_to_hexagon_column}}", sentences: [1]}
          - {row: "{{semantic_segmentation.confusion_octagon_to_hexagon_row}}", column: "{{semantic_segmentation.confusion_octagon_to_hexagon_column}}", sentences: [2]}
          - {row: "{{semantic_segmentation.confusion_octagon_to_circle_row}}", column: "{{semantic_segmentation.confusion_octagon_to_circle_column}}", sentences: [2]}
      - {type: text, position: [1360, 90], text: "iteration 2000\nrows: true class\ncolumns: predicted\nshares of the row, %", font: diagram_small, colour: dim}
    narration:
      - "The confusion matrix of iteration 2000, every row in shares of its true class, shows where the shapes go wrong."
      - "{{semantic_segmentation.confusion_hexagon_to_pentagon:.1f}}% of the hexagon pixels are predicted pentagon, about as many as hexagon itself, {{semantic_segmentation.confusion_hexagon_to_hexagon:.1f}}%."
      - "The octagon goes to the hexagon for {{semantic_segmentation.confusion_octagon_to_hexagon:.1f}}% of its pixels and to the circle for {{semantic_segmentation.confusion_octagon_to_circle:.1f}}%: the shapes with many sides are the ones the network confuses."

  - kind: code
    title: "Region metrics from the confusion matrix"
    code_reference: "vision_training/evaluation/segmentation/segmentation_metrics.py · compute_segmentation_metrics"
    source:
      file: vision_training/evaluation/segmentation/segmentation_metrics.py
      function: compute_segmentation_metrics
    highlights:
      - {match: "union_counts = |intersection_over_union = ", sentences: [0]}
      - {match: "averaged_classes = union_counts > 0|intersection_over_union\\[averaged_classes\\]", sentences: [1]}
      - {match: "frequency_weighted_iou", sentences: [2]}
    narration:
      - "The IOU of a class is its right pixels over the union of its true and predicted pixels; its Dice is twice the right pixels over their sum."
      - "Picture a class predicted but absent from the true masks: its IOU is zero, and the means average every class with a non-empty union, present or predicted, so that false class lowers them, as in mmseg."
      - "The frequency weighted IOU weighs every class by its pixels, so the background dominates it: {{semantic_segmentation.headline_frequency_weighted_iou_2000:.3f}} here."

  - kind: image
    title: "Regions and contours"
    code_reference: "vision_training/evaluation/segmentation/boundary_metrics.py · compute_boundary_counts"
    image: "figures:semantic_segmentation/evaluation/boundary_metrics.png"
    narration:
      - "The region metrics hardly see a contour: the boundary IOU compares only the bands within {{semantic_segmentation.run_boundary_tolerance}} pixels of the true and predicted contours, and the boundary F score the shares of each contour lying near the other."
      - "The square has an IOU of {{semantic_segmentation.class_square_iou:.3f}} but a boundary IOU of {{semantic_segmentation.class_square_boundary_iou:.3f}}; over the classes, the means are {{semantic_segmentation.headline_mean_iou_2000:.3f}} and {{semantic_segmentation.headline_mean_boundary_iou_2000:.3f}}."
      - "The {{semantic_segmentation.class_worst}} is the worst on both, at {{semantic_segmentation.class_hexagon_iou:.3f}} and {{semantic_segmentation.class_hexagon_boundary_iou:.3f}}."

  - kind: html
    page: diagram
    title: "Curves of the pixel probabilities"
    code_reference: "vision_training/evaluation/classification/score_curves.py · compute_histogram_score_curves"
    elements:
      - {type: image, path: "runs:readme_screenshots/SEG_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_UTC-DBN-D2x64.2x64.2x32.2x32.1x16_MC9/Evaluation/Iteration_1000/precision_recall_curves.png", box: [40, 20, 860, 660], caption: "iteration 1000"}
      - {type: image, path: "runs:readme_screenshots/SEG_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_UTC-DBN-D2x64.2x64.2x32.2x32.1x16_MC9/Evaluation/Iteration_2000/precision_recall_curves.png", box: [900, 20, 1720, 660], caption: "iteration 2000", appear: 2}
    narration:
      - "With the per-class report, the histograms give the ROC and precision-recall curves of every class, one against the rest, exact at the edges of the ten thousand bins."
      - "The macro ROC AUC is already {{semantic_segmentation.headline_macro_roc_auc_1000:.3f}} at iteration 1000, when the mean IOU is {{semantic_segmentation.headline_mean_iou_1000:.3f}}: the millions of negative pixels flatter it."
      - "The macro average precision tells more, {{semantic_segmentation.headline_macro_average_precision_1000:.3f}} at iteration 1000 and {{semantic_segmentation.headline_macro_average_precision_2000:.3f}} at 2000."

  - kind: image
    title: "The sample images"
    code_reference: "vision_training/utilities/visualization.py · build_segmentation_sample_grid"
    image: "figures:semantic_segmentation/evaluation/samples.png"
    views:
      - {box: "{{semantic_segmentation.samples_1000_box}}", from_sentence: 0}
      - {box: "{{semantic_segmentation.samples_1000_right_box}}", from_sentence: 1}
      - {box: "{{semantic_segmentation.samples_2000_right_box}}", from_sentence: 2}
    narration:
      - "Every evaluation draws the same eight test images: the input, the ground truth, the prediction and an error map, under the pixel accuracy of the image."
      - "At iteration 1000 the octagon of this image is mostly taken for a circle and the rectangle for other shapes; in the error map, green is right, red a wrong class and yellow a missed pixel."
      - "At iteration 2000 only some edges of the pentagon and of the octagon stay wrong, and the image scores {{semantic_segmentation.levels_pixel_accuracy:.4f}}."

  - kind: html
    page: diagram
    title: "What an evaluation writes"
    code_reference: "vision_training/trainers/segmentation_trainer.py · SegmentationTrainer.compute_evaluation_results"
    elements:
      - type: listing
        box: [40, 40, 1100, 400]
        font: diagram_monospace
        source: {file: "figures:semantic_segmentation/evaluation/evaluation_folder.txt"}
        highlights:
          - {match: "class_metrics|confusion_matrix", sentences: [0]}
          - {match: "curves|Samples", sentences: [0]}
          - {match: "class_metrics", sentences: [2]}
      - {type: box, box: [40, 450, 1100, 670], text: "Results.txt: one block per checkpoint,\nthe classes sorted by IoU, worst first,\nand a recall table with 95% intervals\nTensorBoard Test: {{semantic_segmentation.evaluation_test_scalars}} scalars and {{semantic_segmentation.evaluation_test_images}} images per evaluation", font: diagram_text, outline: violet, appear: 1, highlight: [1, 2]}
      - {type: box, box: [1160, 40, 1720, 670], text: "save_predicted_masks:\none class index PNG\nper test image\n\noriginal_resolution:\nscored against\nthe original masks", font: diagram_text, outline: aqua, appear: 3, highlight: [3]}
    narration:
      - "Every evaluation folder holds the class metrics, the confusion matrix as counts and as an image, the ROC and precision-recall curves and the sample images."
      - "The report goes to the results file, its classes sorted by IOU, worst first, and to TensorBoard with {{semantic_segmentation.evaluation_test_scalars}} scalars per evaluation, the per-class ones included."
      - "In the report, a second table gives the recall of every class with its 95% interval, worst first, and the class metrics file keeps the bounds next to every recall."
      - "If, for instance, you need the masks, save predicted masks writes one class index image per test image, and original resolution scores the predictions against the original masks, as a deployment uses them."

  - kind: terminal
    title: "Generate, train, evaluate, export"
    code_reference: "vision_training/deployment/export_model.py · export_experiment"
    lines:
      - {role: comment, text: "# Synthetic data set: task = \"semantic_segmentation\" in the main block of the script"}
      - {role: command, text: "uv run python -m vision_training.data.synthetic.create_synthetic_dataset"}
      - {role: comment, text: "# Training until stopped: Ctrl+C saves a checkpoint"}
      - {role: command, text: "uv run python -m vision_training.main --configuration_path=\"vision_training/configurations/semantic_segmentation/configuration_synthetic_shapes.yaml\""}
      - {role: comment, text: "# Evaluation of checkpoints: run and iteration set in its main block"}
      - {role: command, text: "uv run python -m scripts.evaluation.evaluate_checkpoint"}
      - {role: comment, text: "# Export to Torch Script and ONNX: needs CUDA"}
      - {role: command, text: "uv run python -m vision_training.deployment.export_model"}
    narration:
      - "To reproduce the run, generate the synthetic data set with the task set in the main block of the script, then train with the synthetic configuration."
      - "Its number of iterations is practically endless, so the training runs until Control C, which saves a checkpoint; the run of these chapters stopped at {{semantic_segmentation.run_iterations}}."
      - "The standalone evaluation skips its maximum error images per class pair with a warning, as for every task without error images, and the export needs a GPU."

  - kind: html
    page: diagram
    title: "What the export gives"
    code_reference: "vision_training/models/segmentation/inference_segmenter.py · InferenceSegmenter.forward"
    elements:
      - {type: box, box: [40, 80, 340, 280], text: "images\n[B, 3, 512, 512]\nletterboxed, BGR", font: diagram_text, outline: blue}
      - {type: arrow, points: [[340, 180], [410, 180]], colour: blue}
      - {type: box, box: [420, 80, 840, 280], text: "exported segmenter\nTorch Script or ONNX\nno deep supervision heads", font: diagram_text, outline: violet}
      - {type: arrow, points: [[840, 180], [890, 180]], colour: violet}
      - {type: text, position: [905, 150], text: "class_map            [B, 512, 512]  int64\nclass_probabilities  [B, 10, 512, 512]", font: diagram_monospace}
      - {type: box, box: [40, 350, 860, 500], text: "client: restore_prediction_to_original_image\ncuts the letterbox, resizes back to the image", font: diagram_text, outline: aqua, appear: 1, highlight: [1]}
      - {type: box, box: [900, 350, 1720, 500], text: "a run trained on tiles: the client tiles the image\nwith segment_image_by_tiles", font: diagram_text, outline: yellow, appear: 2, highlight: [2, 3]}
      - {type: box, box: [40, 560, 1720, 680], text: "export check: compare_segmentations, every probability within 1e-4\nand the same class on 99.9 % of the pixels, a near tie may flip", font: diagram_text, outline: border, appear: 4, highlight: [4]}
    narration:
      - "The exported segmenter takes letterboxed images and gives the class map and the probabilities of every class at the network resolution, without the deep supervision heads."
      - "The client brings them back to its image with restore prediction to original image, which cuts the letterbox and resizes."
      - "Let's consider a run trained on tiles: it is exported with one tile as input, and the client scales and tiles its images itself, with the tile scale and overlap that the export writes next to the model."
      - "The throughput script, by contrast, times one letterboxed image per request."
      - "The export check wants every probability within 10 to the minus 4 and the same class on 99.9% of the pixels, since a pixel whose two best classes are tied may flip."

  - kind: summary
    title: "Recap"
    items:
      - {text: "Counts on the device: confusion [10, 10], boundary [10, 6], histograms [10, 2, 10000]"}
      - {text: "Mean IoU over the classes present or predicted: a hallucinated class counts as 0"}
      - {text: "Boundary IoU and F1 score the contours within 2 pixels"}
      - {text: "Macro ROC AUC is flattered by the negatives; read the macro AP"}
      - {text: "Export: class_map and class_probabilities at the network resolution"}
      - {text: "evaluate_checkpoint: no error images, the limit skipped with a warning"}
    narration:
      - "To recap: the evaluation counts pixels on the device, the mean IOU compares the checkpoints, the boundary metrics check the contours, and the exported model gives a class and probabilities for every pixel."
      - "The next series, sequence classification, runs the backbone on every frame of a sequence and gives one class per sequence."
