# Image classification, chapter 2: judging and shipping a classifier: the evaluation settings, the report block of
# Results.txt, the confusion matrices of the three evaluations, the per-class F1 and the thresholds at the target
# precision, the precision-recall curves, the probabilities of predictions.csv, the logit temperature and its explorer
# page, served to save the thresholds of a temperature and export the checkpoint at it, the sample and error images,
# the measured effects of the head settings in the architecture benchmark, the pitfalls and the export with its
# temperature, its thresholds, its export folder and its input settings. Coordinates of the
# html scenes are in pixels of the content area (1760 x 740, origin at its top left corner); the figures and facts
# named classification.* are made by tutorials/figures/classification from the synthetic shapes run of
# tutorial_sources.yaml, the images under runs: are the files its evaluation wrote.
series: classification
series_title: "Image Classification (CLS)"
chapter: 2
title: "Judging and shipping a classifier"
output_name: classification_02_judging_and_shipping
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [classification]
references:
  - "vision_training/trainers/classification_trainer.py · ClassificationTrainer.compute_evaluation_results"
  - "vision_training/evaluation/classification/classification_metrics.py · compute_metrics_from_confusion_matrix"
  - "vision_training/evaluation/classification/score_curves.py · save_score_curve_images"
  - "vision_training/trainers/classification_trainer.py · ClassificationTrainer.dump_errors"
  - "vision_training/evaluation/classification/temperature_explorer.py · save_temperature_explorer"
  - "vision_training/evaluation/classification/temperature_explorer.py · save_class_logits"
  - "vision_training/evaluation/classification/temperature_explorer.py · compute_temperature_thresholds"
  - "vision_training/deployment/explorer_export.py · build_export_folder"
  - "vision_training/deployment/export_model.py · check_saved_thresholds_location"
  - "vision_training/deployment/export_model.py · find_saved_thresholds_path"
  - "vision_training/deployment/input_contract.py · write_preprocessing_file"
  - "scripts/evaluation/serve_temperature_explorer.py"
  - "vision_training/deployment/export_specifications.py · TASK_MODEL_NAMES"
  - "scripts/evaluation/evaluate_checkpoint.py"
  - "documentation/suggestions.md"
  - "documentation/bug_standards.md"
  - "documentation/task workflows/classification_workflow.md"
scenes:
  - kind: title_card
    heading: "Judging and shipping a classifier"
    subheading: "Reports, confusions, thresholds and the export"
    footnote: "Image Classification · chapter 2"
    # The number of the chapter, the chapter key of this storyboard
    literal_numbers: ["2"]
    narration:
      - "A classifier is judged on its whole test split at every evaluated checkpoint, and every evaluation writes what you need to decide whether to ship it."
      - "This chapter reads the evaluations of the synthetic shapes run: the report, the confusions, the thresholds, the probabilities and their temperature, and the images, then the measured effects of the head settings, the pitfalls and the export."

  - kind: yaml
    title: "The evaluation settings"
    code_reference: "vision_training/configuration_processing/classification_checks.py · check_classification_evaluation_configuration"
    source:
      file: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
      keys: [ExperimentConfiguration.evaluation]
      comments: false
    highlights:
      - {match: "per_class_report|number_sample_images|target_precision", sentences: [0]}
      - {match: "save_predictions|error_dumps|activated|maximum_per_class_pair", sentences: [1]}
    narration:
      - "The evaluation section of a classification run sets the per class report, {{config:vision_training/configurations/classification/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.number_sample_images:words}} sample images, and the target precision of the thresholds, while the top-k accuracy needs no setting."
      - "Save predictions writes the probabilities of every test image, and the error images, off in this run, save the misclassified images up to a number per pair of classes; the checks refuse them in the multi label mode."

  - kind: html
    page: diagram
    title: "The report of a checkpoint"
    code_reference: "vision_training/evaluation/classification/class_metrics_report.py · build_class_metrics_table"
    # The top-2 and top-5 accuracies, the two most probable classes and the last two columns of the report
    literal_numbers: [two, five]
    elements:
      - type: listing
        box: [20, 24, 1740, 600]
        font: diagram_monospace_small
        source: {file: "runs:readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9/Results.txt", start: "^Iteration 1500", end: "is never reached"}
        highlights:
          - {match: "^  Accuracy|^  Macro F1", sentences: [0]}
          - {match: "^  Macro ROC AUC|^   (square|octagon|pentagon) ", sentences: [1]}
          - {match: "Threshold|@ P0.99|@ P99 %|^   rectangle ", sentences: [2]}
      - {type: text, position: [880, 660], text: "Results.txt: one block per evaluated checkpoint · the console prints it with the links of the files", font: diagram_small, colour: dim, anchor: mm}
      - {type: text, position: [880, 705], text: "newer evaluations: rates in percent, and a Per Class Recall table with every {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} interval (Clopper-Pearson)", font: diagram_small, colour: dim, anchor: mm, appear: 3, highlight: [3]}
    narration:
      - "At iteration {{classification.class_metrics.iteration}} the report gives an accuracy of {{classification.headline.iteration_1500.accuracy:percent}}, the balanced accuracy and macro F1, which do not depend on the class counts, and a top two accuracy of {{classification.headline.iteration_1500.top_2_accuracy:percent}}, newer evaluations writing a top five accuracy instead: the right class is almost always among the two most probable."
      - "With the per class report, the macro ROC AUC and average precision join them, and every class gets its row, the worst F1 first: square, octagon and pentagon."
      - "The last two columns give the threshold reaching a precision of {{classification.class_metrics.target_precision:percent_label}} and the recall it keeps, a dash when that precision is never reached, as for rectangle."
      - "Evaluations newer than this run write every rate as a percentage, and add a per class recall table, the worst recall first, with the exact {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} confidence interval of every recall over the test images of its class."

  - kind: html
    page: diagram
    title: "Confusions over the training"
    code_reference: "vision_training/evaluation/classification/classification_metrics.py · compute_confusion_matrix"
    elements:
      - {type: grid, box: [200, 70, 1100, 680], values: "{{classification.confusion.iteration_500.row_percentages}}", show_values: true, value_format: integer, minimum: 0, maximum: 100, font: diagram_monospace_small, row_labels: "{{classification.confusion.class_names}}", column_labels: "{{classification.confusion.short_class_names}}", appear: 0, until: 0, marks: [{row: 4, column: 4, sentences: [0]}, {row: 5, column: 5, sentences: [0]}, {row: 8, column: 8, sentences: [0]}]}
      - {type: grid, box: [200, 70, 1100, 680], values: "{{classification.confusion.iteration_1000.row_percentages}}", show_values: true, value_format: integer, minimum: 0, maximum: 100, font: diagram_monospace_small, row_labels: "{{classification.confusion.class_names}}", column_labels: "{{classification.confusion.short_class_names}}", appear: 1, until: 1, marks: [{row: 4, column: 4, sentences: [1]}, {row: 5, column: 5, sentences: [1]}, {row: 8, column: 8, sentences: [1]}]}
      - {type: grid, box: [200, 70, 1100, 680], values: "{{classification.confusion.iteration_1500.row_percentages}}", show_values: true, value_format: integer, minimum: 0, maximum: 100, font: diagram_monospace_small, row_labels: "{{classification.confusion.class_names}}", column_labels: "{{classification.confusion.short_class_names}}", appear: 2, marks: [{row: 0, column: 3, sentences: [2]}, {row: 3, column: 0, sentences: [2]}, {row: 4, column: 5, sentences: [3]}, {row: 8, column: 5, sentences: [3]}, {row: 1, column: 8, sentences: [3]}]}
      - {type: text, position: [1180, 70], text: "Iteration {{classification.confusion.iterations[0]}}", font: diagram_heading, appear: 0, until: 0}
      - {type: text, position: [1180, 140], text: "test accuracy {{classification.headline.iteration_500.accuracy:percent}}\nrecall: hexagon {{classification.confusion.iteration_500.recall.hexagon:percent}}\npentagon {{classification.confusion.iteration_500.recall.pentagon:percent}} · octagon {{classification.confusion.iteration_500.recall.octagon:percent}}", font: diagram_text, appear: 0, until: 0}
      - {type: text, position: [1180, 70], text: "Iteration {{classification.confusion.iterations[1]}}", font: diagram_heading, appear: 1, until: 1}
      - {type: text, position: [1180, 140], text: "test accuracy {{classification.headline.iteration_1000.accuracy:percent}}\nrecall: pentagon {{classification.confusion.iteration_1000.recall.pentagon:percent}}\nhexagon {{classification.confusion.iteration_1000.recall.hexagon:percent}} · octagon {{classification.confusion.iteration_1000.recall.octagon:percent}}", font: diagram_text, appear: 1, until: 1}
      - {type: text, position: [1180, 70], text: "Iteration {{classification.confusion.iterations[2]}}", font: diagram_heading, appear: 2}
      - {type: text, position: [1180, 140], text: "test accuracy {{classification.headline.iteration_1500.accuracy:percent}}\nsquare → rectangle {{classification.confusion.iteration_1500.square_to_rectangle.count:,}}\nrectangle → square {{classification.confusion.iteration_1500.rectangle_to_square.count:,}}", font: diagram_text, appear: 2}
      - {type: box, box: [1180, 300, 1740, 480], text: "pentagon → hexagon {{classification.confusion.iteration_1500.pentagon_to_hexagon.count:,}}\noctagon → hexagon {{classification.confusion.iteration_1500.octagon_to_hexagon.count:,}}\ncircle → octagon {{classification.confusion.iteration_1500.circle_to_octagon.count:,}}", font: diagram_small, outline: magenta, appear: 3, highlight: [3]}
      - {type: text, position: [1180, 620], text: "rows: true class · columns: predicted\ncells: % of the images of the true class", font: diagram_small, colour: dim}
    narration:
      - "At iteration {{classification.confusion.iterations[0]}}, the test accuracy is {{classification.headline.iteration_500.accuracy:percent}}, and hexagon, pentagon and octagon are found only {{classification.confusion.iteration_500.recall.hexagon:percent}}, {{classification.confusion.iteration_500.recall.pentagon:percent}} and {{classification.confusion.iteration_500.recall.octagon:percent}} of the time."
      - "At iteration {{classification.confusion.iterations[1]}}, {{classification.confusion.iteration_1000.recall.pentagon:percent}} of the pentagons are found, but only {{classification.confusion.iteration_1000.recall.hexagon:percent}} of the hexagons and {{classification.confusion.iteration_1000.recall.octagon:percent}} of the octagons."
      - "At iteration {{classification.confusion.iterations[2]}}, the accuracy reaches {{classification.headline.iteration_1500.accuracy:percent}}, and the errors left are pairs of close outlines: {{classification.confusion.iteration_1500.square_to_rectangle.count:,}} squares taken for rectangles, {{classification.confusion.iteration_1500.square_to_rectangle.share:percent}} of them, and {{classification.confusion.iteration_1500.rectangle_to_square.count:,}} rectangles for squares."
      - "{{classification.confusion.iteration_1500.pentagon_to_hexagon.count:,}} pentagons and {{classification.confusion.iteration_1500.octagon_to_hexagon.count:,}} octagons go to hexagon, which finds {{classification.confusion.iteration_1500.recall.hexagon:percent}} of its images at a precision of only {{classification.confusion.iteration_1500.precision.hexagon:percent}}, and {{classification.confusion.iteration_1500.circle_to_octagon.count:,}} circles are taken for octagons."

  - kind: image
    title: "The confusion matrix image"
    code_reference: "vision_training/evaluation/classification/confusion_matrix.py · save_confusion_matrix_image"
    image: "runs:readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9/Evaluation/Iteration_1500/confusion_matrix.png"
    views:
      - {box: [0, 40, 1192, 520], from_sentence: 0}
      - {box: [0, 670, 1192, 1155], from_sentence: 1}
    highlights:
      - {box: [897, 158, 1028, 950], sentences: [1]}
      - {box: [138, 975, 790, 1115], sentences: [1]}
      - {box: [897, 975, 1028, 1115], sentences: [1]}
    narration:
      - "Every evaluation also draws the matrix as confusion matrix png, every cell with its count and its share of the true class, and sends it to TensorBoard."
      - "Its recall column and its precision row sum it up class by class, and the corner gives the accuracy."

  - kind: html
    page: diagram
    title: "Per-class F1 and the thresholds"
    code_reference: "vision_training/evaluation/classification/threshold_finder.py · find_class_thresholds"
    # The two groups of classes, and the example list of target precisions
    literal_numbers: [two, "0.99", "0.95", "0.9", "0.90"]
    elements:
      - {type: text, position: [20, 24], text: "F1 · iteration {{classification.class_metrics.iteration}}, worst first", font: diagram_small, colour: dim}
      - {type: bars, box: [20, 80, 840, 620], orientation: horizontal, maximum: 1, label_width: 150, values: "{{classification.class_metrics.sorted_f1}}", labels: "{{classification.class_metrics.sorted_class_names}}", value_labels: "{{classification.class_metrics.sorted_f1_labels}}", colour: blue, highlight: [0]}
      - {type: text, position: [920, 24], text: "recall at precision {{classification.class_metrics.target_precision:percent_label}} · class_thresholds.json", font: diagram_small, colour: dim, appear: 1}
      - {type: bars, box: [920, 80, 1740, 620], orientation: horizontal, maximum: 1, label_width: 150, values: "{{classification.class_metrics.sorted_recall_at_target}}", labels: "{{classification.class_metrics.sorted_class_names}}", value_labels: "{{classification.class_metrics.sorted_recall_at_target_labels}}", colour: aqua, appear: 1, highlight: [2]}
      - {type: text, position: [880, 680], text: "rectangle never reaches the precision: null in class_thresholds.json, a dash in the report", font: diagram_small, colour: dim, anchor: mm, appear: 2, until: 2}
      - {type: text, position: [880, 680], text: "target_precision: [0.99, 0.95, 0.90] → additional_targets, Per Class Thresholds table", font: diagram_small, colour: dim, anchor: mm, appear: 3, highlight: [3, 4]}
    narration:
      - "Sorted by F1, the classes split in two: plus sign, star and triangle at {{classification.class_metrics.triangle.f1:percent}} and above, the others between {{classification.class_metrics.square.f1:percent}} and {{classification.class_metrics.circle.f1:percent}}."
      - "Imagine a deployment where errors are costly: for every class, one against the rest, the evaluation finds the lowest probability threshold whose precision reaches {{classification.class_metrics.target_precision:percent_label}}, and saves it with the recall it keeps in class thresholds json."
      - "At that precision, plus sign keeps {{classification.class_metrics.plus_sign.recall_at_target_precision:percent}} of its images and circle {{classification.class_metrics.circle.recall_at_target_precision:percent}}, but square keeps {{classification.class_metrics.square.recall_at_target_precision:percent}}, and rectangle never gets there."
      - "Should you want to choose among several precisions, give target precision a list, such as 0.99, 0.95 and 0.9: every class then gets a threshold and a recall at each, in a per class thresholds table of the report."
      - "The first precision stays the one the deployment reads, the others joining class thresholds json as additional targets."

  - kind: image
    title: "Precision-recall curves"
    code_reference: "vision_training/evaluation/classification/score_curves.py · compute_class_score_curves"
    image: "runs:readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HFLAT.128-HLN-CWB_MC9/Evaluation/Iteration_1500/precision_recall_curves.png"
    views:
      - {box: [0, 0, 1125, 460], from_sentence: 0}
      - {box: [0, 200, 1125, 660], from_sentence: 1}
    highlights:
      - {box: [140, 52, 990, 86], sentences: [0]}
      - {box: [140, 262, 990, 380], sentences: [1]}
    narration:
      - "The precision recall curve of every class sweeps that threshold; the dotted line is the target precision, and every dot the threshold reaching it."
      - "The rectangle curve stays near {{classification.confusion.iteration_1500.precision.rectangle:percent}} whatever the threshold, an average precision of {{classification.class_metrics.rectangle.average_precision:percent}}, since the squares taken for rectangles get high rectangle probabilities; the ROC curves, saved next to it, read the same way."
      - "Evaluations newer than this run also save precision recall thresholds png, which zooms on these dots and writes every threshold in the colour of its curve."

  - kind: image
    title: "Probabilities of right and wrong predictions"
    code_reference: "vision_training/trainers/classification_trainer.py · ClassificationTrainer.compute_evaluation_results"
    image: "figures:classification/evaluation/prediction_confidence_iteration_1500.png"
    highlights:
      - {box: "{{classification.confidence.confidence_panel_box}}", sentences: [1]}
      - {box: "{{classification.confidence.pair_panel_box}}", sentences: [2]}
    narration:
      - "When the goal is to study the errors and the thresholds again without running the model, the predictions file holds one row per test image, {{classification.confidence.test_images:,}} here, with the probability of every class."
      - "For the {{classification.confidence.wrong_count:,}} wrong predictions, the probability of the predicted class has a median of {{classification.confidence.wrong_median:.2f}}, and only {{classification.confidence.wrong_confident_count}} of them pass {{classification.confidence.confident_probability}}, where {{classification.confidence.correct_confident_share:.0%}} of the right ones do."
      - "The test pentagons show a confusion at work: hexagon takes the probability pentagon loses, and {{classification.confidence.pair_wrong:,}} of the {{classification.confidence.pair_images:,}} pentagons tip over, nearly all to hexagon."

  - kind: html
    page: diagram
    title: "The logit temperature"
    code_reference: "vision_training/evaluation/classification/temperature_explorer.py · save_temperature_explorer"
    # The made-up logits of a square and their probabilities at the temperatures one and three, the decimals listed
    # first so that the "0" of the logits leaves them whole; 8091 is the port of the main block of
    # scripts/evaluation/serve_temperature_explorer.py (port = 8091), a local variable that no placeholder reads
    literal_numbers: ["0.950", "0.047", "0.002", "0.665", "0.245", "0.090", "0.95", "0.67", "0.24", "0.09", six, three,
                      zero, "6", "3", "0", "1", "8091"]
    elements:
      - {type: box, box: [40, 30, 1260, 110], text: "probabilities = softmax(logits / T)", font: diagram_bold, outline: blue, highlight: [0]}
      - {type: text, position: [40, 160], text: "a square, logits 6 · 3 · 0, T = 1", font: diagram_small, colour: dim}
      - {type: bars, box: [40, 200, 600, 600], maximum: 1, values: [0.950, 0.047, 0.002], labels: ["square", "rectangle", "circle"], value_labels: ["0.950", "0.047", "0.002"], colours: [blue, aqua, violet], gap: 40, highlight: [1]}
      - {type: text, position: [700, 160], text: "the same logits, T = 3", font: diagram_small, colour: dim, appear: 1}
      - {type: bars, box: [700, 200, 1260, 600], maximum: 1, values: [0.665, 0.245, 0.090], labels: ["square", "rectangle", "circle"], value_labels: ["0.665", "0.245", "0.090"], colours: [blue, aqua, violet], gap: 40, appear: 1, highlight: [1]}
      - {type: box, box: [1340, 30, 1740, 330], text: "temperature_explorer.html\nwith the per class report\nslider from {{classification.temperature_explorer.minimum_temperature:.3g}} to {{classification.temperature_explorer.maximum_temperature:.3g}}\nthe calibrated T\nclass_logits.npz next to it", font: diagram_small, outline: yellow, appear: 2, highlight: [2, 3]}
      - {type: box, box: [1340, 380, 1740, 600], text: "serve_temperature_explorer\nhttp://127.0.0.1:8091/\nany typed T\nSave Thresholds · Export", font: diagram_small, outline: aqua, appear: 4, highlight: [4]}
      - {type: text, position: [880, 680], text: "the order of the logits is kept: the same predicted class, the same accuracy · classification only", font: diagram_small, colour: dim, anchor: mm, appear: 1}
    narration:
      - "A well trained softmax often squeezes its probabilities against one, which leaves the thresholds little room: dividing the logits by a temperature before the softmax spreads them out."
      - "Say a square gets the logits six, three and zero: at a temperature of one, square takes 0.95; at three, it keeps the lead with 0.67, against 0.24 for rectangle and 0.09 for circle, so the predicted class and the accuracy never change."
      - "With the per class report on, every evaluation writes temperature explorer html, where a slider from {{classification.temperature_explorer.minimum_temperature:.3g}} to {{classification.temperature_explorer.maximum_temperature:.3g}} redraws the probabilities, the thresholds and the calibration, next to the temperature that calibrates the test split best."
      - "Up to {{constant:vision_training/evaluation/classification/temperature_explorer.py#MAXIMUM_EXPLORER_CLASSES:words}} classes, it also keeps the test logits next to the page, in class logits npz, so that any other temperature can be drawn later without running the model."
      - "The serve temperature explorer script lists these evaluations on a local page, where you type the temperature you want, save the thresholds of every class at it, and export the checkpoint at that temperature."

  - kind: image
    title: "Sample images"
    code_reference: "vision_training/trainers/classification_trainer.py · ClassificationTrainer.build_sample_image"
    image: "figures:classification/evaluation/sample_images_iterations_500_1500.png"
    views:
      - {box: "{{classification.evaluation.samples.iteration_500.grid_box}}", from_sentence: 0}
      - {box: "{{classification.evaluation.samples.iteration_1500.grid_box}}", from_sentence: 2}
    highlights:
      - {box: "{{classification.evaluation.samples.iteration_500.image_3_box}}", sentences: [1]}
      - {box: "{{classification.evaluation.samples.iteration_500.image_7_box}}", sentences: [1]}
    narration:
      - "The {{classification.evaluation.samples.image_count:words}} sample images are drawn once, spread over the classes, and captioned at every evaluation with the true class, the predicted class and its probability, green when right and red when wrong."
      - "At iteration {{classification.evaluation.samples.iterations[0]}}, this hexagon is taken for a circle, and this triangle for a plus sign."
      - "At iteration {{classification.evaluation.samples.iterations[1]}}, the same {{classification.evaluation.samples.image_count:words}} images are right, and in TensorBoard their slider shows the prediction of every image change over the training."

  - kind: image
    title: "Error images"
    code_reference: "scripts/evaluation/evaluate_checkpoint.py"
    image: "figures:classification/evaluation/error_images_iteration_1500.png"
    highlights:
      - {box: "{{classification.evaluation.errors.image_1_box}}", sentences: [1]}
      - {box: "{{classification.evaluation.errors.image_2_box}}", sentences: [1]}
    # The probabilities are read as the file names on screen write them, with three decimals
    exact_facts: [classification.evaluation.errors.image_1_probability, classification.evaluation.errors.image_2_probability]
    narration:
      - "With error images on, every misclassified test image is saved in a folder named after its true and predicted classes, here by the standalone evaluation of iteration {{classification.evaluation.errors.iteration}}: {{classification.evaluation.errors.images}} images in {{classification.evaluation.errors.pair_folders}} folders, at most {{classification.evaluation.errors.largest_pair_images}} per pair."
      - "The file name ends with the probability of the wrong class: this square went to rectangle at {{classification.evaluation.errors.image_1_probability}}, and this pentagon to hexagon at {{classification.evaluation.errors.image_2_probability}}."

  - kind: html
    page: diagram
    title: "Measured effects of the head settings"
    code_reference: "documentation/architecture_benchmarking/experiment_plan.md"
    elements:
      - {type: text, position: [40, 30], text: "hidden layer normalization\naccuracy at iteration {{classification.benchmark.normalization_iteration}}", font: diagram_small, colour: dim}
      - {type: bars, box: [40, 140, 620, 560], maximum: 1, values: ["{{classification.benchmark.normalization.none}}", "{{classification.benchmark.normalization.batch}}", "{{classification.benchmark.normalization.layer}}"], labels: ["none", "batch", "layer"], value_labels: ["{{classification.benchmark.normalization.none:percent}}", "{{classification.benchmark.normalization.batch:percent}}", "{{classification.benchmark.normalization.layer:percent}}"], colours: [dim, yellow, blue], gap: 40, appear: 0, highlight: [1]}
      - {type: text, position: [760, 30], text: "global pooling\nlast {{classification.benchmark.last_evaluation_count:words}} evaluations", font: diagram_small, colour: dim}
      - {type: bars, box: [760, 140, 1140, 560], maximum: 1, values: ["{{classification.benchmark.pooling.flatten}}", "{{classification.benchmark.pooling.average}}"], labels: ["flatten", "average"], value_labels: ["{{classification.benchmark.pooling.flatten:percent}}", "{{classification.benchmark.pooling.average:percent}}"], colours: [blue, aqua], gap: 40, appear: 1, dim: [1], highlight: [2]}
      - {type: text, position: [1280, 30], text: "class weighting\nlast {{classification.benchmark.last_evaluation_count:words}} evaluations", font: diagram_small, colour: dim}
      - {type: bars, box: [1280, 140, 1700, 560], maximum: 1, values: ["{{classification.benchmark.weighting.balanced}}", "{{classification.benchmark.weighting.none}}"], labels: ["balanced", "none"], value_labels: ["{{classification.benchmark.weighting.balanced:percent}}", "{{classification.benchmark.weighting.none:percent}}"], colours: [blue, aqua], gap: 40, appear: 1, dim: [1], highlight: [2]}
      - {type: text, position: [880, 660], text: "means of {{classification.benchmark.launches_per_setting:words}} launches · {{classification.benchmark.image_size}} pixels · {{classification.benchmark.last_iteration:,}} iterations · {{classification.benchmark.noise.launch_count:words}} launches of one setting: {{classification.benchmark.noise.first_mean:percent}} and {{classification.benchmark.noise.second_mean:percent}}", font: diagram_small, colour: dim, anchor: mm, highlight: [0, 2]}
    narration:
      - "The architecture benchmark compared the head settings on the {{classification.benchmark.class_count:words}} shapes at {{classification.benchmark.image_size}} pixels, {{classification.benchmark.launches_per_setting:words}} launches of {{classification.benchmark.last_iteration}} iterations per setting."
      - "Layer normalization of hidden layers learns fastest: {{classification.benchmark.normalization.layer:percent}} test accuracy at iteration {{classification.benchmark.normalization_iteration}}, against {{classification.benchmark.normalization.none:percent}} without it and {{classification.benchmark.normalization.batch:percent}} with batch normalization; layer and batch end level, above none."
      - "Flatten against average pooling, and balanced against no class weights, differ by less than one point over the last {{classification.benchmark.last_evaluation_count:words}} evaluations, while {{classification.benchmark.noise.launch_count:words}} launches of the same settings ended at {{classification.benchmark.noise.first_mean:percent}} and {{classification.benchmark.noise.second_mean:percent}}."
      - "So flatten and balanced weights are defaults here, not measured gains: the {{classification.data.class_count:words}} classes hold between {{classification.data.smallest_training_class:,}} and {{classification.data.largest_training_class:,}} training images each."

  - kind: text_panel
    title: "Pitfalls"
    # A label smoothing above zero, and the two layers of the blocks without a shortcut
    literal_numbers: [two, "0"]
    columns:
      - heading: "the head and the loss"
        lines:
          - "label_smoothing > 0 with balanced weights"
          - "  pulls towards the rare classes"
          - ""
          - "flatten: the head is tied to the image"
          - "  size and to last_max_pooling"
          - ""
          - "decorrelation on: the correlation is"
          - "  marked Best when it falls, since a fix"
      - heading: "the data and the logs"
        lines:
          - "a synthetic data set generated now:"
          - "  {{classification.data.generator_class_count}} classes, the run ends with MC{{classification.data.generator_class_count}}"
          - ""
          - "Iterations Per Epoch, MLflow counts:"
          - "  unmapped categories included (count_split_samples)"
          - ""
          - "RES: no shortcut in blocks {{classification.backbone.blocks_without_shortcut_text}}"
          - "  two layers changing the channels"
    narration:
      - "Here are the pitfalls specific to this task, or that bite it first, and one console marker fixed since."
      - "Label smoothing with balanced weights pulls every image towards the rare classes, and a flattened head only works at the image size and last max pooling it was trained with."
      - "With the decorrelation on, older logs printed a rising hidden feature correlation in green with best, as if it were an accuracy; it is now marked best when it falls, like a loss."
      - "A synthetic data set generated now has {{classification.data.generator_class_count}} classes, so the numbers of this run do not apply to it; and the iterations per epoch and the sample counts sent to MLflow also count the images of unmapped categories."
      - "And the residual token does not put a shortcut in every block: blocks {{classification.backbone.blocks_without_shortcut_text}} change the channels with two layers and add none."

  - kind: html
    page: diagram
    title: "The export"
    code_reference: "vision_training/models/classification/inference_classifier.py · InferenceClassifier.forward"
    # The range of the raw 8-bit pixels the model takes, and the temperature of 1 of an export without the saved
    # thresholds (the use_saved_temperature off branch of export_experiment in vision_training/deployment/export_model.py)
    literal_numbers: [zero, "0", "255", "1"]
    elements:
      - {type: box, box: [20, 110, 460, 330], text: "images\n[B, {{classification.head.input_channels}}, {{classification.head.image_size}}, {{classification.head.image_size}}] float32\nBGR, 0 to 255\nresized and padded", font: diagram_small, outline: blue, highlight: [0, 1]}
      - {type: arrow, points: [[468, 220], [532, 220]]}
      - {type: box, box: [540, 110, 1000, 330], text: "InferenceClassifier\nthe ImageClassifier\nwithout labels nor loss", font: diagram_small, outline: violet, highlight: [0]}
      - {type: arrow, points: [[1008, 220], [1072, 220]]}
      - {type: box, box: [1080, 110, 1500, 330], text: "class_probabilities\n[B, {{classification.head.number_classes}}]\nsoftmax(logits / T) inside", font: diagram_small, outline: aqua, highlight: [0, 2]}
      - {type: box, box: [20, 420, 1000, 560], text: "Triton model: image_classifier_<format>\nTorchScript and ONNX\nfrom the page: <run>/Exports/Iteration_<n>[_EMA]_T<T>/", font: diagram_small, appear: 2, highlight: [2, 3]}
      - {type: arrow, points: [[1290, 338], [1290, 402]], appear: 2}
      - {type: box, box: [1080, 410, 1740, 600], text: "saved_temperature_thresholds.json\nof the exported checkpoint: its T built in,\ncopied next to the model as class_thresholds.json\nuse_saved_temperature off: T = 1, no thresholds", font: diagram_small, outline: yellow, appear: 2, highlight: [2, 4]}
      - {type: box, box: [20, 625, 1740, 725], text: "preprocessing.json next to the model, and the metadata of the ONNX model: colour order · resize · size\ninterpolation · padding value and placement · layout · value range, read from the run and its data loaders", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
    narration:
      - "The export wraps the classifier in the inference classifier, which takes float BGR images from zero to 255, resized and padded to {{classification.head.image_size}} pixels like the training, and returns the class probabilities only."
      - "So that a server builds these inputs as the training did, the export also writes their colour order, resize, size, interpolation, padding, layout and value range in the preprocessing file next to the model and in the ONNX metadata."
      - "Its Triton model is named image classifier, followed by its format, and the softmax is inside it, after the logits are divided by the temperature saved on the explorer page, whose thresholds are copied next to the model as class thresholds json."
      - "Exported from that page, every checkpoint, weights and temperature gets its own Triton repository in the Exports folder of the run, with the record and the console output of the export."
      - "Faced with several evaluated checkpoints, the export only accepts the thresholds saved on the evaluation of the exported iteration and weights; run from export model with use saved temperature off, it keeps a temperature of one and copies no thresholds."

  - kind: summary
    title: "Recap"
    items:
      - {text: "Results.txt: headline metrics, then every class, worst F1 first"}
      - {text: "Confusion matrices over the evaluations: which pairs remain"}
      - {text: "class_thresholds.json: thresholds at precision {{classification.class_metrics.target_precision:percent_label}}, the temperature"}
      - {text: "predictions.csv: every probability, no model run needed"}
      - {text: "Errors/<TRUE>-TO-<PREDICTED>/<sample>_<probability>.png", monospace: true}
      - {text: "serve_temperature_explorer: save a temperature, export from the page"}
      - {text: "Export: image_classifier, class probabilities [B, {{classification.head.number_classes}}]"}
    narration:
      - "To recap: read the report with the confusion matrices, check the thresholds and the probabilities of the errors, choose a temperature on the explorer page if they are squeezed, and export the checkpoint from that page with the thresholds found at it."
      - "The next series covers object detection: boxes with their class and score, the anchors, the region proposals and the detection heads."
