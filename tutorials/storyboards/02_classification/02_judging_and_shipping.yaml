    narration:
      - "To recap: read the report with the confusion matrices, check the thresholds and the probabilities of the errors, choose a temperature if they are squeezed, and ship the exported probabilities with the thresholds of the same checkpoint."
      - "The next series covers object detection: boxes with their class and score, the anchors, the region proposals and the detection heads."
