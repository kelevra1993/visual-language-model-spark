      - "At iteration {{classification.evaluation.samples.iterations[0]}}, this {{classification.evaluation.samples.iteration_500.wrong_1.true_class}} goes to {{classification.evaluation.samples.iteration_500.wrong_1.predicted_class}}, and this {{classification.evaluation.samples.iteration_500.wrong_2.true_class}} to {{classification.evaluation.samples.iteration_500.wrong_2.predicted_class}}."
      - "At iteration {{classification.evaluation.samples.iterations[1]}}, only the {{classification.evaluation.samples.iteration_2000.wrong_1.true_class}} is still taken for {{classification.evaluation.samples.iteration_2000.wrong_1.predicted_class}}, and in TensorBoard their slider shows the prediction of every image change over the training."

