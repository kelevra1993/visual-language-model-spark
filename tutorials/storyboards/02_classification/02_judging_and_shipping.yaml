      - {type: bars, box: [40, 140, 620, 560], maximum: 1, values: ["{{classification.benchmark.normalization.none}}", "{{classification.benchmark.normalization.batch}}", "{{classification.benchmark.normalization.layer}}"], labels: ["none", "batch", "layer"], value_labels: ["{{classification.benchmark.normalization.none:percent}}", "{{classification.benchmark.normalization.batch:percent}}", "{{classification.benchmark.normalization.layer:percent}}"], colours: [dim, yellow, blue], gap: 40, appear: 0, highlight: [1]}
      - {type: text, position: [760, 30], text: "global pooling\nlast {{classification.benchmark.last_evaluation_count:words}} evaluations", font: diagram_small, colour: dim}
      - {type: bars, box: [760, 140, 1140, 560], maximum: 1, values: ["{{classification.benchmark.pooling.flatten}}", "{{classification.benchmark.pooling.average}}"], labels: ["flatten", "average"], value_labels: ["{{classification.benchmark.pooling.flatten:percent}}", "{{classification.benchmark.pooling.average:percent}}"], colours: [blue, aqua], gap: 40, appear: 1, dim: [1], highlight: [2]}
      - {type: text, position: [1280, 30], text: "class weighting\nlast {{classification.benchmark.last_evaluation_count:words}} evaluations", font: diagram_small, colour: dim}
      - {type: bars, box: [1280, 140, 1700, 560], maximum: 1, values: ["{{classification.benchmark.weighting.balanced}}", "{{classification.benchmark.weighting.none}}"], labels: ["balanced", "none"], value_labels: ["{{classification.benchmark.weighting.balanced:percent}}", "{{classification.benchmark.weighting.none:percent}}"], colours: [blue, aqua], gap: 40, appear: 1, dim: [1], highlight: [2]}
      - {type: text, position: [880, 660], text: "means of {{classification.benchmark.launches_per_setting:words}} launches · {{classification.benchmark.image_size}} pixels · {{classification.benchmark.last_iteration:,}} iterations · {{classification.benchmark.noise.launch_count:words}} launches of one setting: {{classification.benchmark.noise.first_mean:percent}} and {{classification.benchmark.noise.second_mean:percent}}", font: diagram_small, colour: dim, anchor: mm, highlight: [0, 2]}
    narration:
      - "The architecture benchmark compared the head settings on the {{classification.benchmark.class_count:words}} shapes at {{classification.benchmark.image_size}} pixels, {{classification.benchmark.launches_per_setting:words}} launches of {{classification.benchmark.last_iteration}} iterations per setting."
      - "Layer normalization of hidden layers learns fastest: {{classification.benchmark.normalization.layer:percent}} test accuracy at iteration {{classification.benchmark.normalization_iteration}}, against {{classification.benchmark.normalization.none:percent}} without it and {{classification.benchmark.normalization.batch:percent}} with batch normalization; layer and batch end level, above none."
      - "Over the last {{classification.benchmark.last_evaluation_count:words}} evaluations, flatten differs from average pooling by {{classification.benchmark.pooling.difference:points}}, and balanced weights from none by {{classification.benchmark.weighting.difference:points}}, while {{classification.benchmark.noise.launch_count:words}} launches of the same settings ended at {{classification.benchmark.noise.first_mean:percent}} and {{classification.benchmark.noise.second_mean:percent}}."
      - "So flatten and balanced weights are choices of this run, not measured gains: the {{classification.data.class_count:words}} classes hold between {{classification.data.smallest_training_class:,}} and {{classification.data.largest_training_class:,}} training images each."

  - kind: text_panel
    title: "Pitfalls"
    # A label smoothing above zero, and the two layers of the blocks without a shortcut
    literal_numbers: [two, "0"]
    columns:
      - heading: "the head and the loss"
        lines:
          - "label_smoothing > 0 with balanced weights"
          - "  pulls towards the rare classes"
          - ""
          - "flatten: the head is tied to the image"
          - "  size and to last_max_pooling"
          - ""
          - "decorrelation on: the correlation is"
          - "  marked Best when it falls, since a fix"
      - heading: "the data and the logs"
        lines:
          - "class_thresholds.json: null for a class"
          - "  never reaching the target precision"
          - ""
          - "Iterations Per Epoch, MLflow counts:"
          - "  unmapped categories included (count_split_samples)"
          - ""
          - "RES: no shortcut in blocks {{classification.backbone.blocks_without_shortcut_text}}"
          - "  two layers changing the channels"
    narration:
      - "Here are the pitfalls specific to this task, or that bite it first, and one console marker fixed since."
      - "Label smoothing with balanced weights pulls every image towards the rare classes, and a flattened head only works at the image size and last max pooling it was trained with."
      - "With the decorrelation on, older logs printed a rising hidden feature correlation in green with best, as if it were an accuracy; it is now marked best when it falls, like a loss."
      - "A class that never reaches the target precision gets a null threshold in class thresholds json, {{classification.class_metrics.never_reaching_count:words}} classes in this run, so a server applying the thresholds must decide what to do for them; and the iterations per epoch and the sample counts sent to MLflow also count the images of unmapped categories."
      - "And the residual token does not put a shortcut in every block: blocks {{classification.backbone.blocks_without_shortcut_text}} change the channels with two layers and add none."

  - kind: html
    page: diagram
    title: "The export"
    code_reference: "vision_training/models/classification/inference_classifier.py · InferenceClassifier.forward"
    # The range of the raw 8-bit pixels the model takes, and the temperature of 1 of an export without the saved
    # thresholds (the use_saved_temperature off branch of export_experiment in vision_training/deployment/export_model.py)
    literal_numbers: [zero, "0", "255", "1"]
    elements:
      - {type: box, box: [20, 110, 460, 330], text: "images\n[B, {{classification.head.input_channels}}, {{classification.head.image_size}}, {{classification.head.image_size}}] float32\nBGR, 0 to 255\nresized and padded", font: diagram_small, outline: blue, highlight: [0, 1]}
      - {type: arrow, points: [[468, 220], [532, 220]]}
      - {type: box, box: [540, 110, 1000, 330], text: "InferenceClassifier\nthe ImageClassifier\nwithout labels nor loss", font: diagram_small, outline: violet, highlight: [0]}
      - {type: arrow, points: [[1008, 220], [1072, 220]]}
      - {type: box, box: [1080, 110, 1500, 330], text: "class_probabilities\n[B, {{classification.head.number_classes}}]\nsoftmax(logits / T) inside", font: diagram_small, outline: aqua, highlight: [0, 2]}
      - {type: box, box: [20, 420, 1000, 560], text: "Triton model: {{constant:vision_training/deployment/export_specifications.py#TASK_MODEL_NAMES.classification}}_<format>\nTorchScript and ONNX\nfrom the page: <run>/Exports/Iteration_<n>[_EMA]_T<T>/", font: diagram_small, appear: 2, highlight: [2, 3]}
      - {type: arrow, points: [[1290, 338], [1290, 402]], appear: 2}
      - {type: box, box: [1080, 410, 1740, 600], text: "saved_temperature_thresholds.json\nof the exported checkpoint: its T built in,\ncopied next to the model as class_thresholds.json\nno --use_saved_temperature: T = 1, no thresholds", font: diagram_small, outline: yellow, appear: 2, highlight: [2, 4, 5]}
      - {type: box, box: [20, 625, 1740, 725], text: "preprocessing.json next to the model, and the metadata of the ONNX model: colour order · resize · size\ninterpolation · padding value and placement · layout · value range, read from the run and its data loaders", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: box, box: [20, 345, 1000, 405], text: "at launch: the Export Sizes panel estimates every file", font: diagram_small, outline: magenta, appear: 6, highlight: [6]}
    narration:
      - "The export wraps the classifier in the inference classifier, which takes float BGR images from zero to 255, resized and padded to {{classification.head.image_size}} pixels like the training, and returns the class probabilities only."
      - "So that a server builds these inputs as the training did, the export also writes their colour order, resize, size, interpolation, padding, layout and value range in the preprocessing file next to the model and in the ONNX metadata."
      - "Its Triton model is named after the task in the export specifications, followed by its format, and the softmax is inside it, after the logits are divided by the temperature saved on the explorer page, whose thresholds are copied next to the model as class thresholds json."
      - "Exported from that page, every checkpoint, weights and temperature gets its own Triton repository in the Exports folder of the run, with the record and the console output of the export."
      - "Faced with several evaluated checkpoints, the export only accepts the thresholds saved on the evaluation of the exported iteration and weights, and takes those of the checkpoint evaluation folder when the evaluation folder of the training holds some too."
      - "Run by the export model script without its use saved temperature flag, the export keeps a temperature of one and copies no thresholds."
      - "Long before any export, the launch of every training prints the Export Sizes panel after the Model Size panel: the estimated size of the PyTorch weights, the TorchScript and ONNX files, the TensorRT engines and the checkpoint."

  - kind: summary
    title: "Recap"
    items:
      - {text: "Results.txt: headline metrics, then every class, worst F1 first", sentences: [0]}
      - {text: "Confusion matrices over the evaluations: which pairs remain", sentences: [1]}
      - {text: "class_thresholds.json: thresholds at precision {{classification.class_metrics.target_precision:percent_label}}, the temperature", sentences: [2]}
      - {text: "predictions.csv: every probability, no model run needed", sentences: [3]}
      - {text: "Errors/<TRUE>-TO-<PREDICTED>/<sample>_<probability>.png", monospace: true, sentences: [4]}
      - {text: "serve_temperature_explorer: save a temperature, export from the page", sentences: [5]}
      - {text: "Export: {{constant:vision_training/deployment/export_specifications.py#TASK_MODEL_NAMES.classification}}, class probabilities [B, {{classification.head.number_classes}}]", sentences: [6]}
    narration:
      - "To recap: the results file writes one block per evaluated checkpoint, the headline metrics first, then a row for every class, the worst F1 at the top."
      - "Comparing the confusion matrices of successive evaluations shows which pairs of classes the training separates and which remain, here the close quadrilaterals."
      - "Class thresholds json gives every class the threshold reaching the target precision, with the temperature it was found at; a class never reaching it gets null, which a server must handle."
      - "Predictions csv keeps the probability of every class for every test image, so the errors and the thresholds can be studied again without running the model."
      - "The error images are saved in one folder per pair of true and predicted classes, each file name ending with the probability of the wrong class."
      - "When the probabilities are squeezed against one, the serve temperature explorer script lets you choose a temperature, save the thresholds found at it, and export the checkpoint from the page."
      - "The export names its Triton model after the task and returns the class probabilities only, the softmax and the saved temperature built into the model."
      - "The next series covers object detection: boxes with their class and score, the anchors, the region proposals and the detection heads."
