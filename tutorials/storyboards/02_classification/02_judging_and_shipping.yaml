# Image classification, chapter 2: judging and shipping a classifier: the evaluation settings, the report block of
# Results.txt, the confusion matrices of the three evaluations (and the non-zero cells kept above 1,000 classes), the
# per-class F1 and the thresholds at the target precision, the precision-recall curves, the probabilities of
# predictions.csv (and those of a large split written by score_image_split.py), the logit temperature and its explorer
# page, served to save the thresholds of a temperature and export the checkpoint at it, the figures of a research
# report redrawn by draw_report_figures.py (the groups chart left out: it needs a manifest of the group of every
# image), the sample and error images, the measured effects of the head settings in the architecture benchmark, the
# pitfalls and the export with its temperature, its thresholds, its export folder, its input settings and the Export
# Sizes panel of the launch. Coordinates of the html scenes are in pixels of the content area (1760 x 740, origin at
# its top left corner); the figures and facts named classification.* are made by tutorials/figures/classification from
# the synthetic shapes run of tutorial_sources.yaml (35 classes, evaluated at 500, 1000, 1500 and 2000), the classes
# named by their role (the worst F1, the largest confusions, the weakest recalls), and the images under runs: are the
# files its standalone evaluation of checkpoint 2000 wrote (the report block, the confusion matrix image and the
# precision-recall curves), their boxes measured on these files.
series: classification
series_title: "Image Classification (CLS)"
chapter: 2
title: "Judging and shipping a classifier"
output_name: classification_02_judging_and_shipping
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [classification]
references:
  - "vision_training/trainers/classification_trainer.py · ClassificationTrainer.compute_evaluation_results"
  - "vision_training/evaluation/classification/classification_metrics.py · compute_metrics_from_confusion_matrix"
  - "vision_training/evaluation/classification/score_curves.py · save_score_curve_images"
  - "vision_training/trainers/classification_trainer.py · ClassificationTrainer.dump_errors"
  - "vision_training/evaluation/classification/temperature_explorer.py · save_temperature_explorer"
  - "vision_training/evaluation/classification/temperature_explorer.py · save_class_logits"
  - "vision_training/evaluation/classification/temperature_explorer.py · compute_temperature_thresholds"
  - "vision_training/deployment/explorer_export.py · build_export_folder"
  - "vision_training/deployment/export_model.py · check_saved_thresholds_location"
  - "vision_training/deployment/export_model.py · find_saved_thresholds_path"
  - "vision_training/deployment/input_contract.py · write_preprocessing_file"
  - "vision_training/deployment/export_size_estimates.py · print_export_size_summary"
  - "scripts/evaluation/serve_temperature_explorer.py"
  - "vision_training/deployment/export_specifications.py · TASK_MODEL_NAMES"
  - "scripts/evaluation/evaluate_checkpoint.py"
  - "scripts/evaluation/score_image_split.py"
  - "documentation/suggestions.md"
  - "documentation/task workflows/classification_workflow.md"
scenes:
  - kind: title_card
    heading: "Judging and shipping a classifier"
    subheading: "Reports, confusions, thresholds and the export"
    footnote: "Image Classification · chapter 2"
    # The number of the chapter, the chapter key of this storyboard
    literal_numbers: ["2"]
    narration:
      - "A classifier is judged on its whole test split at every evaluated checkpoint, and every evaluation writes what you need to decide whether to ship it."
      - "This chapter reads the evaluations of the synthetic shapes run: the report, the confusions, the thresholds, the probabilities and their temperature, and the images, then the measured effects of the head settings, the pitfalls and the export."

  - kind: yaml
    title: "The evaluation settings"
    code_reference: "vision_training/configuration_processing/classification_checks.py · check_classification_evaluation_configuration"
    source:
      file: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
      keys: [ExperimentConfiguration.evaluation]
      comments: false
    highlights:
      - {key: ExperimentConfiguration.evaluation.per_class_report, sentences: [0]}
      - {key: ExperimentConfiguration.evaluation.number_sample_images, sentences: [0]}
      - {key: ExperimentConfiguration.evaluation.target_precision, sentences: [0]}
      - {key: ExperimentConfiguration.evaluation.save_predictions, sentences: [1]}
      - {key: ExperimentConfiguration.evaluation.error_dumps, sentences: [1]}
      - {key: ExperimentConfiguration.evaluation.error_dumps.activated, sentences: [1]}
      - {key: ExperimentConfiguration.evaluation.error_dumps.maximum_per_class_pair, sentences: [1]}
    narration:
      - "The evaluation section of a classification run sets the per class report, {{config:vision_training/configurations/classification/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.number_sample_images:words}} sample images, and the target precision of the thresholds, while the top-k accuracy needs no setting."
      - "Save predictions writes the probabilities of every test image, and the error images, when activated, save the misclassified images up to a number per pair of classes; the checks refuse the error images in the multi label mode."

  - kind: html
    page: diagram
    title: "The report of a checkpoint"
    code_reference: "vision_training/evaluation/classification/class_metrics_report.py · build_class_metrics_table"
    # The last two columns of the report
    literal_numbers: [two]
    elements:
      - type: listing
        box: [20, 24, 1740, 600]
        font: diagram_monospace_small
        # The standalone evaluation of the classification run of tutorial_sources.yaml (classification_evaluation), its
        # path typed out since file paths take no placeholders: the headline metrics and the first rows of its
        # per-class table, the worst F1 first
        source: {file: "runs:readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128-PT_HFLAT.128-HLN-CWB_MC35/Checkpoint_Evaluation/Results.txt", start: "^Iteration {{classification.checkpoint_evaluation.iteration}} ", count: 22}
        highlights:
          - {match: "^  Accuracy|^  Macro F1", sentences: [0]}
          - {match: "Top-", sentences: [1]}
          - {match: "^  Macro ROC AUC|^   ({{classification.class_metrics.worst_1.report_name}}|{{classification.class_metrics.worst_2.report_name}}|{{classification.class_metrics.worst_3.report_name}}) ", sentences: [2]}
          - {match: "Threshold|@ P99 %|^   {{classification.class_metrics.first_never_reaching.report_name}} ", sentences: [3]}
      - {type: text, position: [880, 660], text: "Checkpoint_Evaluation/Results.txt: one block per evaluated checkpoint, as in the Results.txt of the training · the console prints it with the links of the files", font: diagram_small, colour: dim, anchor: mm}
      - {type: text, position: [880, 705], text: "rates in percent · next in the block: a Per Class Recall table with every {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} interval (Clopper-Pearson)", font: diagram_small, colour: dim, anchor: mm, appear: 4, highlight: [4]}
    narration:
      - "Evaluated again by the evaluate checkpoint script, iteration {{classification.checkpoint_evaluation.iteration}} gives an accuracy of {{classification.checkpoint_evaluation.accuracy:percent}}, with the balanced accuracy and macro F1, which do not depend on the class counts."
      - "The top {{constant:vision_training/evaluation/classification/classification_metrics.py#TOP_K_ACCURACY_CLASSES:words}} accuracy reaches {{classification.checkpoint_evaluation.top_k_accuracy:percent}}: only {{classification.checkpoint_evaluation.top_k_missed_images:,}} test images miss the right class among their {{constant:vision_training/evaluation/classification/classification_metrics.py#TOP_K_ACCURACY_CLASSES:words}} most probable."
      - "With the per class report, the macro ROC AUC and average precision join them, and every class gets its row, the worst F1 first: {{classification.class_metrics.worst_1.class_name}}, {{classification.class_metrics.worst_2.class_name}} and {{classification.class_metrics.worst_3.class_name}}."
      - "The last two columns give the threshold reaching a precision of {{classification.class_metrics.target_precision:percent_label}} and the recall it keeps, a dash when that precision is never reached, as for {{classification.class_metrics.first_never_reaching.class_name}}."
      - "Every rate is written as a percentage, and a per class recall table follows in the block, the worst recall first, with the exact {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} confidence interval of every recall over the test images of its class."

  - kind: html
    page: diagram
    title: "Confusions over the training"
    code_reference: "vision_training/evaluation/classification/classification_metrics.py · compute_confusion_matrix"
    # The non-zero cells the sparse matrix keeps above MAXIMUM_DENSE_CONFUSION_CLASSES classes
    literal_numbers: [zero]
    elements:
      - {type: grid, box: [300, 70, 1100, 680], values: "{{classification.confusion.iteration_500.focus_row_percentages}}", show_values: true, value_format: integer, minimum: 0, maximum: 100, font: diagram_monospace_small, row_labels: "{{classification.confusion.focus_class_names}}", column_labels: "{{classification.confusion.focus_short_names}}", appear: 0, until: 0, marks: [{row: "{{classification.confusion.weakest_1.cell}}", column: "{{classification.confusion.weakest_1.cell}}", sentences: [0]}, {row: "{{classification.confusion.weakest_2.cell}}", column: "{{classification.confusion.weakest_2.cell}}", sentences: [0]}, {row: "{{classification.confusion.weakest_3.cell}}", column: "{{classification.confusion.weakest_3.cell}}", sentences: [0]}]}
      - {type: grid, box: [300, 70, 1100, 680], values: "{{classification.confusion.iteration_1000.focus_row_percentages}}", show_values: true, value_format: integer, minimum: 0, maximum: 100, font: diagram_monospace_small, row_labels: "{{classification.confusion.focus_class_names}}", column_labels: "{{classification.confusion.focus_short_names}}", appear: 1, until: 1, marks: [{row: "{{classification.confusion.weakest_1.cell}}", column: "{{classification.confusion.weakest_1.cell}}", sentences: [1]}, {row: "{{classification.confusion.weakest_2.cell}}", column: "{{classification.confusion.weakest_2.cell}}", sentences: [1]}, {row: "{{classification.confusion.weakest_3.cell}}", column: "{{classification.confusion.weakest_3.cell}}", sentences: [1]}]}
      - {type: grid, box: [300, 70, 1100, 680], values: "{{classification.confusion.iteration_2000.focus_row_percentages}}", show_values: true, value_format: integer, minimum: 0, maximum: 100, font: diagram_monospace_small, row_labels: "{{classification.confusion.focus_class_names}}", column_labels: "{{classification.confusion.focus_short_names}}", appear: 2, marks: [{row: "{{classification.confusion.pair_1.row}}", column: "{{classification.confusion.pair_1.column}}", sentences: [2]}, {row: "{{classification.confusion.pair_2.row}}", column: "{{classification.confusion.pair_2.column}}", sentences: [2]}, {row: "{{classification.confusion.pair_3.row}}", column: "{{classification.confusion.pair_3.column}}", sentences: [3]}, {row: "{{classification.confusion.pair_4.row}}", column: "{{classification.confusion.pair_4.column}}", sentences: [3]}]}
      - {type: text, position: [1180, 70], text: "Iteration {{classification.confusion.iterations[0]}}", font: diagram_heading, appear: 0, until: 0}
      - {type: text, position: [1180, 140], text: "test accuracy {{classification.headline.iteration_500.accuracy:percent}}\nrecall: {{classification.confusion.weakest_1.class_name}} {{classification.confusion.weakest_1.iteration_500.recall:percent}}\n{{classification.confusion.weakest_2.class_name}} {{classification.confusion.weakest_2.iteration_500.recall:percent}} · {{classification.confusion.weakest_3.class_name}} {{classification.confusion.weakest_3.iteration_500.recall:percent}}", font: diagram_text, appear: 0, until: 0}
      - {type: text, position: [1180, 70], text: "Iteration {{classification.confusion.iterations[1]}}", font: diagram_heading, appear: 1, until: 1}
      - {type: text, position: [1180, 140], text: "test accuracy {{classification.headline.iteration_1000.accuracy:percent}}\nrecall: {{classification.confusion.weakest_1.class_name}} {{classification.confusion.weakest_1.iteration_1000.recall:percent}}\n{{classification.confusion.weakest_2.class_name}} {{classification.confusion.weakest_2.iteration_1000.recall:percent}} · {{classification.confusion.weakest_3.class_name}} {{classification.confusion.weakest_3.iteration_1000.recall:percent}}", font: diagram_text, appear: 1, until: 1}
      - {type: text, position: [1180, 70], text: "Iteration {{classification.confusion.iterations[2]}}", font: diagram_heading, appear: 2}
      - {type: text, position: [1180, 140], text: "test accuracy {{classification.headline.iteration_2000.accuracy:percent}}\n{{classification.confusion.pair_1.true_class}} → {{classification.confusion.pair_1.predicted_class}} {{classification.confusion.pair_1.iteration_2000.count:,}}\n{{classification.confusion.pair_2.true_class}} → {{classification.confusion.pair_2.predicted_class}} {{classification.confusion.pair_2.iteration_2000.count:,}}", font: diagram_small, appear: 2}
      - {type: box, box: [1180, 300, 1740, 480], text: "{{classification.confusion.pair_3.true_class}} → {{classification.confusion.pair_3.predicted_class}} {{classification.confusion.pair_3.iteration_2000.count:,}}\n{{classification.confusion.pair_4.true_class}} → {{classification.confusion.pair_4.predicted_class}} {{classification.confusion.pair_4.iteration_2000.count:,}}\n{{classification.confusion.most_taking.class_name}} takes {{classification.confusion.most_taking.wrong_count:,}}", font: diagram_small, outline: magenta, appear: 3, highlight: [3]}
      - {type: box, box: [1180, 495, 1740, 600], text: "above {{constant:vision_training/evaluation/classification/classification_metrics.py#MAXIMUM_DENSE_CONFUSION_CLASSES:,}} classes: non-zero cells\nin confusion_cells.csv, no image", font: diagram_small, outline: yellow, appear: 4, highlight: [4]}
      - {type: text, position: [1180, 615], text: "{{classification.confusion.focus_class_count:words}} of the {{classification.confusion.class_count}} classes\nrows: true class · columns: predicted\ncells: % of the images of the true class", font: diagram_small, colour: dim}
    narration:
      - "At iteration {{classification.confusion.iterations[0]}}, the test accuracy is {{classification.headline.iteration_500.accuracy:percent}}, and {{classification.confusion.weakest_1.class_name}}, {{classification.confusion.weakest_2.class_name}} and {{classification.confusion.weakest_3.class_name}} are found only {{classification.confusion.weakest_1.iteration_500.recall:percent}}, {{classification.confusion.weakest_2.iteration_500.recall:percent}} and {{classification.confusion.weakest_3.iteration_500.recall:percent}} of the time."
      - "At iteration {{classification.confusion.iterations[1]}}, the accuracy reaches {{classification.headline.iteration_1000.accuracy:percent}}, but {{classification.confusion.weakest_1.class_name}} is found {{classification.confusion.weakest_1.iteration_1000.recall:percent}} of the time, {{classification.confusion.weakest_2.class_name}} {{classification.confusion.weakest_2.iteration_1000.recall:percent}} and {{classification.confusion.weakest_3.class_name}} {{classification.confusion.weakest_3.iteration_1000.recall:percent}}."
      - "At iteration {{classification.confusion.iterations[2]}}, the accuracy reaches {{classification.headline.iteration_2000.accuracy:percent}}, and the largest errors left are pairs of close quadrilateral outlines: {{classification.confusion.pair_1.iteration_2000.count:,}} images of {{classification.confusion.pair_1.true_class}} taken for {{classification.confusion.pair_1.predicted_class}}, {{classification.confusion.pair_1.iteration_2000.share:percent}} of them, and {{classification.confusion.pair_2.iteration_2000.count:,}} of {{classification.confusion.pair_2.true_class}} for {{classification.confusion.pair_2.predicted_class}}."
      - "{{classification.confusion.pair_3.iteration_2000.count:,}} images of {{classification.confusion.pair_3.true_class}} go to {{classification.confusion.pair_3.predicted_class}}, and {{classification.confusion.most_taking.class_name}} takes {{classification.confusion.most_taking.wrong_count:,}} images of other classes, finding {{classification.confusion.most_taking.recall:percent}} of its own at a precision of only {{classification.confusion.most_taking.precision:percent}}."
      - "Above {{constant:vision_training/evaluation/classification/classification_metrics.py#MAXIMUM_DENSE_CONFUSION_CLASSES:,}} classes, the evaluation keeps only the non-zero cells, in confusion cells csv, with the same metrics and no image."

  - kind: image
    title: "The confusion matrix image"
    code_reference: "vision_training/evaluation/classification/confusion_matrix.py · save_confusion_matrix_image"
    # The image of the standalone evaluation of the classification run (classification_evaluation of
    # tutorial_sources.yaml), its path typed out since image paths take no placeholders; the views and highlights are
    # pixels of this 35-class image: the whole matrix, the rows of the filled four-sided shapes, then the bottom with
    # the recall column, the precision row and the accuracy corner; the highlighted blocks are the square and rectangle
    # cells, the rhombus to kite cells and the hollow rhombus to hollow kite cells
    image: "runs:readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128-PT_HFLAT.128-HLN-CWB_MC35/Checkpoint_Evaluation/Iteration_2000/confusion_matrix.png"
    views:
      - {box: [0, 0, 2992, 2955], from_sentence: 0}
      - {box: [0, 790, 1750, 1500], from_sentence: 1}
      - {box: [0, 1700, 2992, 2955], from_sentence: 2}
    highlights:
      - {box: [190, 189, 473, 484], sentences: [0]}
      - {box: [825, 854, 1108, 1144], sentences: [0, 1]}
      - {box: [2024, 2103, 2306, 2395], sentences: [0]}
      - {box: [2715, 189, 2821, 2762], sentences: [2]}
      - {box: [190, 2805, 2660, 2914], sentences: [2]}
      - {box: [2715, 2805, 2821, 2914], sentences: [2]}
    narration:
      - "With the per class report, every evaluation also draws the matrix as confusion matrix png and sends it to TensorBoard: here the quadrilaterals stand out as blocks of confusions."
      - "Above {{constant:vision_training/evaluation/classification/confusion_matrix.py#MAXIMUM_CLASSES_WITH_SHARES:words}} classes, as here, every cell writes its count alone, its colour giving its share of the true class."
      - "Its recall column and its precision row sum it up class by class, and the corner gives the accuracy."

  - kind: html
    page: diagram
    title: "Per-class F1 and the thresholds"
    code_reference: "vision_training/evaluation/classification/threshold_finder.py · find_class_thresholds"
    # The two groups of classes, and the example list of target precisions
    literal_numbers: [two, "0.99", "0.95", "0.9", "0.90"]
    elements:
      - {type: text, position: [20, 24], text: "F1 · iteration {{classification.class_metrics.iteration}}, the {{classification.class_metrics.worst_bar_count:words}} worst and the {{classification.class_metrics.best_bar_count:words}} best", font: diagram_small, colour: dim}
      - {type: bars, box: [20, 80, 840, 620], orientation: horizontal, maximum: 1, label_width: 240, values: "{{classification.class_metrics.bar_f1}}", labels: "{{classification.class_metrics.bar_class_names}}", value_labels: "{{classification.class_metrics.bar_f1_labels}}", colour: blue, highlight: [0]}
      - {type: text, position: [920, 24], text: "recall at precision {{classification.class_metrics.target_precision:percent_label}} · class_thresholds.json", font: diagram_small, colour: dim, appear: 1}
      - {type: bars, box: [920, 80, 1740, 620], orientation: horizontal, maximum: 1, label_width: 240, values: "{{classification.class_metrics.bar_recall_at_target}}", labels: "{{classification.class_metrics.bar_class_names}}", value_labels: "{{classification.class_metrics.bar_recall_at_target_labels}}", colour: aqua, appear: 1, highlight: [2]}
      - {type: text, position: [880, 680], text: "never reached by {{classification.class_metrics.never_reaching_text}}: null in class_thresholds.json, a dash", font: diagram_small, colour: dim, anchor: mm, appear: 2, until: 2}
      - {type: text, position: [880, 680], text: "target_precision: [0.99, 0.95, 0.90] → additional_targets, Per Class Thresholds table", font: diagram_small, colour: dim, anchor: mm, appear: 3, highlight: [3, 4]}
    narration:
      - "Sorted by F1, the {{classification.class_metrics.worst_bar_count:words}} worst classes are all quadrilaterals, {{classification.class_metrics.worst_1.class_name}} last at {{classification.class_metrics.worst_1.f1:percent}}, while {{classification.class_metrics.best.class_name}} leads at {{classification.class_metrics.best.f1:percent}}."
      - "Imagine a deployment where errors are costly: for every class, one against the rest, the evaluation finds the probability threshold keeping the highest recall at a precision of {{classification.class_metrics.target_precision:percent_label}}, and saves it with the recall it keeps in class thresholds json."
      - "At that precision, {{classification.class_metrics.best.class_name}} keeps {{classification.class_metrics.best.recall_at_target_precision:percent}} of its images, but {{classification.class_metrics.lowest_reaching.class_name}} keeps {{classification.class_metrics.lowest_reaching.recall_at_target_precision:percent}}, and the precision is never reached for {{classification.class_metrics.never_reaching_text}}."
      - "Should you want to choose among several precisions, give target precision a list, such as 0.99, 0.95 and 0.9: every class then gets a threshold and a recall at each, in a per class thresholds table of the report."
      - "The first precision stays the one the deployment reads, the others joining class thresholds json as additional targets."

  - kind: image
    title: "Precision-recall curves"
    code_reference: "vision_training/evaluation/classification/score_curves.py · compute_class_score_curves"
    # The curves of the standalone evaluation of the classification run (classification_evaluation of
    # tutorial_sources.yaml), its path typed out since image paths take no placeholders; the views and highlights are
    # pixels of this 35-class image, one panel per class in class order: the first two rows of panels with the square
    # panel, then the second and third rows with the rhombus, parallelogram, trapezoid and kite panels
    image: "runs:readme_screenshots/CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128-PT_HFLAT.128-HLN-CWB_MC35/Checkpoint_Evaluation/Iteration_2000/precision_recall_curves.png"
    views:
      - {box: [0, 60, 1800, 790], from_sentence: 0}
      - {box: [0, 350, 1800, 1080], from_sentence: 1}
    highlights:
      - {box: [90, 75, 325, 350], sentences: [0]}
      - {box: [955, 360, 1190, 635], sentences: [1]}
      - {box: [1245, 360, 1480, 635], sentences: [1]}
      - {box: [1535, 360, 1770, 635], sentences: [1]}
      - {box: [90, 645, 325, 920], sentences: [1]}
    narration:
      - "The precision recall curve of every class sweeps that threshold; the dotted line is the target precision, and every dot the threshold reaching it."
      - "The curves of the quadrilaterals stay low whatever the threshold, {{classification.class_metrics.worst_1.class_name}} at an average precision of {{classification.class_metrics.worst_1.average_precision:percent}}, since the other quadrilaterals get high probabilities of its class; the ROC curves, saved next to it, read the same way."
      - "The axes, the target precision and the average precisions are written as percentages, and precision recall thresholds png, saved next to these curves, zooms on these dots and writes every threshold in the colour of its curve."

  - kind: image
    title: "Probabilities of right and wrong predictions"
    code_reference: "vision_training/trainers/classification_trainer.py · ClassificationTrainer.compute_evaluation_results"
    image: "figures:classification/evaluation/prediction_confidence_iteration_2000.png"
    highlights:
      - {box: "{{classification.confidence.confidence_panel_box}}", sentences: [1]}
      - {box: "{{classification.confidence.pair_panel_box}}", sentences: [2]}
    narration:
      - "When the goal is to study the errors and the thresholds again without running the model, the predictions file holds one row per test image, {{classification.confidence.test_images:,}} here, with the probability of every class."
      - "For the {{classification.confidence.wrong_count:,}} wrong predictions, the probability of the predicted class has a median of {{classification.confidence.wrong_median:.2f}}, and only {{classification.confidence.wrong_confident_count}} of them pass {{classification.confidence.confident_probability}}, where {{classification.confidence.correct_confident_share:percent}} of the right ones do."
      - "The test images of {{classification.confidence.pair_true_class}} show the largest confusion at work: {{classification.confidence.pair_predicted_class}} takes the probability {{classification.confidence.pair_true_class}} loses, and {{classification.confidence.pair_wrong:,}} of the {{classification.confidence.pair_images:,}} images tip over, {{classification.confidence.pair_wrong_to_predicted:,}} of them to {{classification.confidence.pair_predicted_class}}."
      - "For a split far larger than a test split, such as images mined for a rare class, the score image split script writes the same probability columns with one checkpoint and the forward pass only, resuming where it stopped."

  - kind: html
    page: diagram
    title: "The logit temperature"
    code_reference: "vision_training/evaluation/classification/temperature_explorer.py · save_temperature_explorer"
    # The made-up logits of a square and their probabilities at the temperatures one and three, the decimals listed
    # first so that the "0" of the logits leaves them whole
    literal_numbers: ["0.950", "0.047", "0.002", "0.665", "0.245", "0.090", "0.95", "0.67", "0.24", "0.09", six, three,
                      zero, "6", "3", "0", "1"]
    elements:
      - {type: box, box: [40, 30, 1260, 110], text: "probabilities = softmax(logits / T)", font: diagram_bold, outline: blue, highlight: [0]}
      - {type: text, position: [40, 160], text: "a square, logits 6 · 3 · 0, T = 1", font: diagram_small, colour: dim}
      - {type: bars, box: [40, 200, 600, 600], maximum: 1, values: [0.950, 0.047, 0.002], labels: ["square", "rectangle", "circle"], value_labels: ["0.950", "0.047", "0.002"], colours: [blue, aqua, violet], gap: 40, highlight: [1]}
      - {type: text, position: [700, 160], text: "the same logits, T = 3", font: diagram_small, colour: dim, appear: 1}
      - {type: bars, box: [700, 200, 1260, 600], maximum: 1, values: [0.665, 0.245, 0.090], labels: ["square", "rectangle", "circle"], value_labels: ["0.665", "0.245", "0.090"], colours: [blue, aqua, violet], gap: 40, appear: 1, highlight: [1]}
      - {type: box, box: [1340, 30, 1740, 330], text: "temperature_explorer.html\nwith the per class report\nslider from {{classification.temperature_explorer.minimum_temperature:.3g}} to {{classification.temperature_explorer.maximum_temperature:.3g}}\na score histogram per class\nclass_logits.npz next to it", font: diagram_small, outline: yellow, appear: 2, highlight: [2, 3]}
      - {type: box, box: [1340, 380, 1740, 600], text: "serve_temperature_explorer\nhttp://127.0.0.1:{{classification.temperature_explorer.port}}/\nany typed T · score ranges\nSave Thresholds · Export", font: diagram_small, outline: aqua, appear: 4, highlight: [4, 5]}
      - {type: text, position: [880, 680], text: "the order of the logits is kept: the same predicted class, the same accuracy · classification only", font: diagram_small, colour: dim, anchor: mm, appear: 1}
    narration:
      - "A well trained softmax often squeezes its probabilities against one, which leaves the thresholds little room: dividing the logits by a temperature before the softmax spreads them out."
      - "Say a square gets the logits six, three and zero: at a temperature of one, square takes 0.95; at three, it keeps the lead with 0.67, against 0.24 for rectangle and 0.09 for circle, so the predicted class and the accuracy never change."
      - "With the per class report on, every evaluation writes temperature explorer html, where a slider from {{classification.temperature_explorer.minimum_temperature:.3g}} to {{classification.temperature_explorer.maximum_temperature:.3g}} redraws, for every class, the histogram of the scores of its own images and its thresholds."
      - "Up to {{constant:vision_training/evaluation/classification/temperature_explorer.py#MAXIMUM_EXPLORER_CLASSES:words}} classes, it also keeps the test logits next to the page, in class logits npz, so that any other temperature can be drawn later without running the model."
      - "The serve temperature explorer script lists on a local page, run by run and iteration by iteration, the evaluations of the trainings and those of the evaluate checkpoint script, written in the checkpoint evaluation folder of their run."
      - "There you type the temperature you want, count the images of every class in score ranges of your choice, save the thresholds of every class at it, and export the checkpoint at that temperature."

