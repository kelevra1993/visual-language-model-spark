      - {box: "{{object_detection.inference.proposal_filter.panel_2_box}}", sentences: [1]}
      - {box: "{{object_detection.inference.proposal_filter.panel_3_box}}", sentences: [2]}
    narration:
      - "On the image, the {{object_detection.inference.evaluation_filter.top_count}} best proposals pile up on the shapes, every level in its color."
      - "After the suppression, {{object_detection.inference.evaluation_filter.valid_count}} remain, still several per object, for the detection heads to score and refine."
      - "The heads turn them into {{object_detection.inference.detection_count}} detections above 0.5: the small nonagon is lost, and the large one gets both a nonagon and a circle box."

  - kind: code
    title: "One selection for training and export"
    code_reference: "vision_training/models/detection/region_proposer.py · select_best_proposals"
    source:
      file: vision_training/models/detection/region_proposer.py
      function: select_best_proposals
      start: "# Keep the best pre-NMS"
      end: "suppress_per_image=suppress_per_image\\)"
    highlights:
      - {match: "torch.topk\\(input=torch.sigmoid", sentences: [0, 1]}
      - {match: "precision of the boxes|confident anchors", sentences: [1]}
      - {match: "kept_mask = suppress_overlapping_proposals", sentences: [2]}
      - {match: "suppress_per_image=suppress_per_image", sentences: [2]}
