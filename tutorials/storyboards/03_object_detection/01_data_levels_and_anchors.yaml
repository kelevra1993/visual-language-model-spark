      - "select_best_proposals does this for the whole batch, and both the training filter and the exported detector call it, so they keep the same proposals."
      - "The scores are ranked in the float32 of the boxes, since the bfloat16 logits of the mixed precision would give the confident anchors only a few distinct probabilities."
      - "Only the suppression differs: one torchvision call per image in the eager model, and one batched call over the batch in the export, the form the ONNX export keeps for any batch size."

