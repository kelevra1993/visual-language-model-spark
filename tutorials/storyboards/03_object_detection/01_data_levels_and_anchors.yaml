    page: diagram
    title: "Two stages on {{object_detection.inference.level_count:words}} levels"
    code_reference: "vision_training/models/detection/two_stage_detector.py · TwoStageDetector"
    # The two stages of the method, and the block numbers of the levels
    literal_numbers: [two, "4", "5", "6", "7"]
    elements:
      # Input and backbone, the four levels of the run as tensors of the batch of the configuration
      - {type: box, box: [20, 300, 200, 420], text: "images\n[{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Backbone.input_channels}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}}]", font: diagram_small, outline: border}
      - {type: arrow, points: [[200, 360], [245, 360]]}
      - {type: cuboid, box: [255, 285, 300, 435], depth: 10, fill: blue}
      - {type: cuboid, box: [320, 305, 352, 415], depth: 16, fill: blue}
      - {type: text, position: [305, 470], text: "backbone", font: diagram_small, colour: dim, anchor: ma}
      - {type: arrow, points: [[375, 325], [425, 90]]}
      - {type: arrow, points: [[375, 345], [425, 247]]}
      - {type: arrow, points: [[375, 375], [425, 410]]}
      - {type: arrow, points: [[375, 395], [425, 560]]}
      # The neck around the levels, whose maps of the channels the heads read are given under every block
      - {type: box, box: [412, 30, 622, 696], fill: null, outline: border, highlight: [0]}
      - {type: text, position: [517, 706], text: "neck: {{object_detection.inference.model.neck_type}}", font: diagram_small, colour: dim, anchor: ma, highlight: [0]}
      - {type: cuboid, box: [435, 60, 495, 120], depth: 18, fill: blue, highlight: [1]}
      - {type: text, position: [430, 132], text: "block 4 · stride {{object_detection.inference.level_4.stride}}\n[{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}}, {{object_detection.inference.model.level_4.head_input_channels}}, {{object_detection.inference.level_4.cells}}, {{object_detection.inference.level_4.cells}}]", font: diagram_small}
      - {type: cuboid, box: [442, 225, 487, 270], depth: 18, fill: blue, highlight: [1]}
      - {type: text, position: [430, 282], text: "block 5 · stride {{object_detection.inference.level_5.stride}}\n[{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}}, {{object_detection.inference.model.level_5.head_input_channels}}, {{object_detection.inference.level_5.cells}}, {{object_detection.inference.level_5.cells}}]", font: diagram_small}
      - {type: cuboid, box: [450, 395, 480, 425], depth: 18, fill: blue, highlight: [1]}
      - {type: text, position: [430, 437], text: "block 6 · stride {{object_detection.inference.level_6.stride}}\n[{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}}, {{object_detection.inference.model.level_6.head_input_channels}}, {{object_detection.inference.level_6.cells}}, {{object_detection.inference.level_6.cells}}]", font: diagram_small}
      - {type: cuboid, box: [450, 545, 480, 575], depth: 18, fill: blue, highlight: [1]}
      - {type: text, position: [430, 587], text: "block 7 · stride {{object_detection.inference.level_7.stride}}\n[{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}}, {{object_detection.inference.model.level_7.head_input_channels}}, {{object_detection.inference.level_7.cells}}, {{object_detection.inference.level_7.cells}}]", font: diagram_small}
      # Region proposal heads of every level, then the proposal filter, per level in the shipped configurations
      - {type: arrow, points: [[628, 90], [665, 90]], appear: 1}
      - {type: box, box: [670, 50, 890, 130], text: "region proposals\n{{object_detection.inference.level_4.anchor_count}} anchors", font: diagram_small, outline: aqua, appear: 1, highlight: [1]}
      - {type: arrow, points: [[628, 247], [665, 247]], appear: 1}
      - {type: box, box: [670, 207, 890, 287], text: "region proposals\n{{object_detection.inference.level_5.anchor_count}} anchors", font: diagram_small, outline: aqua, appear: 1, highlight: [1]}
      - {type: arrow, points: [[628, 410], [665, 410]], appear: 1}
      - {type: box, box: [670, 370, 890, 450], text: "region proposals\n{{object_detection.inference.level_6.anchor_count}} anchors", font: diagram_small, outline: aqua, appear: 1, highlight: [1]}
      - {type: arrow, points: [[628, 560], [665, 560]], appear: 1}
      - {type: box, box: [670, 520, 890, 600], text: "region proposals\n{{object_detection.inference.level_7.anchor_count}} anchors", font: diagram_small, outline: aqua, appear: 1, highlight: [1]}
      - {type: arrow, points: [[890, 90], [935, 250]], appear: 2}
      - {type: arrow, points: [[890, 247], [935, 310]], appear: 2}
      - {type: arrow, points: [[890, 410], [935, 350]], appear: 2}
      - {type: arrow, points: [[890, 560], [935, 410]], appear: 2}
      - {type: box, box: [940, 210, 1200, 450], text: "proposal filter\n{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.proposal_selection}}: top {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.training.pre_nms_proposals}}\nNMS {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.nms_iou_threshold}}, then the best\n{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.training.post_nms_proposals}} per image\nevaluation: {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.inference.pre_nms_proposals}} · {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.inference.post_nms_proposals}}", font: diagram_small, outline: yellow, appear: 2, highlight: [2]}
      # Detection head of the level of every proposal, then the post-processing
      - {type: arrow, points: [[1200, 260], [1275, 90]], appear: 3}
      - {type: arrow, points: [[1200, 310], [1275, 247]], appear: 3}
      - {type: arrow, points: [[1200, 350], [1275, 410]], appear: 3}
      - {type: arrow, points: [[1200, 400], [1275, 560]], appear: 3}
      - {type: box, box: [1280, 50, 1500, 130], text: "RoI head 4\n{{object_detection.inference.model.level_4.roi_align_pool_size}} × {{object_detection.inference.model.level_4.roi_align_pool_size}} ROI Align", font: diagram_small, outline: magenta, appear: 3, highlight: [3]}
      - {type: box, box: [1280, 207, 1500, 287], text: "RoI head 5\n{{object_detection.inference.model.level_5.roi_align_pool_size}} × {{object_detection.inference.model.level_5.roi_align_pool_size}} ROI Align", font: diagram_small, outline: magenta, appear: 3, highlight: [3]}
      - {type: box, box: [1280, 370, 1500, 450], text: "RoI head 6\n{{object_detection.inference.model.level_6.roi_align_pool_size}} × {{object_detection.inference.model.level_6.roi_align_pool_size}} ROI Align", font: diagram_small, outline: magenta, appear: 3, highlight: [3]}
      - {type: box, box: [1280, 520, 1500, 600], text: "RoI head 7\n{{object_detection.inference.model.level_7.roi_align_pool_size}} × {{object_detection.inference.model.level_7.roi_align_pool_size}} ROI Align", font: diagram_small, outline: magenta, appear: 3, highlight: [3]}
      - {type: arrow, points: [[1500, 90], [1570, 300]], appear: 4}
      - {type: arrow, points: [[1500, 247], [1570, 320]], appear: 4}
      - {type: arrow, points: [[1500, 410], [1570, 340]], appear: 4}
      - {type: arrow, points: [[1500, 560], [1570, 360]], appear: 4}
      - {type: box, box: [1575, 275, 1745, 385], text: "post-process\n{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}} per image", font: diagram_small, outline: violet, appear: 4, highlight: [4]}
      - {type: text, position: [1390, 640], text: "{{object_detection.inference.model.number_classes}} classes · a box per class", font: diagram_small, colour: dim, anchor: ma, appear: 3}
    narration:
      - "The detector is a two-stage detector in the style of Faster R-CNN, built on the shared backbone of the repository, with the feature pyramid neck of the Neck section between the backbone and the heads, which then read its maps of {{object_detection.inference.model.level_5.head_input_channels}} channels."
      - "Every block named in Detection Levels is a level with its own anchors and region proposal head: the run shown reads blocks {{object_detection.run.level_names_text}}, with {{object_detection.inference.level_4.anchor_count:,}}, {{object_detection.inference.level_5.anchor_count:,}}, {{object_detection.inference.level_6.anchor_count:,}} and {{object_detection.inference.level_7.anchor_count:,}} anchors at {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}} pixels."
      - "The proposal filter keeps at most the best {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.training.pre_nms_proposals:words}} proposals of every level, or of all the levels with the joint selection, suppresses their overlaps at {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.nms_iou_threshold}}, and passes the best {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.training.post_nms_proposals}} per image to the second stage, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.inference.post_nms_proposals}} in evaluation."
      - "Every proposal goes back to the detection head of the level its anchor came from, which pools it with ROI Align, classifies it among {{object_detection.inference.model.number_classes}} classes and refines one box per class."
      - "Post-processing keeps the {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections:words}} best detections of every image, padded to that number, the fixed shape the exported model returns."

  - kind: html
    page: diagram
    title: "The COCO split"
    code_reference: "vision_training/data/detection/coco_dataset.py · select_image_objects"
    elements:
      - type: listing
        box: [30, 24, 1730, 400]
        font: diagram_monospace_small
        source: {file: "figures:object_detection/listings/coco_manifest.txt"}
        highlights:
          - {match: "^test[_0-9]*/labels.json", sentences: [0, 1]}
          - {match: "bbox", sentences: [2]}
          - {match: "segmentation|counts", sentences: [2]}
          - {match: "label_mapping|label_dictionary", sentences: [3, 4]}
      - {type: text, position: [40, 450], text: "Splits of the synthetic shapes", font: diagram_bold, appear: 1}
      - {type: text, position: [40, 500], text: "train {{object_detection.data.train_images:,}} images · {{object_detection.data.train_objects:,}} objects\nvalidation {{object_detection.data.validation_images:,}} · {{object_detection.data.validation_objects:,}}\n{{object_detection.data.test_folder_name}} {{object_detection.data.test_images:,}} · {{object_detection.data.test_objects:,}}\n{{object_detection.data.minimum_objects_per_image}} to {{object_detection.data.maximum_objects_per_image}} objects per test image", font: diagram_text, appear: 1}
      - {type: box, box: [900, 440, 1730, 560], text: "bbox [x, y, width, height] → corners\n{{object_detection.data.first_bbox}} → {{object_detection.data.first_box_corners}}", font: diagram_small, outline: blue, appear: 2, highlight: [2]}
      - {type: box, box: [900, 590, 1730, 710], text: "class {{object_detection.data.background_class}} = background · classes {{object_detection.data.first_class}} to {{object_detection.data.last_class}} = the shapes\na category missing from the mapping: objects dropped", font: diagram_small, outline: violet, appear: 3, highlight: [3, 4]}
    narration:
      - "A split is a folder of images with a COCO labels file; the run shown reads the data set of the instance masks, so that the detection and mask runs train on the same images."
      - "Its training split holds {{object_detection.data.train_images:,}} images and {{object_detection.data.train_objects:,}} objects of {{object_detection.data.category_count}} shapes at {{object_detection.data.image_size}} pixels; the run is tested on a folder holding the labels of {{object_detection.data.test_images:,}} of the test images, with {{object_detection.data.minimum_objects_per_image:words}} to {{object_detection.data.maximum_objects_per_image:words}} objects each."
      - "The detector reads the bbox of every annotation, x, y, width and height, turns it into corners, and ignores the segmentation, which only the mask task reads."
      - "The mapping file gives every category its class, and the label dictionary saved in the run adds the background as class {{object_detection.data.background_class:words}}, so the heads predict {{object_detection.data.class_count}} classes."
      - "Say a category is missing from the mapping: it is announced in yellow at launch, and its objects are dropped like the background."

  - kind: yaml
    title: "The levels in the configuration"
    code_reference: "vision_training/configuration_processing/detection_checks.py · check_detection_levels"
    # The block numbers of the levels
    literal_numbers: ["6", "7"]
    source:
      file: vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml
      keys: [Backbone.last_max_pooling, DetectionLevels, Neck]
      comments: false
    highlights:
      - {match: "^  \"[0-9]+\":", sentences: [0]}
      - {match: "last_max_pooling", sentences: [1]}
      - {key: Neck.type, sentences: [2]}
      - {key: Neck.output_channels, sentences: [2]}
      - {match: "scales: \\[", sentences: [3]}
      - {match: "region_proposal:|detector:", sentences: [4]}
    narration:
      - "Detection Levels names the backbone blocks the detector reads, as quoted keys in increasing order, and gives every level its anchors, its region proposal head and its detection head: blocks {{object_detection.run.shipped_level_names_text}} in the synthetic configuration."
      - "The backbone divides the resolution by {{object_detection.inference.model.backbone_pooling_stride:words}} in every block; with the last max pooling off, block 7 keeps the {{object_detection.inference.level_6.cells:words}} by {{object_detection.inference.level_6.cells:words}} map of block 6, so these levels have strides of {{object_detection.inference.level_5.stride}}, {{object_detection.inference.level_6.stride}} and {{object_detection.inference.level_7.stride}}."
      - "Picture a data set of small objects: the feature pyramid of the Neck section brings the context of the coarser blocks down to the finest level through a top-down path, path aggregation adding a bottom-up path after it, but only a finer block gives its anchors a finer stride."
      - "The run shown adds block {{object_detection.run.added_level}}, at a stride of {{object_detection.inference.level_4.stride}}, with anchors of {{object_detection.run.added_level_scales_text}} pixels, and a scale of {{object_detection.run.added_scale}} pixels to block {{object_detection.run.added_scale_level}}, so that its anchors span {{object_detection.run.smallest_anchor}} to {{object_detection.run.largest_anchor}} pixels."
      - "The heads are small here: {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.region_proposal.convolutions[0]:words}} convolutions of {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.region_proposal.convolutions[1]}} channels for the proposals, and for the detections {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.convolutions[0]:words}} convolutions with squeeze and excitation and residual shortcuts, then fully connected layers of {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.fully_connected[0]}} and {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.fully_connected[1]}} units."

  - kind: html
    page: 03_object_detection/anchor_grid
    title: "Anchors on a test image"
    code_reference: "vision_training/models/detection/anchors.py · Anchors.generate_anchors"
    # The block numbers of the levels, and the overlap above zero of the fallback (> 0.0 in
    # batch_assign_targets_to_anchors), any overlap at all
    literal_numbers: ["4", "5", "6", "7", "0"]
    data:
      anchors: "{{object_detection.inference.anchor_page}}"
      # First sentence of every stride group of levels (block 4, block 5, blocks 6 and 7), then of the objects
      stages: {groups: [0, 3, 4], objects: 6}
    elements:
      - {type: text, position: [760, 40], text: "Block 4 · stride {{object_detection.inference.level_4.stride}}", font: diagram_heading, until: 2}
      - {type: text, position: [760, 100], text: "{{object_detection.inference.level_4.cells}} × {{object_detection.inference.level_4.cells}} cells · scales {{object_detection.run.level_4.scales_text}}\nratios {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.anchors.aspect_ratios[0]:g}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.anchors.aspect_ratios[1]:g}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.anchors.aspect_ratios[2]:g}} (height / width), every level\n{{object_detection.inference.level_4.anchors_per_cell}} anchors per cell · {{object_detection.inference.level_4.anchor_count}} anchors", font: diagram_text, until: 2}
      - {type: box, box: [760, 330, 1720, 470], text: "centred on the corner of the cell\n(column × stride, row × stride), not its centre\nan offset the regressor has to learn", font: diagram_small, outline: accent, appear: 2, until: 2}
      - {type: text, position: [760, 40], text: "Block 5 · stride {{object_detection.inference.level_5.stride}}", font: diagram_heading, appear: 3, until: 3}
      - {type: text, position: [760, 100], text: "{{object_detection.inference.level_5.cells}} × {{object_detection.inference.level_5.cells}} cells · scales {{object_detection.run.level_5.scales_text}}\n{{object_detection.inference.level_5.anchors_per_cell}} anchors per cell · {{object_detection.inference.level_5.anchor_count}} anchors", font: diagram_text, appear: 3, until: 3}
      - {type: text, position: [760, 40], text: "Blocks 6 and 7 · stride {{object_detection.inference.level_6.stride}}", font: diagram_heading, appear: 4, until: 5}
      - {type: text, position: [760, 100], text: "{{object_detection.inference.level_6.cells}} × {{object_detection.inference.level_6.cells}} cells each\nblock 6: scales {{object_detection.run.level_6.scales_text}} · {{object_detection.inference.level_6.anchor_count}} anchors\nblock 7: scales {{object_detection.run.level_7.scales_text}} · {{object_detection.inference.level_7.anchor_count}} anchors\nin all: {{object_detection.inference.anchor_total:,}} anchors", font: diagram_text, appear: 4, until: 5}
      - {type: box, box: [760, 330, 1720, 430], text: "the {{object_detection.run.shared_scale}} pixel anchors of blocks 6 and 7\nare the same boxes (dashed: block 7)", font: diagram_small, outline: yellow, appear: 5, until: 5}
      - {type: text, position: [760, 40], text: "Best anchor of every object", font: diagram_heading, appear: 6}
      - {type: text, position: [760, 100], text: "{{object_detection.inference.object_lines}}", font: diagram_text, appear: 6}
      - {type: text, position: [760, 210], segments: [{text: "blue", colour: blue}, {text: ": IoU >= {{object_detection.run.anchor_foreground_minimum}}   ", colour: dim}, {text: "magenta", colour: magenta}, {text: ": below {{object_detection.run.anchor_foreground_minimum}}", colour: dim}], font: diagram_small, appear: 6}
      - {type: box, box: [760, 330, 1720, 470], text: "fallback: the best anchor of every object\nis foreground whatever its overlap above 0", font: diagram_small, outline: magenta, appear: 7, highlight: [7]}
      # Colours of the anchor scales, those of SCALE_COLOURS of the animation
      - {type: text, position: [760, 650], segments: [{text: "anchor scales  ", colour: dim}, {text: "{{object_detection.run.level_4.scales[0]}}", colour: aqua}, {text: "  ", colour: dim}, {text: "{{object_detection.run.level_4.scales[1]}}", colour: blue}, {text: "  ", colour: dim}, {text: "{{object_detection.run.level_5.scales[1]}}", colour: violet}, {text: "  ", colour: dim}, {text: "{{object_detection.run.level_6.scales[1]}}", colour: yellow}, {text: "  ", colour: dim}, {text: "{{object_detection.run.level_7.scales[1]}}", colour: magenta}, {text: "  ", colour: dim}, {text: "{{object_detection.run.level_7.scales[2]}}", colour: red}], font: diagram_small, until: 5}
    narration:
      - "Every cell of a level gets one anchor per scale and aspect ratio: block 4 of the run has {{object_detection.inference.level_4.cells}} by {{object_detection.inference.level_4.cells}} cells of {{object_detection.inference.level_4.stride}} pixels, and its {{object_detection.inference.level_4.scale_count:words}} scales, {{object_detection.run.level_4.scales_text}}, by {{object_detection.inference.level_4.ratio_count:words}} ratios give {{object_detection.inference.level_4.anchors_per_cell:words}} anchors per cell."
      - "The ratio is the height over the width at a constant area: {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.anchors.aspect_ratios[0]:.3g}} for a wide anchor, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.anchors.aspect_ratios[2]:.3g}} for a tall one, the same in every level."
