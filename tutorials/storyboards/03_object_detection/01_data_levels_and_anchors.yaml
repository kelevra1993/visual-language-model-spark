      - {type: text, position: [460, 540], text: "joint top 5 above the line", font: diagram_small, colour: yellow, appear: 1}
      # What each selection keeps for three slots
      - {type: box, box: [860, 60, 1700, 320], text: "joint\ntop 5: the five level 4 boxes\nthe level 6 box is cut\none NMS: one of the five survives\n3 slots: 1 real proposal, 2 copies", font: diagram_small, outline: yellow, appear: 1, highlight: [1]}
      - {type: box, box: [860, 360, 1700, 620], text: "per level\nlevel 4: top 5, NMS: one survives\nlevel 6: its box survives its own NMS\n3 slots: 2 real proposals, 1 copy\nthe level 6 head gets this object", font: diagram_small, outline: aqua, appear: 2, highlight: [2]}
    narration:
      - "Take one object seen by two levels: level 4 gives it five near-identical boxes, and level 6 one box, scored a little lower."
      - "With a joint top 5, the five level 4 boxes take every place and the level 6 box is cut; the suppression then keeps one of the five, so the three slots get one real proposal and two copies."
      - "Per level, level 4 still keeps one box after its own suppression, but the level 6 box survives in its level: two real proposals, and the level 6 head gets this object to train on."

