# Object detection, chapter 1: what the detection task is for, the two-stage detector on four backbone levels, the
# COCO data it reads, the levels and their anchors on a real test image, the anchor recall of the training objects, the
# region proposal heads and the proposal filter. Coordinates of the html scenes are in pixels of the content area
# (1760 x 740, origin at its top left corner); the figures named figures:object_detection/... and the facts
# {{object_detection.*}} are made by tutorials/figures/object_detection from the DET run of tutorial_sources.yaml; the
# settings are quoted from the synthetic detection configuration ({{config:...}}), the ones written next to a
# measurement of the run (its levels, anchors, thresholds, filter counts and samplings) from the configuration saved in
# the run ({{object_detection.run.*}}, the level and filter facts), so that both stay true when the shipped values move
# on (the run trained with the shipped settings, the feature pyramid neck, the per-level proposal selection and
# DIoU-NMS among them, plus a level 4 and a 384 pixel scale on level 7, which the yaml scene of the levels says), and
# the block numbers 4, 5, 6 and 7 (the keys of DetectionLevels, also in the names of the facts) are kept as typed. The
# joint and per-level proposal selections are then compared on the detector of the detection benchmark, whose facts
# {{object_detection.proposal_selection.*}} come from its stage 7 launches (proposal_selection.py).
series: object_detection
series_title: "Object Detection (DET)"
chapter: 1
title: "Data, levels and anchors"
output_name: object_detection_01_data_levels_and_anchors
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [object_detection]
references:
  - "vision_training/models/detection/two_stage_detector.py · TwoStageDetector.forward_detection_stages"
  - "vision_training/data/detection/coco_dataset.py · select_image_objects"
  - "vision_training/models/detection/anchors.py · Anchors.generate_anchors"
  - "vision_training/evaluation/detection/region_recall.py · summarise_anchor_recall"
  - "vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml · ExperimentConfiguration.diagnosis_modes.compute_anchor_coverage"
  - "vision_training/models/detection/region_proposer.py · RegionProposalFilter.forward"
  - "documentation/task workflows/object_detection_workflow.md"
  - "documentation/architecture_benchmarking/object_detection_experiment_plan.md"
scenes:
  - kind: title_card
    heading: "Data, levels and anchors"
    subheading: "A two-stage detector on {{object_detection.inference.level_count:words}} backbone levels"
    footnote: "Object Detection · chapter 1"
    # The two stages of the method, and the number of the chapter
    literal_numbers: [two-stage, "1"]
    narration:
      - "The detection task finds every object of an image with its box, its class and a score: choose it when boxes are enough to locate and count the objects."
      - "Choose instance segmentation for a mask per object, keypoint detection for objects described by points, and semantic segmentation when the objects of a class need not be told apart."
      - "This chapter covers the data, the backbone levels the detector reads, the anchors, and the region proposals."

  - kind: image
    title: "What the detector returns"
    code_reference: "vision_training/trainers/detection_trainer.py · DetectionTrainer.draw_test_image"
    image: "figures:object_detection/evaluation/last_sample.png"
    highlights:
      - {box: [0, 24, 512, 536], sentences: [0]}
      - {box: [516, 24, 1028, 536], sentences: [1]}
    narration:
      - "This is a test sample the synthetic run writes at every evaluation: on the left, the {{object_detection.inference.object_count:words}} ground truth boxes of the image."
      - "On the right, the detections of iteration {{object_detection.run.checkpoint_iteration}} that reach the deployment score of {{object_detection.run.score_threshold}}, every one a box in network pixels, a class and a score."

