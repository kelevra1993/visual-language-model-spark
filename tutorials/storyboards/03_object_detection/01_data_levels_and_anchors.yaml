        box: [880, 70, 1720, 600]
        groups: "{{object_detection.proposal_selection.level_labels}}"
        series:
          - {name: "joint", colour: yellow, values: "{{object_detection.proposal_selection.joint_recall_per_level}}", value_labels: "{{object_detection.proposal_selection.joint_recall_per_level_labels}}"}
          - {name: "per level", colour: aqua, values: "{{object_detection.proposal_selection.per_level_recall_per_level}}", value_labels: "{{object_detection.proposal_selection.per_level_recall_per_level_labels}}"}
        orientation: vertical
        maximum: "{{object_detection.proposal_selection.recall_axis_maximum}}"
        appear: 2
        highlight: [2]
      - {type: text, position: [40, 640], text: "test split of the benchmark, averaged weights at iteration {{object_detection.proposal_selection.compared_iteration:,}}, mean of {{object_detection.proposal_selection.launches_per_selection:words}} launches per selection", font: diagram_small, colour: dim}
    narration:
      - "Over the test split of the benchmark, at iteration {{object_detection.proposal_selection.compared_iteration:,}}, the joint pair fills only {{object_detection.proposal_selection.joint_proposals_per_image:.1f}} of its {{object_detection.proposal_selection.inference_post_nms}} slots with real proposals, the rest with copies, and the per-level pair fills all of them."
      - "Level {{object_detection.proposal_selection.level_names[0]}} still takes most of them, {{object_detection.proposal_selection.per_level_proposals_per_level[0]:.0f}} per image, since the last ranking is by score, and the other levels gain a few proposals each."
      - "Yet every level now covers more of the test objects at an IoU of 0.5: level {{object_detection.proposal_selection.level_names[1]}} {{object_detection.proposal_selection.per_level_recall_per_level[1]:percent}} of them against {{object_detection.proposal_selection.joint_recall_per_level[1]:percent}}, and level {{object_detection.proposal_selection.level_names[2]}} {{object_detection.proposal_selection.per_level_recall_per_level[2]:percent}} against {{object_detection.proposal_selection.joint_recall_per_level[2]:percent}}."

