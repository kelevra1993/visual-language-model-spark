      - "The benchmark of the repository trains a larger detector: {{object_detection.proposal_selection.level_count:words}} levels at {{object_detection.proposal_selection.image_size}} pixels, {{object_detection.proposal_selection.anchor_total:,}} anchors per image, {{object_detection.proposal_selection.level_anchor_counts[0]:,}} of them on level {{object_detection.proposal_selection.level_names[0]}}."
      - "The joint selection ranks all of them together, keeps the best {{object_detection.proposal_selection.inference_pre_nms}}, removes the overlaps in one suppression across the levels, and keeps the best {{object_detection.proposal_selection.inference_post_nms}} in evaluation."
      - "The per-level selection keeps the best {{object_detection.proposal_selection.inference_pre_nms}} of every level and suppresses every level on its own, so {{object_detection.proposal_selection.per_level_candidate_count:,}} candidates reach a suppression instead of {{object_detection.proposal_selection.joint_candidate_count}}."
      - "The survivors of all the levels are then ranked together by score and the best {{object_detection.proposal_selection.inference_post_nms}} kept: no level gets a quota, it only stops being crowded out."

