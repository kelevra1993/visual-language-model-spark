      - "With its hard objects option, the object detection task of the script draws the images of the detection benchmark instead: small, faint, covered or cut shapes next to very large ones."
      - "The training takes the synthetic detection configuration, which stops at two thousand iterations; the run shown here was resumed to five thousand."
      - "The evaluation script evaluates any checkpoint again, set in its main block like every script but the training."

