      - {type: text, position: [40, 290], text: "joint: {{object_detection.proposal_selection.joint_copied_slots:.1f}} slots hold copies", font: diagram_small, colour: dim}
      - {type: box, box: [40, 370, 780, 560], text: "proposals per image, levels {{object_detection.proposal_selection.level_names[0]}} / {{object_detection.proposal_selection.level_names[1]}} / {{object_detection.proposal_selection.level_names[2]}} / {{object_detection.proposal_selection.level_names[3]}}\njoint: {{object_detection.proposal_selection.joint_proposals_per_level_labels[0]}} / {{object_detection.proposal_selection.joint_proposals_per_level_labels[1]}} / {{object_detection.proposal_selection.joint_proposals_per_level_labels[2]}} / {{object_detection.proposal_selection.joint_proposals_per_level_labels[3]}}\nper level: {{object_detection.proposal_selection.per_level_proposals_per_level_labels[0]}} / {{object_detection.proposal_selection.per_level_proposals_per_level_labels[1]}} / {{object_detection.proposal_selection.per_level_proposals_per_level_labels[2]}} / {{object_detection.proposal_selection.per_level_proposals_per_level_labels[3]}}", font: diagram_small, outline: violet, appear: 1, highlight: [1]}
      # Share of the test objects covered by a proposal of every level
      - {type: text, position: [880, 15], text: "objects covered at IoU 0.5 by a proposal of the level", font: diagram_bold, appear: 2}
