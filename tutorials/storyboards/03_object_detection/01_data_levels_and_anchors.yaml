  - kind: code
    title: "One selection for training and export"
    code_reference: "vision_training/models/detection/region_proposer.py · select_best_proposals"
    source:
      file: vision_training/models/detection/region_proposer.py
      function: select_best_proposals
      start: "# Keep the best pre-NMS"
      end: "suppress_per_image=suppress_per_image"
    highlights:
      - {match: "top_scores, top_indices = ", sentences: [0, 1]}
      - {match: "precision of the boxes|confident anchors", sentences: [1]}
      - {match: "kept_mask = suppress_overlapping_proposals", sentences: [2]}
      - {match: "suppress_per_image=suppress_per_image", sentences: [2]}
      - {match: "nonempty_mask = find_nonempty_proposals", sentences: [3]}
    narration:
      - "select_best_proposals does this for the whole batch, and both the training filter and the exported detector call it, so they keep the same proposals."
      - "The scores are ranked in the float32 of the boxes, since the bfloat16 logits of the mixed precision would give the confident anchors only a few distinct probabilities."
      - "Only the suppression differs: one torchvision call per image in training and evaluation, and in the exported detector one call over the whole batch, which the ONNX file writes as one suppression node with a batch per image."
      - "The joint selection runs these steps once over all the anchors; the per-level one runs them for every level and leaves out the proposals clamped to an empty box, as torchvision does."

