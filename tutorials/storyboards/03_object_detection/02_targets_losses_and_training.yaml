# Object detection, chapter 2: the training of the detector, the labels of the anchors and their sampling for the
# region proposal losses, the proposals of the detection heads with the ground truth boxes written into them, the
# detection head and its losses, the loss weights, and the losses of the real run in TensorBoard and in the console.
# The counts of the test image come from the trained detector run on the CPU by tutorials/figures/object_detection
# (detector_inference.py), with the target functions of the repository. The thresholds, samplings and learning rate
# written next to them are those of the run ({{object_detection.run.*}}, read from its saved configuration), the
# mechanism and the yaml scenes quoting the shipped configuration ({{config:...}}), so that both stay true when the
# shipped values move on.
series: object_detection
series_title: "Object Detection (DET)"
chapter: 2
title: "Targets, losses and training"
output_name: object_detection_02_targets_losses_and_training
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [object_detection]
references:
  - "vision_training/models/detection/target_assignment.py · batch_assign_targets_to_anchors"
  - "vision_training/models/detection/target_assignment.py · add_ground_truth_proposals"
  - "vision_training/models/detection/target_assignment.py · sample_positive_and_negative_training_targets"
  - "vision_training/models/detection/detection_head.py · DetectionHead.forward"
  - "vision_training/losses/detection_losses.py · compute_detection_losses"
  - "vision_training/trainers/base_trainer.py · BaseTrainer.run_model_iteration"
scenes:
  - kind: title_card
    heading: "Targets, losses and training"
    subheading: "Two samplings, four losses"
    footnote: "Object Detection · chapter 2"
    # The two samplings and four losses of the method, and the number of the chapter
    literal_numbers: [two, four, "2"]
    narration:
      - "The detector learns from two sets of targets: labels for the anchors of the region proposal network, and classes and boxes for the proposals of the detection heads."
      - "This chapter builds both on the test image of the previous chapter, then follows the four losses through the real run."

  - kind: html
    page: diagram
    title: "Labels of the anchors"
    code_reference: "vision_training/models/detection/target_assignment.py · batch_assign_targets_to_anchors"
    # The ends of the IoU axis, and the overlap above zero of the fallback (> 0.0 in batch_assign_targets_to_anchors)
    literal_numbers: ["0", "1", zero]
    elements:
      - {type: text, position: [100, 40], text: "best IoU of an anchor with an object", font: diagram_bold}
      - {type: box, box: [100, 100, 568, 190], text: "background · below {{object_detection.run.anchor_background_maximum}}", font: diagram_small, outline: dim, highlight: [0]}
      - {type: box, box: [576, 100, 880, 190], text: "ignored · {{object_detection.run.anchor_background_maximum}} to {{object_detection.run.anchor_foreground_minimum}}", font: diagram_small, outline: yellow, highlight: [0]}
      - {type: box, box: [888, 100, 1660, 190], text: "foreground · from {{object_detection.run.anchor_foreground_minimum}}", font: diagram_small, outline: blue, highlight: [0]}
      - {type: text, position: [100, 205], text: "0", font: diagram_monospace_small, colour: dim, anchor: ma}
      - {type: text, position: [572, 205], text: "{{object_detection.run.anchor_background_maximum}}", font: diagram_monospace_small, colour: dim, anchor: ma}
      - {type: text, position: [884, 205], text: "{{object_detection.run.anchor_foreground_minimum}}", font: diagram_monospace_small, colour: dim, anchor: ma}
      - {type: text, position: [1660, 205], text: "1", font: diagram_monospace_small, colour: dim, anchor: ma}
      - {type: box, box: [100, 260, 1660, 370], text: "fallback: the best anchor of every object is foreground at any overlap above 0,\nassigned to the object it overlaps most: a small box can get none", font: diagram_small, outline: magenta, appear: 1, highlight: [1]}
      - {type: text, position: [100, 420], text: "test image {{object_detection.inference.image_name}}: {{object_detection.inference.anchor_total:,}} anchors", font: diagram_bold, appear: 2}
      - {type: bars, box: [100, 470, 820, 650], orientation: horizontal, values: ["{{object_detection.inference.anchor_labels.foreground}}", "{{object_detection.inference.anchor_labels.ignored}}", "{{object_detection.inference.anchor_labels.background}}"], labels: ["foreground", "ignored", "background"], value_labels: ["{{object_detection.inference.anchor_labels.foreground}}", "{{object_detection.inference.anchor_labels.ignored}}", "{{object_detection.inference.anchor_labels.background:,}}"], colours: [blue, yellow, border], label_width: 160, appear: 2, highlight: [2]}
      - {type: text, position: [940, 420], text: "sampled: {{object_detection.run.anchor_training_samples}} per image, at most {{object_detection.run.anchor_training_positives}} positive", font: diagram_bold, appear: 3}
      - {type: bars, box: [940, 470, 1660, 590], orientation: horizontal, values: ["{{object_detection.inference.anchor_labels.sampled_positives}}", "{{object_detection.inference.anchor_labels.sampled_negatives}}"], labels: ["positives", "negatives"], value_labels: ["{{object_detection.inference.anchor_labels.sampled_positives}}", "{{object_detection.inference.anchor_labels.sampled_negatives}}"], colours: [blue, border], label_width: 160, appear: 3, highlight: [3]}
    narration:
      - "For the region proposal losses, every anchor is labeled by its best overlap with an object, in the run shown here: background below {{object_detection.run.anchor_background_maximum}}, foreground from {{object_detection.run.anchor_foreground_minimum}}, and ignored in between."
      - "Take a small box sharing its best anchor with a larger one: the best anchor of every object is made foreground at any overlap above zero, but assigned to the object it overlaps most, so the small box gets none, as in torchvision."
      - "On the test image, {{object_detection.inference.anchor_labels.foreground}} anchors are foreground, {{object_detection.inference.anchor_labels.overlap_foreground}} by overlap and {{object_detection.inference.anchor_labels.fallback_foreground}} by the fallback, {{object_detection.inference.anchor_labels.ignored}} are ignored and {{object_detection.inference.anchor_labels.background:,}} are background."
      - "The losses sample {{object_detection.run.anchor_training_samples}} anchors per image with at most {{object_detection.run.anchor_training_positives}} positives: here all {{object_detection.inference.anchor_labels.sampled_positives}} positives and {{object_detection.inference.anchor_labels.sampled_negatives}} random negatives."

  - kind: image
    title: "The labels on the image"
    code_reference: "vision_training/models/detection/target_assignment.py · sample_positive_and_negative_training_targets"
    image: "figures:object_detection/inference/anchor_labels.png"
    highlights:
      - {box: "{{object_detection.inference.anchor_labels.panel_1_box}}", sentences: [0]}
      - {box: "{{object_detection.inference.anchor_labels.panel_2_box}}", sentences: [1]}
      - {box: "{{object_detection.inference.anchor_labels.panel_3_box}}", sentences: [2]}
    narration:
      - "Drawn on the image, the foreground anchors hug the objects, several per object at the levels whose scales fit."
      - "The ignored anchors overlap the objects partly; they give no loss, so the head is never pushed either way on ambiguous boxes."
      - "To keep the thousands of empty anchors from swamping the objectness loss, the negatives are drawn at random among the background anchors."

  - kind: yaml
    title: "The RegionProposal section"
    code_reference: "vision_training/losses/detection_losses.py · compute_region_proposal_losses"
    # The background minimum above zero that leaves the anchors overlapping no object ignored
    literal_numbers: [zero]
    source:
      file: vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml
      keys: [RegionProposal.foreground_iou_threshold, RegionProposal.background_iou_threshold, RegionProposal.number_training_positives, RegionProposal.total_training_samples]
      comments: false
    highlights:
      - {match: "foreground_iou_threshold:|background_iou_threshold:", sentences: [0, 1]}
      - {match: "number_training_positives|total_training_samples", sentences: [2]}
    narration:
      - "The thresholds live in the Region Proposal section: foreground from {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.foreground_iou_threshold.min}}, its maximum being unused, and background from {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.background_iou_threshold.min:.3g}} to {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.background_iou_threshold.max}}."
      - "With a background minimum above zero, the anchors overlapping no object are ignored and every negative touches an object, which the detection benchmark found best after the run shown here."
      - "Then the sampling counts; the box loss is not a setting, the code always taking the smooth L1 with a beta of one over {{object_detection.losses.box_loss_beta_denominator:words}}."

  - kind: html
    page: diagram
    title: "The region proposal losses"
    code_reference: "vision_training/losses/detection_losses.py · compute_region_proposal_losses"
    # The weights of torchvision, the gap measured once on the synthetic shapes (the comment of BOX_REGRESSION_WEIGHTS
    # in box_operations.py, no run of tutorial_sources.yaml) and the metric name mAP at 0.5
    literal_numbers: [ten, five, two, "0.5"]
    elements:
      - type: listing
        box: [20, 15, 1740, 560]
        font: diagram_monospace_small
        source: {file: vision_training/losses/detection_losses.py, function: compute_region_proposal_losses, start: "region_proposal_classification_loss = ", end: "torch.sum\\(input=sampled_positive_mask"}
        highlights:
          - {match: "region_proposal_classification_loss = |binary_cross_entropy_with_logits", sentences: [0]}
          - {match: "region_proposal_localisation_loss = |box_loss=REGION_PROPOSAL_BOX_LOSS|torch.sum\\(input=sampled_positive_mask", sentences: [1]}
      - type: listing
        box: [20, 580, 1740, 725]
        font: diagram_monospace_tiny
        appear: 2
        source: {file: vision_training/models/detection/box_operations.py, start: "# Weights of the regression offsets", end: "^BOX_REGRESSION_WEIGHTS ="}
        highlights:
          - {match: "^BOX_REGRESSION_WEIGHTS =", sentences: [2]}
    narration:
      - "The objectness loss is the binary cross entropy of the sampled anchors, averaged over them."
      - "The box loss, always the smooth L1 between the predicted and target offsets of the positive anchors, is summed, then divided by the number of positives, where torchvision divides by the sampled anchors."
      - "The offsets are regressed unscaled: the box regression weights stay at {{constant:vision_training/models/detection/box_operations.py#BOX_REGRESSION_WEIGHTS[0]:words}}, the ten, ten, five, five of torchvision having given about two and a half times lower mAP at 0.5 on these shapes."

  - kind: html
    page: diagram
    title: "Proposals for the detection heads"
    code_reference: "vision_training/models/detection/two_stage_detector.py · TwoStageDetector._prepare_detector_inputs"
    # The block numbers of the levels, and the zero offsets of a proposal equal to its box
    literal_numbers: ["5", "6", "7", zero]
    elements:
      - {type: box, box: [20, 80, 390, 230], text: "training filter\ntop {{object_detection.inference.training_filter.top_count}} · NMS {{object_detection.run.proposal_nms_threshold}}\n{{object_detection.inference.training_filter.valid_count}} proposals per image", font: diagram_small, outline: yellow, highlight: [0]}
      - {type: arrow, points: [[390, 155], [445, 155]], appear: 1}
      - {type: box, box: [450, 80, 870, 230], text: "ground truth boxes written\ninto the last slots, at the level\nof their best anchor", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: arrow, points: [[870, 155], [925, 155]], appear: 2}
      - {type: box, box: [930, 80, 1320, 230], text: "class of the object\noverlapping by {{object_detection.run.detector_foreground_minimum}} or more,\nelse background", font: diagram_small, outline: magenta, appear: 2, highlight: [2]}
      - {type: arrow, points: [[1320, 155], [1375, 155]], appear: 2}
      - {type: box, box: [1380, 80, 1740, 230], text: "{{object_detection.run.detector_training_samples}} sampled\nat most {{object_detection.run.detector_training_positives}} positive", font: diagram_small, outline: violet, appear: 2, highlight: [2]}
      - {type: text, position: [20, 300], text: "test image: {{object_detection.inference.detector_targets.proposal_count}} proposals, {{object_detection.inference.detector_targets.written_ground_truths}} of them ground truth", font: diagram_bold, appear: 3}
      - {type: bars, box: [20, 350, 820, 470], orientation: horizontal, values: ["{{object_detection.inference.detector_targets.sampled_positives}}", "{{object_detection.inference.detector_targets.sampled_negatives}}"], labels: ["positives", "negatives"], value_labels: ["{{object_detection.inference.detector_targets.sampled_positives}}", "{{object_detection.inference.detector_targets.sampled_negatives}}"], colours: [blue, border], label_width: 160, appear: 3}
      - {type: text, position: [940, 300], text: "the {{object_detection.run.detector_training_samples}} sampled proposals by level", font: diagram_bold, appear: 3}
      - {type: bars, box: [940, 350, 1740, 530], orientation: horizontal, values: ["{{object_detection.inference.detector_targets.sampled_level_5}}", "{{object_detection.inference.detector_targets.sampled_level_6}}", "{{object_detection.inference.detector_targets.sampled_level_7}}"], labels: ["block 5", "block 6", "block 7"], value_labels: ["{{object_detection.inference.detector_targets.sampled_level_5}}", "{{object_detection.inference.detector_targets.sampled_level_6}}", "{{object_detection.inference.detector_targets.sampled_level_7}}"], colours: [blue, aqua, magenta], label_width: 160, appear: 3}
      - {type: text, position: [20, 590], text: "every head trains on the proposals of its own level only", font: diagram_small, colour: dim, appear: 3}
    narration:
      - "The detection heads train on the proposals of the training filter, {{object_detection.inference.training_filter.valid_count}} per image after the suppression at {{object_detection.run.proposal_nms_threshold}}."
      - "Think of proposals that miss an object: the ground truth boxes are first written into the last slots, each at the level of its best anchor, so that every object still has a positive proposal with a zero regression target."
      - "A proposal takes the class of the object it overlaps by {{object_detection.run.detector_foreground_minimum}} or more, the background otherwise, and {{object_detection.run.detector_training_samples}} are sampled with at most {{object_detection.run.detector_training_positives}} positives."
      - "On the test image, {{object_detection.inference.detector_targets.positives}} of the {{object_detection.inference.detector_targets.proposal_count}} proposals are positive and all are kept, with {{object_detection.inference.detector_targets.sampled_negatives}} negatives: block 5 receives {{object_detection.inference.detector_targets.sampled_level_5}} of the {{object_detection.run.detector_training_samples}}, block 6 {{object_detection.inference.detector_targets.sampled_level_6}} and block 7 {{object_detection.inference.detector_targets.sampled_level_7}}."

  - kind: html
    page: diagram
    title: "The detection head"
    code_reference: "vision_training/models/detection/detection_head.py · DetectionHead.forward"
    # The block numbers of the levels, the five columns of a proposal of ROI Align (image index and corners) and the
    # four offsets of a box
    literal_numbers: ["5", "6", "7", four, "4"]
    elements:
      - {type: cuboid, box: [40, 120, 140, 220], depth: 26, fill: blue, label: "[{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Backbone.convolutions.5[1]}}, {{object_detection.inference.level_5.cells}}, {{object_detection.inference.level_5.cells}}]"}
      - {type: text, position: [40, 60], text: "block 5", font: diagram_bold}
      - {type: box, box: [40, 330, 260, 430], text: "proposals\n[K, 5]", font: diagram_small, outline: yellow}
      - {type: arrow, points: [[190, 175], [300, 255]]}
      - {type: arrow, points: [[260, 380], [300, 300]]}
      - {type: box, box: [305, 210, 585, 350], text: "ROI Align {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.roi_align_pool_size}} × {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.roi_align_pool_size}}\nscale {{object_detection.inference.model.level_5.spatial_scale}}\naligned", font: diagram_small, outline: aqua, highlight: [0]}
      - {type: arrow, points: [[585, 280], [640, 280]]}
      - {type: cuboid, box: [645, 245, 715, 315], depth: 26, fill: aqua, label: "[K, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Backbone.convolutions.5[1]}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.roi_align_pool_size}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.roi_align_pool_size}}]"}
      - {type: arrow, points: [[745, 280], [800, 280]], appear: 1}
      - {type: box, box: [805, 210, 1105, 350], text: "ConvolutionBlock [{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.convolutions[0]}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.convolutions[1]}}]\nSE · residual · BN", font: diagram_small, outline: magenta, appear: 1, highlight: [1]}
      - {type: arrow, points: [[1105, 280], [1160, 280]], appear: 1}
      - {type: box, box: [1165, 210, 1445, 350], text: "flatten {{object_detection.inference.model.flattened_dimension}}\nFC {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.fully_connected[0]}} · FC {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.fully_connected[1]}}", font: diagram_small, outline: magenta, appear: 1, highlight: [1]}
      - {type: arrow, points: [[1445, 250], [1500, 150]], appear: 2}
      - {type: arrow, points: [[1445, 310], [1500, 410]], appear: 2}
      - {type: box, box: [1505, 90, 1740, 200], text: "classifier\n{{object_detection.inference.model.number_classes}} logits", font: diagram_small, outline: violet, appear: 2, highlight: [2]}
      - {type: box, box: [1505, 360, 1740, 470], text: "box regressor\n4 per class", font: diagram_small, outline: violet, appear: 2, highlight: [2]}
      - {type: text, position: [1505, 220], text: "[{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.total_training_samples}}, {{object_detection.inference.model.number_classes}}]", font: diagram_monospace_small, appear: 2}
      - {type: text, position: [1505, 490], text: "[{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.total_training_samples}}, {{object_detection.inference.model.number_classes}}, 4]", font: diagram_monospace_small, appear: 2}
      - {type: text, position: [40, 560], text: "{{object_detection.inference.model.detection_level_parameters:,}} parameters per level · {{object_detection.inference.model.detection_parameters:,}} for the {{object_detection.inference.level_count:words}}\nbackbone: {{object_detection.inference.model.backbone_parameters:,}} parameters", font: diagram_text, appear: 3}
    narration:
      - "Each proposal is pooled from the feature map of its level by ROI Align, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.roi_align_pool_size:words}} by {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.roi_align_pool_size:words}}, at a spatial scale of {{object_detection.inference.model.level_5.feature_map_size}} over {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}} for block 5 and {{object_detection.inference.model.level_6.feature_map_size}} over {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}} for blocks 6 and 7, aligned, with adaptive sampling."
      - "A convolution block of {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.convolutions[0]:words}} layers of {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.convolutions[1]}} channels, with squeeze and excitation and residual shortcuts, refines it, then fully connected layers take its {{object_detection.inference.model.flattened_dimension:,}} values to {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.fully_connected[0]}}, then {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.fully_connected[1]}} units."
      - "A linear layer gives the logits of the {{object_detection.inference.model.number_classes}} classes, another four offsets per class: in training, logits of {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}} by {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.total_training_samples}} by {{object_detection.inference.model.number_classes}}, and offsets of {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.batch_size}} by {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.total_training_samples}} by {{object_detection.inference.model.number_classes}} by 4."
      - "Each head has {{object_detection.inference.model.detection_level_parameters:,}} parameters, {{object_detection.inference.model.detection_parameters:,}} for the {{object_detection.inference.level_count:words}} levels, against {{object_detection.inference.model.backbone_parameters:,}} for the backbone."

  - kind: code
    title: "The detection losses"
    code_reference: "vision_training/losses/detection_losses.py · compute_detection_losses"
    # The four offsets of a box
    literal_numbers: [four]
    source:
      file: vision_training/losses/detection_losses.py
      function: compute_detection_losses
      start: "detection_classification_loss = "
      end: "max\\(1, sampled_positive_indices"
    highlights:
      - {match: "detection_classification_loss = ", sentences: [0]}
      - {match: "positive_offsets = ", sentences: [1]}
      - {match: "detection_localisation_loss = |box_loss=box_loss", sentences: [1]}
    narration:
      - "The classification loss is the cross entropy of the sampled proposals over the {{object_detection.inference.model.number_classes}} classes, the background ones teaching the head to reject false positives."
      - "The box loss takes, for every positive proposal, the four offsets of its true class only; with the smooth L1 the Detector box loss selects, beta one over {{object_detection.losses.box_loss_beta_denominator:words}}, it is summed and divided by the positives."

  - kind: yaml
    title: "Weights of the four losses"
    font_size: 34
    code_reference: "vision_training/trainers/detection_trainer.py · DetectionTrainer.get_loss_weights"
    # The four losses of the two-stage detector
    literal_numbers: [four]
    source:
      file: vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml
      keys: [Optimization.loss_weights]
      comments: false
    highlights:
      - {match: "loss_weights:", sentences: [0]}
      - {key: Optimization.loss_weights.region_proposal_classification_loss, sentences: [1]}
      - {key: Optimization.loss_weights.region_proposal_localisation_loss, sentences: [1]}
      - {key: Optimization.loss_weights.detection_classification_loss, sentences: [1]}
      - {key: Optimization.loss_weights.detection_regression_loss, sentences: [1]}
    narration:
      - "The total loss is the sum of the four losses, each multiplied by its weight in Optimization loss weights."
      - "The excerpt gives each weight; TensorBoard and the console track every loss unweighted, and only the total weighted."

  - kind: image
    title: "The losses of the run"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.run_model_iteration"
    # The learning rates of the run and of the configuration, read in full, their significant digit lying beyond the
    # second decimal
    exact_facts: ["config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.learning_rate", object_detection.run.learning_rate]
    image: "figures:object_detection/training/loss_curves.png"
    highlights:
      - {box: "{{object_detection.losses.panel_1_box}}", sentences: [0]}
      - {box: "{{object_detection.losses.panel_2_box}}", sentences: [1]}
      - {box: "{{object_detection.losses.panel_3_box}}", sentences: [2]}
    narration:
      - "Over the {{object_detection.losses.iterations:,}} iterations of the run, the region proposal losses fall fast: the objectness loss from {{object_detection.losses.rpn_classification.first:.2f}} to {{object_detection.losses.rpn_classification.last:.2f}}, the box loss from {{object_detection.losses.rpn_regression.first:.2f}} to {{object_detection.losses.rpn_regression.last:.2f}}."
      - "The detection classification loss starts at {{object_detection.losses.detection_classification.first:.2f}}, close to the logarithm of {{object_detection.inference.model.number_classes}}, then flattens while the proposals improve, and slowly reaches {{object_detection.losses.detection_classification.last:.2f}}."
      - "Their weighted sum goes from {{object_detection.losses.total.first:.2f}} to {{object_detection.losses.total.last:.2f}} at a constant learning rate of {{object_detection.run.learning_rate}}, the moving average of the weights being kept alongside; the shipped configuration now sets {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.learning_rate}}, the best of the detection benchmark."

  - kind: html
    page: diagram
    title: "The console summary"
    code_reference: "vision_training/trainers/metric_tracking.py · MetricTracker.print_interval_summary"
    elements:
      - type: listing
        box: [20, 20, 1740, 340]
        font: diagram_monospace_small
        source: {file: "figures:object_detection/listings/console_1000.txt"}
        highlights:
          - {match: "Iteration: 1000|Total Loss", sentences: [0]}
          - {match: "Took", sentences: [0]}
      - type: listing
        box: [20, 390, 1740, 710]
        font: diagram_monospace_small
        appear: 1
        source: {file: "figures:object_detection/listings/console_2000.txt"}
        highlights:
          - {match: "Best", sentences: [1]}
    narration:
      - "Every {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.information_dump:words}} iterations the console prints the moving averages of the interval: at iteration {{object_detection.console.iterations[0]:words}}, a total loss of {{object_detection.console.1000.total_loss:.2f}} at {{object_detection.console.1000.throughput}} images per second, after {{object_detection.console.1000.minutes}} minutes."
      - "At {{object_detection.console.iterations[1]:words}}, the end of the first launch of the run, the total is {{object_detection.console.2000.total_loss:.2f}}, every loss marked Best."

  - kind: summary
    title: "Recap"
    # The two samplings and four losses of the method, and the four offsets of a box
    literal_numbers: [two, four, "4"]
    items:
      - {text: "Anchors: foreground from {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.foreground_iou_threshold.min}}, background {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.background_iou_threshold.min:.3g}} to {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.background_iou_threshold.max}}, the best anchor of every object kept"}
      - {text: "{{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.total_training_samples}} anchors per image, at most {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.number_training_positives}} positive"}
      - {text: "Ground truth boxes written into the proposals; {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.total_training_samples}} per image, at most {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.number_training_positives}} positive"}
      - {text: "RoI head: ROI Align {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.roi_align_pool_size}} × {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.roi_align_pool_size}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.convolutions[0]}} convolutions, FC {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.fully_connected[0]}} and {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#DetectionLevels.5.detector.fully_connected[1]}}, {{object_detection.inference.model.number_classes}} classes, 4 offsets per class"}
      - {text: "Smooth L1, beta {{object_detection.losses.box_loss_beta_fraction}}, unscaled offsets, divided by the positives"}
      - {text: "Optimization.loss_weights: one weight per loss, losses tracked unweighted", monospace: false}
    narration:
      - "To recap: two samplings feed four losses, the ground truth boxes guarantee positives to the detection heads, and the losses of the run fall steadily over {{object_detection.losses.iterations:words}} iterations."
      - "The next chapter evaluates the checkpoints: the post-processing, the mean average precision and its tables, the proposal recall, and the export."
