# Object detection, chapter 3: the evaluation of a checkpoint (post-processing, sample images along the run, the
# report tables of the mean average precision, the proposal recall, the moving average of the weights, the classes
# and their thresholds, the confusion matrix), the export served by Triton with its input settings, and the
# pitfalls of the task. Every number comes from the DET run of tutorial_sources.yaml (the shipped configuration with a
# level 4 and a 384 pixel scale, stopped after its evaluation of 5000), read by tutorials/figures/object_detection, but
# the joint selection of the pitfalls, measured on the detection benchmark of chapter 1.
series: object_detection
series_title: "Object Detection (DET)"
chapter: 3
title: "Evaluation and export"
output_name: object_detection_03_evaluation_and_export
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [object_detection]
references:
  - "vision_training/models/detection/postprocessing.py · postprocess_detections"
  - "vision_training/evaluation/detection/mean_average_precision.py · evaluate_detections"
  - "vision_training/evaluation/detection/region_recall.py · summarise_proposal_recall"
  - "vision_training/models/detection/inference_detector.py · InferenceDetector"
  - "vision_training/deployment/export_specifications.py · get_export_specification"
  - "vision_training/deployment/input_contract.py · build_input_contract"
  - "documentation/suggestions.md"
scenes:
  - kind: title_card
    heading: "Evaluation and export"
    subheading: "From detections to mAP, and to Triton"
    footnote: "Object Detection · chapter 3"
    # The number of the chapter
    literal_numbers: ["3"]
    narration:
      - "Every evaluated checkpoint of a detection run is scored on the whole test folder of the run, here {{object_detection.data.test_images:,}} images, with the trained weights and, when the moving average is on, with the averaged ones too."
      - "This chapter reads that evaluation on the real run, then exports the detector and lists the pitfalls of the task."

  - kind: code
    title: "Post-processing"
    code_reference: "vision_training/models/detection/postprocessing.py · postprocess_detections"
    source:
      file: vision_training/models/detection/postprocessing.py
      function: postprocess_detections
      start: "probabilities = torch.softmax"
      end: "\\bcandidate_mask = "
    highlights:
      - {match: "torch.softmax|labels = torch.arange", sentences: [0]}
      - {match: "\\bcandidate_mask = ", sentences: [1, 2, 3, 4]}
    narration:
      - "In evaluation the detector runs without ground truth: the filter keeps {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.inference.post_nms_proposals}} proposals, every head scores those of its level, and the post-processing takes the softmax without the background, so that every foreground class of every proposal is a candidate."
      - "The candidates reaching the score threshold go through one batched NMS at {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.nms_iou_threshold}} per image and class, and the {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections:words}} best remain, padded with zeros."
      - "The Detector NMS criterion can run it on the distance IoU, the IoU minus a term of the distance between the centers, which spares overlapping boxes whose centers lie apart."
      - "The run shown here uses it, as the shipped configuration does, its distance term raised to the power {{object_detection.run.nms_distance_exponent}}."
      - "The evaluation runs at its own score threshold, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.score_threshold}} against {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.score_threshold}} at deployment, so that the precision recall curves keep their low end, and restores the deployment one afterwards."

  - kind: image
    title: "One test image through the run"
    code_reference: "vision_training/trainers/detection_trainer.py · DetectionTrainer.draw_test_image"
    # The metric name mAP at 0.5
    literal_numbers: ["0.5"]
    image: "figures:object_detection/evaluation/sample_iterations.png"
    views:
      - {box: "{{object_detection.samples.figure_box}}", from_sentence: 0}
      - {box: [540, 0, 1620, 648], from_sentence: 1}
      - {box: [1080, 0, 2132, 648], from_sentence: 2}
    highlights:
      - {box: "{{object_detection.samples.panel_2_box}}", sentences: [0]}
      - {box: "{{object_detection.samples.panel_3_box}}", sentences: [1]}
      - {box: "{{object_detection.samples.panel_4_box}}", sentences: [2]}
    narration:
      - "The sample images show the same {{object_detection.run.number_sample_images:words}} test images at every evaluation: at iteration {{object_detection.samples.iterations[0]:words}}, the first one, the mAP at 0.5 is {{object_detection.samples.metrics[0]:percent}}, and not one detection of the whole test split reaches {{object_detection.run.score_threshold}}."
      - "Imagine you stop at {{object_detection.samples.iterations[1]:words}}: only the {{object_detection.inference.samples.found_texts[1]}} are found here, with {{object_detection.samples.right_detections[1]:,}} right detections over the {{object_detection.data.test_objects:,}} test objects, at a mAP of {{object_detection.samples.metrics[1]:percent}}."
      - "At {{object_detection.samples.iterations[2]:words}}, where the run was stopped, it finds {{object_detection.inference.found_object_count:words}} of the {{object_detection.inference.object_count:words}} shapes of this image, at a mAP of {{object_detection.samples.metrics[2]:percent}}: the {{object_detection.inference.missed_text}} is still missed, and the {{object_detection.inference.wrong_class_text}} is taken for a {{object_detection.inference.wrong_class_detected_text}}."

  - kind: html
    page: diagram
    title: "The report of a checkpoint"
    code_reference: "vision_training/evaluation/detection/average_precision_report.py · summarise_average_precisions"
    # The overlaps of the columns of the report (mAP@0.5, @0.75, @0.95) and the names of the eleven and hundred and
    # one point methods
    literal_numbers: ["0.5", "0.75", "0.95", "101", eleven, hundred]
    elements:
      - {type: text, position: [30, 20], text: "Results.txt · {{object_detection.report.trained.header}}", font: diagram_bold}
      - type: listing
        box: [30, 70, 900, 270]
        font: diagram_monospace_small
        source: {file: "figures:object_detection/listings/results_methods.txt"}
        highlights:
          - {match: "^ Area", sentences: [1, 2]}
          - {match: "Method", sentences: [0]}
      - type: listing
        box: [30, 300, 1100, 470]
        font: diagram_monospace_small
        appear: 3
        source: {file: "figures:object_detection/listings/results_sizes.txt", start: "Mean Average", end: "Large"}
        highlights:
          - {match: "Small", sentences: [3]}
      - type: listing
        box: [30, 500, 1100, 700]
        font: diagram_monospace_small
        appear: 4
        source: {file: "figures:object_detection/listings/results_recall.txt", start: "Mean Average", end: "Large"}
        highlights:
          - {match: "^ All|Small", sentences: [4]}
      - {type: box, box: [1180, 70, 1740, 270], text: "PASCAL VOC matching at every IoU:\nmAP@[0.5:0.95] and 101 points\nare not those of pycocotools", font: diagram_small, outline: red, appear: 2, highlight: [2]}
    narration:
      - "Every evaluated checkpoint appends its report to the results file; the mAP is computed with {{object_detection.report.trained.method_count:words}} methods, the area under the interpolated curve, eleven points and a hundred and one points."
      - "At iteration {{object_detection.run.checkpoint_iteration:words}} the area method gives {{object_detection.report.trained.methods.area.0:percent}} at an overlap of 0.5, {{object_detection.report.trained.methods.area.1:percent}} at 0.75, and {{object_detection.report.trained.methods.area.2:percent}} at 0.95: the boxes are rarely that tight."
      - "The matching follows the PASCAL VOC rule at every threshold, so the average from 0.5 to 0.95, {{object_detection.report.trained.methods.area.3:percent}}, is not the number of the official COCO tools, which match a detection to the best ground truth still free."
      - "By size, the {{object_detection.report.trained.sizes.small.0}} small test objects score {{object_detection.report.trained.sizes.small.1:percent}}, against {{object_detection.report.trained.sizes.medium.1:percent}} for the medium and {{object_detection.report.trained.sizes.large.1:percent}} for the large ones."
      - "The mean average recall counts the objects found at all: {{object_detection.report.trained.recall.all.1:percent}} at 0.5, but {{object_detection.report.trained.recall.small.1:percent}} for the small ones; if, for instance, you see a low mAP with a high recall, good boxes are ranked below false positives."

  - kind: html
    page: diagram
    title: "Proposal recall"
    code_reference: "vision_training/evaluation/detection/region_recall.py · accumulate_proposal_recall"
    elements:
      - {type: text, position: [40, 30], text: "proposal_recall.csv · objects overlapped by a proposal by {{constant:vision_training/evaluation/detection/region_recall.py#PROPOSAL_RECALL_THRESHOLDS[0]}}", font: diagram_bold}
      - {type: bars, box: [40, 110, 820, 400], orientation: horizontal, values: "{{object_detection.proposal_recall.recall_per_size}}", labels: ["small", "medium", "large", "all"], value_labels: "{{object_detection.proposal_recall.recall_per_size_labels}}", colours: [red, blue, blue, aqua], maximum: 1.0, label_width: 140, highlight: [0]}
      - {type: text, position: [940, 30], text: "proposals of one block alone", font: diagram_bold, appear: 1}
      - {type: bars, box: [940, 110, 1720, 400], orientation: horizontal, values: "{{object_detection.proposal_recall.recall_per_block}}", labels: "{{object_detection.proposal_recall.block_labels}}", value_labels: "{{object_detection.proposal_recall.recall_per_block_labels}}", colours: [violet, blue, aqua, magenta], maximum: 1.0, label_width: 140, appear: 1, highlight: [1]}
      - {type: text, position: [40, 470], text: "{{object_detection.inference.evaluation_filter.valid_count}} valid proposals per image at the inference settings of the filter,\nthe padding copies left out with the valid mask", font: diagram_small, colour: dim}
    narration:
      - "The proposal recall measures what the region proposal network hands the heads: {{object_detection.proposal_recall.all.recall_50:percent}} of the test objects have a proposal overlapping them by {{constant:vision_training/evaluation/detection/region_recall.py#PROPOSAL_RECALL_THRESHOLDS[0]}}, but only {{object_detection.proposal_recall.small.recall_50:percent}} of the small ones."
      - "Each block alone reaches {{object_detection.proposal_recall.block_4.recall_50:percent}}, {{object_detection.proposal_recall.block_5.recall_50:percent}}, {{object_detection.proposal_recall.block_6.recall_50:percent}} and {{object_detection.proposal_recall.block_7.recall_50:percent}} of the objects: the levels overlap in what they cover."

  - kind: image
    title: "Trained and averaged weights"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.run_test_evaluation"
    # The overlaps of the metric names mAP at 0.5 and from 0.5 to 0.95
    literal_numbers: ["0.5", "0.95"]
    image: "figures:object_detection/evaluation/map_iterations.png"
    highlights:
      - {box: "{{object_detection.metrics.panel_1_box}}", sentences: [0]}
      - {box: "{{object_detection.metrics.panel_2_box}}", sentences: [1]}
    narration:
      - "The run keeps a moving average of its weights, evaluated after the trained weights into its own folders and Test EMA curves; at 0.5 and iteration {{object_detection.run.checkpoint_iteration:words}}, the averaged weights reach {{object_detection.metrics.map_50.test_ema_last:percent}} against {{object_detection.metrics.map_50.test_last:percent}} for the trained ones."
      - "From 0.5 to 0.95 the lead grows, {{object_detection.metrics.map_50_95.test_ema_last:percent}} against {{object_detection.metrics.map_50_95.test_last:percent}}: averaging tightens the boxes."

  - kind: image
    title: "Classes and their thresholds"
    code_reference: "vision_training/evaluation/detection/mean_average_precision.py · find_class_score_thresholds"
    # The overlaps of the metric names AP at 0.5 and at 0.75
    literal_numbers: ["0.5", "0.75"]
    image: "figures:object_detection/evaluation/class_average_precision.png"
    narration:
      - "The classes spread widely: the {{object_detection.classes.worst_name_text}} reaches {{object_detection.classes.worst_ap_50:percent}} at 0.5, the {{object_detection.classes.best_name_text}} {{object_detection.classes.best_ap_50:percent}}, the orange marks giving the AP at 0.75."
      - "Next to the bars, the class thresholds file: the score threshold keeping the highest recall of a class at a precision of {{object_detection.classes.target_precision:percent_label}}, with that recall."
      - "The {{object_detection.classes.most_recall.name_text}} keeps the most, {{object_detection.classes.most_recall.recall:percent}} of its objects from a score of {{object_detection.classes.most_recall.threshold:.2f}}; {{object_detection.classes.without_threshold_count:words}} classes never reach that precision: the {{object_detection.classes.without_threshold_text}}."
      - "With the per-class report, a Per Class Recall table adds the share of the objects of every class found at 0.5 and 0.75, whatever the score, with its exact {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} interval."

  - kind: image
    title: "The confusion matrix"
    code_reference: "vision_training/evaluation/detection/detection_confusion.py · match_image_detections"
    image: "figures:object_detection/evaluation/confusion_matrix.png"
    highlights:
      - {box: "{{object_detection.confusion.background_row_box}}", sentences: [1]}
      - {box: "{{object_detection.confusion.background_column_box}}", sentences: [1]}
      - {box: "{{object_detection.confusion.largest_cell_box}}", sentences: [3]}
    narration:
      - "The confusion matrix counts the detections at the deployment threshold of {{object_detection.run.score_threshold}}, matched at an overlap of {{constant:vision_training/evaluation/detection/detection_confusion.py#MATCHING_INTERSECTION_OVER_UNION_THRESHOLD}}: {{object_detection.confusion.right:,}} right, {{object_detection.confusion.wrong_class:,}} of the wrong class."
      - "The background row holds the {{object_detection.confusion.false_positives:,}} false positives, the background column the {{object_detection.confusion.missed:,}} missed objects."
      - "No detection of the {{object_detection.confusion.never_right_text}} classes is right at {{object_detection.run.score_threshold}}, although the {{object_detection.confusion.never_right_best.name_text}} reaches an AP of {{object_detection.confusion.never_right_best.ap_50:percent}}: its right detections all score below the threshold."
      - "The largest confusion, outlined, puts {{object_detection.confusion.largest.count:,}} objects of the {{object_detection.confusion.largest.true_name_text}} class in the {{object_detection.confusion.largest.predicted_name_text}} column, against {{object_detection.confusion.largest.right_count:,}} found right."

  - kind: html
    page: diagram
    title: "The exported detector"
    code_reference: "vision_training/deployment/export_specifications.py · get_export_specification"
    # The range of the 8-bit pixels, the four corners of a box, and the zero label of the padding (the default value
    # of the label padding of postprocess_detections)
    literal_numbers: ["0", "255", "4", zero]
    elements:
      - {type: box, box: [20, 250, 330, 430], text: "images\n[B, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Backbone.input_channels}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}}, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}}]\nfloat BGR, 0 to 255", font: diagram_small, outline: blue, highlight: [1, 2]}
      - {type: box, box: [20, 60, 380, 220], text: "preprocessing.json\nand ONNX metadata:\nthe letterbox of\nthe evaluation", font: diagram_small, outline: yellow, appear: 2, highlight: [2]}
      - {type: arrow, points: [[330, 340], [395, 340]]}
      - {type: box, box: [400, 60, 1150, 620], fill: null, outline: violet, highlight: [4, 6, 7]}
      - {type: text, position: [775, 90], text: "object_detector · TorchScript and ONNX", font: diagram_bold, anchor: ma}
      - {type: text, position: [440, 160], text: "input normalization, backbone\nevery region proposal head\ntop-k and NMS, per level or joint\nvalid mask instead of padding copies\nevery detection head on all {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.inference.post_nms_proposals}} proposals,\n  each proposal keeping its level (torch.where)\npost-processing: score {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.score_threshold}},\n  {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.nms_criterion}} NMS {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.nms_iou_threshold}}, top {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}}", font: diagram_text, appear: 4}
      # The form of both suppressions in the ONNX file (suppress_stacked_groups, postprocess_detections), shown with the
      # sentences on half precision
      - {type: text, position: [440, 500], text: "in ONNX: one NonMaxSuppression, a batch per group\nDIoU-NMS on boxes in fractions of the image", font: diagram_small, colour: accent, appear: 6}
      - {type: arrow, points: [[1150, 200], [1215, 140]], appear: 3}
      - {type: arrow, points: [[1150, 300], [1215, 270]], appear: 3}
      - {type: arrow, points: [[1150, 380], [1215, 400]], appear: 3}
      - {type: arrow, points: [[1150, 480], [1215, 530]], appear: 3}
      - {type: text, position: [1225, 140], text: "detection_boxes [B, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}}, 4]", font: diagram_monospace_small, anchor: lm, appear: 3}
      - {type: text, position: [1225, 270], text: "detection_scores [B, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}}]", font: diagram_monospace_small, anchor: lm, appear: 3}
      - {type: text, position: [1225, 400], text: "detection_labels [B, {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}}]", font: diagram_monospace_small, anchor: lm, appear: 3}
      - {type: text, position: [1225, 530], text: "number_detections [B]", font: diagram_monospace_small, anchor: lm, appear: 3}
      - {type: box, box: [20, 650, 1740, 725], text: "client side: letterbox · restore_boxes_to_original_image · per-class thresholds of class_thresholds.json", font: diagram_small, outline: yellow, appear: 5, highlight: [5]}
    narration:
      - "The export module writes the detector as object detector, in TorchScript and ONNX, with its Triton configuration."
      - "It takes float BGR images of {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}} pixels in 0 to 255, letterboxed by the client, the input normalization being part of the model."
      - "For the client to letterbox its images as the evaluation did, the export writes the colour order, resize, size, interpolation, padding, layout and value range of the run in the preprocessing file next to the model and in the ONNX metadata."
      - "It returns {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections:words}} boxes per image in network pixels, their scores and int64 labels, zero for the padding, and the number of detections of every image."
      - "In the graph: one NMS call over the batch for the proposals of every level with the per-level selection of the run, a single one with the joint selection, every detection head run on all {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#RegionProposal.inference.post_nms_proposals}} proposals with each keeping its own level, and the score threshold and the final distance IoU suppression of the configuration baked in."
      - "Outside the graph stay the letterbox, the restoration of the boxes to the original image, and the per-class thresholds; the export is checked against the eager model to a hundredth of a pixel on the boxes."
      - "In the ONNX file, every greedy suppression is one suppression node with a batch per image, or per image and class, and the distance IoU runs on boxes divided by the input size."
      - "The values then stay within half precision, so that a TensorRT engine in that precision keeps the detections of the eager model."

  - kind: terminal
    title: "Export"
    code_reference: "vision_training/deployment/export_model.py · export_experiment"
    lines:
      - {role: comment, text: "# Run folder, iteration, formats and weights as arguments; without any, the help"}
      - {role: command, text: "uv run python -m vision_training.deployment.export_model --experiment_folder=<run folder> --use_averaged_weights"}
    narration:
      - "One might want to ship the averaged weights: give the run folder and that choice as arguments, the iteration and the formats too, then run it as a module."

  - kind: text_panel
    title: "Pitfalls"
    # The overlaps of the metric name mAP from 0.5 to 0.95, and the residual pairs of two layers of ConvolutionBlock
    # (residual_parity in convolution_block.py)
    literal_numbers: ["0.5", "0.95", two-layer, 2-layer]
    columns:
      - heading: "Training"
        lines:
          - "stride {{object_detection.inference.level_4.stride}} at best: {{object_detection.anchor_recall.small.recall_all_levels:percent}} of small boxes anchored"
          - "anchors on the cell corners"
          - "joint selection: copies fill the slots"
      - heading: "Evaluation and tools"
        lines:
          - "mAP@[0.5:0.95]: VOC matching, not COCO's"
          - "2-layer heads changing channels: no shortcut"
    narration:
      - "To close, the pitfalls: even at the finest stride, {{object_detection.inference.level_4.stride}} pixels, only {{object_detection.anchor_recall.small.recall_all_levels:percent}} of the small objects get an anchor reaching the foreground threshold, and the anchors sit on the cell corners; and the joint selection of older configurations fills only {{object_detection.proposal_selection.joint_proposals_per_image:.0f}} of the {{object_detection.proposal_selection.inference_post_nms}} slots of the benchmark with real proposals, the rest with copies."
      - "The mAP from 0.5 to 0.95 is not the COCO one; and a two-layer head whose first convolution changes the channel count adds no shortcut."

  - kind: summary
    title: "Recap"
    # The overlaps of the metric names mAP at 0.5 and from 0.5 to 0.95
    literal_numbers: ["0.5", "0.95"]
    items:
      - {text: "Evaluation at score {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.score_threshold}}, deployment at {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.score_threshold}}; NMS {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.nms_iou_threshold}} per class; {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}} per image", sentences: [0]}
      - {text: "mAP@0.5 {{object_detection.report.trained.methods.area.0:percent}} at {{object_detection.run.checkpoint_iteration}}, {{object_detection.samples.metrics[1]:percent}} at {{object_detection.samples.iterations[1]}}", sentences: [1]}
      - {text: "Small objects: mAP@0.5 {{object_detection.report.trained.sizes.small.1:percent}}, proposal recall {{object_detection.proposal_recall.small.recall_50:percent}}", sentences: [2]}
      - {text: "Moving average: tighter boxes, mAP@[0.5:0.95] {{object_detection.metrics.map_50_95.test_ema_last:percent}}, trained {{object_detection.metrics.map_50_95.test_last:percent}}", sentences: [3]}
      - {text: "class_thresholds.json: per-class scores at precision {{object_detection.classes.target_precision:percent_label}}", sentences: [4]}
      - {text: "object_detector: boxes, scores, labels, count; letterbox and thresholds client side", sentences: [5]}
    narration:
      - "To recap: the evaluation scores at {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.score_threshold}} so that the precision recall curves keep their low end, the deployment at {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.score_threshold}}, and a suppression per class keeps the best {{config:vision_training/configurations/object_detection/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections:words}} detections per image."
      - "The mAP at 0.5 reaches {{object_detection.report.trained.methods.area.0:percent}} at iteration {{object_detection.run.checkpoint_iteration:words}}, against {{object_detection.samples.metrics[1]:percent}} at {{object_detection.samples.iterations[1]:words}}; its PASCAL VOC matching makes the average from 0.5 to 0.95 differ from that of the COCO tools."
      - "Small objects are the weakest size, {{object_detection.report.trained.sizes.small.1:percent}} at 0.5, and the one the proposals cover least, {{object_detection.proposal_recall.small.recall_50:percent}} of them against {{object_detection.proposal_recall.all.recall_50:percent}} of all objects."
      - "The moving average of the weights tightens the boxes, {{object_detection.metrics.map_50_95.test_ema_last:percent}} from 0.5 to 0.95 against {{object_detection.metrics.map_50_95.test_last:percent}} for the trained weights, so compare both before choosing which to export."
      - "Class thresholds json gives every class the score keeping its highest recall at a precision of {{object_detection.classes.target_precision:percent_label}}; {{object_detection.classes.without_threshold_count:words}} classes never reach it in this run."
      - "The exported object detector returns padded boxes, scores, labels and the number of detections per image, while the letterbox, the box restoration and the per-class thresholds stay on the client side."
      - "The next series, on instance masks, builds on this detector, adding a mask head to every level."
