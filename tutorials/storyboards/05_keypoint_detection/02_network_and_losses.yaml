      # Higher resolution branch
      - {type: arrow, points: [[735, 270], [735, 520], [800, 520]], colour: aqua, appear: 3}
      - {type: arrow, points: [[1245, 270], [1245, 420], [880, 420], [880, 470]], colour: aqua, appear: 3}
      - {type: box, box: [810, 480, 1080, 600], text: "concatenate\n{{keypoint_detection.network_branch_input_shape}}\n{{constant:vision_training/models/keypoints/hrnet.py#HIGHER_RESOLUTION_KERNEL_SIZE}}x{{constant:vision_training/models/keypoints/hrnet.py#HIGHER_RESOLUTION_KERNEL_SIZE}} transposed, stride {{constant:vision_training/models/keypoints/hrnet.py#BRANCH_SCALE_FACTOR}}", font: diagram_small, outline: aqua, appear: 3}
      - {type: arrow, points: [[1080, 540], [1130, 540]], colour: aqua, appear: 3}
      - {type: box, box: [1140, 480, 1400, 600], text: "{{keypoint_detection.network_branch_upsampled_shape}}\n{{keypoint_detection.branch_refinement_layers}} refinement layers\n3x3 then 1x1", font: diagram_small, outline: aqua, appear: 3}
      - {type: arrow, points: [[1400, 540], [1450, 540]], colour: aqua, appear: 3}
      - {type: cuboid, box: [1460, 500, 1540, 580], depth: 48, fill: aqua, label: "{{keypoint_detection.network_branch_heatmaps_shape}}", appear: 3}
      - {type: text, position: [1520, 648], text: "{{keypoint_detection.channels_total}} heat maps at {{keypoint_detection.branch_fraction}}", font: diagram_small, anchor: ma, appear: 3}
      # Initialisation of the last layers
      - {type: text, position: [30, 640], text: "last layers: weights of standard deviation {{constant:vision_training/models/keypoints/keypoint_detector.py#HEAD_INITIALISATION_STANDARD_DEVIATION}}, heat map bias logit({{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_PRIOR_PROBABILITY}}) = {{keypoint_detection.loss_prior_logit:.3f}}", font: diagram_small, colour: dim, appear: 4, highlight: [4]}
    narration:
      - "The stem brings the {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}} pixel image to {{keypoint_detection.network_stem_channels}} channels at a quarter of its size, with a receptive field of only {{keypoint_detection.stem_receptive_field}} pixels: the context comes from the lower branches of the high resolution network."
      - "The network returns its quarter resolution branch of {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#HRNet.base_width}} channels, and a three by three convolution of {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.hidden_width}} channels feeds a one by one convolution of {{keypoint_detection.network_prediction_channels}} channels: {{keypoint_detection.channels_total}} heat map logits, then {{keypoint_detection.channels_total}} tags."
      - "Think of the head without the hidden layer: a one by one convolution would have to raise {{keypoint_detection.channels_total}} heat maps, each on its own key points, from the same {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#HRNet.base_width}} channels."
      - "The higher resolution branch concatenates the features with these predictions, {{keypoint_detection.network_branch_input_channels}} channels, doubles their resolution with a {{constant:vision_training/models/keypoints/hrnet.py#HIGHER_RESOLUTION_KERNEL_SIZE:words}} by {{constant:vision_training/models/keypoints/hrnet.py#HIGHER_RESOLUTION_KERNEL_SIZE:words}} transposed convolution, refines them and predicts {{keypoint_detection.channels_total}} more heat maps at half the image."
      - "Both last layers start with weights of standard deviation {{constant:vision_training/models/keypoints/keypoint_detector.py#HEAD_INITIALISATION_STANDARD_DEVIATION}} and a heat map bias at the logit of {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_PRIOR_PROBABILITY}}, so that every cell starts at a probability of {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_PRIOR_PROBABILITY}}."

  - kind: html
    page: 05_keypoint_detection/high_resolution_network
    title: "Branches that exchange their features"
    code_reference: "vision_training/models/keypoints/hrnet.py · ExchangeModule"
    data: "figures:keypoint_detection/network/high_resolution_network.json"
    steps: {lanes: 0, exchange: 1, output: 2}
    # The kernels of the exchange convolutions, typed in hrnet.py
    literal_numbers: [three]
    narration:
      - "Inside, a branch at a quarter of the image runs from start to end, and every stage adds a branch at half the resolution and twice the width, down to a stride of {{keypoint_detection.network_lowest_stride}}."
      - "Every module ends with an exchange: each branch receives the sum of all the others brought to its resolution, by strided three by three convolutions from above and by a one by one convolution and a nearest upsampling from below."
      - "The last module only computes the quarter resolution branch, the one both heads read."

  - kind: html
    page: diagram
    title: "Where the parameters are"
    code_reference: "vision_training/models/components/convolution_block.py · ConvolutionBlock.count_residual_additions"
    elements:
      - type: bars
        box: [80, 90, 1400, 400]
        orientation: horizontal
        values: "{{keypoint_detection.parameters_values}}"
        labels: ["stem", "high resolution network", "heat map and tag head", "higher resolution branch"]
        value_labels: "{{keypoint_detection.parameters_labels}}"
        colours: [blue, blue, violet, aqua]
        label_width: 330
        value_width: 140
      - {type: text, position: [80, 450], text: "{{keypoint_detection.parameters_total:,}} parameters in all", font: diagram_bold}
      - {type: box, box: [80, 530, 1680, 680], text: "no shortcut in the stem: its {{keypoint_detection.stem_block_count}} blocks change their channel count, which moves their residual pairs past\ntheir last layer; every branch of the network adds {{keypoint_detection.branch_shortcuts}} shortcuts per module, the refinement too", font: diagram_small, outline: yellow, appear: 1, highlight: [1]}
    narration:
      - "Of the {{keypoint_detection.parameters_total:,}} parameters, {{keypoint_detection.parameters_high_resolution_network:,}} are in the high resolution network: the heads are small and the stem tiny."
      - "Residual nets add no shortcut to the stem, whose {{keypoint_detection.stem_block_count:words}} blocks all change their channel count: only the branches of the network and the refinement of the branch have shortcuts."

  - kind: code
    title: "The focal heat map loss"
    code_reference: "vision_training/losses/keypoint_losses.py · compute_heatmap_loss"
    source:
      file: vision_training/losses/keypoint_losses.py
      function: compute_heatmap_loss
    highlights:
      - {match: "positive_losses =", sentences: [1]}
      - {match: "FOCAL_EXPONENT|PENALTY_REDUCTION_EXPONENT", sentences: [1]}
      - {match: "number_positives", sentences: [2]}
      - {match: "ignored_cells", sentences: [3]}
    literal_numbers: [zero]
    narration:
      - "The heat map loss is the penalty-reduced focal loss of Corner Net, computed in float32 from the logits at both strides and summed."
      - "A positive cell costs one minus p, to the power {{constant:vision_training/losses/keypoint_losses.py#FOCAL_EXPONENT:words}}, times minus log p; any other cell is weighted by one minus its target to the power {{constant:vision_training/losses/keypoint_losses.py#PENALTY_REDUCTION_EXPONENT:words}} and by p to the power {{constant:vision_training/losses/keypoint_losses.py#FOCAL_EXPONENT:words}}, so the cells near a key point and those already near zero count for little."
      - "The sum over all the cells and channels is divided by the number of positive cells, so that neither the {{keypoint_detection.channels_total}} channels nor the size of the maps dilute the key points."
      - "With ignore unlabelled objects, the cells mostly covered by the objects without labels are left out, except the key point cells."

  - kind: html
    page: diagram
    title: "Where the loss comes from"
    code_reference: "vision_training/losses/keypoint_losses.py · compute_heatmap_loss"
    elements:
      - {type: text, position: [80, 40], text: "every cell at the prior of {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_PRIOR_PROBABILITY}} · total {{keypoint_detection.loss_prior_total:.3f}}", font: diagram_bold}
      - type: bars
        box: [80, 90, 1500, 330]
        orientation: horizontal
        values: "{{keypoint_detection.loss_prior_values}}"
        maximum: "{{keypoint_detection.loss_maximum}}"
        labels: ["stride {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_STRIDE}}, key point cells", "stride {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_STRIDE}}, other cells", "stride {{keypoint_detection.branch_stride}}, key point cells", "stride {{keypoint_detection.branch_stride}}, other cells"]
        value_labels: "{{keypoint_detection.loss_prior_labels}}"
        colours: [violet, dim, aqua, dim]
        label_width: 330
        value_width: 110
      - {type: text, position: [80, 400], text: "trained weights, iteration {{keypoint_detection.checkpoint_iteration}} · total {{keypoint_detection.loss_trained_total:.3f}}", font: diagram_bold, appear: 2}
      - type: bars
        box: [80, 450, 1500, 690]
        orientation: horizontal
        values: "{{keypoint_detection.loss_trained_values}}"
        maximum: "{{keypoint_detection.loss_maximum}}"
        labels: ["stride {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_STRIDE}}, key point cells", "stride {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_STRIDE}}, other cells", "stride {{keypoint_detection.branch_stride}}, key point cells", "stride {{keypoint_detection.branch_stride}}, other cells"]
        value_labels: "{{keypoint_detection.loss_trained_labels}}"
        colours: [violet, dim, aqua, dim]
        label_width: 330
        value_width: 110
        appear: 2
    narration:
      - "On the test image with every cell at the prior of {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_PRIOR_PROBABILITY}}, each of the {{keypoint_detection.loss_positive_cells}} key point cells costs {{keypoint_detection.loss_prior_stride_4_keypoint_cells:.2f}} at each stride, while all the other cells of the {{keypoint_detection.loss_cells_stride_4:,}} of stride {{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_STRIDE:words}} add only {{keypoint_detection.loss_prior_stride_4_other_cells:.2f}}."
      - "That is the point of the prior: millions of empty cells start almost free, and the gradient goes to the few cells that matter."
      - "With the trained weights of iteration {{keypoint_detection.checkpoint_iteration}}, the heat map loss of this image falls to {{keypoint_detection.loss_trained_total:.2f}}."

  - kind: html
    page: 05_keypoint_detection/tag_line
    title: "Tags pulled together, objects pushed apart"
    code_reference: "vision_training/losses/keypoint_losses.py · compute_tag_losses"
    data: "figures:keypoint_detection/network/tags.json"
    steps: {dots: 0, pull: 1, push: 2}
    # A push loss just below its maximum of one, which two or three decimals would round to it
    exact_facts: [keypoint_detection.tags_push_loss]
    narration:
      - "The tags have no target: every labelled key point takes the tag of its channel at its cell, and only the distances between tags are trained."
      - "The pull loss is the mean squared distance of the tags of an object to their mean, which gathers its key points around one value."
      - "The push loss averages e to the minus squared difference of the mean tags, over the pairs of objects of the same class only, the only ones that share channels; both losses are weighted by {{keypoint_detection.tag_loss_weight}}."
      - "Here the mean tags of the {{keypoint_detection.pair_object_count:words}} {{keypoint_detection.pair_class_plural}} end only {{keypoint_detection.tags_pair_distance:.2f}} apart, so the push loss of this image is {{keypoint_detection.tags_push_loss:.4f}}, its maximum being one: the {{keypoint_detection.pair_object_count:words}} objects of one class were not separated."

