      - {box: "{{keypoint_detection.curves_tag_panel_box}}", sentences: [2]}
    # Tag losses of a few thousandths, which two decimals would read as zero or one hundredth
    exact_facts: [keypoint_detection.curves_tag_pull_loss_first_window_mean,
                  keypoint_detection.curves_tag_pull_loss_last_window_mean,
                  keypoint_detection.curves_tag_push_loss_first_window_mean,
                  keypoint_detection.curves_tag_push_loss_last_window_mean]
    narration:
      - "The run trained {{keypoint_detection.run_iterations}} iterations of {{keypoint_detection.run_batch_size}} images on a GPU shared with other trainings, at about {{keypoint_detection.training_throughput:.0f}} images per second, with a cosine decay after {{keypoint_detection.run_warmup_iterations}} warm-up iterations."
      - "The total loss starts at {{keypoint_detection.curves_total_loss_first:.1f}} and ends near {{keypoint_detection.curves_total_loss_last_smoothed:.2f}}, almost all of it heat map loss."
      - "Over the first and the last {{keypoint_detection.curves_window_iterations}} iterations, the weighted pull loss averages {{keypoint_detection.curves_tag_pull_loss_first_window_mean:.4f}} then {{keypoint_detection.curves_tag_pull_loss_last_window_mean:.4f}}, but the push loss {{keypoint_detection.curves_tag_push_loss_first_window_mean:.4f}} then {{keypoint_detection.curves_tag_push_loss_last_window_mean:.4f}}: it barely falls."
      - "Take a run like this one, with a validation iteration ratio of {{keypoint_detection.run_validation_iteration_ratio:words}}: it logs no validation curve, and the test evaluations every {{keypoint_detection.run_evaluation_interval}} iterations take its place."

  - kind: summary
    title: "Recap"
    items:
      - {text: "Stem at {{keypoint_detection.heatmap_fraction}} by convolutions and max pooling, then an HRNet of {{keypoint_detection.network_branch_count}} branches exchanging after every module"}
      - {text: "modules_per_stage: its length sets the branches, its numbers the modules; blocks_per_branch: residual pairs per module"}
      - {text: "Head at {{keypoint_detection.heatmap_fraction}}: {{keypoint_detection.network_prediction_channels}} channels, {{keypoint_detection.channels_total}} heat map logits then {{keypoint_detection.channels_total}} tags"}
      - {text: "Higher resolution branch: {{keypoint_detection.channels_total}} more heat maps at {{keypoint_detection.branch_fraction}}"}
      - {text: "hidden_width {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.hidden_width}}, heat map bias at logit({{constant:vision_training/models/keypoints/keypoint_detector.py#HEATMAP_PRIOR_PROBABILITY}})"}
      - {text: "Focal loss of both strides over the positive cells"}
      - {text: "Pull and push tag losses, weighted by {{keypoint_detection.tag_loss_weight}}, same class only"}
    narration:
      - "To recap: one quarter resolution branch carries the features from the stem to both heads, the focal loss trains the almost empty heat maps, and the tag losses shape the tags that group the key points."
      - "The next chapter turns the heat maps into objects: the candidates and their refinement, the grouping by tags, the object key point similarity, the metrics of the run and the export."
