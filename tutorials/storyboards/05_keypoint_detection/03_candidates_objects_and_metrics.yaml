# Keypoint detection, chapter 3: from the heatmaps of the trained detector to objects (the candidates, their refinement
# within their cell, the grouping by tags followed on the pair of the test image, its two objects of one class), the
# object keypoint similarity and the metrics of the synthetic keypoint run (trained and averaged weights, worst classes
# and keypoints, the pitfall of Matched Objects), then the commands and the export. Coordinates of the html scenes are
# in pixels of the content area (1760 x 740); the figures and facts are made by tutorials/figures/keypoint_detection.
series: keypoint_detection
series_title: "Keypoint Detection (KPT)"
chapter: 3
title: "From candidates to objects, metrics and export"
output_name: keypoint_detection_03_candidates_objects_and_metrics
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [keypoint_detection]
references:
  - "vision_training/models/keypoints/keypoint_detector.py · compute_peak_offsets"
  - "vision_training/models/keypoints/keypoint_grouping.py · match_candidates_to_objects"
  - "vision_training/evaluation/keypoints/object_keypoint_similarity.py · compute_object_keypoint_similarity"
  - "vision_training/evaluation/keypoints/object_keypoint_similarity.py · summarise_keypoint_accuracy"
  - "vision_training/evaluation/detection/average_precision_report.py"
  - "vision_training/models/keypoints/inference_keypoint_detector.py · InferenceKeypointDetector"
  - "vision_training/deployment/export_specifications.py · compare_keypoints"
  - "vision_training/deployment/deployment_utilities.py · load_inference_inputs"
  - "vision_training/deployment/input_contract.py · write_preprocessing_file"
scenes:
  - kind: title_card
    heading: "From candidates to objects"
    subheading: "Peaks, grouping by tags, key point similarity, metrics and export"
    footnote: "Keypoint Detection (KPT) · chapter 3"
    literal_numbers: ["3"]
    narration:
      - "This last chapter of the series turns the heat maps of the trained detector into objects, scores them, and exports the network."
      - "It follows the same test image with the checkpoint of iteration {{keypoint_detection.checkpoint_iteration}}, run on the CPU."

  - kind: image
    title: "Heat maps of the trained detector"
    code_reference: "vision_training/models/keypoints/keypoint_detector.py · extract_keypoint_candidates"
    image: "figures:keypoint_detection/evaluation/heatmaps.png"
    highlights:
      - {box: "{{keypoint_detection.heatmaps_single_row_box}}", sentences: [1]}
      - {box: "{{keypoint_detection.heatmaps_pair_average_box}}", sentences: [2, 3]}
      - {box: "{{keypoint_detection.heatmaps_single_average_box}}", sentences: [2, 3]}
    narration:
      - "At inference the heat maps of a quarter of the image are upsampled by {{constant:vision_training/models/keypoints/hrnet.py#BRANCH_SCALE_FACTOR:words}} and averaged with those of the higher resolution branch, and the tags are upsampled with them."
      - "For the {{keypoint_detection.single_class_label}} the peaks reach {{keypoint_detection.heatmaps_single_peak_stride_2:.2f}} at stride {{keypoint_detection.branch_stride:words}}, and the average on the right is the map the candidates are taken on."
      - "Of the {{keypoint_detection.heatmaps_candidate_count:,}} candidates of the image, {{keypoint_detection.heatmaps_candidates_above_threshold}} pass the key point threshold of {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.inference.keypoint_threshold}}, and {{keypoint_detection.heatmaps_candidates_on_keypoints}} of them lie less than {{keypoint_detection.heatmaps_error_bound:.1f}} pixels from a labelled key point of their channel."
      - "The {{keypoint_detection.heatmaps_other_candidates}} others score at most {{keypoint_detection.heatmaps_other_best_score:.2f}}, below every candidate on a key point."

  - kind: code
    title: "Local maxima of every channel"
    code_reference: "vision_training/models/keypoints/keypoint_detector.py · extract_keypoint_candidates"
    source:
      file: vision_training/models/keypoints/keypoint_detector.py
      function: extract_keypoint_candidates
      start: "window_maxima = "
      end: "rows = torch.div"
    highlights:
      - {match: "window_maxima|local_maxima|topk", sentences: [0]}
    # The zero scores of the padding candidates
    literal_numbers: [zero]
    narration:
      - "The candidates of a channel are its local maxima over {{constant:vision_training/models/keypoints/keypoint_detector.py#CANDIDATE_WINDOW_SIZE:words}} by {{constant:vision_training/models/keypoints/keypoint_detector.py#CANDIDATE_WINDOW_SIZE:words}} cells, the {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.inference.maximum_candidates}} highest kept and padded with zero scores."

  - kind: code
    title: "Candidates placed within their cell"
    code_reference: "vision_training/models/keypoints/keypoint_detector.py · compute_peak_offsets"
    source:
      file: vision_training/models/keypoints/keypoint_detector.py
      function: extract_keypoint_candidates
      start: "offset_x = compute_peak_offsets"
      end: "candidate_x = "
    highlights:
      - {match: "offset_x = compute_peak_offsets|offset_y = compute_peak_offsets", sentences: [0]}
      - {match: "candidate_x = ", sentences: [1]}
    # The parabola through a cell and its two neighbours
    literal_numbers: [two]
    narration:
      - "Each is placed within its cell, along each axis, at the vertex of the parabola through the log heat map at its cell and its two neighbours: the Taylor expansion of DARK without its cross term."
      - "Its position in pixels is the cell plus that offset plus one half, times the stride."

  - kind: html
    page: 05_keypoint_detection/grouping
    title: "Grouping by tags"
    code_reference: "vision_training/models/keypoints/keypoint_grouping.py · group_keypoint_candidates"
    data: "figures:keypoint_detection/evaluation/grouping.json"
    steps: {columns: 0, exchange: 3}
    # A rounded tag distance below one half and the score of a key point not found
    literal_numbers: [zero]
    narration:
      - "The grouping runs on the CPU, class by class: the candidates of the first key point of the class start one object each."
      - "The candidates of every next key point are matched to the objects so far by the Hungarian method, the cost being the tag distance to the mean tag of the object rounded to whole units, times {{constant:vision_training/models/keypoints/keypoint_grouping.py#TAG_DISTANCE_COST:.0f}}, minus the score."
      - "The {{keypoint_detection.pair_object_count:words}} {{keypoint_detection.pair_class_plural}} have mean tags only {{keypoint_detection.tags_pair_distance:.2f}} apart, so the candidates on their key points are at a rounded distance of zero from both objects and both assignments cost the same."
      - "The candidates then go to the objects in the order of their scores: those of the {{keypoint_detection.grouping_exchanged_keypoints}} key points end in the wrong {{keypoint_detection.pair_class_label}}."
      - "An object scores the mean of its key point scores over all the key points of its class, a key point not found counting zero: the last object here, a single weak candidate left over, scores {{keypoint_detection.grouping_weakest_score:.2f}}."
      - "The evaluation keeps every object, while the sample images keep those scoring at least {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.inference.object_score_threshold}}, the threshold a client passes to the grouping."

  - kind: image
    title: "The sample image of the evaluation"
    code_reference: "vision_training/utilities/visualization.py · build_keypoint_sample_grid"
    image: "runs:keypoint_focal_synthetic/experiments/KPT_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x64_HRSE-HRRES-HRBN-HR16.1.2.2x2_K243-KH256-HH_MC33/Checkpoint_Evaluation/Iteration_6000/Samples/test_000409.png"
    # The score of a key point not found
    literal_numbers: [zero]
    highlights:
      - {box: "{{keypoint_detection.sample_prediction_pair_box}}", sentences: [0]}
      - {box: "{{keypoint_detection.sample_ground_truth_pair_box}}", sentences: [0]}
      - {box: "{{keypoint_detection.sample_prediction_cut_box}}", sentences: [1]}
      - {box: "{{keypoint_detection.sample_prediction_single_box}}", sentences: [2]}
    narration:
      - "The sample image of the evaluation shows it: every labelled key point of both {{keypoint_detection.pair_class_plural}} is found, but their skeletons cross from one {{keypoint_detection.pair_class_label}} to the other."
      - "The {{keypoint_detection.pair_class_label}} cut by the border also gets its {{keypoint_detection.grouping_cut_border_keypoints:words}} key points outside the image, placed on the edge with scores of at most {{keypoint_detection.grouping_cut_border_best_score:.2f}}."
      - "The {{keypoint_detection.single_class_label}}, alone in its class, scores only {{keypoint_detection.grouping_single_best_score:.2f}}: its {{keypoint_detection.single_unlabelled_keypoint_label}} key point, outside the image, is not found and counts zero."

  - kind: html
    page: diagram
    title: "Object key point similarity"
    code_reference: "vision_training/evaluation/keypoints/object_keypoint_similarity.py · compute_object_keypoint_similarity"
    # The COCO formula, the ticks of the chart, the similarity of one half and the zero of a key point not found
    literal_numbers: ["0.5", "1.0", "2", "0", "10", "20", "30", zero]
    elements:
      - {type: text, position: [80, 40], text: "OKS = mean over the labelled key points of exp(-d² / (2 · area · k²)),  k = 2 sigma = {{keypoint_detection.oks_constant:g}}", font: code_text}
      - type: curve
        box: [180, 110, 1180, 560]
        series:
          - {name: "{{keypoint_detection.oks_large_label}}", colour: blue, points: "{{keypoint_detection.oks_large_points}}"}
          - {name: "{{keypoint_detection.oks_small_label}}", colour: aqua, points: "{{keypoint_detection.oks_small_points}}"}
        x_range: [0, 30]
        y_range: [0, 1]
        x_ticks: [{value: 0, label: "0"}, {value: 10, label: "10"}, {value: 20, label: "20"}, {value: 30, label: "30"}]
        y_ticks: [{value: 0.5, label: "0.5"}, {value: 1.0, label: "1.0"}]
        x_label: "distance of every key point to its ground truth, pixels"
        y_label: "OKS"
        appear: 1
      - {type: text, position: [1300, 200], text: "{{keypoint_detection.oks_large_label}}, area {{keypoint_detection.oks_large_area:,}} px²\nOKS 0.5 at {{keypoint_detection.oks_large_half_distance:.1f}} px\nPCK tolerance {{keypoint_detection.oks_large_pck_tolerance:.2f}} px", font: diagram_small, colour: blue, appear: 1}
      - {type: text, position: [1300, 360], text: "{{keypoint_detection.oks_small_label}}, area {{keypoint_detection.oks_small_area:,}} px²\nOKS 0.5 at {{keypoint_detection.oks_small_half_distance:.1f}} px\nPCK tolerance {{keypoint_detection.oks_small_pck_tolerance:.2f}} px", font: diagram_small, colour: aqua, appear: 1}
      - {type: box, box: [80, 655, 1680, 725], text: "a labelled key point not found counts 0: half the key points missing caps the OKS at 0.5", font: diagram_small, outline: yellow, appear: 2, highlight: [2]}
    narration:
      - "An object found is scored against the ground truth objects of its class with the COCO object key point similarity, which replaces the box IOU of detection."
      - "With the default sigma of {{keypoint_detection.oks_default_sigma:.3g}}, key points about {{keypoint_detection.oks_large_half_distance:.0f}} pixels away bring the similarity down to one half on the {{keypoint_detection.oks_large_label}}, but only about {{keypoint_detection.oks_small_half_distance:.0f}} pixels away on the smaller {{keypoint_detection.oks_small_label}}."
      - "A labelled key point that was not found counts zero, so an object missing half its key points has an OKS of one half at most, only with the others exact."

  - kind: html
    page: diagram
    title: "Metrics of the evaluated checkpoints"
    code_reference: "vision_training/evaluation/keypoints/object_keypoint_similarity.py · match_ground_truth_objects"
    # The similarities of the metric names, mAP@0.5 and mAP@0.95
    literal_numbers: ["0.5", "0.95"]
    elements:
      - type: grid
        box: [330, 90, 1500, 600]
        values: "{{keypoint_detection.metrics_grid_percentages}}"
        show_values: true
        decimals: 2
        font: diagram_monospace_small
        row_labels: "{{keypoint_detection.metrics_grid_row_labels}}"
        column_labels: "{{keypoint_detection.metrics_grid_column_labels}}"
        low_colour: box
        high_colour: blue
        marks:
          - {row: 0, column: 0, sentences: [1]}
          - {row: 0, column: 4, sentences: [1]}
          - {row: 2, column: 0, sentences: [1, 2]}
          - {row: 2, column: 4, sentences: [1, 2]}
          - {row: 2, column: 1, sentences: [2]}
          - {row: 2, column: 5, sentences: [2]}
          - {row: 6, column: 4, sentences: [3]}
      - {type: text, position: [330, 640], text: "cells in % · {{keypoint_detection.metrics_test_images}} test images, {{keypoint_detection.metrics_test_objects:,}} objects with key points · mean error at {{keypoint_detection.checkpoint_iteration}}: {{keypoint_detection.metrics_trained_6000_error:.2f}} px", font: diagram_small, colour: dim}
    narration:
      - "Every evaluation of this run covers the first {{keypoint_detection.metrics_test_images}} test images, holding {{keypoint_detection.metrics_test_objects:,}} objects with key points, for the trained and the averaged weights."
      - "From iteration {{keypoint_detection.metrics_first_iteration}} to {{keypoint_detection.checkpoint_iteration}}, the OKS mean average precision at 0.5 rises from {{keypoint_detection.metrics_trained_2000_map_0_5:percent}} to {{keypoint_detection.metrics_trained_6000_map_0_5:percent}}, and the strict one at 0.95 from {{keypoint_detection.metrics_trained_2000_map_0_95:percent}} to {{keypoint_detection.metrics_trained_6000_map_0_95:percent}}."
      - "At iteration {{keypoint_detection.metrics_first_iteration}} the averaged weights are well ahead, {{keypoint_detection.metrics_ema_2000_map_0_95:percent}} at 0.95; by {{keypoint_detection.checkpoint_iteration}} they reach {{keypoint_detection.metrics_ema_6000_map_0_95:percent}}, against {{keypoint_detection.metrics_trained_6000_map_0_95:percent}} for the trained weights."
      - "A ground truth counts as matched only by an object reaching an OKS of {{constant:vision_training/evaluation/keypoints/object_keypoint_similarity.py#MINIMUM_MATCH_SIMILARITY}}: {{keypoint_detection.metrics_trained_6000_matched:percent}} at iteration {{keypoint_detection.checkpoint_iteration}}, the mean error of {{keypoint_detection.metrics_trained_6000_error:.1f}} pixels coming from these matches only."

  - kind: image
    title: "Worst classes and key points"
    code_reference: "vision_training/evaluation/keypoints/object_keypoint_similarity.py · summarise_keypoint_accuracy"
    image: "figures:keypoint_detection/evaluation/worst_classes_and_keypoints.png"
    # The similarities of the recall columns of class metrics
    literal_numbers: ["0.5", "0.75"]
    narration:
      - "Per class, the {{keypoint_detection.worst_class}} is the weakest at {{keypoint_detection.worst_class_ap:percent}}; per key point, the {{keypoint_detection.worst_keypoint_name}} of the {{keypoint_detection.worst_keypoint_class}}, with a PCK of {{keypoint_detection.worst_keypoint_pck:percent}} and {{keypoint_detection.worst_keypoint_error:.0f}} pixels of mean error."
      - "Both tables come from class metrics and key point metrics, written in the evaluation folder of every checkpoint next to its sample images and to the same files for the averaged weights."
      - "Class metrics also holds the recall of every class at an OKS of 0.5 and 0.75, with its exact {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} interval over its objects, shown worst first in a recall table of the per-class report."

  - kind: terminal
    title: "Generate, train, evaluate, export"
    code_reference: "vision_training/deployment/export_model.py · export_experiment"
    lines:
      - {role: comment, text: "# Synthetic key point data set: task = \"keypoint_detection\" in the main block of the script"}
      - {role: command, text: "uv run python -m vision_training.data.synthetic.create_synthetic_dataset"}
      - {role: comment, text: "# Training, its data folders and label mapping set in the configuration"}
      - {role: command, text: "uv run python -m vision_training.main --configuration_path=\"vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml\""}
      - {role: comment, text: "# Evaluation of checkpoints: run and iteration set in its main block"}
      - {role: command, text: "uv run python -m scripts.evaluation.evaluate_checkpoint"}
      - {role: comment, text: "# Export to Torch Script and ONNX: needs CUDA"}
      - {role: command, text: "uv run python -m vision_training.deployment.export_model"}
    narration:
      - "To train a run like it, generate the synthetic key point data set with the task set in the main block of the script, then train with the synthetic configuration set to {{keypoint_detection.run_iterations}} iterations and a cosine decay over {{keypoint_detection.run_decay_iterations}}."
      - "Its test folder holds the first {{keypoint_detection.metrics_test_images}} test images, and every other setting is the one of the configuration file, augmentations included."
      - "The evaluation script skips its maximum error images per class pair with a yellow warning, key point detection saving no error images."
      - "In a situation where no GPU is available, the export cannot run: it loads the checkpoint on CUDA, hard-coded."

  - kind: html
    page: diagram
    title: "What the export gives"
    code_reference: "vision_training/models/keypoints/inference_keypoint_detector.py · InferenceKeypointDetector.forward"
    # The range of uint8 pixels and the x and y of a candidate
    literal_numbers: ["0", "255", "2"]
    elements:
      - {type: box, box: [40, 90, 330, 290], text: "images\n[B, {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#Backbone.input_channels}}, {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}}, {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#Data.image_settings.size}}]\nBGR, 0 to 255", font: diagram_text, outline: blue}
      - {type: arrow, points: [[330, 190], [400, 190]], colour: blue}
      - {type: box, box: [410, 90, 800, 290], text: "exported network\nTorch Script or ONNX\nin Triton", font: diagram_text, outline: violet}
      - {type: arrow, points: [[800, 190], [860, 190]], colour: violet}
      - {type: text, position: [875, 140], text: "candidate_positions  [B, {{keypoint_detection.channels_total}}, {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.inference.maximum_candidates}}, 2]\ncandidate_scores     [B, {{keypoint_detection.channels_total}}, {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.inference.maximum_candidates}}]\ncandidate_tags       [B, {{keypoint_detection.channels_total}}, {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.inference.maximum_candidates}}]", font: diagram_monospace}
      - {type: arrow, points: [[1200, 270], [1200, 350]], colour: aqua, appear: 1}
      - {type: box, box: [660, 360, 1740, 510], text: "client: group_keypoint_candidates (NumPy, SciPy)\nwith the channel table rebuilt from the training labels.json", font: diagram_text, outline: aqua, appear: 1, highlight: [1]}
      - {type: box, box: [40, 360, 610, 510], text: "preprocessing.json and ONNX metadata:\ncolour order, resize, size, padding,\nlayout and value range of the run", font: diagram_small, outline: violet, appear: 2, highlight: [2]}
      - {type: box, box: [40, 560, 1740, 700], text: "export check: compare_keypoints pairs the candidates by position, not by rank\n(a cell tied with its neighbour can become a local maximum in one runtime only)", font: diagram_text, outline: yellow, appear: 3, highlight: [3]}
    narration:
      - "The exported network stops at the candidates: the positions, scores and tags of {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#KeypointHead.inference.maximum_candidates}} candidates per channel, served by Triton as Torch Script or ONNX."
      - "Imagine a client receiving these outputs: it groups them with the same function, rebuilding the channel table from the categories of the training labels, since the export writes no channel names."
      - "So that the client resizes and pads its photos as the data loaders did, the export writes the colour order, resize, size, padding, layout and value range of the run in a preprocessing file next to the model and in the ONNX metadata."
      - "The export check pairs the candidates by position rather than by rank: a cell tied with its neighbour can become a local maximum in one runtime only and shift the ranks."

  - kind: summary
    title: "Recap"
    # The similarity of a key point not found (0.5 listed first, the 0 alone splitting the name mAP@0.5)
    literal_numbers: ["0.5", "0"]
    items:
      - {text: "Candidates: {{constant:vision_training/models/keypoints/keypoint_detector.py#CANDIDATE_WINDOW_SIZE}}x{{constant:vision_training/models/keypoints/keypoint_detector.py#CANDIDATE_WINDOW_SIZE}} local maxima of the averaged heat maps, placed within their cell"}
      - {text: "Grouping on the CPU, key point by key point, by rounded tag distance then score"}
      - {text: "OKS replaces the box IOU: sigma {{config:vision_training/configurations/keypoint_detection/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.default_keypoint_sigma}}, a missing key point counts 0"}
      - {text: "OKS mAP@0.5 is the headline; Matched Objects needs an OKS of {{constant:vision_training/evaluation/keypoints/object_keypoint_similarity.py#MINIMUM_MATCH_SIMILARITY}}"}
      - {text: "Exported network outputs candidates, the client groups them"}
      - {text: "evaluate_checkpoint: no error images, the limit skipped with a warning"}
    narration:
      - "To recap: the network gives candidates, the grouping turns them into objects by their tags, and the object key point similarity scores them, with the trained and the averaged weights."
      - "The next series, semantic segmentation, keeps the shared backbone and puts a decoder on it to give a class to every pixel."
