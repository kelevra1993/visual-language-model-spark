# Sequence labelling, chapter 1: what the task is for and when to choose it, its synthetic data (frames redrawn at
# every change), the labels and mapping files, the class balance and the position prior, the padded batches and the
# data settings, and the commands of a run. Coordinates of the html scenes are in pixels of the content area (1760 x
# 740, origin at its top left corner); the figures named figures:sequence_labelling/... are made by
# tutorials/figures/sequence_labelling from the README run of tutorials/tutorial_sources.yaml.
series: sequence_labelling
series_title: "Sequence Labelling (M2M)"
chapter: 1
title: "One class per frame: the task and its data"
output_name: sequence_labelling_01_task_and_data
pace: 1.16
voice: {name: af_heart, language: en-us}
figures: [sequence_labelling]
references:
  - "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer"
  - "vision_training/data/synthetic/create_synthetic_dataset.py · generate_shape_change_sequence"
  - "vision_training/data/sequence/sequence_dataset.py · SequenceDataset"
  - "scripts/data/create_sequence_split_subset.py"
  - "documentation/task workflows/sequence_labelling_workflow.md"
scenes:
  - kind: title_card
    heading: "One class per frame"
    subheading: "Sequence labelling: where in a sequence something happens"
    footnote: "Sequence Labelling (M2M) · chapter 1"
    narration:
      - "Sequence labeling gives a class to every frame of a sequence, so that the answer says where in the sequence something happens, not only whether it happens."
      - "This chapter covers when to choose it, its synthetic data set, the labels file, the class balance, and how whole sequences of different lengths are batched."

  - kind: html
    page: diagram
    title: "Four sequence tasks, four outputs"
    code_reference: "vision_training/models/sequence/sequence_labeller.py · SequenceLabeller"
    elements:
      # The test sequence of the next scene, shared by the four tasks
      - {type: text, position: [40, 70], text: "test_017424", font: diagram_monospace, anchor: lm}
      - {type: box, box: [430, 35, 620, 105], text: "frame 0", font: diagram_small, outline: blue}
      - {type: box, box: [650, 35, 840, 105], text: "frame 1", font: diagram_small, outline: blue}
      - {type: box, box: [870, 35, 1060, 105], text: "frame 2", font: diagram_small, outline: blue}
      - {type: box, box: [1090, 35, 1280, 105], text: "frame 3", font: diagram_small, outline: blue}
      - {type: text, position: [1330, 70], text: "backbone on every frame,\nthen a temporal module", font: diagram_small, colour: dim, anchor: lm}
      # M2O and CMP: one class per sequence, or per pair of sequences
      - {type: box, box: [40, 160, 400, 240], text: "M2O · classification", font: diagram_small, outline: aqua, appear: 1}
      - {type: box, box: [430, 160, 1280, 240], text: "one class for the whole sequence", font: diagram_small, outline: aqua, appear: 1}
      - {type: text, position: [1330, 200], text: "one answer per sequence", font: diagram_small, colour: dim, anchor: lm, appear: 1}
      - {type: box, box: [40, 280, 400, 360], text: "CMP · comparison", font: diagram_small, outline: aqua, appear: 1}
      - {type: box, box: [430, 280, 840, 360], text: "before sequence", font: diagram_small, outline: aqua, appear: 1}
      - {type: box, box: [870, 280, 1280, 360], text: "after sequence", font: diagram_small, outline: aqua, appear: 1}
      - {type: text, position: [1330, 320], text: "one answer per pair", font: diagram_small, colour: dim, anchor: lm, appear: 1}
      # M2M: a class for every frame, the labels of the test sequence
      - {type: box, box: [40, 420, 400, 500], text: "M2M · labelling", font: diagram_bold, outline: yellow, appear: 2, highlight: [2]}
      - {type: box, box: [430, 420, 620, 500], text: "no_change", font: diagram_small, outline: yellow, appear: 2}
      - {type: box, box: [650, 420, 840, 500], text: "appearing_star", font: diagram_small, outline: yellow, appear: 2}
      - {type: box, box: [870, 420, 1060, 500], text: "appearing_star", font: diagram_small, outline: yellow, appear: 2}
      - {type: box, box: [1090, 420, 1280, 500], text: "disappearing\nrectangle", font: diagram_small, outline: yellow, appear: 2}
      - {type: text, position: [1330, 460], text: "a class per frame,\nany count of each", font: diagram_small, colour: dim, anchor: lm, appear: 2}
      # SEL: a fixed number of frames per wanted class, chosen by a decoding (schematic)
      - {type: box, box: [40, 560, 400, 640], text: "SEL · selection", font: diagram_small, outline: magenta, appear: 3}
      - {type: box, box: [430, 560, 620, 640], text: "unselected", font: diagram_small, outline: border, text_colour: dim, appear: 3}
      - {type: box, box: [650, 560, 840, 640], text: "wanted class A", font: diagram_small, outline: magenta, appear: 3}
      - {type: box, box: [870, 560, 1060, 640], text: "unselected", font: diagram_small, outline: border, text_colour: dim, appear: 3}
      - {type: box, box: [1090, 560, 1280, 640], text: "wanted class B", font: diagram_small, outline: magenta, appear: 3}
      - {type: text, position: [1330, 600], text: "N frames per wanted class,\nchosen by a decoding", font: diagram_small, colour: dim, anchor: lm, appear: 3}
    narration:
      - "The four sequence tasks share the encoder of the frames, the backbone run on every frame, and a temporal module; they differ by what they predict."
      - "The sequence classification gives one class to the whole sequence, and the sequence comparison one class to a pair of sequences, a before and an after."
      - "The sequence labeling gives a class to every frame, any number of frames holding any class: choose it when the frame of the event matters."
      - "The frame selection also scores every frame, but returns a fixed number of frames per wanted class, which its decoding imposes: choose it when that count is known in advance."

  - kind: image
    title: "The synthetic changing shapes"
    code_reference: "vision_training/data/synthetic/create_synthetic_dataset.py · generate_shape_change_sequence"
    image: "figures:sequence_labelling/dataset/sequence_strip.png"
    views:
      - {box: "{{sequence_labelling.dataset.strip_pair_01_box}}", from_sentence: 3}
      - {box: "{{sequence_labelling.dataset.strip_pair_23_box}}", from_sentence: 4}
      - {box: [0, 0, 1720, 700], from_sentence: 5}
    highlights:
      - {box: "{{sequence_labelling.dataset.strip_frame_1_box}}", sentences: [3]}
      - {box: "{{sequence_labelling.dataset.strip_frame_3_box}}", sentences: [4]}
    narration:
      - "The synthetic data set of the task, synthetic changing shapes, holds {{sequence_labelling.dataset.training_sequences:,}} training sequences of two to 12 frames of {{sequence_labelling.dataset.image_size}} pixels, every frame showing five to ten shapes of 35 classes."
      - "From the second frame on, a shape of a random class appears, one of the shapes disappears, or nothing changes, with the same probability among the changes the number of shapes allows."
      - "And every frame draws all its shapes again, with a new size, color, rotation and position: a change is told only by comparing the classes of the shapes with the previous frame."
      - "Here, frame zero shows one star and frame one two of them: frame one is appearing star."
      - "Frame two shows a third star, and frame three still three stars but no rectangle: disappearing rectangle."
      - "That gives {{sequence_labelling.dataset.class_count}} classes: no change, always the label of the first frame, then appearing and disappearing for each of the 35 shape classes."

  - kind: html
    page: diagram
    title: "The labels file and the label mapping"
    code_reference: "vision_training/data/sequence/sequence_dataset.py · SequenceDataset"
    elements:
      - type: listing
        box: [40, 40, 960, 700]
        font: diagram_monospace
        source: {file: "figures:sequence_labelling/listings/labels_entry.txt"}
        highlights:
          - {match: "frame_category_ids|disappearing_trapezoid", sentences: [0]}
          - {match: "\"frames\"", sentences: [3]}
      - type: listing
        box: [1040, 40, 1720, 330]
        font: diagram_monospace
        appear: 1
        source: {file: "figures:sequence_labelling/listings/label_mapping.txt"}
        highlights:
          - {match: "\"1\": 0", sentences: [1]}
      - {type: box, box: [1040, 400, 1720, 560], text: "category left out of the mapping\n→ label -100: no loss, no metric,\nthe end of a segment", font: diagram_small, outline: red, appear: 2, highlight: [2]}
      - {type: box, box: [1040, 590, 1720, 700], text: "one category per frame: not checked", font: diagram_small, outline: yellow, appear: 3, highlight: [3]}
    narration:
      - "A sequence of the labels file lists its frames in order and, in frame category ids, the category of every frame: here no change twice, then disappearing trapezoid."
      - "The label mapping file maps every category to a class index, category one, no change, becoming class zero."
      - "A frame whose category the mapping leaves out gets the label minus 100: the loss and the metrics ignore it, and it ends a segment."
      - "Nothing checks that the list holds exactly one category per frame: a longer list labels padding frames, and a shorter one silently drops real frames, an open item of the suggestions file."

  - kind: image
    title: "The class balance and the position prior"
    image: "figures:sequence_labelling/dataset/class_balance.png"
    highlights:
      - {box: "{{sequence_labelling.dataset.balance_class_panel_box}}", sentences: [0, 1]}
      - {box: "{{sequence_labelling.dataset.balance_position_panel_box}}", sentences: [2, 3]}
    narration:
      - "The record of the run, its data json file, counts the frames of every class: {{sequence_labelling.dataset.no_change_frames:,}} of the {{sequence_labelling.dataset.training_frames:,}} training frames are no change, {{sequence_labelling.dataset.no_change_share:.1%}}."
      - "Each of the 70 change classes holds {{sequence_labelling.dataset.change_class_minimum_frames:,}} to {{sequence_labelling.dataset.change_class_maximum_frames:,}} frames, under 0.8% of the frames each."
      - "The first frame of every sequence is no change by construction, and on the later frames no change falls to {{sequence_labelling.dataset.prior_later_no_change_share:.0%}}."
      - "So a model that only knows the position of a frame already reaches a cross entropy of {{sequence_labelling.dataset.prior_cross_entropy:.2f}}, against {{sequence_labelling.dataset.uniform_cross_entropy:.2f}} for a uniform guess over the {{sequence_labelling.dataset.class_count}} classes."
      - "Keep these two numbers in mind: the next two chapters recognize a failed run by them."

  - kind: image
    title: "Whole sequences, padded batches"
    code_reference: "vision_training/data/sequence/sequence_dataset.py · collate_padded_sequences"
    image: "figures:sequence_labelling/dataset/padded_batch.png"
    highlights:
      - {box: "{{sequence_labelling.batch.row_1_box}}", sentences: [1]}
      - {box: "{{sequence_labelling.batch.grid_box}}", sentences: [2]}
    narration:
      - "Every sequence is one sample, fed whole: a sequence longer than the maximum sequence length, 50 frames here, is left out of its split with a red warning, never cut into windows."
      - "The collate function pads the sequences of a batch to the longest one: black frames, masked out by the sequence mask, and the label minus 100, so the padding never reaches the loss."
      - "These are the first {{sequence_labelling.batch.sequence_count}} test sequences, read by the sequence data set of the repository and padded by its collate function into a batch of {{sequence_labelling.batch.sequence_count}} sequences of {{sequence_labelling.batch.length}} frames."
      - "The backbone then runs on the real frames only, {{sequence_labelling.batch.real_frame_total}} of the {{sequence_labelling.batch.frame_slots}} here, and a step can reach the batch size times 50 frames with long sequences."

  - kind: yaml
    title: "The data settings"
    code_reference: "vision_training/configuration_processing/sequence_checks.py · check_sequence_labelling_configuration"
    source:
      file: vision_training/configurations/sequence_labelling/configuration_synthetic_sequences.yaml
      keys: [ExperimentConfiguration.task, ExperimentConfiguration.batch_size, Data.image_settings,
             Data.sequence_settings, Data.label_mapping]
      comments: false
    highlights:
      - {match: "task:", sentences: [0]}
      - {match: "batch_size|size: 512|keep_ratio", sentences: [1]}
      - {match: "maximum_sequence_length", sentences: [2]}
      - {match: "mode:", sentences: [3]}
    narration:
      - "In the synthetic configuration, the task key selects the sequence labeling trainer, its checks at launch and the M2M code of the run name."
      - "A batch holds 16 sequences of frames resized to 512 pixels, their aspect ratio kept by padding."
      - "The maximum sequence length is the only sequence setting: it gives the T50 token of the run name, and the number of learned frame positions of a transformer."
      - "And the label mapping is multi class: one class per frame among the 71."

  - kind: terminal
    title: "Generate, train, evaluate"
    code_reference: "scripts/data/create_sequence_split_subset.py · create_sequence_split_subset"
    lines:
      - {role: comment, text: "# Data: task = \"sequence_labelling\" in the main block, 250,000 / 50,000 / 50,000 sequences"}
      - {role: command, text: "uv run python -m vision_training.data.synthetic.create_synthetic_dataset"}
      - {role: comment, text: "# test_10000: 10,000 test sequences drawn with the seed 0, linked to the test frames"}
      - {role: command, text: "uv run python -m scripts.data.create_sequence_split_subset"}
      - {role: comment, text: "# Training: its only argument is the configuration"}
      - {role: command, text: "uv run python -m vision_training.main --configuration_path=\"vision_training/configurations/sequence_labelling/configuration_synthetic_sequences.yaml\""}
      - {role: comment, text: "# Any checkpoint again: run_name, iteration and test folder in the main block"}
      - {role: command, text: "uv run python -m scripts.evaluation.evaluate_checkpoint"}
    narration:
      - "The data set is written by the synthetic data set script, its task set to sequence labeling in its main block."
      - "Its full test split of 50,000 sequences took 26 minutes to evaluate at 256 pixels, so the split subset script draws test ten thousand, a fixed subset of 10,000 sequences drawn with the seed zero, whose labels file links to the frames of the full split."
      - "The training takes the synthetic configuration alone; the README run of this series trained it for 2000 iterations, tested on that subset."
      - "And any checkpoint can be evaluated again with the evaluation script, set in its main block like the generator."

  - kind: summary
    title: "Recap"
    items:
      - {text: "M2M: one class per frame, any number of frames per class"}
      - {text: "labels.json: frame_category_ids, one category per frame"}
      - {text: "Unmapped category → label -100: no loss, no metric"}
      - {text: "no_change: {{sequence_labelling.dataset.no_change_share:.1%}} of the frames, always the first one"}
      - {text: "Position prior: cross entropy {{sequence_labelling.dataset.prior_cross_entropy:.2f}}, uniform {{sequence_labelling.dataset.uniform_cross_entropy:.2f}}"}
      - {text: "Whole sequences, padded per batch, longer ones left out"}
    narration:
      - "To recap: one class per frame, unmapped frames ignored, whole sequences padded per batch, and a class balance where no change dominates and always opens a sequence."
      - "The next chapter follows a batch through the model: the encoder of the frames, the recurrent module keeping one vector per frame, the head and the loss."
