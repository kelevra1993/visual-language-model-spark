# Sequence labelling, chapter 3: the evaluation of the README run read file by file (Results.txt, predictions.csv, the
# sample images, class_thresholds.json), which shows a degenerate solution predicting no_change on every frame; the
# segment metrics on the example of documentation/reference/tasks_reference.md and on the run; how to recognize such a
# run; the launches of the experiment plan on the same data; the pitfalls and the export. Coordinates of the html
# scenes are in pixels of the content area (1760 x 740, origin at its top left corner); the figures named
# figures:sequence_labelling/... are made by tutorials/figures/sequence_labelling, the sample image is read from the
# run folder.
series: sequence_labelling
series_title: "Sequence Labelling (M2M)"
chapter: 3
title: "Reading an evaluation: a degenerate solution"
output_name: sequence_labelling_03_reading_an_evaluation
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [sequence_labelling]
references:
  - "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer.compute_segment_results"
  - "vision_training/evaluation/classification/score_curves.py · compute_class_score_curves"
  - "vision_training/evaluation/classification/threshold_finder.py · find_class_thresholds"
  - "vision_training/evaluation/sequence/sequence_metrics.py · compute_sequence_exact_matches"
  - "vision_training/configurations/sequence_labelling/run-1.yaml"
  - "documentation/architecture_benchmarking/sequence_labelling_experiment_plan.md"
  - "documentation/bug_standards.md"
  - "documentation/suggestions.md"
scenes:
  - kind: title_card
    heading: "Reading an evaluation"
    subheading: "A run that looks half right and learned nothing"
    footnote: "Sequence Labelling (M2M) · chapter 3"
    narration:
      - "This chapter reads the evaluation of the README run, which looks acceptable at first sight and is a degenerate solution."
      - "It shows how to recognize one from the evaluation files, what the segment metrics add, how the launches on real settings avoid it, and the pitfalls and export of the task."

  - kind: html
    page: diagram
    title: "The report of the last checkpoint"
    code_reference: "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer.compute_extra_headline_metrics"
    elements:
      - type: listing
        box: [24, 40, 1736, 720]
        font: diagram_monospace_small
        source: {file: "figures:sequence_labelling/listings/results_block.txt"}
        highlights:
          - {match: "^Iteration", sentences: [0]}
          - {match: "^  Accuracy", sentences: [1, 2]}
          - {match: "^  Macro F1", sentences: [3]}
          - {match: "appearing_square|appearing_circle|^   no_change", sentences: [4]}
    narration:
      - "Every evaluation appends its block to the results file: here iteration {{sequence_labelling.evaluation.iteration}}, {{sequence_labelling.evaluation.test_sequences:,}} test sequences of the test ten thousand subset, {{sequence_labelling.predictions.frame_count:,}} labeled frames."
      - "The accuracy is {{sequence_labelling.evaluation.accuracy:.2f}}, which reads like a model right about half of the time."
      - "The balanced accuracy, on the same line, is {{sequence_labelling.evaluation.balanced_accuracy:.4f}}: one over 71, a single class ever right."
      - "The macro F1 is {{sequence_labelling.evaluation.macro_f1:.3f}}, and the top-2 accuracy {{sequence_labelling.evaluation.top_2_accuracy:.4f}}, barely above the accuracy."
      - "The per-class rows confirm it: no change has a recall of one and a precision of {{sequence_labelling.evaluation.accuracy:.2f}}, and every change class a recall of zero."
      - "Evaluations newer than this run write a top-5 accuracy instead, and add a Per Class Recall table: the frame recall of every class with a 95% Korn-Graubard interval over the test sequences."

  - kind: image
    title: "What the predictions file shows"
    code_reference: "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer.build_prediction_rows"
    image: "figures:sequence_labelling/evaluation/no_change_probabilities.png"
    highlights:
      - {box: "{{sequence_labelling.predictions.histogram_panel_box}}", sentences: [1, 2]}
      - {box: "{{sequence_labelling.predictions.position_panel_box}}", sentences: [3]}
    narration:
      - "The predictions file holds one row per labeled frame, its true and predicted classes and the probability of every class."
      - "On the {{sequence_labelling.predictions.first_frame_count:,}} first frames, the probability of no change is {{sequence_labelling.predictions.first_mean:.4f}}: the model knows that a sequence opens with no change."
      - "On the {{sequence_labelling.predictions.later_frame_count:,}} later frames, it stays between {{sequence_labelling.predictions.later_minimum:.2f}} and {{sequence_labelling.predictions.later_maximum:.2f}}, around {{sequence_labelling.predictions.later_mean:.2f}}, which is the share of no change among them."
      - "By frame position, it follows the share of no change at that position, whatever the frame shows."
      - "So its argmax is no change on every one of the {{sequence_labelling.predictions.frame_count:,}} frames."

  - kind: image
    title: "A sample image of the evaluation"
    code_reference: "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer.build_sample_image"
    image: "runs:readme_screenshots/M2M_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128_HAVG.64_MC71/Evaluation/Iteration_2000/Samples/test_000001.png"
    views:
      - {box: [0, 0, 1550, 545], from_sentence: 1}
      - {box: [0, 0, 2068, 1060], from_sentence: 2}
    highlights:
      - {box: [0, 0, 250, 22], sentences: [0]}
      - {box: [2, 26, 206, 50], sentences: [1]}
      - {box: [516, 26, 722, 50], sentences: [1]}
      - {box: [1033, 26, 1238, 50], sentences: [1]}
      - {box: [1550, 26, 1946, 50], sentences: [2]}
      - {box: [2, 541, 298, 568], sentences: [2]}
    narration:
      - "The sample images show the same thing: every frame captioned true over predicted, an X before the wrong ones, and the count of right frames in the bar above."
      - "In the README sample, the first three frames are right only because they are no change."
      - "Both changes, disappearing hollow heptagon and disappearing kite, are predicted no change: a sample whose right frames are all no change is the visual sign of this failure."

  - kind: html
    page: diagram
    title: "Scores that rank by position"
    code_reference: "vision_training/evaluation/classification/score_curves.py · compute_class_score_curves"
    elements:
      - {type: text, position: [40, 40], text: "Macro ROC AUC of the predictions file", font: diagram_bold}
      - type: bars
        box: [40, 100, 1000, 260]
        orientation: horizontal
        label_width: 330
        value_width: 110
        maximum: 1.0
        values: ["{{sequence_labelling.predictions.macro_roc_auc_all_frames}}", "{{sequence_labelling.predictions.macro_roc_auc_later_frames}}"]
        labels: ["all frames (report)", "later frames only"]
        value_labels: ["{{sequence_labelling.predictions.macro_roc_auc_all_frames:.3f}}", "{{sequence_labelling.predictions.macro_roc_auc_later_frames:.3f}}"]
        colours: [blue, aqua]
        highlight: [1]
      - {type: box, box: [628, 92, 632, 270], fill: dim, outline: dim, radius: 0, width: 1}
      - {type: text, position: [630, 300], text: "chance: 0.5", font: diagram_small, colour: dim, anchor: ma}
      - {type: text, position: [40, 400], text: "class_thresholds.json, target precision 0.99", font: diagram_bold, appear: 2}
      - {type: box, box: [40, 450, 1000, 570], text: "no_change: from p ≥ {{sequence_labelling.thresholds.no_change_threshold:.4f}}, recall {{sequence_labelling.thresholds.no_change_recall:.4f}}\nabout the share of first frames among the no_change frames", font: diagram_small, outline: yellow, appear: 2, highlight: [2]}
      - {type: box, box: [40, 600, 1000, 700], text: "{{sequence_labelling.thresholds.null_classes}} change classes: null, the precision 0.99 never reached", font: diagram_small, outline: red, appear: 3, highlight: [3]}
      - {type: box, box: [1080, 100, 1720, 420], text: "A change class is never\nthe first frame, and the model\ngives it almost nothing there:\nits ROC AUC over all the frames\nrewards the position alone", font: diagram_small, outline: aqua, appear: 1}
    narration:
      - "The macro ROC AUC of the report, {{sequence_labelling.evaluation.macro_roc_auc:.2f}}, looks like a weak signal."
      - "Computed again from the predictions file on the later frames only, it falls to {{sequence_labelling.predictions.macro_roc_auc_later_frames:.2f}}, chance: a change class ranks above chance only because the model gives it almost nothing on the first frames, which are never a change."
      - "The thresholds file tells the same story: no change reaches a precision of 0.99 from a probability of {{sequence_labelling.thresholds.no_change_threshold:.2f}}, with a recall of {{sequence_labelling.thresholds.no_change_recall:.2f}}, about the share of first frames among the no change frames."
      - "And the {{sequence_labelling.thresholds.null_classes}} change classes get a null threshold, their precision never reaching 0.99."

  - kind: html
    page: diagram
    title: "The segment metrics"
    code_reference: "vision_training/evaluation/sequence/segment_metrics.py · compute_segment_metrics"
    elements:
      # The example of the tasks reference: a true sequence A A A A A B B B B B predicted A A B A A B B A B B
      - {type: text, position: [40, 75], text: "true", font: diagram_bold, anchor: lm}
      - {type: box, box: [200, 40, 300, 110], text: "A", fill: blue}
      - {type: box, box: [310, 40, 410, 110], text: "A", fill: blue}
      - {type: box, box: [420, 40, 520, 110], text: "A", fill: blue}
      - {type: box, box: [530, 40, 630, 110], text: "A", fill: blue}
      - {type: box, box: [640, 40, 740, 110], text: "A", fill: blue}
      - {type: box, box: [750, 40, 850, 110], text: "B", fill: magenta}
      - {type: box, box: [860, 40, 960, 110], text: "B", fill: magenta}
      - {type: box, box: [970, 40, 1070, 110], text: "B", fill: magenta}
      - {type: box, box: [1080, 40, 1180, 110], text: "B", fill: magenta}
      - {type: box, box: [1190, 40, 1290, 110], text: "B", fill: magenta}
      - {type: text, position: [40, 185], text: "predicted", font: diagram_bold, anchor: lm}
      - {type: box, box: [200, 150, 300, 220], text: "A", fill: blue}
      - {type: box, box: [310, 150, 410, 220], text: "A", fill: blue}
      - {type: box, box: [420, 150, 520, 220], text: "B", fill: magenta}
      - {type: box, box: [530, 150, 630, 220], text: "A", fill: blue}
      - {type: box, box: [640, 150, 740, 220], text: "A", fill: blue}
      - {type: box, box: [750, 150, 850, 220], text: "B", fill: magenta}
      - {type: box, box: [860, 150, 960, 220], text: "B", fill: magenta}
      - {type: box, box: [970, 150, 1070, 220], text: "A", fill: blue}
      - {type: box, box: [1080, 150, 1180, 220], text: "B", fill: magenta}
      - {type: box, box: [1190, 150, 1290, 220], text: "B", fill: magenta}
      # The segments: two true ones, six predicted ones
      - {type: box, box: [194, 34, 746, 116], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [744, 34, 1296, 116], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [194, 144, 416, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [414, 144, 526, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [524, 144, 746, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [744, 144, 966, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [964, 144, 1076, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [1074, 144, 1296, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: text, position: [1350, 75], text: "{{sequence_labelling.segments.readme_true_segments}} true segments", font: diagram_small, colour: dim, anchor: lm, appear: 1}
      - {type: text, position: [1350, 185], text: "{{sequence_labelling.segments.readme_predicted_segments}} predicted segments", font: diagram_small, colour: dim, anchor: lm, appear: 1}
      # The metrics of the example, computed by compute_segment_metrics
      - {type: box, box: [40, 280, 560, 400], text: "frames right\n{{sequence_labelling.segments.readme_frame_accuracy:.0%}}", font: diagram_text, outline: blue, appear: 1}
      - {type: box, box: [620, 280, 1140, 400], text: "edit score {{sequence_labelling.segments.readme_edit_score:.2f}}\nA B against A B A B A B", font: diagram_text, outline: aqua, appear: 2, highlight: [2]}
      - {type: box, box: [1200, 280, 1720, 400], text: "segment F1 {{sequence_labelling.segments.readme_f1_at_10:.2f}} at 10%\n{{sequence_labelling.segments.readme_f1_at_50:.0f}} at 50%", font: diagram_text, outline: violet, appear: 3, highlight: [3]}
      # The README run: one predicted segment per sequence
      - {type: box, box: [40, 470, 1720, 700], text: "README run: {{sequence_labelling.evaluation.true_segments:,}} true segments, {{sequence_labelling.evaluation.predicted_segments:,}} predicted in {{sequence_labelling.evaluation.test_sequences:,}} sequences\nedit score {{sequence_labelling.evaluation.edit_score:.4f}} · segment F1 {{sequence_labelling.evaluation.segment_f1_10:.4f}} at 10%, {{sequence_labelling.evaluation.segment_f1_50:.4f}} at 50%", font: diagram_text, outline: yellow, appear: 4, highlight: [4]}
    narration:
      - "The frame metrics do not see fragmentation, so the segment metrics score the events: a segment is a run of consecutive frames of one class, an unlabeled frame ending it."
      - "In the example of the tasks reference, the prediction gets {{sequence_labelling.segments.readme_frame_accuracy:.0%}} of its frames right, but cuts the two true segments into six."
      - "The edit score, one minus the edit distance between the orders of the segment classes over the larger number of segments, is {{sequence_labelling.segments.readme_edit_score:.2f}}."
      - "A predicted segment is right when it overlaps the true segment of its class by enough intersection over union, each true segment matched once: the segment F1 is {{sequence_labelling.segments.readme_f1_at_10:.1f}} at 10%, and zero at 50%."
      - "On the README run, one predicted segment per sequence faces {{sequence_labelling.evaluation.true_segments:,}} true ones: an edit score of {{sequence_labelling.evaluation.edit_score:.2f}}, and a segment F1 of {{sequence_labelling.evaluation.segment_f1_10:.2f}} at 10% and {{sequence_labelling.evaluation.segment_f1_50:.2f}} at 50%."

  - kind: html
    page: diagram
    title: "Recognizing a degenerate solution"
    elements:
      - {type: text, position: [40, 40], text: "The report", font: diagram_bold}
      - {type: text, position: [900, 40], text: "equals", font: diagram_bold}
      - {type: box, box: [40, 100, 820, 190], text: "Accuracy {{sequence_labelling.evaluation.accuracy:.4f}}", font: diagram_text, outline: blue, highlight: [0]}
      - {type: box, box: [900, 100, 1720, 190], text: "share of no_change test frames {{sequence_labelling.segments.no_change_test_frames:,}} / {{sequence_labelling.segments.test_frames:,}}", font: diagram_small, outline: blue, highlight: [0]}
      - {type: box, box: [40, 210, 820, 300], text: "Balanced accuracy {{sequence_labelling.evaluation.balanced_accuracy:.4f}}", font: diagram_text, outline: aqua, highlight: [0]}
      - {type: box, box: [900, 210, 1720, 300], text: "1 / {{sequence_labelling.dataset.class_count}}: a single class right", font: diagram_small, outline: aqua, highlight: [0]}
      - {type: box, box: [40, 320, 820, 410], text: "Training loss {{sequence_labelling.training.train_total_loss.mean_after_500:.2f}} after iteration 500", font: diagram_text, outline: violet, highlight: [0]}
      - {type: box, box: [900, 320, 1720, 410], text: "position prior {{sequence_labelling.dataset.prior_cross_entropy:.2f}}", font: diagram_small, outline: violet, highlight: [0]}
      - {type: box, box: [40, 430, 820, 520], text: "Predicted segments {{sequence_labelling.evaluation.predicted_segments:,}}", font: diagram_text, outline: yellow, appear: 1, highlight: [1]}
      - {type: box, box: [900, 430, 1720, 520], text: "test sequences {{sequence_labelling.evaluation.test_sequences:,}}", font: diagram_small, outline: yellow, appear: 1, highlight: [1]}
      - {type: box, box: [40, 540, 820, 630], text: "Sequence exact match {{sequence_labelling.evaluation.sequence_exact_match:.4f}}", font: diagram_text, outline: magenta, appear: 1, highlight: [1]}
      - {type: box, box: [900, 540, 1720, 630], text: "{{sequence_labelling.evaluation.sequences_without_change}} test sequences without any change", font: diagram_small, outline: magenta, appear: 1, highlight: [1]}
      - {type: text, position: [880, 690], text: "Read first: balanced accuracy, macro F1, segment metrics", font: diagram_bold, colour: accent, anchor: mm, appear: 2}
    narration:
      - "Put together, a degenerate solution has its accuracy equal to the share of the majority class, its balanced accuracy at one over the number of classes, and its loss on the cross entropy of a prior."
      - "For a sequence task, add one predicted segment per sequence, and an exact match equal to the share of the sequences without any change, {{sequence_labelling.evaluation.sequences_without_change}} of the {{sequence_labelling.evaluation.test_sequences:,}}."
      - "Faced with a run of your own, read the balanced accuracy, the macro F1 and the segment metrics first, and compute the prior of your data before trusting a loss curve."
      - "The suggestions file lists this run as left to redo, with a longer training and another learning rate."

  - kind: yaml
    title: "The launches of the experiment plan"
    code_reference: "documentation/architecture_benchmarking/sequence_labelling_experiment_plan.md"
    source:
      file: vision_training/configurations/sequence_labelling/run-1.yaml
      keys: [ExperimentConfiguration.batch_size, Optimization.exponential_moving_average, Data.image_settings,
             TemporalModel.type, TemporalModel.causal, ClassificationHead.global_pooling,
             ClassificationHead.class_weighting]
      comments: false
    highlights:
      - {match: "type: \"lstm\"|causal|global_pooling|class_weighting|size: 256|batch_size", sentences: [0]}
      - {match: "exponential_moving_average|activated: True|decay", sentences: [1]}
    narration:
      - "The launches of the sequence labeling experiment plan, run one to run 50, start from other values: a causal LSTM, flatten pooling, balanced class weights, frames of 256 pixels and batches of 64 sequences."
      - "They keep a moving average of the weights and are compared on the test macro F1 of the averaged weights, which weighs every change as much as the frequent no change frames."
      - "At iteration 2000 of the learning rate stage, the launches at 0.001 reach a macro F1 of 0.024 on average and still rise, so the later stages train 6000 iterations."
      - "One launch at 0.002 stayed at 0.0068 from iteration 500 on, the score of a model that only learns that the first frame is no change: the same failure, caught by the same metric."

  - kind: html
    page: diagram
    title: "Pitfalls"
    elements:
      - {type: box, box: [40, 60, 1720, 220], text: "test_10000 holds a copy of the labels and a link to the frames of the full test split:\ngenerating the data set again makes its labels name other frames, without any error  (create_sequence_split_subset)", font: diagram_small, outline: red, highlight: [0]}
      - {type: box, box: [40, 280, 1720, 440], text: "A causal module with Backbone.normalization.feature_map_normalization \"sequence\":\nthe statistics of every backbone layer come from the whole sequence, future frames included  (B8)", font: diagram_small, outline: yellow, appear: 1, highlight: [1]}
      - {type: box, box: [40, 500, 1720, 660], text: "A sequence without any labelled frame counts as an exact match,\nand a batch without any labelled frame gives a NaN loss  (L11)", font: diagram_small, outline: violet, appear: 2, highlight: [2]}
    narration:
      - "Imagine that you generate the data set again: the test ten thousand subset holds a copy of the labels and a link to the frames of the full test split, so its labels name other frames, without any error."
      - "If, for instance, you pair a causal module with the sequence normalization of the backbone, it still sees the future, the statistics of every layer coming from the whole sequence."
      - "And a sequence without any labeled frame counts as an exact match."

  - kind: html
    page: diagram
    title: "The export"
    code_reference: "vision_training/models/sequence/inference_sequence_model.py · InferenceSequenceModel"
    elements:
      - {type: box, box: [40, 160, 520, 330], text: "images\n[B, T, 3, S, S]\nfloat32 BGR in [0, 255]", font: diagram_small, outline: blue}
      - {type: arrow, points: [[520, 245], [615, 245]], appear: -1}
      - {type: box, box: [620, 160, 1140, 330], text: "sequence_labeller_torchscript\nsequence_labeller_onnx\ninput normalization inside", font: diagram_small, outline: violet}
      - {type: arrow, points: [[1140, 245], [1235, 245]]}
      - {type: box, box: [1240, 160, 1720, 330], text: "class_probabilities\n[B, T, K]", font: diagram_small, outline: aqua}
      - {type: box, box: [240, 460, 1520, 620], text: "No sequence mask: the sequences of one request share T,\nfrom 1 to Data.sequence_settings.maximum_sequence_length", font: diagram_text, outline: yellow, appear: 1, highlight: [1]}
    narration:
      - "The export writes sequence labeler in Torch Script and ONNX: images of B by T by three by S by S in, the class probabilities of B by T by K out, the input normalization inside the model."
      - "It has no sequence mask, so every sequence of one request has the same number of frames, from one to the maximum sequence length."

  - kind: summary
    title: "Recap"
    items:
      - {text: "Accuracy {{sequence_labelling.evaluation.accuracy:.2f}} = the share of no_change frames"}
      - {text: "Balanced accuracy {{sequence_labelling.evaluation.balanced_accuracy:.4f}} = 1/71: one class right"}
      - {text: "predictions.csv: p(no_change) follows the frame position"}
      - {text: "ROC AUC on the later frames: {{sequence_labelling.predictions.macro_roc_auc_later_frames:.2f}}"}
      - {text: "Segment metrics: events, not frames"}
      - {text: "Real-data launches: run-*.yaml, macro F1 of the averaged weights"}
      - {text: "Export: [B, T, 3, S, S] → [B, T, K], no mask"}
    narration:
      - "To recap: compare every metric with its trivial value, read the predictions by frame position, and score the events with the segment metrics."
      - "The next series, sequence comparison, puts two sequences side by side: a before and an after member, their padding and their fusion."
