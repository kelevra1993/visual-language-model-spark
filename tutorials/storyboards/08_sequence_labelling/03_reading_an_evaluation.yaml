# Sequence labelling, chapter 3: the evaluation of the README run read file by file (Results.txt, predictions.csv, the
# sample images, class_thresholds.json), which shows a degenerate solution predicting no_change on every frame; the
# segment metrics on the example of documentation/reference/tasks_reference.md and on the run; how to recognize such a
# run; the experiment plan on the same data and the settings it kept, shown in configuration_example.yaml; the
# pitfalls and the export. Coordinates of the html scenes are in pixels of the content area (1760 x 740, origin at its
# top left corner); the figures named figures:sequence_labelling/... are made by tutorials/figures/sequence_labelling,
# the sample image is read from the run folder.
series: sequence_labelling
series_title: "Sequence Labelling (M2M)"
chapter: 3
title: "Reading an evaluation: a degenerate solution"
output_name: sequence_labelling_03_reading_an_evaluation
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [sequence_labelling]
references:
  - "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer.compute_segment_results"
  - "vision_training/evaluation/classification/score_curves.py · compute_class_score_curves"
  - "vision_training/evaluation/classification/threshold_finder.py · find_class_thresholds"
  - "vision_training/evaluation/sequence/sequence_metrics.py · compute_sequence_exact_matches"
  - "documentation/architecture_benchmarking/sequence_labelling_experiment_plan.md"
  - "vision_training/deployment/input_contract.py · build_input_contract"
  - "documentation/bug_standards.md"
  - "documentation/suggestions.md"
scenes:
  - kind: title_card
    heading: "Reading an evaluation"
    subheading: "A run that looks half right and learned nothing"
    footnote: "Sequence Labelling (M2M) · the third chapter"
    narration:
      - "This chapter reads the evaluation of the README run, which looks acceptable at first sight and is a degenerate solution."
      - "It shows how to recognize one from the evaluation files, what the segment metrics add, how the settings kept by the experiment plan avoid it, and the pitfalls and export of the task."

  - kind: html
    page: diagram
    title: "The report of the last checkpoint"
    code_reference: "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer.compute_extra_headline_metrics"
    elements:
      - type: listing
        box: [24, 40, 1736, 720]
        font: diagram_monospace_small
        source: {file: "figures:sequence_labelling/listings/results_block.txt"}
        highlights:
          - {match: "^Iteration", sentences: [0]}
          - {match: "^  Accuracy", sentences: [1, 2]}
          - {match: "^  Macro F1", sentences: [3]}
          - {match: "appearing_square|appearing_circle|^   no_change", sentences: [4]}
    # The top-2 accuracy is the name of a metric of the report of this run
    literal_numbers: [top-2]
    narration:
      - "Every evaluation appends its block to the results file: here iteration {{sequence_labelling.evaluation.iteration}}, {{sequence_labelling.evaluation.test_sequences:,}} test sequences of the test {{sequence_labelling.evaluation.test_sequences:words}} subset, {{sequence_labelling.predictions.frame_count:,}} labeled frames."
      - "The accuracy is {{sequence_labelling.evaluation.accuracy:percent}}, which reads like a model right about half of the time."
      - "The balanced accuracy, on the same line, is {{sequence_labelling.evaluation.balanced_accuracy:percent}}: one over {{sequence_labelling.dataset.class_count}}, a single class ever right."
      - "The macro F1 is {{sequence_labelling.evaluation.macro_f1:percent}}, and the top-2 accuracy {{sequence_labelling.evaluation.top_2_accuracy:percent}}, barely above the accuracy."
      - "The per-class rows confirm it: no change has a recall of {{sequence_labelling.evaluation.no_change_recall:percent}}, a precision of {{sequence_labelling.evaluation.no_change_precision:percent}}, and every change class a recall of {{sequence_labelling.evaluation.change_class_maximum_recall:percent}}."
      - "Evaluations newer than this run write the rates as percentages, a top-{{constant:vision_training/evaluation/classification/classification_metrics.py#TOP_K_ACCURACY_CLASSES}} accuracy instead, and a Per Class Recall table: the frame recall of every class with a {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} Korn-Graubard interval over the test sequences."

  - kind: image
    title: "What the predictions file shows"
    code_reference: "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer.build_prediction_rows"
    image: "figures:sequence_labelling/evaluation/no_change_probabilities.png"
    highlights:
      - {box: "{{sequence_labelling.predictions.histogram_panel_box}}", sentences: [1, 2]}
      - {box: "{{sequence_labelling.predictions.position_panel_box}}", sentences: [3]}
    narration:
      - "The predictions file holds one row per labeled frame, its true and predicted classes and the probability of every class."
      - "On the {{sequence_labelling.predictions.first_frame_count:,}} first frames, the probability of no change is {{sequence_labelling.predictions.first_mean:.2%}}: the model knows that a sequence opens with no change."
      - "On the {{sequence_labelling.predictions.later_frame_count:,}} later frames, it stays between {{sequence_labelling.predictions.later_minimum:.2f}} and {{sequence_labelling.predictions.later_maximum:.2f}}, around {{sequence_labelling.predictions.later_mean:.2f}}, which is the share of no change among them."
      - "By frame position, it follows the share of no change at that position, whatever the frame shows."
      - "So its argmax is no change on every one of the {{sequence_labelling.predictions.frame_count:,}} frames."

  - kind: image
    title: "A sample image of the evaluation"
    code_reference: "vision_training/trainers/sequence_labelling_trainer.py · SequenceLabellingTrainer.build_sample_image"
    image: "runs:readme_screenshots/M2M_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64_T50_GRU1x128_HAVG.64_MC71/Evaluation/Iteration_2000/Samples/test_000001.png"
    views:
      - {box: [0, 0, 1550, 545], from_sentence: 1}
      - {box: [0, 0, 2068, 1060], from_sentence: 2}
    highlights:
      - {box: [0, 0, 250, 22], sentences: [0]}
      - {box: [2, 26, 206, 50], sentences: [1]}
      - {box: [516, 26, 722, 50], sentences: [1]}
      - {box: [1033, 26, 1238, 50], sentences: [1]}
      - {box: [1550, 26, 1946, 50], sentences: [2]}
      - {box: [2, 541, 298, 568], sentences: [2]}
    narration:
      - "The sample images show the same thing: every frame captioned true over predicted, an X before the wrong ones, and the count of right frames in the bar above."
      - "In the README sample, the first {{sequence_labelling.sample.no_change_frames:words}} frames are right only because they are no change."
      - "Both changes, disappearing hollow heptagon and disappearing kite, are predicted no change: a sample whose right frames are all no change is the visual sign of this failure."

  - kind: html
    page: diagram
    title: "Scores that rank by position"
    code_reference: "vision_training/evaluation/classification/score_curves.py · compute_class_score_curves"
    # The ROC AUC of a ranking by chance, a property of the metric, written as a percentage like the rates of the report
    literal_numbers: ["50"]
    elements:
      - {type: text, position: [40, 40], text: "Macro ROC AUC of the predictions file", font: diagram_bold}
      - type: bars
        box: [40, 100, 1000, 260]
        orientation: horizontal
        label_width: 330
        value_width: 110
        maximum: 1.0
        values: ["{{sequence_labelling.predictions.macro_roc_auc_all_frames}}", "{{sequence_labelling.predictions.macro_roc_auc_later_frames}}"]
        labels: ["all frames (report)", "later frames only"]
        value_labels: ["{{sequence_labelling.predictions.macro_roc_auc_all_frames:percent}}", "{{sequence_labelling.predictions.macro_roc_auc_later_frames:percent}}"]
        colours: [blue, aqua]
        highlight: [1]
      - {type: box, box: [628, 92, 632, 270], fill: dim, outline: dim, radius: 0, width: 1}
      - {type: text, position: [630, 300], text: "chance: 50 %", font: diagram_small, colour: dim, anchor: ma}
      - {type: text, position: [40, 400], text: "class_thresholds.json, target precision {{sequence_labelling.thresholds.target_precision:percent_label}}", font: diagram_bold, appear: 2}
      - {type: box, box: [40, 450, 1000, 570], text: "no_change: from p ≥ {{sequence_labelling.thresholds.no_change_threshold:.4f}}, recall {{sequence_labelling.thresholds.no_change_recall:percent}}\nabout the share of first frames among the no_change frames", font: diagram_small, outline: yellow, appear: 2, highlight: [2]}
      - {type: box, box: [40, 600, 1000, 700], text: "{{sequence_labelling.thresholds.null_classes}} change classes: null, the precision {{sequence_labelling.thresholds.target_precision:percent_label}} never reached", font: diagram_small, outline: red, appear: 3, highlight: [3]}
      - {type: box, box: [1080, 100, 1720, 420], text: "A change class is never\nthe first frame, and the model\ngives it almost nothing there:\nits ROC AUC over all the frames\nrewards the position alone", font: diagram_small, outline: aqua, appear: 1}
    narration:
      - "The macro ROC AUC of the report, {{sequence_labelling.evaluation.macro_roc_auc:percent}}, looks like a weak signal."
      - "Computed again from the predictions file on the later frames only, it falls to {{sequence_labelling.predictions.macro_roc_auc_later_frames:percent}}, chance: a change class ranks above chance only because the model gives it almost nothing on the first frames, which are never a change."
      - "The thresholds file tells the same story: no change reaches a precision of {{sequence_labelling.thresholds.target_precision:percent_label}} from a probability of {{sequence_labelling.thresholds.no_change_threshold:.2f}}, with a recall of {{sequence_labelling.thresholds.no_change_recall:percent}}, about the share of first frames among the no change frames."
      - "And the {{sequence_labelling.thresholds.null_classes}} change classes get a null threshold, their precision never reaching {{sequence_labelling.thresholds.target_precision:percent_label}}."

  - kind: html
    page: diagram
    title: "The segment metrics"
    code_reference: "vision_training/evaluation/sequence/segment_metrics.py · compute_segment_metrics"
    elements:
      # The example of the tasks reference: a true sequence A A A A A B B B B B predicted A A B A A B B A B B
      - {type: text, position: [40, 75], text: "true", font: diagram_bold, anchor: lm}
      - {type: box, box: [200, 40, 300, 110], text: "A", fill: blue}
      - {type: box, box: [310, 40, 410, 110], text: "A", fill: blue}
      - {type: box, box: [420, 40, 520, 110], text: "A", fill: blue}
      - {type: box, box: [530, 40, 630, 110], text: "A", fill: blue}
      - {type: box, box: [640, 40, 740, 110], text: "A", fill: blue}
      - {type: box, box: [750, 40, 850, 110], text: "B", fill: magenta}
      - {type: box, box: [860, 40, 960, 110], text: "B", fill: magenta}
      - {type: box, box: [970, 40, 1070, 110], text: "B", fill: magenta}
      - {type: box, box: [1080, 40, 1180, 110], text: "B", fill: magenta}
      - {type: box, box: [1190, 40, 1290, 110], text: "B", fill: magenta}
      - {type: text, position: [40, 185], text: "predicted", font: diagram_bold, anchor: lm}
      - {type: box, box: [200, 150, 300, 220], text: "A", fill: blue}
      - {type: box, box: [310, 150, 410, 220], text: "A", fill: blue}
      - {type: box, box: [420, 150, 520, 220], text: "B", fill: magenta}
      - {type: box, box: [530, 150, 630, 220], text: "A", fill: blue}
      - {type: box, box: [640, 150, 740, 220], text: "A", fill: blue}
      - {type: box, box: [750, 150, 850, 220], text: "B", fill: magenta}
      - {type: box, box: [860, 150, 960, 220], text: "B", fill: magenta}
      - {type: box, box: [970, 150, 1070, 220], text: "A", fill: blue}
      - {type: box, box: [1080, 150, 1180, 220], text: "B", fill: magenta}
      - {type: box, box: [1190, 150, 1290, 220], text: "B", fill: magenta}
      # The segments: two true ones, six predicted ones
      - {type: box, box: [194, 34, 746, 116], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [744, 34, 1296, 116], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [194, 144, 416, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [414, 144, 526, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [524, 144, 746, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [744, 144, 966, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [964, 144, 1076, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: box, box: [1074, 144, 1296, 226], fill: null, outline: yellow, width: 4, appear: 1}
      - {type: text, position: [1350, 75], text: "{{sequence_labelling.segments.readme_true_segments}} true segments", font: diagram_small, colour: dim, anchor: lm, appear: 1}
      - {type: text, position: [1350, 185], text: "{{sequence_labelling.segments.readme_predicted_segments}} predicted segments", font: diagram_small, colour: dim, anchor: lm, appear: 1}
      # The metrics of the example, computed by compute_segment_metrics
      - {type: box, box: [40, 280, 560, 400], text: "frames right\n{{sequence_labelling.segments.readme_frame_accuracy:percent}}", font: diagram_text, outline: blue, appear: 1}
      - {type: box, box: [620, 280, 1140, 400], text: "edit score {{sequence_labelling.segments.readme_edit_score:percent}}\nA B against A B A B A B", font: diagram_text, outline: aqua, appear: 2, highlight: [2]}
      - {type: box, box: [1200, 280, 1720, 400], text: "segment F1 {{sequence_labelling.segments.readme_f1_at_10:percent}} at {{constant:vision_training/evaluation/sequence/segment_metrics.py#SEGMENT_OVERLAP_THRESHOLDS[0]:.0%}}\n{{sequence_labelling.segments.readme_f1_at_50:percent}} at {{constant:vision_training/evaluation/sequence/segment_metrics.py#SEGMENT_OVERLAP_THRESHOLDS[2]:.0%}}", font: diagram_text, outline: violet, appear: 3, highlight: [3]}
      # The README run: one predicted segment per sequence
      - {type: box, box: [40, 470, 1720, 700], text: "README run: {{sequence_labelling.evaluation.true_segments:,}} true segments, {{sequence_labelling.evaluation.predicted_segments:,}} predicted in {{sequence_labelling.evaluation.test_sequences:,}} sequences\nedit score {{sequence_labelling.evaluation.edit_score:percent}} · segment F1 {{sequence_labelling.evaluation.segment_f1_10:percent}} at {{constant:vision_training/evaluation/sequence/segment_metrics.py#SEGMENT_OVERLAP_THRESHOLDS[0]:.0%}}, {{sequence_labelling.evaluation.segment_f1_50:percent}} at {{constant:vision_training/evaluation/sequence/segment_metrics.py#SEGMENT_OVERLAP_THRESHOLDS[2]:.0%}}", font: diagram_text, outline: yellow, appear: 4, highlight: [4]}
    narration:
      - "The frame metrics do not see fragmentation, so the segment metrics score the events: a segment is a run of consecutive frames of one class, an unlabeled frame ending it."
      - "In the example of the tasks reference, the prediction gets {{sequence_labelling.segments.readme_frame_accuracy:percent}} of its frames right, but cuts the {{sequence_labelling.segments.readme_true_segments:words}} true segments into {{sequence_labelling.segments.readme_predicted_segments:words}}."
      - "The edit score, one minus the edit distance between the orders of the segment classes over the larger number of segments, is {{sequence_labelling.segments.readme_edit_score:percent}}."
      - "A predicted segment is right when it overlaps the true segment of its class by enough intersection over union, each true segment matched once: the segment F1 is {{sequence_labelling.segments.readme_f1_at_10:percent}} at {{constant:vision_training/evaluation/sequence/segment_metrics.py#SEGMENT_OVERLAP_THRESHOLDS[0]:.0%}}, and {{sequence_labelling.segments.readme_f1_at_50:percent}} at {{constant:vision_training/evaluation/sequence/segment_metrics.py#SEGMENT_OVERLAP_THRESHOLDS[2]:.0%}}."
      - "On the README run, one predicted segment per sequence faces {{sequence_labelling.evaluation.true_segments:,}} true ones: an edit score of {{sequence_labelling.evaluation.edit_score:percent}}, and a segment F1 of {{sequence_labelling.evaluation.segment_f1_10:percent}} at {{constant:vision_training/evaluation/sequence/segment_metrics.py#SEGMENT_OVERLAP_THRESHOLDS[0]:.0%}} and {{sequence_labelling.evaluation.segment_f1_50:percent}} at {{constant:vision_training/evaluation/sequence/segment_metrics.py#SEGMENT_OVERLAP_THRESHOLDS[2]:.0%}}."

  - kind: html
    page: diagram
    title: "Recognizing a degenerate solution"
    # The balanced accuracy of a model right on one class only, one over the number of classes
    literal_numbers: ["1"]
    elements:
      - {type: text, position: [40, 40], text: "The report", font: diagram_bold}
      - {type: text, position: [900, 40], text: "equals", font: diagram_bold}
      - {type: box, box: [40, 100, 820, 190], text: "Accuracy {{sequence_labelling.evaluation.accuracy:percent}}", font: diagram_text, outline: blue, highlight: [0]}
      - {type: box, box: [900, 100, 1720, 190], text: "share of no_change test frames {{sequence_labelling.segments.no_change_test_frames:,}} / {{sequence_labelling.segments.test_frames:,}}", font: diagram_small, outline: blue, highlight: [0]}
      - {type: box, box: [40, 210, 820, 300], text: "Balanced accuracy {{sequence_labelling.evaluation.balanced_accuracy:percent}}", font: diagram_text, outline: aqua, highlight: [0]}
      - {type: box, box: [900, 210, 1720, 300], text: "1 / {{sequence_labelling.dataset.class_count}}: a single class right", font: diagram_small, outline: aqua, highlight: [0]}
      - {type: box, box: [40, 320, 820, 410], text: "Training loss {{sequence_labelling.training.train_total_loss.late_mean:.2f}} after iteration {{sequence_labelling.training.late_mean_start_iteration}}", font: diagram_text, outline: violet, highlight: [0]}
      - {type: box, box: [900, 320, 1720, 410], text: "position prior {{sequence_labelling.dataset.prior_cross_entropy:.2f}}", font: diagram_small, outline: violet, highlight: [0]}
      - {type: box, box: [40, 430, 820, 520], text: "Predicted segments {{sequence_labelling.evaluation.predicted_segments:,}}", font: diagram_text, outline: yellow, appear: 1, highlight: [1]}
      - {type: box, box: [900, 430, 1720, 520], text: "test sequences {{sequence_labelling.evaluation.test_sequences:,}}", font: diagram_small, outline: yellow, appear: 1, highlight: [1]}
      - {type: box, box: [40, 540, 820, 630], text: "Sequence exact match {{sequence_labelling.evaluation.sequence_exact_match:percent}}", font: diagram_text, outline: magenta, appear: 1, highlight: [1]}
      - {type: box, box: [900, 540, 1720, 630], text: "{{sequence_labelling.evaluation.sequences_without_change}} test sequences without any change", font: diagram_small, outline: magenta, appear: 1, highlight: [1]}
      - {type: text, position: [880, 690], text: "Read first: balanced accuracy, macro F1, segment metrics", font: diagram_bold, colour: accent, anchor: mm, appear: 2}
    narration:
      - "Put together, a degenerate solution has its accuracy equal to the share of the majority class, its balanced accuracy at one over the number of classes, and its loss on the cross entropy of a prior."
      - "For a sequence task, add one predicted segment per sequence, and an exact match equal to the share of the sequences without any change, {{sequence_labelling.evaluation.sequences_without_change}} of the {{sequence_labelling.evaluation.test_sequences:,}}."
      - "Faced with a run of your own, read the balanced accuracy, the macro F1 and the segment metrics first, and compute the prior of your data before trusting a loss curve."
      - "The suggestions file lists this run as left to redo, and the experiment plan shows what it lacked."

  # The benchmark was trained once and is not trained again: the plan holds its scores, and the configuration example
  # the settings it kept, so the scene reads no run folder and the narration quotes no score
  - kind: yaml
    title: "What the experiment plan kept"
    code_reference: "documentation/architecture_benchmarking/sequence_labelling_experiment_plan.md"
    source:
      file: vision_training/configurations/sequence_labelling/configuration_example.yaml
      keys: [ExperimentConfiguration.learning_rate, Backbone.pretrained.experiment_folder, TemporalModel.type,
             TemporalModel.number_layers, TemporalModel.bidirectional, TemporalModel.causal,
             ClassificationHead.global_pooling, ClassificationHead.class_weighting]
      comments: false
    highlights:
      - {match: "class_weighting", sentences: [2, 3]}
      - {key: ExperimentConfiguration.learning_rate, sentences: [3]}
      - {key: TemporalModel.type, sentences: [3]}
      - {key: TemporalModel.number_layers, sentences: [3, 4]}
      - {key: TemporalModel.bidirectional, sentences: [3]}
      - {key: TemporalModel.causal, sentences: [3]}
      - {key: ClassificationHead.global_pooling, sentences: [3, 4]}
      - {key: Backbone.pretrained.experiment_folder, sentences: [4]}
    # The learning rate is read with all its decimals, the value a launch copies
    exact_facts: ["config:vision_training/configurations/sequence_labelling/configuration_example.yaml#ExperimentConfiguration.learning_rate"]
    narration:
      - "The sequence labeling benchmark trained its experiment plan once, on the same changing shapes, one setting at a time, every score recorded in the plan."
      - "Its launches were compared on the test macro F1, which weighs every change as much as the frequent no change frames."
      - "Without class weights, as in the README run, one launch stayed at the score of a model predicting no change on every frame: the same failure, caught by the same metric."
      - "Suppose you start on sequences of your own: the configuration example holds what the plan kept, balanced class weights, a learning rate of {{config:vision_training/configurations/sequence_labelling/configuration_example.yaml#ExperimentConfiguration.learning_rate}}, a bidirectional LSTM of {{config:vision_training/configurations/sequence_labelling/configuration_example.yaml#TemporalModel.number_layers:words}} layers and flatten pooling."
      - "The {{config:vision_training/configurations/sequence_labelling/configuration_example.yaml#TemporalModel.number_layers:words}} layers and the flatten pooling were kept with a pre-trained backbone, which the example leaves off: its experiment folder is null."

  - kind: html
    page: diagram
    title: "Pitfalls"
    elements:
      - {type: box, box: [40, 60, 1720, 220], text: "test_10000 holds a copy of the labels and a link to the frames of the full test split:\ngenerating the data set again makes its labels name other frames, without any error  (create_sequence_split_subset)", font: diagram_small, outline: red, highlight: [0]}
      - {type: box, box: [40, 280, 1720, 440], text: "A causal module with Backbone.normalization.feature_map_normalization \"sequence\":\nthe statistics of every backbone layer come from the whole sequence, future frames included", font: diagram_small, outline: yellow, appear: 1, highlight: [1]}
      - {type: box, box: [40, 500, 1720, 660], text: "A sequence without any labelled frame counts as an exact match,\nand a batch without any labelled frame gives a NaN loss", font: diagram_small, outline: violet, appear: 2, highlight: [2]}
    narration:
      - "Imagine that you generate the data set again: the test {{sequence_labelling.subset.sequence_count:words}} subset holds a copy of the labels and a link to the frames of the full test split, so its labels name other frames, without any error."
      - "If, for instance, you pair a causal module with the sequence normalization of the backbone, it still sees the future, the statistics of every layer coming from the whole sequence."
      - "And a sequence without any labeled frame counts as an exact match."

  - kind: html
    page: diagram
    title: "The export"
    code_reference: "vision_training/models/sequence/inference_sequence_model.py · InferenceSequenceModel"
    # The range of the 8-bit pixel values the exported model takes
    literal_numbers: ["0", "255"]
    elements:
      - {type: box, box: [40, 60, 520, 230], text: "images\n[B, T, {{sequence_labelling.run.input_channels}}, S, S]\nfloat32 BGR in [0, 255]", font: diagram_small, outline: blue}
      - {type: arrow, points: [[520, 145], [615, 145]], appear: -1}
      - {type: box, box: [620, 60, 1140, 230], text: "sequence_labeller_torchscript\nsequence_labeller_onnx\ninput normalization inside", font: diagram_small, outline: violet}
      - {type: arrow, points: [[1140, 145], [1235, 145]]}
      - {type: box, box: [1240, 60, 1720, 230], text: "class_probabilities\n[B, T, K]", font: diagram_small, outline: aqua}
      - {type: box, box: [240, 310, 1520, 460], text: "No sequence mask: the sequences of one request share T,\nfrom one to Data.sequence_settings.maximum_sequence_length", font: diagram_text, outline: yellow, appear: 1, highlight: [1]}
      # The input contract of the run (vision_training/deployment/input_contract.py), written by every export
      - {type: box, box: [240, 540, 1520, 690], text: "preprocessing.json next to the model, and the metadata of the ONNX model:\ncolor order · resize · size · padding · layout NTCHW · value range", font: diagram_small, outline: blue, appear: 2, highlight: [2]}
    narration:
      - "The export writes sequence labeler in Torch Script and ONNX: images of B by T by {{sequence_labelling.run.input_channels:words}} by S by S in, the class probabilities of B by T by K out, the input normalization inside the model."
      - "It has no sequence mask, so every sequence of one request has the same number of frames, from one to the maximum sequence length."
      - "The export also writes the color order, resize, size, padding, layout and value range of the run in the preprocessing file next to the model and in the ONNX metadata, for a server to build the frames as the training did."

  - kind: summary
    title: "Recap"
    # The balanced accuracy of a model right on one class only, one over the number of classes
    literal_numbers: ["1"]
    items:
