# Instance segmentation, chapter 2: the masks of the final detections, their pasting into the image, the mask IoU,
# the mask and box tables of the report with the mask scores of Mask Scoring R-CNN ('MaskHead.mask_scoring', off in the
# run and the configuration), the classes where masks and boxes part, the finer inputs of the mask heads on
# the instance segmentation benchmark, the object sizes by mask and by box area, the evaluation at the original
# resolution, the export with its input settings and its client side pasting, and the pitfalls. The numbers come from
# the INS run of tutorial_sources.yaml (tutorials/figures/instance_segmentation), the objects and detections of the
# test image named by their role in its facts, which check what the narration says of them, and from the committed
# results of the instance segmentation benchmark (mask_input_benchmark.py).
series: instance_segmentation
series_title: "Instance Segmentation (INS)"
chapter: 2
title: "Scoring and shipping masks"
output_name: instance_segmentation_02_scoring_and_shipping_masks
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [instance_segmentation]
references:
  - "vision_training/models/instance_segmentation/instance_segmenter.py · InstanceSegmenter.predict_detection_masks"
  - "vision_training/models/instance_segmentation/mask_operations.py · build_interpolation_weights"
  - "vision_training/trainers/instance_segmentation_trainer.py · InstanceSegmentationTrainer.compute_mask_overlaps"
  - "vision_training/models/instance_segmentation/inference_instance_segmenter.py · InferenceInstanceSegmenter.predict_masks"
  - "vision_training/data/preprocessing.py · restore_boxes_to_original_image"
  - "vision_training/deployment/input_contract.py · write_onnx_input_contract"
  - "documentation/architecture_benchmarking/instance_segmentation_experiment_plan.md"
  - "documentation/architecture_benchmarking/instance_segmentation_results.csv"
scenes:
  - kind: title_card
    heading: "Scoring and shipping masks"
    subheading: "Pasting, mask IoU, mask mAP, export"
    footnote: "Instance Segmentation · chapter 2"
    literal_numbers: ["2"]
    narration:
      - "A mask head predicts {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.mask_resolution}} by {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.mask_resolution}} probabilities in the frame of a box; scoring them and using them needs them pasted back into the image."
      - "This chapter follows the masks of the test image from the head to the mask IoU, reads the mask evaluation of the run against its boxes, and exports the model."

  - kind: image
    title: "The masks of the detections"
    code_reference: "vision_training/models/instance_segmentation/instance_segmenter.py · InstanceSegmenter.predict_detection_masks"
    image: "figures:instance_segmentation/masks/predicted_masks.png"
    highlights:
      - {box: "{{instance_segmentation.predictions.level_4.tile_box}}", sentences: [1]}
      - {box: "{{instance_segmentation.predictions.level_5.tile_box}}", sentences: [1]}
      - {box: "{{instance_segmentation.predictions.level_6.tile_box}}", sentences: [1]}
      - {box: "{{instance_segmentation.predictions.level_7.tile_box}}", sentences: [1]}
      - {box: "{{instance_segmentation.predictions.duplicate.right_tile_box}}", sentences: [2]}
      - {box: "{{instance_segmentation.predictions.duplicate.wrong_tile_box}}", sentences: [2]}
    narration:
      - "In evaluation, the mask heads run on the final boxes refined by the detection heads, each detection at the level of its proposal, and keep the sigmoid of the channel of the detected class."
      - "On the test image, the {{instance_segmentation.predictions.detection_count}} detections give {{instance_segmentation.predictions.detection_count}} masks in the frame of their boxes, from blocks {{instance_segmentation.predictions.levels_text}}: the {{instance_segmentation.predictions.level_4.name_text}}, the {{instance_segmentation.predictions.level_5.name_text}}, the {{instance_segmentation.predictions.level_6.name_text}} and the {{instance_segmentation.predictions.level_7.name_text}}, one per block in that order."
      - "The {{instance_segmentation.predictions.duplicate.object_text}} gets a mask from block {{instance_segmentation.predictions.duplicate.right_level}} under its own class, and another from block {{instance_segmentation.predictions.duplicate.wrong_level}} as a {{instance_segmentation.predictions.duplicate.wrong_name_text}}."

  - kind: code
    title: "Pasting a mask"
    code_reference: "vision_training/models/instance_segmentation/mask_operations.py · paste_instance_masks"
    source:
      file: vision_training/models/instance_segmentation/mask_operations.py
      function: paste_instance_masks
    highlights:
      - {match: "row_weights = build_interpolation_weights|column_weights = build_interpolation_weights", sentences: [0]}
      - {match: "torch.bmm", sentences: [1]}
    # The rows and the columns of the separable pasting
    literal_numbers: [two]
    narration:
      - "The evaluation pastes every mask into the image at its box by bilinear sampling at the pixel centers, written with separable tent weights, one matrix for the rows and one for the columns of every box."
      - "Two batched matrix products then paste all the masks of an image at once on the device, and the pixels from the mask threshold of {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.inference.mask_threshold}} belong to the object."

  - kind: image
    title: "Pasted masks against the ground truth"
    code_reference: "vision_training/trainers/instance_segmentation_trainer.py · InstanceSegmentationTrainer.compute_mask_overlaps"
    image: "figures:instance_segmentation/masks/pasted_masks.png"
    highlights:
      - {box: "{{instance_segmentation.predictions.panel_1_box}}", sentences: [0]}
      - {box: "{{instance_segmentation.predictions.panel_2_box}}", sentences: [0]}
      - {box: "{{instance_segmentation.predictions.panel_3_box}}", sentences: [1, 2]}
    narration:
      - "Pasted, the probabilities follow the shapes inside their boxes, and they are compared with the ground truth masks of the image."
      - "Thresholded, the {{instance_segmentation.predictions.best_mask.name_text}} reaches a mask IoU of {{instance_segmentation.predictions.best_mask.mask_iou:.2f}}, against {{instance_segmentation.predictions.best_mask.box_iou:.2f}} for its box, but the {{instance_segmentation.predictions.weakest_mask.name_text}} only {{instance_segmentation.predictions.weakest_mask.mask_iou:.2f}}, against {{instance_segmentation.predictions.weakest_mask.box_iou:.2f}}."
      - "Its box stops short of the shape, whose edges outside the box no mask in that frame can reach, and its mask spills into the hole."

  - kind: code
    title: "The mask IoU"
    code_reference: "vision_training/models/instance_segmentation/mask_operations.py · compute_mask_intersection_over_union"
    source:
      file: vision_training/models/instance_segmentation/mask_operations.py
      function: compute_mask_intersection_over_union
    highlights:
      - {match: "for chunk_start in range", sentences: [0]}
      - {match: "prediction_segments = cut_mask_segments", sentences: [0]}
      - {match: "intersections = ", sentences: [1]}
      - {match: "unions = prediction_areas", sentences: [2]}
    # A worked example of a ratio that float32 rounds down
    literal_numbers: ["13", "20", "0.65"]
    narration:
      - "The mask IoU compares {{instance_segmentation.geometry.overlap_chunk_size}} detections at a time at {{instance_segmentation.geometry.image_size}} pixels, their flattened masks cut into segments of {{constant:vision_training/models/instance_segmentation/mask_operations.py#MASK_PRODUCT_SEGMENT_PIXELS:,}} pixels."
      - "Each segment is multiplied with the same segment of every ground truth mask, exact in float16 on the GPU and far faster than one product over the whole image."
      - "The counts are summed and the ratio taken in float64, so that an exact 13 over 20 is not pushed below 0.65; the mAP then runs as for the boxes, once on the masks and once on the boxes of the same detections."

  - kind: image
    title: "One test image through the run"
    code_reference: "vision_training/trainers/instance_segmentation_trainer.py · InstanceSegmentationTrainer.get_sample_masks"
    image: "figures:instance_segmentation/evaluation/sample_iterations.png"
    views:
      - {box: "{{instance_segmentation.samples.figure_box}}", from_sentence: 0}
      - {box: [1080, 0, 2132, 648], from_sentence: 1}
    highlights:
      - {box: "{{instance_segmentation.samples.panel_2_box}}", sentences: [0]}
      - {box: "{{instance_segmentation.samples.panel_4_box}}", sentences: [1]}
    # The intersection over union of the metric name, mAP@0.5
    literal_numbers: ["0.5"]
    narration:
      - "At iteration {{instance_segmentation.samples.iterations[0]:words}}, at a mask mAP at 0.5 of {{instance_segmentation.samples.metric_1000:percent}}, only {{instance_segmentation.outcomes.1000.right:,}} of the {{instance_segmentation.data.test_objects:,}} test objects are found right at the deployment threshold, and the samples stay empty."
      - "At {{instance_segmentation.samples.iterations[1]:words}} iterations the mask mAP is {{instance_segmentation.samples.metric_3000:percent}}, and {{instance_segmentation.samples.metric_6000:percent}} at {{instance_segmentation.samples.iterations[2]:words}}, with masks on all {{instance_segmentation.predictions.object_count:words}} shapes of this image."

  - kind: html
    page: diagram
    title: "Mask and box tables"
    code_reference: "vision_training/trainers/instance_segmentation_trainer.py · InstanceSegmentationTrainer.compute_evaluation_results"
    # The intersections over union of the metric names, mAP@0.5, @0.75 and @[0.5:0.95]
    literal_numbers: ["0.5", "0.75", "0.95"]
    elements:
      - type: listing
        box: [30, 30, 1000, 230]
        font: diagram_monospace_small
        source: {file: "figures:instance_segmentation/listings/results_mask_methods.txt"}
        highlights:
          - {match: "^ Area", sentences: [0, 2]}
      - type: listing
        box: [30, 290, 1000, 490]
        font: diagram_monospace_small
        appear: 1
        source: {file: "figures:instance_segmentation/listings/results_box_methods.txt"}
        highlights:
          - {match: "^ Area", sentences: [1, 2]}
      - {type: box, box: [1080, 60, 1740, 200], text: "headline: Mask mAP@0.5/area\nclass thresholds and confusion\nmatrix on the masks", font: diagram_small, outline: magenta}
      - {type: box, box: [1080, 300, 1740, 430], text: "moving average of the weights:\nmask mAP@0.5 {{instance_segmentation.report.averaged.mask_methods.area.0:percent}}", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: text, position: [30, 540], text: "{{instance_segmentation.run.test_scalar_count}} scalars per evaluation in Tensorboard/Test · class_metrics.csv: the box columns, then the mask_ ones", font: diagram_small, colour: dim, appear: 2}
      - {type: box, box: [30, 590, 1740, 710], text: "MaskHead.mask_scoring · activated: {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.mask_scoring.activated}} · a mask IoU head per mask head, trained by mask_iou_loss\nmask score = class score × predicted mask IoU: ranks the mask tables and their class thresholds", font: diagram_small, outline: aqua, appear: 3, highlight: [3, 4]}
    narration:
      - "The report starts with the mask tables: at {{instance_segmentation.run.checkpoint_iteration:words}}, a mask mAP of {{instance_segmentation.report.trained.mask_methods.area.0:percent}} at 0.5, {{instance_segmentation.report.trained.mask_methods.area.1:percent}} at 0.75 and {{instance_segmentation.report.trained.mask_methods.area.3:percent}} from 0.5 to 0.95; the first compares the checkpoints."
      - "The boxes of the same detections reach {{instance_segmentation.report.trained.box_methods.area.0:percent}} at 0.5, and the moving average of the weights reaches a mask mAP of {{instance_segmentation.report.averaged.mask_methods.area.0:percent}} at 0.5."
      - "At 0.95, the masks do better than the boxes, {{instance_segmentation.report.trained.mask_methods.area.2:percent}} against {{instance_segmentation.report.trained.box_methods.area.2:percent}}: a mask is scored on its pixels, where a box one pixel off fails."
      - "Should you turn mask scoring on, as in Mask Scoring R-CNN, a mask IoU head learns the IoU of every mask with its object, and the mask score, the class score times that predicted IoU, ranks the masks of these tables and sets their class thresholds."
      - "The box tables, the confusion matrix and the deployment threshold keep the class scores; the run shown scores none of its masks."

  - kind: image
    title: "Where masks and boxes part"
    code_reference: "vision_training/trainers/instance_segmentation_trainer.py · InstanceSegmentationTrainer.compute_evaluation_results"
    image: "figures:instance_segmentation/evaluation/mask_box_average_precision.png"
    # The intersections over union of the metric names, AP@0.75 and AP@0.95; the class claims are checked by
    # check_class_claims of evaluation_figures.py
    literal_numbers: ["0.75", "0.95"]
    narration:
      - "Per class at 0.75, the masks lose on every hollow shape, the {{instance_segmentation.classes.largest_loss.name_text}} most: {{instance_segmentation.classes.largest_loss.mask_ap_75:percent}} on its masks against {{instance_segmentation.classes.largest_loss.box_ap_75:percent}} on its boxes."
      - "The star loses too, {{instance_segmentation.classes.star.mask_ap_75:percent}} against {{instance_segmentation.classes.star.box_ap_75:percent}}."
      - "Think of thin walls and points: pooled from strides of {{instance_segmentation.geometry.strides_text}}, their features hold only a few cells, too coarse for their borders."
      - "Most filled shapes gain instead at 0.95, the {{instance_segmentation.classes.largest_gain_95.name_text}} most: {{instance_segmentation.classes.largest_gain_95.mask_ap_95:percent}} on its masks, against {{instance_segmentation.classes.largest_gain_95.box_ap_95:percent}} on its boxes."

  # Stage 3b of documentation/architecture_benchmarking/instance_segmentation_experiment_plan.md (design A, the image
  # branch, and design B, the backbone skips, against the heads of stage 3 and the control, the fusion convolution
  # alone) and its stage 2 (the doubled mask resolution): the facts instance_segmentation.mask_inputs.* are read from
  # the committed results of the benchmark by mask_input_benchmark.py, which checks the comparisons said here; the
  # choice of design A and the caution on photographs are those of the plan
  - kind: html
    page: diagram
    title: "Finer inputs of the mask heads"
    code_reference: "vision_training/models/instance_segmentation/mask_head.py · MaskFineInputs"
    # The intersections over union of the metric name, mAP@[0.5:0.95]
    literal_numbers: ["0.5", "0.95"]
    elements:
      # Mask head settings of every arm, read from the results of its launches
      - {type: box, box: [30, 20, 650, 120], text: "heads of the benchmark\nconvolutions {{instance_segmentation.mask_inputs.mask_convolutions}}, no finer input", font: diagram_small, outline: blue}
      - {type: box, box: [30, 145, 650, 275], text: "design A · image branch\nimage_branch_convolutions: {{instance_segmentation.mask_inputs.image_branch_convolutions}}\nfusion_convolutions: {{instance_segmentation.mask_inputs.fusion_convolutions}}", font: diagram_small, outline: aqua, highlight: [1, 3]}
      - {type: box, box: [30, 300, 650, 460], text: "design B · backbone skips\nskip_blocks_at_pool_size: {{instance_segmentation.mask_inputs.skip_blocks_at_pool_size}}\nskip_blocks_at_mask_resolution: {{instance_segmentation.mask_inputs.skip_blocks_at_mask_resolution}}\nfusion_convolutions: {{instance_segmentation.mask_inputs.fusion_convolutions}}", font: diagram_small, outline: yellow, highlight: [1]}
      - {type: box, box: [30, 485, 650, 585], text: "control · fusion alone\nfusion_convolutions: {{instance_segmentation.mask_inputs.fusion_convolutions}}", font: diagram_small, outline: magenta, appear: 2, highlight: [2]}
      - {type: text, position: [30, 625], text: "doubled resolution, masks of {{instance_segmentation.mask_inputs.doubled_resolution}}: {{instance_segmentation.mask_inputs.doubled_resolution_map:percent}}\nagainst {{instance_segmentation.mask_inputs.reference_resolution_map:percent}} at {{instance_segmentation.mask_inputs.reference_resolution}}", font: diagram_small, colour: dim, highlight: [0]}
      # Test mask mAP of the averaged weights of every arm, mean of its launches
      - {type: text, position: [760, 20], text: "test mask mAP@[0.5:0.95], averaged weights, mean of {{instance_segmentation.mask_inputs.launches_per_arm:words}} launches", font: diagram_bold}
      - type: curve
        box: [860, 85, 1400, 560]
        series:
          - {name: "heads {{instance_segmentation.mask_inputs.mask_convolutions}} {{instance_segmentation.mask_inputs.heads_map:percent}}", colour: blue, points: "{{instance_segmentation.mask_inputs.heads_points}}"}
          - {name: "design A {{instance_segmentation.mask_inputs.image_branch_map:percent}}", colour: aqua, points: "{{instance_segmentation.mask_inputs.image_branch_points}}", highlight: [1, 3]}
          - {name: "design B {{instance_segmentation.mask_inputs.backbone_skips_map:percent}}", colour: yellow, points: "{{instance_segmentation.mask_inputs.backbone_skips_points}}", highlight: [1]}
          - {name: "control {{instance_segmentation.mask_inputs.control_map:percent}}", colour: magenta, points: "{{instance_segmentation.mask_inputs.control_points}}", dim: [0, 1], highlight: [2]}
        x_range: "{{instance_segmentation.mask_inputs.iteration_range}}"
        y_range: "{{instance_segmentation.mask_inputs.map_range}}"
        x_ticks: "{{instance_segmentation.mask_inputs.iteration_ticks}}"
        y_ticks: "{{instance_segmentation.mask_inputs.map_ticks}}"
        x_label: "iteration"
        y_label: "mask mAP"
      - {type: text, position: [760, 645], text: "gap between the launches of an arm at {{instance_segmentation.mask_inputs.compared_iteration:,}}:\nA {{instance_segmentation.mask_inputs.image_branch_launch_gap:points}}, B {{instance_segmentation.mask_inputs.backbone_skips_launch_gap:points}}, control {{instance_segmentation.mask_inputs.control_launch_gap:points}}, heads {{instance_segmentation.mask_inputs.heads_launch_gap:points}}", font: diagram_small, colour: dim, appear: 1}
    narration:
      - "Since doubling the mask resolution did not help, the instance segmentation benchmark gave its mask heads finer inputs: design A crops every box from the input image, design B reads backbone blocks before their pooling."
      - "Averaged over {{instance_segmentation.mask_inputs.launches_per_arm:words}} launches, design A reaches a mask mAP from 0.5 to 0.95 of {{instance_segmentation.mask_inputs.image_branch_map:percent}} at iteration {{instance_segmentation.mask_inputs.compared_iteration:,}} and design B {{instance_segmentation.mask_inputs.backbone_skips_map:percent}}, a tie within the gap between launches, against {{instance_segmentation.mask_inputs.heads_map:percent}} without them."
      - "Both add a fusion convolution at the mask resolution, which alone, as a control, reaches only {{instance_segmentation.mask_inputs.control_map:percent}}: designs A and B owe {{instance_segmentation.mask_inputs.image_branch_over_control:points}} and {{instance_segmentation.mask_inputs.backbone_skips_over_control:points}} to their finer inputs."
      - "The benchmark keeps design A for its next stages, though on photographs, where colour edges and object borders part more often than on these flat shapes, its plan expects the image branch to gain less and the skips to carry better."

  - kind: html
    page: diagram
    title: "Object sizes by mask and by box"
    code_reference: "vision_training/evaluation/detection/object_sizes.py · is_in_object_size"
    # The mask table and the box table
    literal_numbers: [two]
    elements:
      - {type: text, position: [40, 40], text: "test objects by mask area", font: diagram_bold}
      - {type: bars, box: [40, 100, 820, 330], orientation: horizontal, values: "{{instance_segmentation.report.mask_sizes_counts}}", labels: ["small", "medium", "large"], value_labels: "{{instance_segmentation.report.mask_sizes_count_labels}}", colours: [magenta, magenta, magenta], maximum: "{{instance_segmentation.report.sizes_axis_maximum}}", label_width: 120, highlight: [1]}
      - {type: text, position: [940, 40], text: "test objects by box area", font: diagram_bold}
      - {type: bars, box: [940, 100, 1720, 330], orientation: horizontal, values: "{{instance_segmentation.report.box_sizes_counts}}", labels: ["small", "medium", "large"], value_labels: "{{instance_segmentation.report.box_sizes_count_labels}}", colours: [blue, blue, blue], maximum: "{{instance_segmentation.report.sizes_axis_maximum}}", label_width: 120, highlight: [1]}
      - {type: box, box: [40, 420, 1720, 560], text: "small below {{instance_segmentation.geometry.small_object_limit}}, medium to {{instance_segmentation.geometry.large_object_limit}}, large above · a shape fills only part of its box\nmask mAP@0.5 of the {{instance_segmentation.report.weakest_size}} objects {{instance_segmentation.report.weakest_size_mask_map:percent}} · box {{instance_segmentation.report.weakest_size_box_map:percent}}", font: diagram_small, outline: border, appear: 2, highlight: [2]}
    narration:
      - "The size tables measure the objects differently: by mask area for the mask table, by box area for the box table."
      - "So {{instance_segmentation.report.trained.mask_sizes.small.0:,}} test objects are small by their mask but only {{instance_segmentation.report.trained.box_sizes.small.0:,}} by their box, and {{instance_segmentation.report.trained.mask_sizes.large.0:,}} are large against {{instance_segmentation.report.trained.box_sizes.large.0:,}}: the two rows of a size hold different objects."
      - "The {{instance_segmentation.report.weakest_size}} objects are the weak point either way, at a mask mAP of {{instance_segmentation.report.weakest_size_mask_map:percent}} and a box mAP of {{instance_segmentation.report.weakest_size_box_map:percent}}."

  - kind: yaml
    title: "Scoring at the original resolution"
    code_reference: "vision_training/data/detection/coco_dataset.py · CocoDetectionDataset.add_original_instances"
    source:
      file: vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml
      keys: [ExperimentConfiguration.evaluation.score_threshold, ExperimentConfiguration.evaluation.original_resolution, MaskHead.inference]
      comments: false
    highlights:
      - {match: "original_resolution", sentences: [0, 1]}
      - {match: "mask_threshold", sentences: [1]}
    narration:
      - "With the original resolution off, the masks are scored at the network resolution, the objects whose mask vanished at {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Data.image_settings.size}} pixels being left out."
      - "When the goal is a score as COCO computes it, turn the original resolution on: the boxes are restored to the original images, the masks pasted and thresholded at that size, and the objects are those of the original annotations."

  - kind: html
    page: diagram
    title: "The exported instance segmenter"
    code_reference: "vision_training/models/instance_segmentation/inference_instance_segmenter.py · InferenceInstanceSegmenter.predict_masks"
    # The four outputs of the exported detector (detection_outputs of export_specifications.py) and the zero
    # padding masks
    literal_numbers: [four, zero]
    elements:
      - {type: box, box: [20, 250, 300, 410], text: "images\n[B, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Backbone.input_channels}}, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Data.image_settings.size}}, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Data.image_settings.size}}]", font: diagram_small, outline: blue, highlight: [3]}
      - {type: box, box: [20, 60, 350, 220], text: "preprocessing.json\nand ONNX metadata:\nthe letterbox of\nthe evaluation", font: diagram_small, outline: yellow, appear: 3, highlight: [3]}
      - {type: arrow, points: [[300, 330], [365, 330]]}
      - {type: box, box: [370, 60, 1130, 560], fill: null, outline: violet, highlight: [1]}
      - {type: text, position: [750, 90], text: "instance_segmenter", font: diagram_bold, anchor: ma}
      - {type: text, position: [410, 160], text: "the exported detector, then\nevery level's mask head on all {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}} detections,\neach detection keeping its own level,\nor the shared mask head once\nthe class channel picked by a gather\nthe sigmoid", font: diagram_text, appear: 1}
      - {type: arrow, points: [[1130, 220], [1195, 150]]}
      - {type: text, position: [1205, 150], text: "the four outputs of DET", font: diagram_small, anchor: lm}
      - {type: arrow, points: [[1130, 380], [1195, 380]]}
      - {type: text, position: [1205, 380], text: "detection_masks\n[B, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}}, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.mask_resolution}}, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.mask_resolution}}] FP32", font: diagram_monospace_small, anchor: lm, highlight: [0]}
      - {type: arrow, points: [[1130, 500], [1195, 500]], appear: 1}
      - {type: text, position: [1205, 500], text: "mask_scores [B, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}}] FP32\nwith mask scoring only", font: diagram_monospace_small, anchor: lm, appear: 1, highlight: [2]}
      - {type: box, box: [20, 600, 1740, 720], text: "client: restore_boxes_to_original_image(..., clip=False) · paste_instance_masks · pixels >= mask_threshold\na box clipped at the border squeezes its mask", font: diagram_small, outline: yellow, appear: 4, highlight: [4, 5]}
    narration:
      - "The export writes the segmenter with the four outputs of the detector, then the detection masks: {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections:words}} probability masks of {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.mask_resolution}} pixels per image in the frame of their boxes, zero for the padding."
      - "In the graph, every level's mask head runs on all the detections, each keeping its own level, or the shared head once on all of them; the class channel is picked by a gather, then the sigmoid, and the export is checked to a thousandth on the masks."
      - "With mask scoring on, the mask scores follow the masks as a last output, and the class thresholds of the evaluation, found on these scores, apply to them, not to the detection scores."
      - "So that the client letterboxes its images as the evaluation did, the export also writes the colour order, resize, size, interpolation, padding, layout and value range of the run in the preprocessing file next to the model and in the ONNX metadata."
      - "The client pastes the masks itself with paste instance masks, at the boxes brought back to the original image, and keeps the pixels from the mask threshold, which the export does not apply."
      - "Take an object at the border: restore its box unclipped, since a box clipped at the border squeezes its mask, as the recipe of the tools reference says."

  - kind: text_panel
    title: "Pitfalls"
    columns:
      - heading: "Training"
        lines:
          - "{{instance_segmentation.samples.iterations[0]}} iterations: samples empty"
          - "per-level heads: own positives; shared: all"
          - "block {{instance_segmentation.proposal_recall.busiest_block}} takes most proposals"
          - "polygons, overlaps: one full-size mask each"
      - heading: "Evaluation and export"
        lines:
          - "masks lose thin walls and points"
          - "mask and box size rows: other objects"
          - "client pastes, thresholds itself"
          - "restore boxes unclipped"
    narration:
      - "The pitfalls of the masks: short runs leave the samples empty, and each level's mask head trains on the positives of its level only, while block {{instance_segmentation.proposal_recall.busiest_block}} takes most proposals, unless the shared setting gives one head all of them."
      - "Polygons or overlapping masks, as in COCO, still travel through the loaders as one full-size mask each."
      - "Masks pooled from coarse strides lose thin walls and points at strict IoU, the size rows of the mask and box tables hold different objects, and the client must paste with unclipped boxes and apply the threshold."

  - kind: summary
    title: "Recap"
    # The intersections over union of mAP@0.5 and AP@0.75
    literal_numbers: ["0.5", "0.75"]
    items:
      - {text: "Masks predicted on the final boxes, at the level of their proposal", sentences: [0]}
      - {text: "paste_instance_masks: bilinear at pixel centres, then >= {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.inference.mask_threshold}}", sentences: [1]}
      - {text: "Mask IoU in chunks, float64 ratio; mAP on masks, then on boxes", sentences: [2]}
      - {text: "Mask mAP@0.5 {{instance_segmentation.report.trained.mask_methods.area.0:percent}}, box {{instance_segmentation.report.trained.box_methods.area.0:percent}} at {{instance_segmentation.run.checkpoint_iteration}}", sentences: [3]}
      - {text: "AP@0.75 of the {{instance_segmentation.classes.largest_loss.name_text}}: mask {{instance_segmentation.classes.largest_loss.mask_ap_75:percent}}, box {{instance_segmentation.classes.largest_loss.box_ap_75:percent}}", sentences: [4]}
      - {text: "Finer mask inputs: image branch {{instance_segmentation.mask_inputs.image_branch_map:percent}}, skips {{instance_segmentation.mask_inputs.backbone_skips_map:percent}}, none {{instance_segmentation.mask_inputs.heads_map:percent}}", sentences: [5]}
      - {text: "detection_masks [B, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#Detector.inference.maximum_detections}}, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.mask_resolution}}, {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.mask_resolution}}]: pasted and thresholded by the client", sentences: [6]}
    narration:
      - "To recap: in evaluation the masks are predicted on the final refined boxes, each detection at the level of its proposal, keeping the sigmoid of the detected class."
      - "Paste instance masks puts every mask back into the image by bilinear sampling at the pixel centres, and the pixels from the mask threshold of {{config:vision_training/configurations/instance_segmentation/configuration_synthetic_shapes.yaml#MaskHead.inference.mask_threshold}} belong to the object."
      - "The mask IoU multiplies the masks in segments and takes the ratio in float64, so that exact ratios are not rounded down; the mAP then runs on the masks, then on the boxes of the same detections."
      - "The mask table heads the report and compares the checkpoints: at iteration {{instance_segmentation.run.checkpoint_iteration:words}}, a mask mAP at 0.5 of {{instance_segmentation.report.trained.mask_methods.area.0:percent}}, against {{instance_segmentation.report.trained.box_methods.area.0:percent}} on the boxes."
      - "Per class at 0.75, the masks lose on the hollow shapes, the {{instance_segmentation.classes.largest_loss.name_text}} most: thin walls pooled from coarse strides hold too few cells for their borders."
      - "On the instance segmentation benchmark, the image branch and the backbone skips tie on the mask mAP over all overlap thresholds, both well above the heads without finer inputs."
      - "The export ships probability masks in the frame of their boxes: the client pastes them at boxes restored unclipped, and applies the mask threshold itself."
      - "That closes the series on instance masks; the keypoint detection series follows."
