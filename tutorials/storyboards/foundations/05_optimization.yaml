# Foundations, chapter 5: the optimization shared by every task: the settings of the Optimization section, one
# optimizer step, the three optimizers, the learning rate and what the benchmark measured for it, the warm-up and the
# cosine decay, gradient clipping, mixed precision and the moving average of the weights. The curves are those of
# benchmark.py (documentation/architecture_benchmarking/results.csv) and learning_rate_schedule.py (the schedule of the
# keypoint configuration) of tutorials/figures/foundations; the costs of mixed precision are those recorded in
# documentation/architecture_benchmarking/experiment_plan.md.
series: foundations
series_title: "Foundations"
chapter: 5
title: "Optimization"
output_name: foundations_05_optimization
pace: 1.16
voice: {name: af_heart, language: en-us}
figures: [foundations]
references:
  - "vision_training/trainers/base_trainer.py · BaseTrainer.build_optimizer"
  - "vision_training/trainers/base_trainer.py · BaseTrainer.step_optimizer"
  - "vision_training/trainers/weight_averaging.py · ExponentialMovingAverage"
  - "vision_training/configuration_processing/run_name.py · build_optimizer_tokens"
  - "documentation/architecture_benchmarking/experiment_plan.md"
scenes:
  - kind: title_card
    heading: "Optimization"
    subheading: "Optimizer, learning rate, schedule, precision, averaged weights"
    footnote: "Foundations · chapter 5"
    narration:
      - "Every task is optimized by the same step of the base trainer, set by the Optimization section of its configuration."
      - "This chapter covers the optimizer and its learning rate, the schedule, the gradient clipping, the mixed precision and the moving average of the weights, with what the benchmark measured for them."

  - kind: yaml
    title: "The optimization settings"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.build_optimizer"
    source:
      file: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
      keys: [ExperimentConfiguration.batch_size, ExperimentConfiguration.learning_rate, Optimization]
      comments: false
    highlights:
      - {match: "batch_size|^\\s*learning_rate:", sentences: [0]}
      - {match: "optimizer:|weight_decay", sentences: [1]}
      - {match: "learning_rate_schedule|warmup_iterations|decay_iterations|minimum_learning_rate_ratio", sentences: [2]}
      - {match: "gradient_clipping_norm|mixed_precision|exponential_moving_average|activated|decay:", sentences: [3]}
    narration:
      - "The experiment section sets the batch size and the learning rate of the run."
      - "The Optimization section picks the optimizer, Adam, AdamW or SGD, with its weight decay."
      - "Then comes the schedule of the learning rate: an optional linear warm-up, followed by a constant learning rate or a cosine decay."
      - "Last, the clipping of the gradients, the mixed precision of the forward passes and the moving average of the weights."

  - kind: html
    page: diagram
    title: "One optimizer step"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.step_optimizer"
    elements:
      - {type: box, box: [20, 200, 230, 320], text: "loss of the\ntraining batch", font: diagram_small}
      - {type: arrow, points: [[238, 260], [282, 260]]}
      - {type: box, box: [290, 200, 500, 320], text: "backward:\nthe gradients", font: diagram_small}
      - {type: arrow, points: [[508, 260], [552, 260]], appear: 0}
      - {type: box, box: [560, 200, 800, 320], text: "gradients clipped\nto the norm", font: diagram_small, outline: yellow, appear: 0, highlight: [0]}
      - {type: text, position: [680, 340], text: "when gradient_clipping_norm\nis set", font: diagram_small, colour: dim, anchor: ma, align: center, appear: 0}
      - {type: arrow, points: [[808, 260], [852, 260]], appear: 1}
      - {type: box, box: [860, 200, 1120, 320], text: "learning rate\n× schedule factor", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: arrow, points: [[990, 328], [880, 452]], appear: 1}
      - {type: arrow, points: [[990, 328], [1300, 452]], appear: 1}
      - {type: box, box: [640, 460, 1060, 570], text: "new layers:\nlearning_rate × factor", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [1100, 460, 1740, 570], text: "component transferred from another run:\nlearning_rate × multiplier × factor", font: diagram_small, outline: blue, appear: 1}
      - {type: arrow, points: [[1128, 260], [1172, 260]], appear: 2}
      - {type: box, box: [1180, 200, 1400, 320], text: "optimizer\nstep", font: diagram_small, outline: violet, appear: 2, highlight: [2]}
      - {type: arrow, points: [[1408, 260], [1452, 260]], appear: 2}
      - {type: box, box: [1460, 200, 1740, 320], text: "moving average\nof the weights", font: diagram_small, outline: aqua, appear: 2, highlight: [2]}
      - {type: text, position: [1600, 340], text: "when activated", font: diagram_small, colour: dim, anchor: ma, appear: 2}
      - {type: text, position: [880, 670], text: "TensorBoard: Learning Rate, at every iteration", font: diagram_small, colour: dim, anchor: mm, appear: 2}
    narration:
      - "After the backward pass of every training batch, the gradients are first clipped, when a clipping norm is set."
      - "Then every parameter group gets its learning rate of the moment: the learning rate of the run times the factor of the schedule, and a component transferred from another run also times its multiplier."
      - "The optimizer takes its step, the moving average of the weights follows it when it is on, and TensorBoard records the learning rate at every iteration."

  - kind: html
    page: diagram
    title: "Adam, AdamW and SGD"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.build_optimizer"
    elements:
      - {type: box, box: [20, 40, 570, 560], text: "adam\n\nits own step for every weight,\nfrom running averages of its gradient\nand of its squared gradient\n\nweight decay added to the gradient\n\nno run name token", font: diagram_small, outline: blue, highlight: [0]}
      - {type: box, box: [605, 40, 1155, 560], text: "adamw\n\nthe steps of Adam\n\nweight decay applied to the weights,\napart from the gradient\n\nrun name token ADAMW", font: diagram_small, outline: aqua, appear: 1, highlight: [1]}
      - {type: box, box: [1190, 40, 1740, 560], text: "sgd\n\nsteps along the gradient,\nwith Nesterov momentum 0.9\n\nweight decay added to the gradient\n\nrun name token SGD", font: diagram_small, outline: yellow, appear: 1, highlight: [1]}
      - {type: text, position: [880, 650], text: "weight_decay above 0: run name token WD<decay>", font: diagram_monospace, anchor: mm, appear: 2, highlight: [2]}
    narration:
      - "Adam, the default, gives every weight its own step size, from running averages of its gradient and of its squared gradient, and adds the weight decay to the gradient."
      - "AdamW takes the same steps but applies the weight decay to the weights directly, apart from the gradient, and SGD steps along the gradient with a Nesterov momentum of zero point nine."
      - "Another optimizer adds its name to the run name, and a weight decay above zero adds W D and its value, since the state of one optimizer cannot be resumed by another."

  - kind: image
    title: "The learning rate"
    code_reference: "documentation/architecture_benchmarking/experiment_plan.md"
    image: "figures:foundations/benchmark/benchmark_learning_rate_axes.png"
    overlay: "figures:foundations/benchmark/benchmark_learning_rate.png"
    highlights:
      - {box: "{{foundations.benchmark.learning_rate.learning_rate_panel_box}}", sentences: [1]}
    reveals:
      - {region: "{{foundations.benchmark.learning_rate.learning_rate_reveal_region}}", sentence: 1}
    narration:
      - "The learning rate sets the size of the steps, and the benchmark of the repository tried five values on the synthetic shapes, two launches each."
      - "One and two ten-thousandths learn within a thousand iterations, at {{foundations.benchmark.learning_rate.learning_rate_1e_4.accuracy_1000:.1%}} and {{foundations.benchmark.learning_rate.learning_rate_2e_4.accuracy_1000:.1%}}, while from five ten-thousandths on, the launches stay near one class in nine for at least seven hundred and fifty iterations."
      - "Two ten-thousandths was ahead over the first seven hundred and fifty iterations and became the value of the synthetic configurations: the largest usable value lies between two and five ten-thousandths."

  - kind: image
    title: "Warm-up and cosine decay"
    code_reference: "vision_training/trainers/learning_rate_schedule.py · compute_learning_rate_factor"
    image: "figures:foundations/learning_rate_schedule_keypoint_synthetic_shapes_axes.png"
    overlay: "figures:foundations/learning_rate_schedule_keypoint_synthetic_shapes.png"
    highlights:
      - {box: "{{foundations.learning_rate_schedule.warmup_panel_box}}", sentences: [0]}
      - {box: "{{foundations.learning_rate_schedule.whole_run_panel_box}}", sentences: [1]}
    reveals:
      - {region: "{{foundations.learning_rate_schedule.warmup_reveal_region}}", sentence: 0}
      - {region: "{{foundations.learning_rate_schedule.whole_run_reveal_region}}", sentence: 1}
    narration:
      - "With a warm-up, the learning rate climbs linearly from zero, here over the first {{foundations.learning_rate_schedule.warmup_iterations}} iterations of the synthetic keypoint configuration."
      - "The cosine schedule then lowers it along a half cosine to its minimum ratio, {{foundations.learning_rate_schedule.minimum_learning_rate_ratio}} here, over the decay iterations, and keeps it there."
      - "The factor only depends on the iteration, so a resumed run continues the schedule exactly, and a transferred component follows the same curve times its multiplier."

  - kind: html
    page: diagram
    title: "Gradient clipping"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.step_optimizer"
    elements:
      - {type: box, box: [300, 140, 700, 540], radius: 200, fill: null, outline: yellow, width: 3, highlight: [0]}
      - {type: text, position: [500, 570], text: "clipping norm: 1.0", font: diagram_small, colour: dim, anchor: ma}
      - {type: box, box: [492, 332, 508, 348], radius: 8, fill: text, outline: text}
      - {type: arrow, points: [[500, 340], [880, 70]], colour: magenta, width: 5, label: "gradient of the batch\nnorm 2.3", label_position: [900, 70], label_anchor: la}
      - {type: arrow, points: [[500, 340], [663, 224]], colour: aqua, width: 5, label: "clipped, norm 1.0", label_position: [690, 250], label_anchor: la, appear: 0, highlight: [1]}
      - {type: text, position: [1060, 200], text: "all the gradients of the model,\nas one vector", font: diagram_text, anchor: la}
      - {type: text, position: [1060, 340], text: "a norm above the clipping norm:\nthe vector is scaled down to it", font: diagram_text, anchor: la, appear: 0}
      - {type: text, position: [1060, 480], text: "same direction, shorter step", font: diagram_text, anchor: la, appear: 1, highlight: [1]}
      - {type: text, position: [1060, 620], text: "gradient_clipping_norm: null", font: diagram_monospace, anchor: la, appear: 2, highlight: [2]}
    narration:
      - "Gradient clipping looks at all the gradients of the model as one long vector: when its norm exceeds the clipping norm, the whole vector is scaled down to that norm."
      - "The direction of the step stays the same, only its length is limited, which tames the rare batches whose gradients explode."
      - "Null turns it off, as in the synthetic configurations; a value such as one turns it on, and since it gives no run name token, it can change when a run resumes."

  - kind: html
    page: diagram
    title: "Mixed precision"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.run_model_iteration"
    elements:
      - {type: box, box: [20, 60, 700, 220], text: "training and validation forward passes:\nbfloat16", font: diagram_text, outline: aqua, highlight: [0]}
      - {type: box, box: [20, 260, 700, 420], text: "weights, optimizer and test evaluation:\nfloat32", font: diagram_text, outline: blue, highlight: [0]}
      - {type: text, position: [1270, 40], text: "time of 100 iterations at iteration 100, in minutes", font: diagram_small, colour: dim, anchor: mm, appear: 1}
      - {type: bars, box: [800, 70, 1740, 230], orientation: horizontal, values: [6.6, 3.6], maximum: 7.5, labels: ["float32", "mixed precision"], value_labels: ["6:16 to 7:01", "3:20 to 3:57"], label_width: 190, value_width: 160, colours: [blue, aqua], appear: 1, highlight: [1]}
      - {type: text, position: [1270, 320], text: "GPU memory per launch", font: diagram_small, colour: dim, anchor: mm, appear: 1}
      - {type: bars, box: [800, 350, 1740, 510], orientation: horizontal, values: [38.7, 20.4], maximum: 45, labels: ["float32", "mixed precision"], value_labels: ["38.7 GB", "20.4 GB"], label_width: 190, value_width: 160, colours: [blue, aqua], appear: 1, highlight: [1]}
      - {type: text, position: [1270, 590], text: "test accuracy level from iteration 750 on", font: diagram_text, anchor: mm, appear: 1}
      - {type: text, position: [20, 520], text: "mixed_precision: True", font: diagram_monospace, anchor: la, appear: 2, highlight: [2]}
    narration:
      - "With mixed precision, the training and validation forward passes run in bfloat16, half the bits of float32, while the weights, the optimizer and the test evaluation stay in float32."
      - "In the benchmark, a float32 launch took about one and a half times longer and thirty nine gigabytes instead of twenty, the test accuracy being level from iteration seven hundred and fifty on."
      - "It is on in the synthetic configurations, and since it gives no run name token, it can change when a run resumes."

  - kind: image
    title: "The moving average of the weights"
    code_reference: "vision_training/trainers/weight_averaging.py · ExponentialMovingAverage.update"
    image: "figures:foundations/benchmark/benchmark_moving_average_axes.png"
    overlay: "figures:foundations/benchmark/benchmark_moving_average.png"
    highlights:
      - {box: "{{foundations.benchmark.moving_average.whole_panel_box}}", sentences: [1]}
      - {box: "{{foundations.benchmark.moving_average.zoom_panel_box}}", sentences: [2]}
    reveals:
      - {region: "{{foundations.benchmark.moving_average.whole_reveal_region}}", sentence: 1}
      - {region: "{{foundations.benchmark.moving_average.zoom_reveal_region}}", sentence: 2}
    narration:
      - "The moving average keeps a second copy of the model, never trained itself, which moves towards the trained weights after every step: the decay times the average, plus one minus the decay times the weights."
      - "In the benchmark, the mean of the averaged weights of two launches was ahead of the trained weights at every evaluated iteration, and steadier: the trained weights dip, the average does not."
      - "At the last evaluation, they reach {{foundations.benchmark.moving_average.averaged_weights.accuracy_2000:.2%}} against {{foundations.benchmark.moving_average.trained_weights.accuracy_2000:.2%}}."
      - "A decay of zero point nine nine nine eight averages about the last five thousand steps, the first updates using a smaller decay so that the random starting weights fade quickly."

  - kind: html
    page: diagram
    title: "Using the averaged weights"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.use_averaged_weights"
    elements:
      - {type: box, box: [20, 260, 420, 420], text: "checkpoint of iteration n:\ntrained weights\nand averaged weights", font: diagram_small, outline: aqua}
      - {type: arrow, points: [[428, 300], [592, 80]], appear: 0}
      - {type: box, box: [600, 30, 1160, 130], text: "Evaluation/Iteration_<n>/EMA/", font: diagram_monospace_small, appear: 0, highlight: [0]}
      - {type: arrow, points: [[428, 320], [592, 200]], appear: 0}
      - {type: box, box: [600, 150, 1160, 250], text: "TensorBoard: Test_EMA", font: diagram_monospace_small, appear: 0, highlight: [0]}
      - {type: arrow, points: [[428, 340], [592, 320]], appear: 0}
      - {type: box, box: [600, 270, 1160, 370], text: "Results.txt: EMA Weights blocks", font: diagram_monospace_small, appear: 0, highlight: [0]}
      - {type: arrow, points: [[428, 370], [592, 440]], appear: 1}
      - {type: box, box: [600, 390, 1160, 490], text: "export: use_averaged_weights: True", font: diagram_monospace_small, appear: 1, highlight: [1]}
      - {type: arrow, points: [[428, 390], [592, 560]], appear: 1}
      - {type: box, box: [600, 510, 1160, 610], text: "a run starting from this one,\nwith a moving average too", font: diagram_small, appear: 1, highlight: [1]}
      - {type: box, box: [1240, 150, 1740, 250], text: "validation curves:\ntrained weights", font: diagram_small, appear: 1}
      - {type: text, position: [880, 690], text: "saved in every checkpoint · no run name token · can be turned on when a run resumes", font: diagram_small, colour: dim, anchor: mm, appear: 2, highlight: [2]}
    narration:
      - "Every test evaluation then scores the trained weights and the averaged weights of the same checkpoint: the averaged results go to the EMA folder of the evaluation, the Test EMA curves of TensorBoard and the EMA blocks of the results file."
      - "The validation curves keep the trained weights, the export takes the averaged ones with use averaged weights, and a run starting from this one loads them when it keeps an average too."
      - "The average is saved in the checkpoints and gives no run name token, so it can be turned on when a run resumes, starting from the weights of that checkpoint."

  - kind: summary
    title: "Recap"
    items:
      - {text: "One step: clipping, learning rate × schedule factor, optimizer, average"}
      - {text: "Adam by default; AdamW, SGD and a weight decay enter the run name"}
      - {text: "A learning rate that learns: 2e-4 on the synthetic shapes"}
      - {text: "Warm-up, then constant or cosine, from the iteration alone"}
      - {text: "Mixed precision: bfloat16 forward passes, faster and lighter"}
      - {text: "The averaged weights were ahead at every evaluation of the benchmark"}
    narration:
      - "To sum up: pick a learning rate that learns, an optimizer and a schedule, keep the mixed precision on, and consider the moving average of the weights, ahead at every evaluation of the benchmark."
      - "The next chapter reads the results of a run: the evaluation files, the comparison of runs and the export of a model."
