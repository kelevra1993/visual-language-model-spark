# Self-supervised learning, chapter 1: what the task is for and when to choose it, how a run is generated, trained and
# evaluated, the keys of the projection head and of the views, how create_views draws the two views (with the views of
# a real sample image of the run and their drawn augmentations), the checks at launch and the run name. Coordinates of
# the html scenes are in pixels of the content area (1760 x 740, origin at its top left corner); the figures named
# figures:self_supervised/... are made by tutorials/figures/self_supervised from the SimCLR run of
# tutorial_sources.yaml (key self_supervised).
series: self_supervised
series_title: "Self-Supervised Learning (SSL)"
chapter: 1
title: "Two views of one image"
output_name: self_supervised_01_two_views
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [self_supervised]
references:
  - "vision_training/trainers/self_supervised_trainer.py · SelfSupervisedTrainer"
  - "vision_training/data/loaders.py · get_classification_dataloaders"
  - "vision_training/core/contracts.py · IGNORED_LABEL_INDEX"
  - "vision_training/data/augmentations.py · SELF_SUPERVISED_AUGMENTATION_STRENGTHS"
  - "vision_training/data/augmentations.py · SECOND_VIEW_ONLY_TYPES"
  - "vision_training/data/augmentations.py · DataAugmenter.should_apply"
  - "vision_training/configuration_processing/self_supervised_checks.py · check_projection_head_configuration"
  - "vision_training/configuration_processing/self_supervised_checks.py · check_grouped_batches_configuration"
  - "tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml"
  - "documentation/task workflows/self_supervised_workflow.md"
scenes:
  - kind: title_card
    heading: "Two views of one image"
    subheading: "A backbone trained without labels"
    footnote: "Self-Supervised Learning (SSL) · chapter 1"
    # The two views of the methods, and the number of the chapter in the footnote
    literal_numbers: ["two", "1"]
    narration:
      - "The self-supervised task, SSL, trains the shared backbone without a single label, from two random views of every image."
      - "This chapter covers what it is for, how a run is launched, the keys of its views and of its projection head, the checks at launch and its run name."

  - kind: html
    page: diagram
    title: "When to choose it"
    code_reference: "vision_training/models/model_transfer.py · load_pretrained_component"
    # The two views of the methods
    literal_numbers: ["two"]
    elements:
      # Unlabelled images, the self-supervised training, the backbone it produces
      - {type: box, box: [30, 80, 330, 220], text: "many images,\nfew or no labels", font: diagram_bold, outline: violet, highlight: [0]}
      - {type: arrow, points: [[340, 150], [430, 150]], colour: violet}
      - {type: box, box: [440, 50, 900, 250], outline: violet, highlight: [0]}
      - {type: text, position: [670, 70], text: "SSL training", font: diagram_bold, anchor: ma}
      - {type: text, position: [670, 125], text: "two random views of every image\nbackbone + projection head\nloss pulls the two views together", font: diagram_small, colour: dim, anchor: ma, align: center}
      - {type: arrow, points: [[910, 150], [1010, 150]], colour: violet}
      - {type: cuboid, box: [1030, 95, 1150, 205], depth: 26, fill: blue, label: "backbone", appear: 0}
      - {type: box, box: [1240, 60, 1730, 140], text: "projection head: thrown away", font: diagram_small, outline: red, appear: 1, highlight: [1]}
      - {type: arrow, points: [[1090, 250], [1090, 330]], colour: blue, appear: 1, label: "Backbone.pretrained", label_position: [1250, 290], label_font: diagram_monospace_small, label_colour: key}
      # The other tasks it initialises
      - {type: box, box: [700, 340, 960, 410], text: "CLS", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [980, 340, 1240, 410], text: "DET · INS", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [1260, 340, 1520, 410], text: "SEG · KPT", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [1540, 340, 1730, 410], text: "M2O ...", font: diagram_small, outline: aqua, appear: 1}
      # Labels: only the evaluation reads them
      - {type: box, box: [30, 480, 860, 650], outline: yellow, appear: 2, highlight: [2]}
      - {type: text, position: [60, 505], text: "labels.json of the classifier: same layout, same loaders", font: diagram_bold, appear: 2}
      - {type: text, position: [60, 560], text: "categories → classes of the k-NN evaluation only\nthe training never reads a label", font: diagram_small, colour: dim, appear: 2}
      - {type: box, box: [900, 480, 1730, 650], outline: magenta, appear: 3, highlight: [3]}
      - {type: text, position: [930, 505], text: "image without a mapped category", font: diagram_bold, appear: 3}
      - {type: text, position: [930, 560], text: "kept, label IGNORED_LABEL_INDEX = {{constant:vision_training/core/contracts.py#IGNORED_LABEL_INDEX}}\ntrained on like the others", font: diagram_small, colour: dim, appear: 3}
    narration:
      - "Imagine a team whose images far outnumber its labels: with this task, the backbone learns from all of them, then initialises another task through the pre-trained settings of its backbone section."
      - "Only the backbone is transferred; the projection head that served the loss is thrown away."
      - "The task reads the data set layout and the loaders of the image classifier, and the categories of the labels files only serve the evaluation, a nearest neighbour classification of the labelled test images among labelled training images."
      - "An image without a mapped category is not dropped: it gets the ignored label, {{constant:vision_training/core/contracts.py#IGNORED_LABEL_INDEX:words}}, and is trained on like the others; should every image be labelled, train the classifier directly."

  - kind: terminal
    title: "Generate, train, evaluate"
    code_reference: "vision_training/data/synthetic/create_synthetic_dataset.py · create_synthetic_dataset"
    lines:
      - {role: comment, text: "# The synthetic shapes of the classifier: the classification task as an argument"}
      - {role: command, text: "uv run python -m vision_training.data.synthetic.create_synthetic_dataset --task=classification --output_folder=~/Data/classifier_data/synthetic_shapes"}
      - {role: comment, text: "# SimCLR on the synthetic shapes: data folders and label mapping set in the file"}
      - {role: command, text: "uv run python -m vision_training.main --configuration_path=\"vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml\""}
      - {role: comment, text: "# The checkpoints scored again: run and iteration set in its main block"}
      - {role: command, text: "uv run python -m scripts.evaluation.evaluate_checkpoint"}
    narration:
      - "The synthetic configuration reads the shapes data set of the classifier, so the generator runs with classification as its task argument; given self supervised, it draws the counted shapes of the SimCLR and Barlow Twins counted shapes configurations instead."
      - "The training takes the self-supervised configuration, and the standalone evaluation scores its checkpoints again, as the last chapter shows."
      - "The run of this series is that configuration stopped at {{self_supervised.run.number_iterations:,}} iterations, with batches of {{self_supervised.run.batch_size}} images of {{self_supervised.run.image_size}} pixels."
      - "It evaluated a checkpoint every {{self_supervised.run.early_evaluation_step}} iterations up to iteration {{self_supervised.run.evaluation_step_change_iteration:,}}, then every {{self_supervised.run.late_evaluation_step:,}} once its training was extended."

  - kind: yaml
    title: "The projection head"
    code_reference: "vision_training/models/self_supervised/projection_head.py · ProjectionHead"
    source:
      file: vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml
      keys: [ExperimentConfiguration.batch_size, ExperimentConfiguration.evaluation.number_neighbours,
             ExperimentConfiguration.evaluation.number_reference_images_per_class,
             ProjectionHead.global_pooling, ProjectionHead.fully_connected, ProjectionHead.fully_connected_normalization,
             ProjectionHead.method, ProjectionHead.simclr,
             ProjectionHead.barlow_twins]
      comments: false
    highlights:
      - {key: ProjectionHead.global_pooling, sentences: [0]}
      - {key: ProjectionHead.fully_connected, sentences: [1]}
      - {key: ProjectionHead.fully_connected_normalization, sentences: [1]}
      - {key: ProjectionHead.method, sentences: [2]}
      - {key: ProjectionHead.simclr.temperature, sentences: [2]}
      - {key: ProjectionHead.barlow_twins.off_diagonal_weight, sentences: [2]}
      - {key: ExperimentConfiguration.batch_size, sentences: [3]}
      - {key: ExperimentConfiguration.evaluation.number_neighbours, sentences: [3]}
      - {key: ExperimentConfiguration.evaluation.number_reference_images_per_class, sentences: [3]}
    narration:
      - "The task adds one section, the projection head: its global pooling turns the last feature map into the representation, the vector that is evaluated, exported and transferred."
      - "Its fully connected layers map the representation to the embedding the loss compares: here one hidden layer of {{config:vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml#ProjectionHead.fully_connected[0]}} units, normalized as fully connected normalization sets, then an embedding of {{config:vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml#ProjectionHead.fully_connected[1]}} values."
      - "The method is SimCLR or Barlow Twins, each with one setting, the temperature of SimCLR, {{config:vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml#ProjectionHead.simclr.temperature}} here, or the off-diagonal weight of Barlow Twins; both are checked whatever the method, so that one key switches between them."
      - "The batch size weighs more than in a supervised task, every view being compared with the {{self_supervised.curves.other_view_count}} other views of its batch, and the evaluation votes with {{config:vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.number_neighbours}} neighbours among {{config:vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.number_reference_images_per_class}} training images per class."

  - kind: yaml
    title: "The views come from the augmentation"
    code_reference: "vision_training/data/augmentations.py · SELF_SUPERVISED_AUGMENTATION_STRENGTHS"
    # The two views of the methods
    literal_numbers: ["two"]
    source:
      file: vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml
      keys: [Data.data_augmentation.activated, Data.data_augmentation.probability, Data.data_augmentation.types.random_crop,
             Data.data_augmentation.types.random_left_right_flip, Data.data_augmentation.types.random_rotation,
             Data.data_augmentation.types.brightness_contrast_saturation, Data.data_augmentation.types.random_hue,
             Data.data_augmentation.types.gray_scale_augment, Data.data_augmentation.types.random_blur,
             Data.data_augmentation.types.random_solarize, Data.data_augmentation.types.random_black_out,
             Data.data_augmentation.types.random_erasing]
      comments: false
    highlights:
      - {key: Data.data_augmentation.activated, sentences: [0]}
      - {key: Data.data_augmentation.probability, sentences: [0]}
      - {key: Data.data_augmentation.types.random_crop, sentences: [1]}
      - {key: Data.data_augmentation.types.brightness_contrast_saturation, sentences: [2]}
      - {key: Data.data_augmentation.types.random_hue, sentences: [2]}
      - {key: Data.data_augmentation.types.gray_scale_augment, sentences: [2]}
      - {key: Data.data_augmentation.types.random_solarize, sentences: [3]}
      - {key: Data.data_augmentation.types.random_black_out, sentences: [3]}
    narration:
      - "The views are drawn by the data augmentation section every task has, and it must be on; its global probability is ignored, every image getting its two views."
      - "The random crop must stay at a probability of one: {{self_supervised.views.crop_minimum_area:percent_label}} of the area or more, at an aspect ratio between {{self_supervised.views.crop_minimum_aspect_ratio:.2g}} and {{self_supervised.views.crop_maximum_aspect_ratio:.2g}}, it is the main difference between the views."
      - "Every activated type is then drawn for each view on its own, with its probability: {{self_supervised.run.activated_type_count}} of the {{self_supervised.run.type_count}} types in the run, at the stronger self-supervised strengths of the code, compared in the foundations series."
      - "The solarization and the black-out are drawn for the second view only, as in the asymmetric views of Barlow Twins."

  - kind: code
    title: "Drawing the views"
    code_reference: "vision_training/data/augmentations.py · DataAugmenter.create_views"
    # The two views of the methods
    literal_numbers: ["two"]
    source:
      file: vision_training/data/augmentations.py
      function: DataAugmenter.create_views
      start: "# Every view of the batch drawn"
    highlights:
      - {match: "return views", sentences: [0]}
      - {match: "for view_index in|for image in", sentences: [1]}
      - {match: "view_index=view_index", sentences: [1]}
      - {match: "with torch.autocast", sentences: [2]}
    narration:
      - "The trainer calls create views in its forward pass, for the training and the validation batches alike, so that the validation loss is measured on views too."
      - "It loops over the two views and over the images, and passes the index of the view down to the draw, where the first view never draws the second view types: the two views of an image never share them."
      - "The views are computed in float32 with the autocast off, so that the crops, blurs and interpolations keep their precision under the bfloat16 mixed precision of the run."

  - kind: html
    page: diagram
    title: "Two views of one star"
    code_reference: "vision_training/data/augmentations.py · DataAugmenter.describe_report"
    # The two views of the methods and their labels
    literal_numbers: ["two", "1", "2"]
    elements:
      # The test image and its two views, as the sample images of the evaluation draw them
      - {type: image, path: "figures:self_supervised/views/test_000000_image.png", box: [30, 230, 270, 470], border: border, caption: "{{self_supervised.views.sample_0.name}} · {{self_supervised.views.sample_0.class}}", highlight: [0]}
      - {type: arrow, points: [[285, 320], [375, 175]], colour: dim}
      - {type: arrow, points: [[285, 380], [375, 545]], colour: dim}
      - {type: image, path: "figures:self_supervised/views/test_000000_view_1.png", box: [390, 25, 690, 325], border: blue, highlight: [1]}
      - {type: text, position: [540, 335], text: "view 1", font: diagram_small, colour: blue, anchor: ma}
      - {type: image, path: "figures:self_supervised/views/test_000000_view_2.png", box: [390, 395, 690, 695], border: violet, highlight: [2]}
      - {type: text, position: [540, 705], text: "view 2", font: diagram_small, colour: violet, anchor: ma}
      # The augmentations drawn for every view, as the input viewer lists them
      - type: listing
        box: [720, 50, 1740, 330]
        font: diagram_monospace_tiny
        source: {file: "figures:self_supervised/listings/test_000000_view_1_augmentations.txt"}
        highlights:
          # Every line, whatever types the draw of the current code picks for this view
          - {match: ".", sentences: [1]}
      - type: listing
        box: [720, 420, 1740, 700]
        font: diagram_monospace_tiny
        source: {file: "figures:self_supervised/listings/test_000000_view_2_augmentations.txt"}
        highlights:
          - {match: ".", sentences: [2]}
    narration:
      - "Here is a star of the test split and the two views its sample image draws at every evaluation, from a seed of the image, each listed with the augmentations it drew."
      - "The first view is a crop of {{self_supervised.views.crop_minimum_area:percent_label}} to {{self_supervised.views.crop_maximum_area:percent_label}} of the area, followed by the geometric and photometric changes its draw picked, listed beside it."
      - "The second view draws again from the same image, so its crop and its changes differ, and the black-out and solarization types only ever appear in this second view."
      - "The shape is what both views keep, and the loss pulls their embeddings together, so the backbone has to learn what survives these changes, and nothing else."

  - kind: html
    page: diagram
    title: "The checks at launch"
    code_reference: "vision_training/configuration_processing/self_supervised_checks.py · check_self_supervised_configuration"
    # The two methods (SELF_SUPERVISED_METHODS), the smallest batch of check_self_supervised_configuration (a batch of
    # one refused, no constant) and the positive numbers of neighbours and of reference images
    literal_numbers: ["two", "0"]
    elements:
      - type: listing
        box: [30, 60, 1740, 560]
        font: diagram_monospace
        source: {file: "figures:self_supervised/listings/configuration_checks.txt"}
        highlights:
          - {match: "Invalid Configuration File", sentences: [0]}
          - {match: "data_augmentation.activated' must|views of every image, which", sentences: [1]}
          - {match: "random_crop.probability' must|random_crop.activated' is True|drawn for every view", sentences: [1]}
          - {match: "ProjectionHead.method", sentences: [2]}
          - {match: "batch_size' must|compare the views", sentences: [2]}
      - {type: text, position: [880, 640], text: "checked the same way: Data.grouped_batches, the head layers, the k-NN neighbours and reference images > 0", font: diagram_small, colour: dim, anchor: mm, appear: 3, highlight: [3]}
    narration:
      - "At launch, the self-supervised checks run after the common ones, and every mistake is listed before the run stops: here the saved configuration of the run, given {{self_supervised.checks.error_count:words}} mistakes."
      - "The augmentation must be on, since its types draw the views, and the crop must be drawn for every view or turned off."
      - "The method must be one of the two, and a batch must hold at least two images, the losses comparing the images of a batch with each other."
      - "The grouped batches, which fill a batch with blocks of images sharing a camera as hard negatives, the layers of the head, and the numbers of neighbours and of reference images per class are checked the same way."

  - kind: html
    page: diagram
    title: "The run name"
    code_reference: "vision_training/configuration_processing/run_name.py · build_self_supervised_sections"
    elements:
      - {type: text, position: [148, 110], font: code_text, segments: [{text: "SSL", highlight: [0]}, {text: "_", colour: dim}, {text: "IN-KAR-{{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#Data.image_settings.size}}_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128", dim: [1, 2]}, {text: "_", colour: dim}, {text: "PAVG.{{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.fully_connected[0]}}.{{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.fully_connected[1]}}-PBN", highlight: [1]}, {text: "_", colour: dim}, {text: "SIMCLR-T{{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.simclr.temperature}}", highlight: [1]}]}
      - {type: box, box: [60, 230, 470, 430], text: "SSL\n\ntask: self_supervised\nno class count:\nno label is trained", font: diagram_small, outline: violet, highlight: [0]}
      - {type: box, box: [560, 230, 1030, 430], text: "PAVG.{{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.fully_connected[0]}}.{{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.fully_connected[1]}}-PBN\n\naverage pooling,\nlayers {{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.fully_connected[0]}} then {{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.fully_connected[1]}},\nbatch normalization", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: box, box: [1120, 230, 1700, 430], text: "SIMCLR-T{{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.simclr.temperature}}\n\nSimCLR, temperature {{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#ProjectionHead.simclr.temperature}}\nor BT-OD<weight>\nfor Barlow Twins", font: diagram_small, outline: aqua, appear: 1, highlight: [1]}
      - {type: arrow, points: [[230, 130], [260, 225]], colour: dim}
      - {type: arrow, points: [[1140, 130], [800, 225]], colour: dim, appear: 1}
      - {type: arrow, points: [[1450, 130], [1410, 225]], colour: dim, appear: 1}
      - {type: box, box: [130, 520, 1630, 700], text: "No token: the views, the batch size, the learning rate, the grouped batches\na run with stronger views or larger batches resumes the folder of the previous one\nrun_name_suffix: \"v1\"  →  <run name>_v1", font: diagram_text, outline: yellow, appear: 2, highlight: [2]}
    narration:
      - "The run name starts with SSL, followed by the input and backbone tokens of every task; it has no class count, since the training reads no label."
      - "The head gives P with the pooling and the layer sizes, then PBN for its batch normalization; the method gives SIMCLR with its temperature, or BT with its off-diagonal weight."
      - "Say you relaunch with stronger views or larger batches: the views, the batch size, the learning rate and the grouped batches leave no token, so the run resumes the folder of the previous one, unless a run name suffix is set."

  - kind: summary
    title: "Recap"
    items:
      - {text: "Pre-train the backbone on unlabelled images, transfer it with Backbone.pretrained", sentences: [0]}
      - {text: "Labels only serve the k-NN evaluation; unmapped images get {{constant:vision_training/core/contracts.py#IGNORED_LABEL_INDEX}}", sentences: [1]}
      - {text: "ProjectionHead: pooling to the representation, layers to the embedding", sentences: [2]}
      - {text: "simclr (temperature) or barlow_twins (off-diagonal weight)", sentences: [3]}
      - {text: "Views drawn by Data.data_augmentation, random_crop at probability {{config:vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml#Data.data_augmentation.types.random_crop.probability}}", sentences: [4]}
      - {text: "Solarize and black-out on the second view only", sentences: [5]}
      - {text: "No token for the views, batch or learning rate: set run_name_suffix", sentences: [6]}
    narration:
      - "To recap: the task pre-trains the backbone on images without labels, and another task starts from it through the pre-trained settings of its backbone section."
      - "The labels only serve the nearest neighbour evaluation; an image without a mapped category gets the ignored label and is trained on like the others."
      - "The projection head pools the last map into the representation, the vector that is evaluated and transferred, and its layers map it to the embedding the loss compares."
      - "The method key switches between SimCLR, set by its temperature, and Barlow Twins, set by its off-diagonal weight, both settings being checked whatever the method."
      - "The data augmentation section draws the views and must be on, and the random crop, when activated, stays at a probability of one: it is the main difference between the views."
      - "Solarization and black-out are drawn for the second view only, as in the asymmetric views of Barlow Twins."
      - "The views, the batch size and the learning rate leave no run name token, so a relaunch with stronger views resumes the previous folder unless a run name suffix is set."
      - "The next chapter follows the views through the network to the InfoNCE and Barlow Twins losses, and reads the training curves of the run."
