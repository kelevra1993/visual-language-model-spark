# Self-supervised learning, chapter 3: how a checkpoint is judged without any classifier (the k-NN of the test images
# among reference training images, the real neighbourhood of a star of the test split among them, and the effective
# rank), the test metrics of the run across its checkpoints, its sample images and the nearest reference images of the
# star, Results.txt, the batch normalization pitfall of the first validations, the standalone evaluation, the export of
# the encoder with its input contract, the transfer of the backbone and the pitfalls of the task. Coordinates of the html scenes are in pixels of the content area (1760 x 740, origin at its top
# left corner); the figures named figures:self_supervised/... are made by tutorials/figures/self_supervised from the
# SimCLR run of tutorial_sources.yaml (key self_supervised), the sample images read from the run folder itself.
series: self_supervised
series_title: "Self-Supervised Learning (SSL)"
chapter: 3
title: "Judging without a classifier"
output_name: self_supervised_03_judging_without_a_classifier
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [self_supervised]
references:
  - "vision_training/trainers/self_supervised_trainer.py · SelfSupervisedTrainer.compute_evaluation_results"
  - "vision_training/trainers/self_supervised_trainer.py · SelfSupervisedTrainer.compute_nearest_neighbour_results"
  - "vision_training/trainers/self_supervised_trainer.py · SelfSupervisedTrainer.build_sample_image"
  - "vision_training/deployment/export_specifications.py · TASK_MODEL_NAMES"
  - "vision_training/models/model_transfer.py · load_pretrained_component"
  - "documentation/bug_standards.md"
  - "documentation/task workflows/self_supervised_workflow.md"
scenes:
  - kind: title_card
    heading: "Judging without a classifier"
    subheading: "k-NN, effective rank, pitfalls, export and transfer"
    footnote: "Self-Supervised Learning (SSL) · chapter 3"
    # The number of the chapter in the footnote
    literal_numbers: ["3"]
    narration:
      - "A self-supervised run has no classifier to score, so every evaluated checkpoint is judged by its representations: whether their nearest neighbours share a class, and how many directions they use."
      - "This chapter reads the evaluation of the run, its pitfalls, and how its backbone is exported and transferred."

  - kind: code
    title: "The k-nearest neighbour vote"
    code_reference: "vision_training/evaluation/self_supervised/representation_metrics.py · compute_nearest_neighbour_predictions"
    source:
      file: vision_training/evaluation/self_supervised/representation_metrics.py
      function: compute_nearest_neighbour_predictions
      start: "normalized_queries = "
    highlights:
      - {match: "normalize\\(", sentences: [1]}
      - {match: "^\\s*similarities = ", sentences: [1]}
      - {match: "topk|torch.exp", sentences: [2]}
      - {match: "scatter_add_|argmax", sentences: [3]}
    narration:
      - "Every test image is encoded without views, as in deployment, and the representations of the whole split are kept on the CPU until the end: {{self_supervised.results.test_images:,}} here."
      - "Every labelled test image is then compared by cosine similarity with the reference images, at most {{self_supervised.run.number_reference_images_per_class}} labelled training images per class, the same at every evaluation and encoded by the same weights, never with the other test images."
      - "Its {{self_supervised.run.number_neighbours}} nearest training images vote for their class, each weighing the exponential of its similarity over {{self_supervised.knn.temperature}}."
      - "The class with the most weight is the prediction, scored like a classifier with the accuracy, the balanced accuracy, the macro F1 and the metrics of every class; no classifier is ever trained."

  - kind: html
    page: 11_self_supervised/knn_vote
    title: "The neighbours of a star"
    code_reference: "vision_training/evaluation/self_supervised/representation_metrics.py · compute_nearest_neighbour_predictions"
    data: "figures:self_supervised/representations/knn_radial_layout.json"
    steps: {points: 0, ring: 1}
    # The distance of the layout, square root of 1 - cosine similarity
    literal_numbers: ["1"]
    elements:
      - {type: text, position: [40, 30], text: "{{self_supervised.knn.query_class}} among {{self_supervised.knn.reference_count:,}} reference images · iteration {{self_supervised.knn.last_iteration:,}}", font: diagram_bold}
      - {type: text, position: [40, 700], text: "distance from the centre: square root of 1 - cosine similarity to the query", font: diagram_tiny, colour: dim}
      - {type: text, position: [1000, 70], text: "weighted vote of the {{self_supervised.run.number_neighbours}} neighbours", font: diagram_bold, appear: 2}
      - {type: bars, box: [1000, 120, 1720, 600], orientation: horizontal, values: "{{self_supervised.knn.vote_shares}}", labels: "{{self_supervised.knn.vote_labels}}", value_labels: "{{self_supervised.knn.vote_value_labels}}", colours: "{{self_supervised.knn.vote_colours}}", maximum: 1.0, label_width: 170, appear: 2, highlight: [3]}
      - {type: text, position: [1000, 640], text: "prediction: {{self_supervised.knn.query_prediction_last}}", font: diagram_text, colour: accent, appear: 3}
    narration:
      - "Here is the star of the sample images, a test image, with its nearest images among the {{self_supervised.knn.reference_count:,}} reference images of the run, encoded by the last checkpoint: every dot is a training image, farther from the centre as its cosine similarity to the star falls."
      - "Its {{self_supervised.run.number_neighbours}} nearest images fall inside the ring, from a similarity of {{self_supervised.knn.query_nearest_similarity_last:.2f}} down to {{self_supervised.knn.query_last_neighbour_similarity_last:.2f}}, and {{self_supervised.knn.query_same_class_neighbours_last}} of them are stars."
      - "Each weighs the exponential of its similarity over {{self_supervised.knn.temperature}}, so the nearest counts {{self_supervised.knn.weight_ratio:.1f}} times the farthest of them."
      - "The vote goes to {{self_supervised.knn.query_prediction_last}}, the class of the largest total weight; the k-NN accuracy is the share of the labelled test images whose vote gives their own class."

  - kind: image
    title: "The test metrics of the run"
    code_reference: "vision_training/trainers/self_supervised_trainer.py · SelfSupervisedTrainer.compute_evaluation_results"
    image: "figures:self_supervised/evaluation/test_metrics.png"
    # The two other metrics of the figure, and the spread of collapsed representations
    literal_numbers: ["two", "zero"]
    highlights:
      - {box: "{{self_supervised.test.knn_accuracy_panel_box}}", sentences: [0]}
      - {box: "{{self_supervised.test.effective_rank_panel_box}}", sentences: [1]}
      - {box: "{{self_supervised.test.representation_standard_deviation_panel_box}}", sentences: [2]}
    narration:
      - "Over the evaluations of the whole test split, the k-NN accuracy goes from {{self_supervised.test.knn_accuracy_first:.1%}} to {{self_supervised.test.knn_accuracy_last:.1%}}, {{self_supervised.test.knn_accuracy_last_over_chance:.1f}} times the chance of one in {{self_supervised.test.class_count}}."
      - "The effective rank goes from {{self_supervised.test.effective_rank_first:.0f}} to {{self_supervised.test.effective_rank_last:.0f}} of the {{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#Backbone.convolutions.6[1]}} directions of the representation."
      - "The spread of the representations goes from {{self_supervised.test.representation_standard_deviation_first:.2f}} to {{self_supervised.test.representation_standard_deviation_last:.2f}}: never negative after the ReLU and the pooling, the representations cover only part of the sphere, so read the spread as a trend next to the other two, a collapse driving it towards zero."

  - kind: code
    title: "The effective rank"
    code_reference: "vision_training/evaluation/self_supervised/representation_metrics.py · compute_effective_rank"
    source:
      file: vision_training/evaluation/self_supervised/representation_metrics.py
      function: compute_effective_rank
    highlights:
      - {match: "svdvals|singular_value_distribution = ", sentences: [0]}
      - {match: "entropy = |torch.exp", sentences: [0]}
      - {match: "isfinite|\\bnan\\b", sentences: [1]}
    narration:
      - "The effective rank is the exponential of the entropy of the singular values of the representations, normalized to sum to one: one when they all lie along one direction, {{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#Backbone.convolutions.6[1]}} when they use every direction evenly."
      - "It needs no label, so it is the headline metric of a test split without labels, and the warning of a collapse; diverged weights give not a number instead of stopping the run."

  - kind: html
    page: diagram
    title: "The sample images"
    code_reference: "vision_training/trainers/self_supervised_trainer.py · SelfSupervisedTrainer.build_sample_image"
    # The two views of the methods
    literal_numbers: ["two"]
    elements:
      - {type: text, position: [460, 14], text: "iteration {{self_supervised.knn.first_iteration:,}}", font: diagram_small, colour: dim, anchor: ma}
      - {type: text, position: [1310, 14], text: "iteration {{self_supervised.knn.last_iteration:,}}", font: diagram_small, colour: dim, anchor: ma}
      - {type: image, path: "runs:tutorials/{{self_supervised.run.name}}/Evaluation/Iteration_{{self_supervised.knn.first_iteration}}/Samples/test_000000.png", box: [40, 50, 880, 356], border: border, highlight: [1]}
      - {type: image, path: "runs:tutorials/{{self_supervised.run.name}}/Evaluation/Iteration_{{self_supervised.knn.last_iteration}}/Samples/test_000000.png", box: [890, 50, 1730, 356], border: border, highlight: [1]}
      - {type: image, path: "runs:tutorials/{{self_supervised.run.name}}/Evaluation/Iteration_{{self_supervised.knn.first_iteration}}/Samples/test_000012.png", box: [40, 400, 880, 706], border: border, appear: 0}
      - {type: image, path: "runs:tutorials/{{self_supervised.run.name}}/Evaluation/Iteration_{{self_supervised.knn.last_iteration}}/Samples/test_000012.png", box: [890, 400, 1730, 706], border: border, appear: 0}
    narration:
      - "Every evaluation also saves {{self_supervised.run.number_sample_images}} fixed test images, each next to two views drawn from its seed, so that every checkpoint compares the same two views."
      - "The caption gives the cosine similarity of the representations of the two views: {{self_supervised.similarity.star_first:.2f}} for this star at iteration {{self_supervised.knn.first_iteration:,}}, and {{self_supervised.similarity.star_last:.2f}} at the last one."
      - "Faced with a similarity near one, remember that it proves nothing alone, a collapsed backbone giving one to every pair: read it with the nearest neighbour accuracy and the effective rank."

  - kind: image
    title: "The nearest images"
    code_reference: "vision_training/models/self_supervised/inference_encoder.py · InferenceEncoder"
    image: "figures:self_supervised/representations/neighbour_mosaic.png"
    narration:
      - "The {{constant:tutorials/figures/self_supervised/representation_figures.py#MOSAIC_NEIGHBOUR_COUNT:words}} nearest reference images of the star, at the first and at the last evaluation, among the same {{self_supervised.knn.reference_count:,}} training images."
      - "The stars among them go from {{self_supervised.knn.mosaic_same_class_neighbours_first:words}} to {{self_supervised.knn.mosaic_same_class_neighbours_last:words}}; read the colours of the others too, a neighbour sharing the colour of the star rather than its shape being the colour cue of the previous chapter."

  - kind: html
    page: diagram
    title: "Results.txt and the classes"
    code_reference: "vision_training/trainers/self_supervised_trainer.py · SelfSupervisedTrainer.compute_nearest_neighbour_results"
    # The global metrics of SelfSupervisedTrainer.compute_evaluation_results (k-NN accuracy, balanced accuracy and
    # macro F1, effective rank, representation standard deviation), counted by hand
    literal_numbers: ["five"]
    elements:
      - type: listing
        box: [20, 30, 1010, 720]
        font: diagram_monospace_small
        source: {file: "figures:self_supervised/listings/last_results_block.txt"}
        highlights:
          - {match: "k-NN Accuracy|Effective Rank|Representation Standard", sentences: [0]}
          - {match: "Labelled Test Images|neighbours among|Sample Images", sentences: [0]}
          - {match: "Per Class|Precision", sentences: [1]}
      - {type: text, position: [1060, 40], text: "k-NN F1 per class · iteration {{self_supervised.results.last_iteration:,}}", font: diagram_bold, appear: 1}
      - {type: bars, box: [1060, 100, 1720, 600], orientation: horizontal, values: "{{self_supervised.classes.f1_values}}", labels: "{{self_supervised.classes.f1_labels}}", value_labels: "{{self_supervised.classes.f1_value_labels}}", colour: blue, maximum: "{{self_supervised.classes.f1_bar_maximum}}", label_width: 160, appear: 1, highlight: [2]}
      - {type: text, position: [1060, 650], text: "class_metrics.csv: the same metrics in class order", font: diagram_small, colour: dim, appear: 1}
      - {type: text, position: [1060, 690], text: "then: k-NN recall with its {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:.0%}} interval", font: diagram_small, colour: dim, appear: 3, highlight: [3]}
    narration:
      - "Results.txt keeps one block per evaluation: the five global metrics, the labelled test images, the neighbours and reference training images of the k-NN, and the sample images."
      - "Then the table of the classes, worst F1 first, the class metrics file holding the same rows in class order."
      - "The {{self_supervised.classes.best_class}} and the {{self_supervised.classes.second_class}} lead with an F1 of {{self_supervised.classes.best_f1:.2f}} and {{self_supervised.classes.second_f1:.2f}}, while {{self_supervised.classes.bottom_four}} trail, down to {{self_supervised.classes.worst_f1:.2f}}."
      - "A per class k-NN recall table follows, the worst recall first, with the exact {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:.0%}} confidence interval of every recall over the labelled test images of its class."

  - kind: image
    title: "The first validations"
    code_reference: "vision_training/models/components/convolution_block.py · ConvolutionBlock"
    image: "figures:self_supervised/training/early_validation.png"
    # The spread of the first validation batch is a few thousandths, which two decimals would read as 0.00, a
    # collapse the sentence says it only looks like
    exact_facts: [self_supervised.early.spread_validation_0]
    highlights:
      - {box: "{{self_supervised.early.spread_panel_box}}", sentences: [0, 2]}
      - {box: "{{self_supervised.early.loss_panel_box}}", sentences: [1]}
    narration:
      - "The first validation batch, at iteration {{self_supervised.early.validation_iteration_0}}, gave an embedding standard deviation of {{self_supervised.early.spread_validation_0:.4f}}, against {{self_supervised.early.spread_train_at_validation_0:.2f}} for the training batch of the same iteration."
      - "Its loss was exactly the {{self_supervised.curves.random_info_nce:.2f}} of random embeddings, and stayed there up to iteration {{self_supervised.early.last_iteration_at_random}}."
      - "Validation and test images are encoded in evaluation mode, where the batch normalization uses running statistics updated at a momentum of {{self_supervised.run.backbone_momentum}}, still far from the data after a few updates: every image gets almost the same embedding."
      - "The spread passed one half at iteration {{self_supervised.early.spread_half_iteration}} here; take a checkpoint evaluated that early: it looks collapsed whatever the training."

  - kind: code
    title: "Evaluating checkpoints again"
    code_reference: "scripts/evaluation/evaluate_checkpoint.py"
    source:
      file: scripts/evaluation/evaluate_checkpoint.py
      start: "# Largest number of error images saved"
      end: "^    nms_distance_exponent = "
    highlights:
      - {match: "maximum_error_images_per_class_pair = ", sentences: [0, 1]}
      - {match: "error_dumps", sentences: [1]}
      - {match: "^    target_precisions = |^    nms_criterion = |^    nms_distance_exponent = ", sentences: [2]}
    narration:
      - "The evaluate checkpoint script scores the checkpoints of a run again, its settings in its main block, as the foundations series showed."
      - "Say you leave the maximum number of error images per pair of classes as it is: a self-supervised configuration has no error dumps section, so the script skips that limit with a yellow warning and evaluates the run without error images."
      - "Target precisions and the non-maximum suppression settings, when set, are skipped the same way, a self-supervised run having neither class thresholds nor a detector."

  - kind: html
    page: diagram
    title: "Export and transfer"
    code_reference: "vision_training/models/self_supervised/inference_encoder.py · InferenceEncoder.forward"
    # The range of the 8-bit pixel values the encoder takes
    literal_numbers: ["0", "255"]
    elements:
      # The exported encoder
      - {type: text, position: [40, 30], text: "export: image_encoder (InferenceEncoder)", font: diagram_bold}
      - {type: box, box: [40, 90, 380, 230], text: "images\n[B, {{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#Backbone.input_channels}}, {{self_supervised.run.image_size}}, {{self_supervised.run.image_size}}]\nfloat32 BGR, 0 to 255", font: diagram_small, outline: blue, highlight: [0]}
      - {type: arrow, points: [[390, 160], [460, 160]], colour: dim}
      - {type: box, box: [470, 90, 830, 230], text: "backbone\n+ average pooling", font: diagram_small, outline: aqua, highlight: [0]}
      - {type: arrow, points: [[840, 160], [910, 160]], colour: dim}
      - {type: box, box: [920, 90, 1200, 230], text: "L2\nnormalization", font: diagram_small, outline: aqua, highlight: [0]}
      - {type: arrow, points: [[1210, 160], [1280, 160]], colour: dim}
      - {type: box, box: [1290, 90, 1720, 230], text: "representations\n[B, {{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#Backbone.convolutions.6[1]}}]\ndot product = cosine", font: diagram_small, outline: blue, highlight: [0]}
      - {type: box, box: [920, 260, 1720, 330], text: "preprocessing.json: the input contract", font: diagram_small, outline: blue, appear: 1, highlight: [1]}
      - {type: box, box: [470, 260, 830, 330], text: "no projection head", font: diagram_small, outline: red, appear: 2, highlight: [2]}
      # The transfer to another task
      - {type: text, position: [40, 400], text: "transfer: Backbone.pretrained of any task", font: diagram_bold, appear: 3}
      - type: listing
        box: [40, 450, 1000, 700]
        font: diagram_monospace_small
        appear: 3
        source: {file: vision_training/configurations/classification/configuration_synthetic_shapes.yaml, keys: [Backbone.pretrained.experiment_folder, Backbone.pretrained.iteration, Backbone.pretrained.freeze], comments: false}
        highlights:
          - {key: Backbone.pretrained.experiment_folder, sentences: [3]}
      - {type: box, box: [1060, 450, 1720, 700], text: "same modules and normalization,\nthe same blocks or the first ones,\nonly the backbone is loaded,\nthe projection head is dropped", font: diagram_small, outline: violet, appear: 3, highlight: [3]}
    narration:
      - "The export wraps the trained model in the inference encoder, served by Triton as the image encoder: float32 BGR images of {{self_supervised.run.image_size}} pixels in, L2-normalized representations of {{config:tutorials/run_configurations/self_supervised_synthetic_shapes_tutorial.yaml#Backbone.convolutions.6[1]}} values out, so that a dot product is a cosine similarity."
      - "Next to the model, the export also writes the input contract of the run: how a photo is resized, padded and laid out before the encoder takes it."
      - "The projection head is not in the graph: the export serves the representation, for similarity searches and nearest neighbour classifications."
      - "When the goal is to start another task from this backbone, give the run folder as the experiment folder of its backbone pre-trained settings; its modules and normalization must be those of this run, its blocks the same or the first of them, and only the backbone is loaded."

  - kind: text_panel
    title: "Pitfalls"
    font_size: 34
    # The residual shortcuts of the six blocks of the run backbone: only blocks 3 and 5 get one, blocks 2, 4 and 6
    # changing the channels in 2 layers (ConvolutionBlock.residual_parity), derived by hand from Backbone.convolutions
    literal_numbers: ["three", "five", "3", "5", "2"]
    columns:
      - heading: "symptom"
        lines:
          - "early checkpoints look collapsed"
          - "pair accuracy high, k-NN at chance"
          - "stronger views resume the old run"
          - "shortcuts in blocks 3 and 5 only"
      - heading: "cause and fix"
        lines:
          - "batch norm running statistics: wait"
          - "a cue both views share: more colour types"
          - "no run name token: run_name_suffix"
          - "channel changes in 2 layers only"
    narration:
      - "To sum up the pitfalls: early checkpoints look collapsed because of the running statistics, and a positive pair accuracy far ahead of the nearest neighbour accuracy means the views share a cue."
      - "Stronger views or larger batches resume the previous run folder unless a suffix is set."
      - "And in this backbone layout, only blocks three and five get residual shortcuts, which a transferred backbone keeps."

  - kind: summary
    title: "Recap"
    # The two views of the methods
    literal_numbers: ["two"]
    items:
      - {text: "No classifier: a k-NN of test images among training images"}
      - {text: "{{config:vision_training/configurations/self_supervised/configuration_synthetic_shapes.yaml#ExperimentConfiguration.evaluation.number_neighbours}} neighbours, each weighing exp(cosine / {{constant:vision_training/evaluation/self_supervised/representation_metrics.py#NEAREST_NEIGHBOUR_TEMPERATURE}})"}
      - {text: "Effective rank: the label-free collapse watch"}
      - {text: "Sample images: the same two views at every checkpoint"}
      - {text: "Early checkpoints: running statistics not settled"}
      - {text: "Export image_encoder: L2-normalized representations, no head"}
      - {text: "Transfer through Backbone.pretrained"}
    narration:
      - "To recap: a checkpoint is judged by the nearest neighbours of its representations and by their effective rank, with the same sample views at every evaluation."
      - "The representation is what the export serves and what the other tasks start from; this ends the self-supervised series."
