# Frame selection, chapter 3: the evaluation of the README run read file by file (Results.txt of iteration 1000, three
# of its wrong picks, WRONG_PICKS of the selection figures, drawn again from the checkpoint run on the CPU, the chosen
# probabilities against the thresholds of class_thresholds.json at iterations 1000 and 2000, the low confidence flags,
# the wrong picks going through), the deployment as a network with its
# input settings, a decoder and an ensemble with the settings of the decoder, and the pitfalls of the task. Coordinates
# of the html scenes are in pixels of the content area (1760 x 740, origin at its top left corner); the figures named
# figures:frame_selection/... are made by tutorials/figures/frame_selection.
series: frame_selection
series_title: "Frame Selection (SEL)"
chapter: 3
title: "Evaluation and deployment"
output_name: frame_selection_03_evaluation_and_deployment
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [frame_selection]
references:
  - "vision_training/evaluation/sequence/frame_selection_metrics.py · compute_ranking_metrics"
  - "vision_training/evaluation/sequence/frame_selection_metrics.py · find_selection_thresholds"
  - "vision_training/trainers/frame_selection_trainer.py · FrameSelectionTrainer.write_selections_file"
  - "vision_training/deployment/frame_selection_decoder_backend.py · TritonPythonModel"
  - "vision_training/deployment/frame_selection_deployment.py · export_frame_selection_decoding"
  - "vision_training/deployment/input_contract.py · write_preprocessing_file"
  - "vision_training/deployment/export_formats.py · restore_dynamic_output_frames"
  - "vision_training/deployment/export_size_estimates.py · estimate_export_sizes"
  - "documentation/suggestions.md"
scenes:
  - kind: title_card
    heading: "Evaluation and deployment"
    subheading: "Both decodings scored, doubtful picks flagged, the decoding next to the network"
    footnote: "Frame Selection (SEL) · chapter 3"
    # The number of the chapter in the footnote
    literal_numbers: ["3"]
    narration:
      - "This chapter reads the evaluation of the frame selection run: its report, its {{frame_selection.decodings.iteration_1000_hungarian_wrong}} wrong picks of iteration {{frame_selection.picks.iteration}}, and the confidence thresholds that flag the doubtful ones."
      - "Then the deployment as a network, a decoder and an ensemble, and the pitfalls of the task."

  - kind: html
    page: diagram
    title: "The report of iteration {{frame_selection.evaluation.listed_iteration}}"
    code_reference: "vision_training/trainers/frame_selection_trainer.py · FrameSelectionTrainer.compute_evaluation_results"
    elements:
      - type: listing
        box: [24, 20, 1736, 720]
        font: diagram_monospace_small
        # The block down to the end of the Per Class Selection table: with the Per Class Recall table after it, the
        # block holds more lines than the box shows
        source: {file: "figures:frame_selection/listings/results_block.txt", end: "never reached"}
        highlights:
          - {match: "^Iteration", sentences: [0]}
          - {match: "Hungarian Selection Accuracy|Greedy Selection Accuracy", sentences: [1]}
          - {match: "Fully Right", sentences: [2]}
          - {match: "Background Picks", sentences: [3]}
          - {match: "Top-{{frame_selection.evaluation.top_k}} Selection", sentences: [4]}
          - {match: "Frame Accuracy|Frame Macro F1", sentences: [5]}
          - {match: "^   {{frame_selection.evaluation.worst_class}}", sentences: [6]}
    narration:
      - "The report gives the metrics of both decodings: here iteration {{frame_selection.evaluation.listed_iteration}}, {{frame_selection.dataset.test_sequences}} test sequences, {{frame_selection.dataset.test_frames:,}} frames."
      - "The selection accuracy is the share of the true frames chosen for their class: {{frame_selection.evaluation.hungarian_selection_accuracy:percent}} with the Hungarian decoding, all but {{frame_selection.decodings.iteration_1000_hungarian_wrong}} of the {{frame_selection.decodings.iteration_1000_rows}} true frames, and {{frame_selection.evaluation.greedy_selection_accuracy:percent}} with the greedy one."
      - "Fully right sequences is the share of sequences with every choice right, {{frame_selection.evaluation.hungarian_fully_right_sequences:percent}}."
      - "Background and swapped picks sort the wrong choices: the Hungarian decoding made {{frame_selection.evaluation.picks.hungarian_background_count}} background picks, frames to leave unselected, and {{frame_selection.evaluation.picks.hungarian_swapped_count}} swapped picks, true frames of another class, {{frame_selection.evaluation.hungarian_background_picks:percent}} and {{frame_selection.evaluation.hungarian_swapped_picks:percent}} of its picks."
      - "The top-{{frame_selection.evaluation.top_k}} selection accuracy and the mean true frame rank score the probabilities before any decoding: {{frame_selection.evaluation.top_2_selection_accuracy:percent}} of the true frames are among the {{frame_selection.evaluation.top_k:words}} most probable of their class, and the mean rank is {{frame_selection.evaluation.mean_true_frame_rank:.2f}}."
      - "The frame metrics take the most probable class of every frame, before decoding: a frame accuracy of {{frame_selection.evaluation.frame_accuracy:percent}}."
      - "The per-class table puts the worst class first, here the {{frame_selection.evaluation.worst_class}} at {{frame_selection.evaluation.worst_class_accuracy:percent}}; at iteration {{frame_selection.evaluation.last_iteration}}, the selection accuracy reaches {{frame_selection.evaluation.iteration_2000.hungarian_selection_accuracy:percent}}, the {{frame_selection.evaluation.iteration_2000.worst_class}} then worst at {{frame_selection.evaluation.iteration_2000.worst_class_accuracy:percent}}."
      - "Below it, the report adds a Per Class Recall table: the selection accuracy of every class with the run's decoding, and its {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} Korn-Graubard interval over the test sequences, whose frames are chosen together."

  - kind: image
    title: "The wrong picks of iteration {{frame_selection.picks.iteration}}"
    code_reference: "vision_training/utilities/visualization.py · build_frame_selection_image"
    image: "figures:frame_selection/selection/wrong_picks.png"
    # The three picks of WRONG_PICKS of tutorials/figures/frame_selection/selection_figures.py, which checks their class
    # and flag; the shapes the sentences describe (a color close to the background, a shape cut by the border, a smaller
    # whole copy) are their content: check these sentences again when the picks change
    views:
      - {box: "{{frame_selection.picks.first.box}}", from_sentence: 1}
      - {box: "{{frame_selection.picks.second.box}}", from_sentence: 3}
      - {box: "{{frame_selection.picks.third.box}}", from_sentence: 4}
    narration:
      - "These are {{frame_selection.picks.count:words}} of the {{frame_selection.decodings.iteration_1000_hungarian_wrong}} wrong picks of iteration {{frame_selection.picks.iteration}}, drawn by the selection image of the repository from the checkpoint run again on the CPU."
      - "A solid green border marks a frame chosen for its true class, a red one a frame chosen for a class it does not hold, dashed yellow a true frame left unchosen, and the heat map below gives the probability of every frame for every wanted class."
      - "In test sequence {{frame_selection.picks.first.sequence_number}}, the true {{frame_selection.picks.first.class}}, frame {{frame_selection.picks.first.true_frame}}, drawn in a color close to the background, has a probability of {{frame_selection.picks.first.true_probability:.2f}}, and the model prefers frame {{frame_selection.picks.first.chosen_frame}} at {{frame_selection.picks.first.chosen_probability:.2f}}: no frame looks like a {{frame_selection.picks.first.class}} to it."
      - "In sequence {{frame_selection.picks.second.sequence_number}}, the true {{frame_selection.picks.second.class}}, frame {{frame_selection.picks.second.true_frame}}, is cut by the border: {{frame_selection.picks.second.true_probability:.2f}}, against {{frame_selection.picks.second.chosen_probability:.2f}} for a smaller whole one, frame {{frame_selection.picks.second.chosen_frame}}."
      - "In sequence {{frame_selection.picks.third.sequence_number}}, the wrong choice is confident: the true {{frame_selection.picks.third.class}}, frame {{frame_selection.picks.third.true_frame}}, also cut by the border, gets {{frame_selection.picks.third.true_probability:.2f}}, and frame {{frame_selection.picks.third.chosen_frame}}, a smaller one, {{frame_selection.picks.third.chosen_probability:.2f}}."

  - kind: image
    title: "Confidence thresholds"
    code_reference: "vision_training/evaluation/sequence/frame_selection_metrics.py · find_selection_thresholds"
    image: "figures:frame_selection/evaluation/thresholds.png"
    highlights:
      - {box: "{{frame_selection.thresholds.iteration_1000_panel_box}}", sentences: [1, 2, 3]}
      - {box: "{{frame_selection.thresholds.iteration_2000_panel_box}}", sentences: [4]}
    narration:
      - "The confidence threshold of a class is the probability from which the chosen frames of the class reach the target precision, {{frame_selection.thresholds.target_precision:percent_label}}, while keeping the most true frames, written in the class thresholds json file with the share of the true frames kept."
      - "At iteration {{frame_selection.thresholds.iterations[0]}}, circle reaches it from {{frame_selection.thresholds.iteration_1000_circle_threshold:.2f}}, keeping {{frame_selection.thresholds.iteration_1000_circle_recall:percent}} of its true frames, while triangle and star need {{frame_selection.thresholds.iteration_1000_triangle_threshold:.2f}} and {{frame_selection.thresholds.iteration_1000_star_threshold:.2f}}, keeping {{frame_selection.thresholds.iteration_1000_triangle_recall:percent}} and {{frame_selection.thresholds.iteration_1000_star_recall:percent}}."
      - "Under these thresholds fall {{frame_selection.thresholds.iteration_1000_wrong_flagged:words}} of the {{frame_selection.thresholds.iteration_1000_wrong:words}} wrong picks, flagged low confidence for a human, along with {{frame_selection.thresholds.iteration_1000_right_flagged}} right choices."
      - "The {{frame_selection.thresholds.iteration_1000_wrong_unflagged:words}} others go through unflagged, among them the confident {{frame_selection.picks.third.class}} of sequence {{frame_selection.picks.third.sequence_number}}, at {{frame_selection.picks.third.chosen_probability:.2f}}."
      - "At iteration {{frame_selection.thresholds.iterations[1]}}, the thresholds become {{frame_selection.thresholds.iteration_2000_circle_threshold:.2f}}, {{frame_selection.thresholds.iteration_2000_triangle_threshold:.2f}} and {{frame_selection.thresholds.iteration_2000_star_threshold:.2f}}, flagging {{frame_selection.thresholds.iteration_2000_wrong_flagged:words}} of the {{frame_selection.thresholds.iteration_2000_wrong:words}} wrong picks; a class never reaching the target precision would get a null threshold, every frame chosen for it flagged."
      - "Unlike the classifiers, the frame selection takes a single target precision and refuses a list, its deployed decoder keeping one threshold per class."

  - kind: code
    title: "The low confidence flags"
    code_reference: "vision_training/models/sequence/frame_selection_decoding.py · flag_low_confidence"
    source:
      file: vision_training/models/sequence/frame_selection_decoding.py
      function: flag_low_confidence
    highlights:
      - {match: "NO_FRAME|class_threshold is None|low_confidence\\[wanted_index\\]", sentences: [0]}
    narration:
      - "flag low confidence applies them in the deployed decoder: a missing frame, a frame below the threshold of its class, or any frame of a class without threshold."
      - "With save predictions on, the selections file of every evaluation gives the same flags, one row per sequence and class, with the true frames, their probabilities and ranks, and the picks of both decodings."

  - kind: html
    page: diagram
    title: "Network, decoder, ensemble"
    code_reference: "vision_training/deployment/frame_selection_deployment.py · write_frame_selection_ensemble"
    # The three kinds of models of the export (network, decoder, ensemble), the ensemble chaining the two others
    literal_numbers: ["three", "two"]
    elements:
      - {type: box, box: [20, 300, 300, 440], text: "images\n[B, T, {{frame_selection.run.input_channels}}, {{frame_selection.dataset.image_size}}, {{frame_selection.dataset.image_size}}]", font: diagram_small, outline: blue}
      - {type: arrow, points: [[300, 370], [375, 370]]}
      # The ensemble the clients query, chaining the network and the decoder
      - {type: box, box: [380, 60, 1320, 700], fill: null, outline: yellow, appear: 5, highlight: [5]}
      - {type: text, position: [850, 92], text: "frame_selector_<format>_ensemble", font: diagram_monospace, colour: value, anchor: mm, appear: 5}
      - {type: box, box: [420, 130, 1280, 300], text: "frame_selector_torchscript, frame_selector_onnx\nthe network alone: class_probabilities [B, T, {{frame_selection.dataset.class_count}}]\nno sequence mask, no decoding\npreprocessing.json next to it: the input settings of the run", font: diagram_small, outline: violet, appear: 1, highlight: [1, 2]}
      - {type: arrow, points: [[850, 300], [850, 375]], appear: 3}
      - {type: box, box: [420, 380, 1280, 660], text: "frame_selector_decoder\nPython backend on the CPU, numpy and scipy\n\nmodel.py · frame_selection_decoding.py (a copy)\ndecoding_settings.json: decoding, frames_per_class,\nunselected class, thresholds, class names", font: diagram_small, outline: aqua, appear: 3, highlight: [3]}
      - {type: arrow, points: [[1280, 520], [1375, 520]], appear: 4}
      - {type: box, box: [1380, 200, 1740, 640], text: "selected_frames [B, {{frame_selection.dataset.wanted_class_count}}, {{frame_selection.run.frames_per_class}}]\nselected_probabilities\nlow_confidence\n\ncandidate_frames [B, {{frame_selection.dataset.wanted_class_count}}, {{frame_selection.evaluation.top_k}}]\ncandidate_probabilities", font: diagram_small, outline: aqua, appear: 4, highlight: [4]}
      - {type: text, position: [160, 520], text: "one T for all\nthe sequences\nof a request", font: diagram_small, colour: dim, anchor: ma, appear: 6}
      # The dynamo ONNX export writes the frames of its trace into the outputs after the bidirectional recurrent layer,
      # which Triton refuses against the dynamic frames of config.pbtxt; restore_dynamic_output_frames of
      # vision_training/deployment/export_formats.py gives that axis the frames of the input again
      - {type: box, box: [20, 60, 300, 270], text: "ONNX network:\noutput frames\nmade dynamic\nagain at export", font: diagram_small, outline: yellow, appear: 7, highlight: [7]}
      # The Export Sizes panel printed at launch (vision_training/deployment/export_size_estimates.py) estimates the
      # inference model of the task, the network alone
      - {type: box, box: [20, 635, 300, 730], text: "Export Sizes panel\nat launch: the network", font: diagram_small, outline: blue, appear: 8, highlight: [8]}
    narration:
      - "The export writes three kinds of Triton models for a frame selection run, the networks checked against the model they were exported from before they replace the served ones."
      - "frame selector Torch Script or ONNX is the network alone: images of B by T by {{frame_selection.run.input_channels:words}} by {{frame_selection.dataset.image_size}} by {{frame_selection.dataset.image_size}} in, class probabilities of B by T by {{frame_selection.dataset.class_count:words}} out, without sequence mask and without decoding."
      - "Like every export, it also writes the input settings of the run, its resize, colour order and layout with the frames after the batch dimension, in a preprocessing file next to it and in the ONNX metadata."
      - "frame selector decoder is a Python backend model run on the CPU: its folder holds a copy of the decoding file of the evaluation, and a decoding settings json file with the decoding, the frames per class, the unselected class, the thresholds and the class names."
      - "It gives the selected frames with their probabilities and low confidence flags, {{frame_selection.dataset.wanted_class_count:words}} by {{frame_selection.run.frames_per_class:words}} per sequence here, and the top-k candidate frames of every class with their probabilities, k being the top k of the evaluation, {{frame_selection.evaluation.top_k:words}}."
      - "frame selector Torch Script ensemble, or ONNX ensemble, chains the two: the model the clients query."
      - "Picture a client with mixed lengths: without a mask, the sequences of one request share their number of frames, from one to the maximum sequence length."
      - "As for the sequence labeler, the dynamo export fixes the output of the ONNX network to the traced frames, and the export makes that axis dynamic again, which Triton needs to load it and its ensemble."
      - "The Export Sizes panel printed at the launch of the training gives the size of the files of the network alone, the decoder and the ensembles left out."

  - kind: code
    title: "The settings of the decoder"
    code_reference: "vision_training/deployment/frame_selection_deployment.py · build_decoding_settings"
    # The thresholds of an export without evaluation, the class_thresholds of zero of the else branch of the excerpt
    literal_numbers: ["zero"]
    source:
      file: vision_training/deployment/frame_selection_deployment.py
      function: build_decoding_settings
      start: "thresholds_path = find_class_thresholds_path"
      end: "class_thresholds = .*wanted_class_indices"
    highlights:
      - {match: "find_class_thresholds_path\\(", sentences: [0, 1, 3]}
      - {match: "^    else:|wanted_class_indices", sentences: [2]}
    narration:
      - "The decoding settings read the class thresholds file of the evaluation of the exported iteration, written by the training or by the evaluation script."
      - "Should both folders hold one, the export stops before writing the decoder rather than pick one of them."
      - "Take a checkpoint that was never evaluated: once exported, every threshold is zero, no chosen frame is ever flagged, and the wanted classes are named by their indices, so evaluate before exporting."
      - "Say you export the moving average of the weights: it still reads the thresholds of the trained weights, a known limit left as it is."

  - kind: html
    page: diagram
    title: "Pitfalls"
    # The best rank, which tied probabilities all get
    literal_numbers: ["1"]
    elements:
      - {type: box, box: [40, 40, 1720, 170], text: "A sequence without exactly frames_per_class frames of every wanted class stops the launch", font: diagram_text, outline: red, highlight: [0]}
      - {type: box, box: [40, 200, 1720, 330], text: "Hungarian: the most probable labelling, not the largest number of right frames", font: diagram_text, outline: violet, highlight: [0]}
      - {type: box, box: [40, 360, 1720, 520], text: "Tied probabilities take the best rank: equal probabilities on every frame\nscore a top-k selection accuracy and a mean true frame rank of 1  (compute_frame_ranks)", font: diagram_text, outline: yellow, appear: 1, highlight: [1]}
      - {type: box, box: [40, 550, 1720, 710], text: "The thresholds flag the doubtful picks, not every wrong one: at iteration {{frame_selection.picks.iteration}},\n{{frame_selection.thresholds.iteration_1000_wrong_unflagged}} of the {{frame_selection.thresholds.iteration_1000_wrong}} wrong picks go through above the threshold of their class", font: diagram_text, outline: aqua, appear: 2, highlight: [2]}
    narration:
      - "To recap the pitfalls: a sequence without exactly frames per class frames of every wanted class stops the launch, and the Hungarian decoding maximizes the labeling, not the right frames."
      - "Equal probabilities give every equal frame the best rank, so a model giving the same probability to every frame scores a top-k accuracy and a mean rank of one: read them with the selection accuracy."
      - "And the thresholds only flag the doubtful picks: a confident wrong pick goes through, as {{frame_selection.thresholds.iteration_1000_wrong_unflagged:words}} of the {{frame_selection.thresholds.iteration_1000_wrong:words}} wrong picks of iteration {{frame_selection.picks.iteration}} do."

  - kind: summary
    title: "Recap"
    # The two views of the self-supervised methods of the next series, and the thresholds of zero of an export
    # without evaluation (build_decoding_settings)
    literal_numbers: ["two", "zero"]
    items:
      - {text: "Selection accuracy of both decodings, the run's decoding as headline", sentences: [0]}
      - {text: "Top-k and mean rank: the probabilities before decoding", sentences: [1]}
      - {text: "Thresholds at the target precision flag the doubtful picks", sentences: [2]}
      - {text: "selections.csv: one row per sequence and wanted class", sentences: [3]}
      - {text: "Network, CPU decoder, ensemble: the clients query the ensemble", sentences: [4]}
      - {text: "Evaluate the exported iteration, or no pick is flagged", sentences: [5]}
    narration:
      - "To recap: the report gives the selection accuracy of both decodings, and the one of Selection decoding is the headline metric that chooses the best checkpoint."
      - "The top-k accuracy and the mean true frame rank score the probabilities before any decoding; tied probabilities take the best rank, so read them with the selection accuracy."
      - "The threshold of a class is the probability from which its picks reach the target precision; the picks below it are flagged low confidence, but a confident wrong pick goes through."
      - "With save predictions on, the selections file gives one row per sequence and wanted class, with the true frames, their probabilities and ranks, and the picks of both decodings."
      - "The export writes the network, a Python decoder run on the CPU with a copy of the decoding file, and the ensemble chaining them, the model the clients query."
      - "The decoder reads the thresholds of the evaluation of the exported iteration; without one, every threshold is zero and no pick is ever flagged, so evaluate before exporting."
      - "The next series, self-supervised learning, trains the backbone without labels from two views of every image: SimCLR and Barlow Twins, the projection head, and the nearest neighbor evaluation."
