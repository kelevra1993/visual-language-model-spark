# Sequence classification, chapter 2: the model of the task on a padded batch, with the shapes and weights of the
# trained flatten run at 256 pixels: the frame encoder gathering the real frames for the backbone and scattering their
# vectors back, the global pooling that decides whether the position of the shape survives, the seven temporal
# modules and their masks, the GRU of the configuration, the head and the run name. Coordinates of the html scenes are
# in pixels of the content area (1760 x 740); the figures are made by tutorials/figures/sequence_classification.
series: sequence_classification
series_title: "Sequence Classification (M2O)"
chapter: 2
title: "Frame encoder, temporal module and head"
output_name: sequence_classification_02_frame_encoder_temporal_module_head
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [sequence_classification]
# The unit word of the parameter counts, every one following a {{...millions}} fact
literal_numbers: [million]
references:
  - "vision_training/models/sequence/sequence_classifier.py · SequenceClassifier"
  - "vision_training/models/sequence/sequence_model.py · SequenceFrameModel.compute_class_outputs"
  - "vision_training/models/classification/classification_head.py · build_global_pooling"
  - "vision_training/models/classification/classification_head.py · compute_pooled_features"
  - "vision_training/models/sequence/temporal_modules.py · build_temporal_module"
  - "vision_training/configuration_processing/sequence_checks.py · check_temporal_model_configuration"
  - "vision_training/configuration_processing/run_name.py · build_temporal_tokens"
scenes:
  - kind: title_card
    heading: "From frames to classes"
    subheading: "The frame encoder, the temporal module and the head"
    footnote: "Sequence Classification (M2O) · chapter 2"
    # The chapter number of the footnote, the chapter key of this storyboard
    literal_numbers: ["2"]
    narration:
      - "A sequence model runs in stages: the encoder of the frames turns every real frame into a vector, the temporal module summarizes the vectors of a sequence, and the head gives the classes."
      - "This chapter follows the padded batch through them, with the weights of the trained run at {{sequence_classification.run.image_size}} pixels, and shows the one setting that decides whether the moving shapes are learned at all."

  - kind: code
    title: "The frame encoder"
    code_reference: "vision_training/models/sequence/frame_encoder.py · encode_frames"
    source:
      file: vision_training/models/sequence/frame_encoder.py
      function: encode_frames
      start: "# Every frame is real"
    highlights:
      - {match: "^def encode_frames", sentences: [0]}
      - {match: "input_tensor\\[sequence_mask\\]", sentences: [1]}
      - {match: "^\\s+frame_features", sentences: [2]}
      - {match: "if sequence_mask is None|\\.flatten\\(|\\.reshape\\(", sentences: [3]}
    # The zero vectors of the padding frames, made by new_zeros in the excerpt
    literal_numbers: [zero]
    narration:
      - "The encoder of the frames is one function, shared by the classifier, the labeller and the comparator."
      - "With a mask, the real frames of all the sequences are gathered into one batch of images, so the padding costs no backbone computation and stays out of the batch normalization statistics."
      - "Their vectors are then scattered back to their frame positions, the padding frames getting zero vectors."
      - "Without a mask, in the exported model, every frame is real, and the whole tensor runs as one fixed-shape batch."

  - kind: html
    page: 07_sequence_classification/frame_batches
    title: "Gather, encode, scatter"
    code_reference: "vision_training/models/sequence/frame_encoder.py · encode_frames"
    data:
      layout: "figures:sequence_classification/animations/padded_batch.json"
      phases: [{name: mask, sentence: -1}, {name: gather, sentence: 1}, {name: encode, sentence: 2}, {name: scatter, sentence: 4}]
    elements:
      - {type: text, position: [330, 680], text: "The squares: the real frame vectors of the trained flatten run, every channel map of {{sequence_classification.batch.block_5_size}} x {{sequence_classification.batch.block_5_size}} on a mosaic of the {{sequence_classification.batch.block_5_channels}} channels", font: diagram_small, colour: dim, appear: 3}
    narration:
      - "Back to the padded batch of the first chapter: {{sequence_classification.batch.sequence_count_words}} sequences padded to {{sequence_classification.batch.longest_words}} frames, with their mask."
      - "Indexing with the mask keeps the {{sequence_classification.batch.real_frames}} real frames, sequence after sequence: one batch of images for the backbone."
      - "The backbone runs on them as on any images: {{sequence_classification.batch.block_1_channels:words}} channels at {{sequence_classification.batch.block_1_size}} pixels, then {{sequence_classification.batch.block_2_channels}} at {{sequence_classification.batch.block_2_size}}, {{sequence_classification.batch.block_3_channels}} at {{sequence_classification.batch.block_3_size}}, and {{sequence_classification.batch.block_4_channels}} at {{sequence_classification.batch.block_4_size:words}} for the fourth and fifth blocks, the fifth having no pooling."
      - "The flatten pooling turns every map of {{sequence_classification.batch.block_5_channels}} by {{sequence_classification.batch.block_5_size:words}} by {{sequence_classification.batch.block_5_size:words}} into {{sequence_classification.batch.frame_vector_features}} features: each square is the real vector of one frame, its {{sequence_classification.batch.block_5_channels}} channel maps side by side."
      - "Scattered back, the vectors fill a tensor of {{sequence_classification.batch.sequence_count_words}} by {{sequence_classification.batch.longest_words}} by {{sequence_classification.batch.frame_vector_features}}, and the padding positions hold exact zeros."

  - kind: html
    page: diagram
    title: "Average or flatten"
    code_reference: "vision_training/models/classification/classification_head.py · build_global_pooling"
    elements:
      - {type: text, position: [440, 22], text: "average pooling · {{sequence_classification.image_sizes.average_512}} pixels · {{sequence_classification.similarity.average.features}} features", font: diagram_bold, anchor: ma}
      - {type: grid, box: [140, 100, 740, 580], values: "{{sequence_classification.similarity.average.values}}", show_values: true, decimals: 2, minimum: 0.0, maximum: 1.0, row_labels: "{{sequence_classification.similarity.frame_labels}}", column_labels: "{{sequence_classification.similarity.frame_labels}}", high_colour: yellow, highlight: [1, 2]}
      - {type: text, position: [1320, 22], text: "flatten · {{sequence_classification.image_sizes.flatten_256}} pixels · {{sequence_classification.similarity.flatten.features:,}} features", font: diagram_bold, anchor: ma, appear: 3}
      - {type: grid, box: [1020, 100, 1620, 580], values: "{{sequence_classification.similarity.flatten.values}}", show_values: true, decimals: 2, minimum: 0.0, maximum: 1.0, row_labels: "{{sequence_classification.similarity.frame_labels}}", column_labels: "{{sequence_classification.similarity.frame_labels}}", high_colour: blue, appear: 3, highlight: [3]}
      - {type: text, position: [880, 640], text: "Cosine similarity of the frame vectors of every pair of the {{sequence_classification.similarity.frames}} frames of {{sequence_classification.similarity.sequence}}, both trained runs on the CPU", font: diagram_small, colour: dim, anchor: ma}
    narration:
      - "The global pooling of the head decides what the temporal module can see of a frame."
      - "Average pooling keeps one value per channel: through the encoder of the average pooling run, the {{sequence_classification.similarity.frames:words}} frames of a test sequence get almost the same vector, every pair at a cosine similarity that rounds to {{sequence_classification.similarity.average.minimum:.2f}}."
      - "Picture the shape crossing the image: it moved, but its position was averaged away, so no temporal module can find the direction, and max pooling removes it the same way."
      - "Flatten keeps every position of the {{sequence_classification.batch.block_5_size:words}} by {{sequence_classification.batch.block_5_size:words}} map: the frame vectors of the flatten run drift apart with the distance between the frames, down to a similarity of {{sequence_classification.similarity.flatten.first_last:.2f}} between the first and the last one."
      - "Think of a run at {{sequence_classification.image_sizes.flatten_512}} pixels: the cost of flatten is a frame vector that follows the image size, {{sequence_classification.parameters.flatten_256.frame_features:,}} features at {{sequence_classification.image_sizes.flatten_256}} pixels, {{sequence_classification.parameters.flatten_512.frame_features:,}} at {{sequence_classification.image_sizes.flatten_512}}."

  - kind: html
    page: diagram
    title: "The {{sequence_classification.temporal.types:words}} temporal modules"
    code_reference: "vision_training/models/sequence/temporal_modules.py · build_temporal_module"
    elements:
      - {type: text, position: [40, 30], text: "Ignore the order", font: diagram_bold, colour: blue}
      - {type: box, box: [40, 80, 840, 190], text: "mean_pooling\nthe mean of the real frames", font: diagram_small, outline: blue, highlight: [1]}
      - {type: box, box: [40, 210, 840, 320], text: "max_pooling\nthe padding set to minus infinity first", font: diagram_small, outline: blue, highlight: [1]}
      - {type: box, box: [40, 340, 840, 450], text: "attention_pooling\nframe scores at minus infinity on the padding, then softmax", font: diagram_small, outline: blue, highlight: [1]}
      - {type: text, position: [920, 30], text: "Follow the order", font: diagram_bold, colour: aqua}
      - {type: box, box: [920, 80, 1720, 190], text: "gru, lstm\npacked sequences, final state of the last layer", font: diagram_small, outline: aqua, highlight: [2]}
      - {type: box, box: [920, 210, 1720, 320], text: "transformer\nkey padding mask, then the mean of the real frames", font: diagram_small, outline: aqua, highlight: [2]}
      - {type: box, box: [920, 340, 1720, 450], text: "temporal_convolution\ndilation 2^i, the padding zeroed before every layer", font: diagram_small, outline: aqua, highlight: [2]}
      - {type: box, box: [40, 520, 1720, 640], text: "causal: True is refused for M2O and CMP (check_temporal_model_configuration): it is for M2M and SEL", font: diagram_text, outline: yellow, appear: 3, highlight: [3]}
    # The dilation 2^i of the layer i of the temporal convolution (TemporalConvolutionModule, 2 ** layer_index)
    literal_numbers: ["2^i"]
    narration:
      - "The temporal module summarizes the frame vectors into one vector per sequence; {{sequence_classification.temporal.types:words}} types exist, and each keeps the padding out."
      - "The {{sequence_classification.temporal.pooling_types:words}} poolings ignore the order: the masked mean, the max with the padding at minus infinity, and the attention pooling, whose frame scores are set to minus infinity on the padding before their softmax."
      - "The {{sequence_classification.temporal.ordered_types:words}} ordered modules follow it: the GRU and the LSTM on packed sequences, the transformer with its key padding mask and a masked mean of its outputs, and the temporal convolution, whose dilation doubles at every layer, with the padding zeroed before every convolution."
      - "Should you pick a causal module here, it is refused: it only sees the past frames, which is meant for the sequence labeller and the frame selector."

  - kind: code
    title: "The GRU of the run"
    code_reference: "vision_training/models/sequence/temporal_modules.py · RecurrentTemporalModule.forward"
    source:
      file: vision_training/models/sequence/temporal_modules.py
      function: RecurrentTemporalModule.forward
    highlights:
      - {match: "sequence_lengths = |pack_padded_sequence|enforce_sorted|^\\s+packed_outputs", sentences: [1]}
      - {match: "last_layer_states", sentences: [2]}
      - {match: "if self.keep_time_axis", sentences: [3]}
    narration:
      - "The run uses {{sequence_classification.run.number_layers:words}} bidirectional GRU layer of {{sequence_classification.run.hidden_size}} units."
      - "With a mask, the frame vectors are packed by sequence length, so the GRU stops at the last real frame of every sequence and never reads the padding."
      - "The sequence vector is the final state of the last layer in both directions, concatenated: {{sequence_classification.run.sequence_features}} features."
      - "The labeller takes the outputs of every frame instead; and the dropout rate of the module only acts between stacked layers, so with a single layer, as in this run, it does nothing."

  - kind: html
    page: diagram
    title: "Padding changes nothing"
    code_reference: "vision_training/models/sequence/sequence_model.py · SequenceFrameModel.compute_class_outputs"
    elements:
      - {type: text, position: [60, 22], text: "{{sequence_classification.invariance.sequence_count}} test sequences cut to {{sequence_classification.invariance.lengths[0]}}, {{sequence_classification.invariance.lengths[1]}}, {{sequence_classification.invariance.lengths[2]}} and {{sequence_classification.invariance.lengths[3]}} frames, padded together: their class probabilities", font: diagram_bold}
      - {type: grid, box: [340, 130, 1100, 530], values: "{{sequence_classification.invariance.padded_probabilities}}", show_values: true, decimals: 3, minimum: 0.0, maximum: 1.0, row_labels: "{{sequence_classification.invariance.row_labels}}", column_labels: "{{sequence_classification.dataset.class_names}}", font: diagram_monospace_small}
      - {type: box, box: [1200, 200, 1700, 460], text: "the same sequences alone,\nwithout mask\n\nlargest difference\n{{sequence_classification.invariance.maximum_difference:.1e}}", font: diagram_text, outline: aqua, appear: 1, highlight: [1]}
    narration:
      - "The test: {{sequence_classification.invariance.sequence_count:words}} test sequences cut to {{sequence_classification.invariance.lengths[0]:words}}, {{sequence_classification.invariance.lengths[1]:words}}, {{sequence_classification.invariance.lengths[2]:words}} and {{sequence_classification.invariance.lengths[3]:words}} frames, padded together in one batch with their mask, then run alone without mask."
      - "On the CPU, their probabilities differ by less than one in {{sequence_classification.invariance.inverse_bound:,}}: the padding changes nothing."

  - kind: html
    page: diagram
    title: "The head and the weights"
    code_reference: "vision_training/models/classification/classification_head.py · ClassificationHead"
    elements:
      - {type: box, box: [20, 40, 300, 160], text: "frame vectors\n[{{sequence_classification.run.batch_size}}, T, {{sequence_classification.parameters.flatten_256.frame_features}}]", font: diagram_small, outline: blue}
      - {type: arrow, points: [[300, 100], [350, 100]]}
      - {type: box, box: [350, 40, 690, 160], text: "GRU, bidirectional\n{{sequence_classification.parameters.flatten_256.frame_features}} → 2 × {{sequence_classification.run.hidden_size}}", font: diagram_small, outline: aqua}
      - {type: arrow, points: [[690, 100], [740, 100]]}
      - {type: box, box: [740, 40, 1360, 160], text: "Dropout {{sequence_classification.run.head_dropout}} · Linear {{sequence_classification.run.sequence_features}} → {{sequence_classification.run.head_hidden_units}} · ReLU\nDropout {{sequence_classification.run.head_dropout}} · Linear {{sequence_classification.run.head_hidden_units}} → {{sequence_classification.run.number_classes}}", font: diagram_small, outline: violet, highlight: [0]}
      - {type: arrow, points: [[1360, 100], [1410, 100]]}
      - {type: box, box: [1410, 40, 1740, 160], text: "softmax\nclass probabilities [{{sequence_classification.run.batch_size}}, {{sequence_classification.run.number_classes}}]", font: diagram_small, outline: violet}
      - {type: text, position: [60, 230], text: "Parameters, bar length on a log scale", font: diagram_bold, appear: 1}
      - {type: bars, box: [60, 290, 1700, 690], orientation: horizontal, label_width: 420, value_width: 200, values: ["{{sequence_classification.parameters.flatten_256.backbone_log10}}", "{{sequence_classification.parameters.flatten_256.temporal_module_log10}}", "{{sequence_classification.parameters.flatten_256.classification_head_log10}}", "{{sequence_classification.parameters.average_512.temporal_module_log10}}", "{{sequence_classification.parameters.flatten_512.temporal_module_log10}}"], labels: ["backbone", "GRU, flatten at {{sequence_classification.image_sizes.flatten_256}} px", "head", "GRU, average at {{sequence_classification.image_sizes.average_512}} px", "GRU, flatten at {{sequence_classification.image_sizes.flatten_512}} px"], value_labels: ["{{sequence_classification.parameters.flatten_256.backbone:,}}", "{{sequence_classification.parameters.flatten_256.temporal_module:,}}", "{{sequence_classification.parameters.flatten_256.classification_head:,}}", "{{sequence_classification.parameters.average_512.temporal_module:,}}", "{{sequence_classification.parameters.flatten_512.temporal_module:,}}"], colours: [blue, aqua, violet, yellow, magenta], maximum: 8.0, appear: 1}
    # The two directions of the bidirectional GRU
    literal_numbers: ["2"]
    narration:
      - "The head is the one of the image classifier: dropout, a hidden layer of {{sequence_classification.run.head_hidden_units}} units with its ReLU, dropout again, and {{sequence_classification.run.number_classes:words}} logits read with a softmax, the output mode being multi-class."
      - "The flattened frames make the GRU the largest part: {{sequence_classification.parameters.flatten_256.temporal_module_millions}} million of the {{sequence_classification.parameters.flatten_256.total_millions}} million weights, against {{sequence_classification.parameters.flatten_256.backbone:,}} for the backbone."
      - "The same GRU has {{sequence_classification.parameters.average_512.temporal_module:,}} weights on the {{sequence_classification.parameters.average_512.frame_features}} features of average pooling, and {{sequence_classification.parameters.flatten_512.temporal_module_millions}} million on the {{sequence_classification.parameters.flatten_512.frame_features:,}} of flatten at {{sequence_classification.image_sizes.flatten_512}} pixels."

  - kind: html
    page: diagram
    title: "The run name"
    code_reference: "vision_training/configuration_processing/run_name.py · build_sequence_sections"
    elements:
      - {type: text, position: [150, 110], font: code_text, segments: [{text: "M2O", colour: dim}, {text: "_", colour: dim}, {text: "IN-KAR-{{sequence_classification.run.image_size}}", colour: dim}, {text: "_", colour: dim}, {text: "SE-RES-BN-B1x16.2x32.2x32.2x64.2x64", colour: dim}, {text: "_", colour: dim}, {text: "T50", highlight: [0]}, {text: "_", colour: dim}, {text: "GRU1x128-BI", highlight: [0]}, {text: "_", colour: dim}, {text: "HFLAT.64", highlight: [1]}, {text: "_", colour: dim}, {text: "MC4", highlight: [1]}]}
      - {type: arrow, points: [[960, 130], [560, 250]], appear: 0}
      - {type: box, box: [300, 255, 820, 425], text: "T50\n\nmaximum_sequence_length {{sequence_classification.run.maximum_sequence_length}}", font: diagram_small, outline: aqua, appear: 0, highlight: [0]}
      - {type: arrow, points: [[1100, 130], [1110, 250]], appear: 0}
      - {type: box, box: [860, 255, 1380, 425], text: "GRU1x128-BI\n\ntype gru, number_layers {{sequence_classification.run.number_layers}},\nhidden_size {{sequence_classification.run.hidden_size}}, bidirectional", font: diagram_small, outline: aqua, appear: 0, highlight: [0]}
      - {type: arrow, points: [[1290, 130], [1530, 250]], appear: 1}
      - {type: box, box: [1420, 255, 1740, 425], text: "HFLAT.64 · MC4\n\nflatten, hidden layer {{sequence_classification.run.head_hidden_units}},\n{{sequence_classification.run.number_classes}} classes", font: diagram_small, outline: violet, appear: 1, highlight: [1]}
      - {type: box, box: [300, 520, 1740, 650], text: "No token: TemporalModel.dropout_rate, the augmentation, the learning rate", font: diagram_text, outline: yellow, appear: 1}
    narration:
      - "The run name adds its sequence tokens between the backbone and the head: T50 for the maximum length, and the GRU token for {{sequence_classification.run.number_layers:words}} bidirectional GRU layer of {{sequence_classification.run.hidden_size}} units."
      - "HFLAT.64 is the flatten pooling with its hidden layer of {{sequence_classification.run.head_hidden_units}} units, and MC4 the {{sequence_classification.run.number_classes:words}} classes; the temporal dropout has no token, so it may change when a run resumes."

  - kind: summary
    title: "Recap"
    items:
      - {text: "encode_frames: real frames gathered, vectors scattered back", sentences: [0]}
      - {text: "Padding frames: never encoded, zero vectors", sentences: [1]}
      - {text: "average and max pooling remove where the shape is", sentences: [2]}
      - {text: "flatten: channels x height x width, follows the image size", sentences: [3]}
      - {text: "The {{sequence_classification.temporal.types:words}} temporal modules all mask the padding", sentences: [4]}
      - {text: "GRU on packed sequences: final states, 2 x {{sequence_classification.run.hidden_size}}", sentences: [5]}
    # The zero vectors of the padding frames (new_zeros of encode_frames) and the two directions of the GRU
    literal_numbers: [zero, "2"]
    narration:
      - "To recap: the encode frames function gathers the real frames of all the sequences into one batch of images for the backbone, then scatters their vectors back to their frame positions."
      - "The padding frames never reach the backbone, so they cost nothing and stay out of the batch normalization statistics; they get zero vectors."
      - "Average and max pooling keep one value per channel, so the position of the shape is lost and no temporal module can find its direction."
      - "Flatten keeps every position of the last map, a frame vector of channels times height times width, which grows with the image size, and the GRU with it."
      - "Every one of the {{sequence_classification.temporal.types:words}} temporal modules keeps the padding out, by a mask, scores at minus infinity or packed sequences, so the padding changes nothing."
      - "The GRU reads packed sequences, stops at the last real frame of each, and concatenates the final states of both directions into {{sequence_classification.run.sequence_features}} features."
      - "The third chapter trains this configuration, reads its evaluation against the average pooling run, and exports the model."
