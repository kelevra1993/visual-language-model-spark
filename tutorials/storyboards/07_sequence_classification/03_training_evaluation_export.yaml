# Sequence classification, chapter 3: the README run of the synthetic configuration against the average pooling and
# flatten runs at 512 pixels: the console summary, the training loss, Results.txt and its Per Class Recall table, the
# confusion matrices and ROC curves, the probabilities of the predictions file, the sample sequences, the accuracy per
# number of frames, the export with its input settings and the Export Sizes panel of the launch, and the pitfalls of the
# task. The figures are made by
# tutorials/figures/sequence_classification, the evaluations read from the Checkpoint_Evaluation folder of the runs.
series: sequence_classification
series_title: "Sequence Classification (M2O)"
chapter: 3
title: "Training, evaluation and export"
output_name: sequence_classification_03_training_evaluation_export
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [sequence_classification]
# The unit word of the parameter counts, every one following a {{...millions}} fact
literal_numbers: [million]
references:
  - "vision_training/trainers/sequence_classification_trainer.py · SequenceClassificationTrainer"
  - "vision_training/trainers/classification_trainer.py · ClassificationTrainer.compute_evaluation_results"
  - "vision_training/trainers/classification_trainer.py · ClassificationTrainer.write_predictions_file"
  - "vision_training/deployment/export_model.py"
  - "vision_training/deployment/export_specifications.py"
  - "vision_training/deployment/input_contract.py · build_input_contract"
  - "vision_training/deployment/export_size_estimates.py · probe_inference_graph"
  - "documentation/suggestions.md"
  - "documentation/task workflows/sequence_classification_workflow.md"
scenes:
  - kind: title_card
    heading: "Training, evaluation and export"
    subheading: "What the run writes, why average pooling fails, what Triton serves"
    footnote: "Sequence Classification (M2O) · chapter 3"
    # The chapter number of the footnote, the chapter key of this storyboard
    literal_numbers: ["3"]
    narration:
      - "This chapter reads the run of the synthetic configuration at {{sequence_classification.run.image_size}} pixels, in batches of {{sequence_classification.run.batch_size}} sequences: {{sequence_classification.run.number_iterations}} iterations, its checkpoints of iterations {{sequence_classification.evaluation.flatten_256.first_iteration}} and {{sequence_classification.evaluation.flatten_256.last_iteration}} evaluated again on the test split."
      - "Then it sets it against the same task with average pooling, which never leaves chance, and ends with the export and the pitfalls."

  - kind: image
    title: "The console summary"
    code_reference: "vision_training/trainers/base_trainer.py · BaseTrainer.run_training_iterations"
    image: "figures:sequence_classification/evaluation/training_console.png"
    highlights:
      - {box: "{{sequence_classification.console.header_box}}", sentences: [0, 2]}
      - {box: "{{sequence_classification.console.train_loss_box}}", sentences: [1]}
      - {box: "{{sequence_classification.console.validation_box}}", sentences: [1]}
      - {box: "{{sequence_classification.console.accuracy_box}}", sentences: [3]}
    narration:
      - "Every {{sequence_classification.console.flatten_256.interval_iterations}} iterations, the summary gives the sequences per second, and the frames per second without the padding."
      - "At the first interval of this run: {{sequence_classification.console.flatten_256.first_throughput}} sequences and {{sequence_classification.console.flatten_256.first_frame_throughput}} frames per second, a training loss of {{sequence_classification.console.flatten_256.first_interval_loss:.2f}}, and {{sequence_classification.console.flatten_256.validation_batches:words}} validation batches, one every {{sequence_classification.console.flatten_256.validation_ratio}} iterations."
      - "The same task at {{sequence_classification.image_sizes.average_512}} pixels ran at {{sequence_classification.console.average_512.first_throughput}} sequences per second: the frame size sets the cost of a sequence run."
      - "The accuracies are written as percentages, followed from the next summary on by their change since the previous one."

  - kind: image
    title: "Flatten learns, average does not"
    image: "figures:sequence_classification/evaluation/training_loss_axes.png"
    overlay: "figures:sequence_classification/evaluation/training_loss.png"
    reveals:
      - {region: "{{sequence_classification.training.panel_0_reveal_region}}", sentence: 0}
      - {region: "{{sequence_classification.training.panel_1_reveal_region}}", sentence: 1}
    highlights:
      - {box: "{{sequence_classification.training.panel_0_box}}", sentences: [0]}
      - {box: "{{sequence_classification.training.panel_1_box}}", sentences: [1, 2]}
    # The interval losses of the average pooling run are read with four decimals, as the console prints them: rounded
    # to two, their narrow band around the natural log of four (1.386) would lose the width the sentence describes
    exact_facts: [sequence_classification.console.average_512.minimum_interval_loss,
                  sequence_classification.console.average_512.maximum_interval_loss]
    narration:
      - "The training loss of the flatten run falls from {{sequence_classification.training.flatten_256.first_loss:.2f}} to {{sequence_classification.training.flatten_256.smoothed_last_loss:.2f}} on the smoothed curve in {{sequence_classification.training.flatten_256.iterations}} iterations."
      - "With average pooling at {{sequence_classification.image_sizes.average_512}} pixels, it stays at the natural log of {{sequence_classification.run.number_classes:words}}, the loss of a uniform guess over {{sequence_classification.run.number_classes:words}} classes, for {{sequence_classification.training.average_512.iterations}} iterations: its interval averages never leave {{sequence_classification.console.average_512.minimum_interval_loss:.4f}} to {{sequence_classification.console.average_512.maximum_interval_loss:.4f}}."
      - "Flatten at {{sequence_classification.image_sizes.flatten_512}} pixels stays there too after {{sequence_classification.training.flatten_512.iterations}} iterations, its {{sequence_classification.parameters.flatten_512.frame_features:,}} features per frame feeding a GRU of {{sequence_classification.parameters.flatten_512.temporal_module_millions}} million weights."

  - kind: code
    title: "Results.txt"
    code_reference: "vision_training/trainers/classification_trainer.py · ClassificationTrainer.compute_evaluation_results"
    syntax: plain
    source:
      file: "figures:sequence_classification/listings/results_flatten_256.txt"
      start: "^Iteration "
      count: 16
    highlights:
      - {match: "Accuracy  |Macro F1|Macro ROC AUC", sentences: [0]}
      - {match: "^Iteration ", sentences: [1]}
      - {match: "^   {{sequence_classification.evaluation.flatten_256.first.wrong.true_class}} ", sentences: [2]}
      - {match: "Threshold|@ P99 %|Worst F1 first", sentences: [4]}
    narration:
      - "The results file gets one block per evaluated checkpoint: the accuracy, the headline metric, then the balanced accuracy, the macro F1, the top-k accuracy, the macro ROC AUC and the macro average precision."
      - "Its first block, iteration {{sequence_classification.evaluation.flatten_256.first_iteration}}, gives an accuracy of {{sequence_classification.evaluation.flatten_256.first.accuracy:percent}}, {{sequence_classification.evaluation.flatten_256.first.wrong_count}} of the {{sequence_classification.probabilities.flatten_256.sequences}} test sequences being wrong."
      - "The most confident mistake is sequence {{sequence_classification.evaluation.flatten_256.first.wrong.number}}, a {{sequence_classification.evaluation.flatten_256.first.wrong.true_class}} shape given {{sequence_classification.evaluation.flatten_256.first.wrong.predicted_class}} at {{sequence_classification.evaluation.flatten_256.first.wrong.probability:.2f}}."
      - "At iteration {{sequence_classification.evaluation.flatten_256.last_iteration}}, the last evaluated checkpoint, the accuracy reaches {{sequence_classification.evaluation.flatten_256.last.accuracy:percent}}, with {{sequence_classification.evaluation.flatten_256.last.wrong_count}} sequences wrong."
      - "The per-class table is sorted by F1, worst first, with the threshold keeping the highest recall at a precision of {{sequence_classification.run.target_precision:percent_label}}, and that recall."
      - "Every rate of the report is written as a percentage."

  - kind: code
    title: "Per Class Recall"
    code_reference: "vision_training/evaluation/recall_intervals.py · build_recall_interval_table"
    syntax: plain
    source:
      file: "figures:sequence_classification/listings/results_flatten_256.txt"
      start: "^  Per Class Recall"
      count: 10
    highlights:
      - {match: "Lower|Clopper-Pearson", sentences: [0]}
      - {match: "^   {{sequence_classification.evaluation.flatten_256.first.worst_recall_class}} ", sentences: [1]}
    narration:
      - "The same block ends with the Per Class Recall table: the recall of every class with its exact Clopper-Pearson {{constant:vision_training/evaluation/recall_intervals.py#CONFIDENCE_LEVEL:percent_label}} confidence interval, the test sequences being independent."
      - "It is sorted by recall, worst first, so {{sequence_classification.evaluation.flatten_256.first.worst_recall_class}} comes first at {{sequence_classification.evaluation.flatten_256.first.worst_recall:percent}}."
      - "With {{sequence_classification.evaluation.flatten_256.first.fewest_class_sequences}} to {{sequence_classification.evaluation.flatten_256.first.most_class_sequences}} test sequences per class, the intervals stay wide: even a class with every sequence right keeps a lower bound well below its recall."

  - kind: image
    title: "Flatten against average"
    image: "figures:sequence_classification/evaluation/confusion_and_roc.png"
    views:
      - {box: "{{sequence_classification.evaluation.composite.row_0_box}}", from_sentence: 1}
      - {box: "{{sequence_classification.evaluation.composite.row_1_box}}", from_sentence: 2}
    narration:
      - "The evaluation folder holds the files of the image classification without its temperature explorer: the confusion matrix, the class metrics and thresholds, the ROC and precision-recall curves, the predictions, and the sample sequences."
      - "At iteration {{sequence_classification.evaluation.flatten_256.last_iteration}}, the flatten run leaves {{sequence_classification.evaluation.flatten_256.last.wrong_count}} test sequences off the diagonal of its confusion matrix, with a macro ROC AUC of {{sequence_classification.evaluation.flatten_256.last.macro_roc_auc:percent}}."
      - "The average pooling run predicts {{sequence_classification.probabilities.average_512.predicted_class}} for all {{sequence_classification.probabilities.average_512.sequences}} test sequences: an accuracy of {{sequence_classification.evaluation.average_512.accuracy.iteration_2000:percent}}, the share of that class, a balanced accuracy of {{sequence_classification.evaluation.average_512.balanced_accuracy.iteration_2000:percent}}, and ROC curves along the diagonal, a macro ROC AUC of {{sequence_classification.evaluation.average_512.macro_roc_auc.iteration_2000:percent}}."
      - "Like the report, these images write the accuracies, the areas under the curves and their axes as percentages."

  - kind: image
    title: "The probability of the true class"
    code_reference: "vision_training/trainers/classification_trainer.py · ClassificationTrainer.write_predictions_file"
    image: "figures:sequence_classification/evaluation/true_class_probabilities.png"
    highlights:
      - {box: "{{sequence_classification.probabilities.panel_0_box}}", sentences: [0]}
      - {box: "{{sequence_classification.probabilities.panel_1_box}}", sentences: [1]}
    narration:
      - "The predictions file gives every test sequence with its first and last frames and its {{sequence_classification.run.number_classes:words}} probabilities: the flatten run gives the true class more than {{sequence_classification.probabilities.threshold}} for {{sequence_classification.probabilities.flatten_256.above_0_9}} of the {{sequence_classification.probabilities.flatten_256.sequences}} sequences."
      - "With average pooling, every probability of every sequence lies between {{sequence_classification.probabilities.average_512.minimum_any:.2f}} and {{sequence_classification.probabilities.average_512.maximum_any:.2f}}: the same answer, whatever the frames."

  - kind: image
    title: "Sample sequences"
    image: "figures:sequence_classification/evaluation/samples.png"
    highlights:
      - {box: "{{sequence_classification.samples.row_0_image_0_box}}", sentences: [1]}
      - {box: "{{sequence_classification.samples.row_0_image_1_box}}", sentences: [1]}
    # The probability of the flatten run is read with three decimals: rounded to two, a probability just under one
    # would read as a certainty
    exact_facts: [sequence_classification.samples.flatten_256.probability]
    narration:
      - "Every evaluation draws its {{sequence_classification.run.number_sample_images_words}} fixed test sequences as grids of their real frames, under the true class, the predicted one and its probability, in green when right and in red when wrong."
      - "Here the same {{sequence_classification.samples.flatten_256.true_class}} sequence of {{sequence_classification.samples.frames:words}} frames: right at {{sequence_classification.samples.flatten_256.probability:.3f}} with flatten, given {{sequence_classification.samples.average_512.predicted_class}} at {{sequence_classification.samples.average_512.probability:.2f}} with average pooling."

  - kind: image
    title: "Accuracy per number of frames"
    image: "figures:sequence_classification/evaluation/accuracy_by_length.png"
    highlights:
      - {box: "{{sequence_classification.length_accuracy.panel_box}}", sentences: [0]}
    narration:
      - "The predictions file and the labels file together give the accuracy on the test sequences of every length: at iteration {{sequence_classification.evaluation.flatten_256.last_iteration}}, the weakest length is {{sequence_classification.length_accuracy.weakest_length:words}} frames, at {{sequence_classification.length_accuracy.weakest_accuracy:percent}} over {{sequence_classification.length_accuracy.weakest_sequences}} sequences."
      - "Let's consider a deployment that sends longer sequences: the model accepts up to {{sequence_classification.export.maximum_frames}} frames, but what it learnt comes from sequences of {{sequence_classification.dataset.disk_minimum_frames_words}} to {{sequence_classification.dataset.disk_maximum_frames_words}} frames, so check the lengths it receives against the training data."

  - kind: html
    page: diagram
    title: "The export"
    code_reference: "vision_training/models/sequence/inference_sequence_model.py · InferenceSequenceModel"
    elements:
      - {type: box, box: [20, 120, 380, 380], text: "client\n\nevery frame resized\nand padded to {{sequence_classification.run.image_size}}\n(keep_ratio)", font: diagram_small, outline: border, highlight: [3]}
      - {type: arrow, points: [[380, 250], [470, 250]], label: "images", label_position: [425, 220]}
      - {type: box, box: [470, 40, 1290, 460], text: null, outline: aqua, fill: null}
      - {type: text, position: [880, 64], text: "InferenceSequenceModel · Triton model sequence_classifier", font: diagram_bold, anchor: ma}
      - {type: text, position: [880, 130], text: "input normalization\nbackbone on every frame\nflatten pooling\nGRU, bidirectional\nhead and softmax", font: diagram_text, anchor: ma, align: center, appear: 2, highlight: [2]}
      - {type: arrow, points: [[1290, 250], [1380, 250]]}
      - {type: box, box: [1380, 150, 1740, 350], text: "class_probabilities\n[B, {{sequence_classification.export.output_classes}}]", font: diagram_text, outline: violet}
      - {type: text, position: [880, 520], text: "images {{sequence_classification.export.input_shape}} float32, BGR in [0, 255], T from 1 to {{sequence_classification.export.maximum_frames}}", font: diagram_monospace_small, anchor: ma, appear: 1, highlight: [1]}
      - {type: text, position: [880, 570], text: "traced on {{sequence_classification.export.example_shape}}, checked on {{sequence_classification.export.check_shape}}", font: diagram_monospace_small, colour: dim, anchor: ma, appear: 1}
      - {type: box, box: [1380, 400, 1740, 620], text: "preprocessing.json\nand ONNX metadata\n\nthe input settings\nof the run, layout NTCHW", font: diagram_small, outline: yellow, appear: 3, highlight: [3]}
      - {type: text, position: [880, 640], text: "no mask in the graph: every frame of a request is a real frame", font: diagram_bold, colour: accent, anchor: ma, appear: 4}
      # The Export Sizes panel printed at launch (vision_training/deployment/export_size_estimates.py), whose probe
      # counts the recurrent layer as one operator of the exported graph
      - {type: box, box: [20, 430, 380, 700], text: "Export Sizes panel\nat launch\n\nweights, TorchScript,\nONNX, TensorRT,\ncheckpoint\nthe GRU: one operator", font: diagram_small, outline: blue, appear: 5, highlight: [5]}
    # The range of the byte values of the frames, and the single frame a request holds at least
    literal_numbers: [zero, "0", "255", "1"]
    narration:
      - "The export script wraps the run in InferenceSequenceModel, served by Triton as the sequence classifier."
      - "Its input is images: float32 BGR frames in the zero to 255 range at {{sequence_classification.run.image_size}} pixels, any number of frames up to {{sequence_classification.export.maximum_frames}}, traced on {{sequence_classification.export.traced_frames}} frames and checked on {{sequence_classification.export.checked_frames}}."
      - "The input normalization, the backbone, the pooling, the GRU, the head and the softmax are in the graph; the resizing stays with the client."
      - "So that a server builds these frames as the training did, the export writes their resize, colour order, padding, value range and layout, the frames after the batch, in the preprocessing file next to the model and in the ONNX metadata."
      - "Take a client batching sequences of different lengths: the export runs the path without mask, where every frame counts, so it must not pad them, or the GRU reads the black frames as frames."
      - "The size of these files is known before the first iteration: the launch prints an Export Sizes panel, whose estimates count the GRU as one operator, the single node it becomes in the ONNX graph, whatever the number of frames."

  - kind: html
    page: diagram
    title: "Pitfalls"
    code_reference: "documentation/task workflows/sequence_classification_workflow.md"
    elements:
      - {type: box, box: [40, 40, 860, 230], text: "global_pooling average or max\nmotion classes at chance,\nthe loss at the natural log of {{sequence_classification.run.number_classes}}", font: diagram_text, outline: red, highlight: [0]}
      - {type: box, box: [900, 40, 1720, 230], text: "flatten at {{sequence_classification.image_sizes.flatten_512}} pixels\n{{sequence_classification.parameters.flatten_512.temporal_module_millions}} M GRU weights,\ncheckpoints of {{sequence_classification.checkpoints.flatten_512.megabytes:.0f}} MB", font: diagram_text, outline: red, highlight: [1]}
      - {type: box, box: [40, 270, 860, 460], text: "lengths outside the training data\nthe export accepts up to {{sequence_classification.export.maximum_frames}} frames,\nthe run learnt from {{sequence_classification.dataset.disk_minimum_frames}} to {{sequence_classification.dataset.disk_maximum_frames}}", font: diagram_text, outline: yellow, highlight: [2]}
      - {type: box, box: [900, 270, 1720, 460], text: "TemporalModel.dropout_rate\nno effect with one GRU layer", font: diagram_text, outline: yellow, highlight: [3]}
      - {type: box, box: [40, 500, 860, 690], text: "shuffle_frames with an ordered module\na yellow warning only", font: diagram_text, outline: yellow, highlight: [3]}
      - {type: box, box: [900, 500, 1720, 690], text: "Iterations Per Epoch\ncounted before the label mapping\n(count_split_sequences)", font: diagram_text, outline: yellow, highlight: [3]}
    narration:
      - "The pitfalls of the task: average or max pooling leaves motion classes at chance, and nothing warns about it but a loss stuck at the natural log of {{sequence_classification.run.number_classes:words}}."
      - "Flatten follows the image size: at {{sequence_classification.image_sizes.flatten_512}} pixels its GRU grows to {{sequence_classification.parameters.flatten_512.temporal_module_millions}} million weights and its checkpoint to {{sequence_classification.checkpoints.flatten_512.megabytes:.0f}} megabytes, against {{sequence_classification.checkpoints.flatten_256.megabytes:.0f}} at {{sequence_classification.image_sizes.flatten_256}} pixels, and it stayed at a test accuracy of {{sequence_classification.evaluation.flatten_512.last.accuracy:percent}} after {{sequence_classification.training.flatten_512.iterations}} iterations."
      - "The model takes up to {{sequence_classification.export.maximum_frames}} frames, but the run only learnt from {{sequence_classification.dataset.disk_minimum_frames_words}} to {{sequence_classification.dataset.disk_maximum_frames_words}}: nothing warns about a deployment sending longer sequences."
      - "The temporal dropout does nothing with one GRU layer, shuffled frames with an ordered module only print a warning, and the iterations per epoch are counted before the label mapping."

  - kind: summary
    title: "Recap"
    items:
      - {text: "Console: sequences and real frames per second"}
      - {text: "Flatten at {{sequence_classification.image_sizes.flatten_256}} pixels: accuracy {{sequence_classification.evaluation.flatten_256.last.accuracy:percent}} at iteration {{sequence_classification.evaluation.flatten_256.last_iteration:,}}"}
      - {text: "Average pooling: {{sequence_classification.probabilities.average_512.predicted_class}} for every sequence, loss at ln {{sequence_classification.run.number_classes}}"}
      - {text: "The evaluation files of CLS, one row per sequence"}
      - {text: "Export: images {{sequence_classification.export.input_shape}}, every frame real"}
      - {text: "On motion classes, the pooling decides, not the temporal module"}
    narration:
      - "To recap: on the moving shapes the frame pooling decides everything, flatten at {{sequence_classification.image_sizes.flatten_256}} pixels reaches {{sequence_classification.evaluation.flatten_256.last.accuracy:percent}} in {{sequence_classification.evaluation.flatten_256.last_iteration}} iterations, and the evaluation reads like that of the image classification."
      - "The next series, sequence labelling, keeps the time axis and gives a class to every frame."
