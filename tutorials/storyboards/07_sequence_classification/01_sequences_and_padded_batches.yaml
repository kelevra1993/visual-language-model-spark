# Sequence classification, chapter 1: what the task is for, its data on disk, its configuration keys, how a sequence
# becomes a sample, and how the collate pads a batch of sequences of different lengths with its mask. Coordinates of
# the html scenes are in pixels of the content area (1760 x 740, origin at its top left corner); the figures named
# figures:sequence_classification/... are made by tutorials/figures/sequence_classification.
series: sequence_classification
series_title: "Sequence Classification (M2O)"
chapter: 1
title: "Sequences and padded batches"
output_name: sequence_classification_01_sequences_and_padded_batches
pace: 1.0
voice: {name: af_heart, language: en-us}
figures: [sequence_classification]
references:
  - "vision_training/trainers/sequence_classification_trainer.py · SequenceClassificationTrainer"
  - "vision_training/data/sequence/sequence_dataset.py · SequenceDataset"
  - "vision_training/data/sequence/sequence_dataset.py · read_sequence_frames"
  - "vision_training/data/synthetic/create_synthetic_dataset.py · generate_moving_shape_sequence"
  - "vision_training/data/split_description.py · count_split_sequences"
  - "documentation/task workflows/sequence_classification_workflow.md"
scenes:
  - kind: title_card
    heading: "Sequences and padded batches"
    subheading: "One class for a whole sequence of frames"
    footnote: "Sequence Classification (M2O) · chapter 1"
    # The chapter number of the footnote, the chapter key of this storyboard
    literal_numbers: ["1"]
    narration:
      - "The sequence classifier, M2O for many to one, gives one class to a whole sequence of frames."
      - "This chapter follows its data from the disk to a padded batch: the layout, the configuration, the length limit, and the padding and masks that every sequence task relies on."

  - kind: html
    page: diagram
    title: "When to choose it"
    code_reference: "vision_training/trainers/sequence_classification_trainer.py · SequenceClassificationTrainer"
    elements:
      # The nine frames of the first training sequence, the shape crossing them: SHOWN_SEQUENCE_NAME and
      # SHOWN_FRAME_COUNT of tutorials/figures/sequence_classification/dataset_figures.py, which stops the build when
      # the sequence holds another number of frames than these image elements
      - {type: text, position: [40, 22], text: "{{sequence_classification.dataset.shown_sequence}} · {{sequence_classification.dataset.shown_class}} · {{sequence_classification.dataset.shown_frames}} frames of {{sequence_classification.dataset.frame_size}} pixels", font: diagram_bold}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_00.png", box: [40, 74, 178, 212], border: border}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_01.png", box: [192, 74, 330, 212], border: border}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_02.png", box: [344, 74, 482, 212], border: border}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_03.png", box: [496, 74, 634, 212], border: border}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_04.png", box: [648, 74, 786, 212], border: border}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_05.png", box: [800, 74, 938, 212], border: border}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_06.png", box: [952, 74, 1090, 212], border: border}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_07.png", box: [1104, 74, 1242, 212], border: border}
      - {type: image, path: "figures:sequence_classification/frames/train_000000_08.png", box: [1256, 74, 1394, 212], border: border}
      - {type: arrow, points: [[109, 250], [1325, 250]], colour: aqua, width: 4, highlight: [0]}
      - {type: text, position: [1430, 120], text: "one frame:\na shape somewhere\n\nthe sequence:\nwhere it goes", font: diagram_small, colour: dim}
      # The task against the other tasks
      - {type: box, box: [40, 330, 440, 470], text: "CLS\none image carries the class", font: diagram_small, outline: blue, appear: 1}
      - {type: box, box: [470, 330, 870, 470], text: "M2O\none class needs several frames", font: diagram_small, outline: aqua, appear: 1, highlight: [1]}
      - {type: box, box: [900, 330, 1300, 470], text: "M2M · SEL\na class or a choice per frame", font: diagram_small, outline: violet, appear: 1}
      - {type: box, box: [1330, 330, 1730, 470], text: "CMP\na before and an after sequence", font: diagram_small, outline: magenta, appear: 1}
      # The trainer it extends
      - {type: box, box: [40, 540, 1730, 690], text: "SequenceClassificationTrainer extends ClassificationTrainer\nthe loss, the batch accuracy and the evaluation of CLS, computed per sequence", font: diagram_text, outline: yellow, appear: 2, highlight: [2]}
    narration:
      - "Suppose the class needs several frames, as in the synthetic moving shapes, where one shape moves left, right, up or down and no single frame shows the direction: choose this task."
      - "Take the image classifier when one image carries the class, the sequence labeller or the frame selector when the answer is per frame, and the comparator when a before and an after sequence are compared."
      - "Its trainer extends the image classification trainer: the loss, the batch accuracy and the evaluation are those of the classification, computed on sequences."

  - kind: html
    page: diagram
    title: "The data on disk"
    code_reference: "vision_training/data/sequence/sequence_dataset.py · SequenceDataset"
    elements:
      - type: listing
        box: [40, 40, 720, 340]
        font: diagram_monospace
        source: {file: "figures:sequence_classification/listings/split_tree.txt"}
        highlights:
          - {match: "data/|train_000000/|0000\\d\\d\\.png", sentences: [0]}
          - {match: "labels.json", sentences: [0, 1]}
      - type: listing
        box: [760, 30, 1740, 600]
        font: diagram_monospace
        source: {file: "figures:sequence_classification/listings/labels_entry.txt"}
        highlights:
          - {match: "categories|\"id\": \\d, \"name\"", sentences: [0]}
          - {match: "train_000000\", \"category_id\"|\"frames\"|0000\\d\\d\\.png\"", sentences: [1]}
          - {match: "label_mapping.json", sentences: [1]}
      - {type: text, position: [60, 420], text: "{{sequence_classification.dataset.train_sequences:,}} training, {{sequence_classification.dataset.validation_sequences}} validation\nand {{sequence_classification.dataset.test_sequences}} test sequences", font: diagram_bold, appear: 2}
      - {type: text, position: [60, 520], text: "{{sequence_classification.dataset.train_minimum_class}} to {{sequence_classification.dataset.train_maximum_class}} training sequences per class\n{{sequence_classification.dataset.disk_minimum_frames}} to {{sequence_classification.dataset.disk_maximum_frames}} frames of {{sequence_classification.dataset.frame_size}} pixels per sequence", font: diagram_small, colour: dim, appear: 2}
    narration:
      - "A split holds a data folder with one folder of frames per sequence, and a labels file with the categories and the sequences."
      - "Every sequence gives its name, its frames in order relative to the data folder, and one category for the whole sequence; the label mapping file turns the {{sequence_classification.dataset.category_count:words}} categories into the class indices {{sequence_classification.dataset.first_class_index:words}} to {{sequence_classification.dataset.last_class_index:words}}."
      - "The data set holds {{sequence_classification.dataset.train_sequences:,}} training, {{sequence_classification.dataset.validation_sequences}} validation and {{sequence_classification.dataset.test_sequences}} test sequences, {{sequence_classification.dataset.train_minimum_class}} to {{sequence_classification.dataset.train_maximum_class}} per class in training, each of {{sequence_classification.dataset.disk_minimum_frames_words}} to {{sequence_classification.dataset.disk_maximum_frames_words}} frames."

  - kind: terminal
    title: "Generate, train, evaluate"
    code_reference: "vision_training/data/synthetic/create_synthetic_dataset.py · create_synthetic_dataset"
    lines:
      - {role: comment, text: "# A moving shapes dataset: task and output folder as arguments"}
      - {role: command, text: "uv run python -m vision_training.data.synthetic.create_synthetic_dataset --task=sequence_classification --output_folder=~/Data/sequence_data/synthetic_moving_shapes"}
      - {role: comment, text: "# The training: data folders and label mapping set in the configuration"}
      - {role: command, text: "uv run python -m vision_training.main --configuration_path=\"vision_training/configurations/sequence_classification/configuration_synthetic_sequences.yaml\""}
      - {role: comment, text: "# The evaluation of checkpoints into <run>/Checkpoint_Evaluation/, its run folder an argument"}
      - {role: command, text: "uv run python -m scripts.evaluation.evaluate_checkpoint --experiment_folder=<run folder>"}
    narration:
      - "The synthetic generator writes such a data set given its task and its output folder as arguments, its recipe for each task fixed in the script, the split sizes an option."
      - "It draws {{sequence_classification.dataset.generator_minimum_frames_words}} to {{sequence_classification.dataset.generator_maximum_frames_words}} frames of {{sequence_classification.dataset.generator_image_size}} pixels per sequence, one shape of {{constant:vision_training/data/synthetic/create_synthetic_dataset.py#OBJECT_MINIMUM_SIZE}} pixels or more crossing them in a straight line over a background shared by the frames."
      - "{{constant:vision_training/data/synthetic/create_synthetic_dataset.py#TEXTURED_BACKGROUND_PROBABILITY:percent_label}} of the sequences have a textured background, {{constant:vision_training/data/synthetic/create_synthetic_dataset.py#LOW_CONTRAST_PROBABILITY:percent_label}} of the others a shape color close to their flat background, and the border may cut the shape, which keeps at least {{constant:vision_training/data/synthetic/create_synthetic_dataset.py#SHAPE_MINIMUM_VISIBLE_FRACTION:percent_label}} of its pixels in every frame."
      - "The training takes the synthetic configuration, and the standalone evaluation script scores any checkpoint of the run again, given the run folder as an argument."
      - "It writes into the checkpoint evaluation folder of the run, next to the evaluation folder of the training."

  - kind: yaml
    title: "The keys of the task"
    code_reference: "vision_training/configuration_processing/sequence_checks.py · check_sequence_classification_configuration"
    source:
      file: vision_training/configurations/sequence_classification/configuration_synthetic_sequences.yaml
      keys: [Data.image_settings.size, Data.sequence_settings, Data.data_augmentation.independent_frames,
             Data.data_augmentation.shuffle_frames, Data.data_augmentation.types.random_left_right_flip,
             TemporalModel.type, TemporalModel.hidden_size, TemporalModel.bidirectional,
             ClassificationHead.global_pooling]
      comments: false
    highlights:
      - {key: Data, sentences: [0]}
      - {key: Data.sequence_settings, sentences: [0]}
      - {key: TemporalModel, sentences: [0]}
      - {key: ClassificationHead, sentences: [0]}
      - {key: Data.sequence_settings.maximum_sequence_length, sentences: [1]}
      - {key: Data.image_settings.size, sentences: [2]}
      - {key: ClassificationHead.global_pooling, sentences: [2]}
      - {key: Data.data_augmentation.types.random_left_right_flip, sentences: [3]}
      - {key: Data.data_augmentation.independent_frames, sentences: [4]}
      - {key: Data.data_augmentation.shuffle_frames, sentences: [4]}
    narration:
      - "The task adds the sequence settings and the temporal module to a classification configuration, the global pooling of its head turning every frame into a vector."
      - "The maximum sequence length, {{config:vision_training/configurations/sequence_classification/configuration_synthetic_sequences.yaml#Data.sequence_settings.maximum_sequence_length}} here, is the longest sequence a run accepts, and the number of learned frame positions of a transformer."
      - "The configuration reads the frames at {{config:vision_training/configurations/sequence_classification/configuration_synthetic_sequences.yaml#Data.image_settings.size}} pixels, the run of this series at {{sequence_classification.run.image_size}}, and the global pooling, {{config:vision_training/configurations/sequence_classification/configuration_synthetic_sequences.yaml#ClassificationHead.global_pooling}} here, decides what survives of the last feature map of every frame: the next chapter shows why the moving shapes need flatten."
      - "The augmentation draws once per sequence, so all its frames share the same geometric and photometric changes; the flips must stay off, since a mirrored movement keeps its label but reverses its direction."
      - "Independent frames redraws only the photometric types frame by frame, and shuffle frames is for sequences whose order carries nothing: with an ordered temporal module, it only prints a yellow warning."

  - kind: code
    title: "One sequence, one sample"
    code_reference: "vision_training/data/sequence/sequence_dataset.py · SequenceDataset.__init__"
    source:
      file: vision_training/data/sequence/sequence_dataset.py
      function: SequenceDataset.__init__
      start: "for sequence in manifest"
      end: "number_long_sequences"
    highlights:
      - {match: "for sequence in manifest", sentences: [0]}
      - {match: "number_left_out_sequences|\\[\"category_id\"\\]", sentences: [1]}
      - {match: "label_type != \"sequence\"", sentences: [1]}
      - {match: "self.maximum_sequence_length|warn_long_sequence|number_long_sequences", sentences: [2]}
    narration:
      - "The data set reads the labels file of the split, and every sequence becomes one sample, read in full, with no window and no subsampling."
      - "A sequence of an unmapped category, or without frames, is counted in one yellow note; the check of one category per frame is for the tasks labelled frame by frame."
      - "Say you set the maximum length too low: every longer sequence is left out with a red line naming it, then a red total for the split, and every split shrinks, the test split included."

  - kind: image
    title: "What the launch prints"
    code_reference: "vision_training/data/split_description.py · count_split_sequences"
    image: "figures:sequence_classification/evaluation/launch_console.png"
    highlights:
      - {box: "{{sequence_classification.launch.splits_box}}", sentences: [0]}
      - {box: "{{sequence_classification.launch.epoch_box}}", sentences: [1]}
    narration:
      - "At launch, every split is described from its labels file: its sequences, its frames, and the sequences short enough for the maximum length."
      - "An epoch is the kept training sequences over the batch size, {{sequence_classification.launch.iterations_per_epoch}} iterations here; the count is made before the label mapping, so a mapping that leaves categories out makes it too high."

  - kind: code
    title: "Padding to the longest sequence"
    code_reference: "vision_training/data/sequence/sequence_dataset.py · collate_padded_sequences"
    source:
      file: vision_training/data/sequence/sequence_dataset.py
      function: collate_padded_sequences
    highlights:
      - {match: "longest_member = max", sentences: [0]}
      - {match: "new_full|torch.cat", sentences: [0]}
      - {match: "FRAME_AXIS_PADDING_VALUES|\\.dim\\(\\)", sentences: [1]}
      - {match: "member_lengths = |unflatten", sentences: [2]}
    # The two members of a pair of the comparator, a before and an after sequence
    literal_numbers: [two]
    narration:
      - "Imagine a batch mixing short and long sequences: every sample keeps its own length, so the collate of the loaders pads them with black frames up to the longest one of that batch, not up to the maximum length."
      - "The mask is padded with False, and the frame labels of the tasks that have them with the ignored index; the class of a whole sequence has no frame axis and is left as it is."
      - "The same function batches the pairs of the comparator, two members per sample, every member padded to the longest member of the batch."

  - kind: html
    page: 07_sequence_classification/frame_batches
    title: "A padded batch"
    code_reference: "vision_training/data/sequence/sequence_dataset.py · collate_padded_sequences"
    data:
      layout: "figures:sequence_classification/animations/padded_batch.json"
      phases: [{name: sequences, sentence: -1}, {name: padded, sentence: 1}, {name: mask, sentence: 2}]
    elements:
      - {type: text, position: [330, 560], text: "labels [{{sequence_classification.batch.sequence_count}}] int64 · sample_identifiers [{{sequence_classification.batch.sequence_count}}] int64", font: diagram_monospace_small, colour: key, appear: 2}
      - {type: text, position: [330, 610], text: "prepare_batch: images in the precision of the model, still BGR in [0, 255], on the device with the mask and the labels", font: diagram_small, appear: 3}
      - {type: text, position: [330, 690], text: "{{sequence_classification.batch.sequence_count}} sequences drawn by the synthetic generator (seed {{sequence_classification.batch.seed}}), read at {{sequence_classification.run.image_size}} pixels like the run reads its dataset", font: diagram_small, colour: dim}
    # The range of the unsigned byte values of the frames
    literal_numbers: [zero, "0", "255"]
    narration:
      - "Here are {{sequence_classification.batch.sequence_count:words}} sequences drawn by the synthetic generator, read at {{sequence_classification.run.image_size}} pixels: {{sequence_classification.batch.length_0_words}}, {{sequence_classification.batch.length_1_words}}, {{sequence_classification.batch.length_2_words}} and {{sequence_classification.batch.length_3_words}} frames, each sample a tensor of its own length."
      - "The collate pads them to the {{sequence_classification.batch.longest_words}} frames of the longest one: a batch of {{sequence_classification.batch.sequence_count_words}} by {{sequence_classification.batch.longest_words}} frames of {{sequence_classification.batch.frame_channels:words}} by {{sequence_classification.run.image_size}} by {{sequence_classification.run.image_size}}, still in unsigned bytes."
      - "The sequence mask marks the {{sequence_classification.batch.real_frames}} real frames, which always come first in their sequence, as the packed recurrent networks need."
      - "The trainer then casts the frames to the precision of the model, still BGR in the zero to 255 range, and moves them to the device with the mask and the labels."

  - kind: image
    title: "Padding in numbers"
    image: "figures:sequence_classification/dataset/lengths.png"
    highlights:
      - {box: "{{sequence_classification.lengths.length_panel_box}}", sentences: [0]}
      - {box: "{{sequence_classification.lengths.padding_panel_box}}", sentences: [1, 2]}
    narration:
      - "The training sequences hold every number of frames from {{sequence_classification.dataset.disk_minimum_frames_words}} to {{sequence_classification.dataset.disk_maximum_frames_words}}, {{sequence_classification.dataset.train_mean_frames:.1f}} on average."
      - "In the batches of {{sequence_classification.run.batch_size}} sequences of the run, {{sequence_classification.lengths.padding_share_run:percent}} of the frames are padding: made by the collate and moved to the device, but never encoded, as the next chapter shows."
      - "Every batch is padded to its own longest sequence, so smaller batches pad less: {{sequence_classification.lengths.padding_share_batch_small:percent}} of the frames with {{sequence_classification.lengths.padding_batch_small:words}} sequences per batch."
      - "The frames per second of the console summary count the real frames only, so they stay comparable whatever the padding."

  - kind: summary
    title: "Recap"
    items:
      - {text: "One class per sequence, read whole: no window", sentences: [0]}
      - {text: "labels.json: the ordered frames and one category per sequence", sentences: [1]}
      - {text: "Longer than maximum_sequence_length: left out, in red", sentences: [2]}
      - {text: "Batches padded with black frames to their longest sequence", sentences: [3]}
      - {text: "sequence_mask: False on the padding, real frames first", sentences: [4]}
      - {text: "Moving shapes: {{sequence_classification.dataset.disk_minimum_frames}} to {{sequence_classification.dataset.disk_maximum_frames}} frames, {{sequence_classification.lengths.padding_share_run:percent}} padding", sentences: [5]}
    narration:
      - "To recap: every sequence is one sample with one class, read in full, with no window and no subsampling."
      - "The labels file gives every sequence its frames in order and a single category, which the label mapping turns into a class index."
      - "A sequence longer than the maximum length is left out with a red line, in every split, the test split included, so set the length from the data."
      - "The collate pads every batch with black frames up to its own longest sequence, not up to the maximum length, so smaller batches pad less."
      - "The sequence mask is False on the padding, and the real frames always come first, as the packed recurrent networks need."
      - "The moving shapes hold {{sequence_classification.dataset.disk_minimum_frames_words}} to {{sequence_classification.dataset.disk_maximum_frames_words}} frames per sequence, so {{sequence_classification.lengths.padding_share_run:percent}} of the frames of the run batches are padding, made by the collate but never encoded."
      - "The next chapter follows a padded batch through the encoder of the frames, the temporal module and the head."
