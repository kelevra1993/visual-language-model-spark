# Storyboard of the tests of the builder: one scene of every kind and one element of every type of the HTML diagrams,
# quoting real files of the repository, so that a change of the builder or of the repository that breaks a kind of
# scene shows in the tests. It is not a chapter of any series.
series: smoke
series_title: "Smoke Test"
chapter: 1
title: "Every kind of scene"
output_name: smoke_every_kind_of_scene
pace: 1.16
voice: {name: af_heart, language: en-us}
scenes:
  - kind: title_card
    heading: "Every kind of scene"
    subheading: "The smoke test of the tutorial builder"
    footnote: "tutorials/tests/fixtures/smoke_storyboard.yaml"
    narration:
      - "This storyboard shows one scene of every kind."

  - kind: yaml
    title: "A configuration excerpt read from the repository"
    code_reference: "vision_training/configurations/classification/configuration_synthetic_shapes.yaml · Optimization"
    source:
      file: vision_training/configurations/classification/configuration_synthetic_shapes.yaml
      keys: [Optimization.learning_rate_schedule, Optimization.warmup_iterations]
      comments: false
    highlights:
      - {match: "learning_rate_schedule", sentences: [0]}
      - {match: "warmup_iterations", sentences: [1]}
    narration:
      - "The schedule key is highlighted first."
      - "Then the warmup iterations."

  - kind: code
    title: "A function read by its name"
    code_reference: "vision_training/models/components/convolution_block.py · ConvolutionBlock.count_residual_additions"
    source:
      file: vision_training/models/components/convolution_block.py
      function: ConvolutionBlock.count_residual_additions
    font_size: 24
    highlights:
      - {match: "residual_parity", sentences: [0]}
    narration:
      - "The parity decides where the pairs close."

  - kind: terminal
    title: "A terminal"
    lines:
      - {role: comment, text: "# Train the synthetic classification"}
      - {role: command, text: "uv run python -m vision_training.main --configuration_path=\"vision_training/configurations/classification/configuration_synthetic_shapes.yaml\""}
      - {role: output, text: "Backbone Architecture Summary"}
    narration:
      - "A command is typed, then its output appears."

  - kind: html
    page: diagram
    title: "Every element of a diagram"
    elements:
      - {type: text, position: [40, 30], text: "Elements", font: diagram_heading}
      - {type: box, box: [40, 100, 300, 190], text: "box\nsecond line", highlight: [1]}
      - {type: arrow, points: [[300, 145], [420, 145]], appear: 1, highlight: [1], flow: true, label: "arrow", label_position: [360, 115]}
      - {type: arrow, points: [[40, 250], [300, 250]], dash: [12, 8], appear: 1, label: "dashed", label_position: [170, 280]}
      - {type: cuboid, box: [440, 100, 560, 220], depth: 40, fill: aqua, label: "[8, 32, 64, 64]", appear: 1}
      - {type: stack, box: [680, 120, 780, 220], count: 5, fills: [blue, violet], label: "stack", appear: 2}
      - {type: bars, box: [880, 90, 1200, 230], values: [0.2, 0.9, 0.5], labels: ["a", "b", "c"], value_labels: ["0.2", "0.9", "0.5"], appear: 2}
      - {type: grouped_bars, box: [1530, 40, 1740, 300], groups: ["1k", "2k"], series: [{name: "box", colour: blue, values: [0.4, 0.7]}, {name: "mask", colour: magenta, values: [0.3, 0.6]}], appear: 2}
      - {type: grid, box: [1280, 90, 1500, 310], values: [[1.0, 0.1, 0.2], [0.1, 1.0, 0.3], [0.2, 0.3, 1.0]], show_values: true, row_labels: ["x", "y", "z"], column_labels: ["x", "y", "z"], marks: [{row: 0, column: 0, sentences: [3]}], appear: 3}
      - {type: curve, box: [120, 330, 700, 640], series: [{name: "loss", colour: red, points: [[0, 2.2], [1, 1.4], [2, 0.9], [3, 0.6], [4, 0.5]]}, {name: "validation", colour: blue, points: [[0, 2.0], [1, 1.5], [2, 1.0], [3, 0.7], [4, 0.52]]}], x_label: "iteration", y_label: "loss", y_ticks: [{value: 0.5, label: "0.5"}, {value: 2.0, label: "2.0"}], appear: 3}
      - {type: image, path: "repository:README/architectures.png", box: [900, 340, 1700, 700], caption: "README/architectures.png", appear: 4, highlight: [4]}
      - {type: text, position: [1000, 300], segments: [{text: "CLS_", highlight: [4]}, {text: "IN-KAR-512", dim: [4]}], appear: 4}
    narration:
      - "A heading and a box."
      - "An arrow grows with a tensor."
      - "A stack and bars."
      - "A grid with a mark, and a curve."
      - "An image of the repository and a run name."

  - kind: text_panel
    title: "Columns of text in a larger font"
    font_size: 30
    columns:
      - {heading: "folder", lines: ["experiments/", "└── Weights/"]}
      - {heading: "manifest", lines: ["{\"split\": \"train\"}"], syntax: json}
    narration:
      - "Two columns of text."

  - kind: image
    title: "A figure seen through a camera"
    image: "repository:README/tasks_overview.png"
    views:
      - {box: [0, 0, 900, 700], from_sentence: 1}
    highlights:
      - {box: [0, 0, 400, 400], sentences: [1]}
    narration:
      - "The whole figure."
      - "Then the camera zooms in."

  - kind: summary
    title: "Recap"
    items:
      - {text: "Every kind of scene is drawn."}
      - {text: "tutorials/build_tutorials.sh --series foundations", monospace: true}
    narration:
      - "That is every kind of scene."
