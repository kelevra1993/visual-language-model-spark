[project]
name = "vlms-tutorials"
version = "1.0.0"
description = "Environment of the tutorial video build of visual-language-model-spark, the builder being tutorial-video-builder"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Builder of the videos: storyboards, frames, Kokoro narration, encoding, checks (pinned by tag below)
    "tutorial-video-builder",
]

[tool.uv]
# This folder holds storyboards, figures and pages, not a package to install
package = false

[tool.uv.sources]
# The private builder repository, pinned to a release tag; move the tag to take a newer builder, then `uv sync`
tutorial-video-builder = { git = "ssh://git@github.com/kelevra1993/tutorial-video-builder.git", tag = "v1.2.1" }
