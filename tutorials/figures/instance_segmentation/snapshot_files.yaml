# Files of the run the instance segmentation figures read, copied into tutorials/run_snapshots by
# tutorials/make_run_snapshots.py. The series reads no checkpoint from
# the snapshots: the geometry of the mask heads comes from the instance segmenter built untrained from the
# configuration, and the inference of the INS run on the test image (mask target, predicted and pasted masks,
# parameter counts) is committed under figure_reuse/instance_segmentation/masks by a build from the real runs.
runs:
  # INS run of the series (the synthetic configuration with benchmark settings, stopped after its evaluation of 6000)
  - run: instance_segmentation
    files:
      # Settings, test folder and score threshold of the run, and the model built untrained from them
      - path: training_configuration.yaml
      - path: label_dictionary.json
      # Confusion matrix notes of the evaluations made during the training (iterations 1000 to 6000)
      - path: Results.txt
      # Losses (Train), mask mAP and the tag count (Test, Test_EMA) of the run, without the sample images
      - path: Tensorboard/*/events.out.tfevents.*
        reduction: tensorboard_scalars
      # Sample image of the test image of the series at the three compared evaluations (SAMPLE_ITERATIONS); the one of
      # 6000 is also shown directly by the first chapter (runs: path of its storyboard), and their folders tell the
      # figures the last evaluated iteration
      - path: Evaluation/Iteration_1000/Samples/test_000000.png
      - path: Evaluation/Iteration_3000/Samples/test_000000.png
      - path: Evaluation/Iteration_6000/Samples/test_000000.png
      # Last checkpoint evaluated again after the training: report tables, classes and proposal recall
      - path: Checkpoint_Evaluation/Results.txt
      - path: Checkpoint_Evaluation/Iteration_6000/class_metrics.csv
      - path: Checkpoint_Evaluation/Iteration_6000/proposal_recall.csv
      # Console log next to the run folder, whose summaries of iterations 1000 and 6000 are read
      - path: ../instance_segmentation.log

# Dataset files of the INS run, relative to the recorded data root: the test manifest of the run (test_5000, the first
# 5,000 test images), the test image of the series kept whole (its first annotation is the one the first chapter
# decodes) and the other records slimmed so that the counts of the split stay right, its 'area' and 'iscrowd' keys
# removed after writing; and the test image itself, declared under test/data since the
# committed test_5000/data is a relative link to ../test/data
datasets:
  - path: instance_segmentation_data/synthetic_shapes/test_5000/labels.json
    reduction: manifest_subset
    images: [test_000000.png]
  - path: instance_segmentation_data/synthetic_shapes/test/data/test_000000.png

# Outputs of the inference of the INS checkpoint on the test image, reused by a build without the checkpoint
# (make_mask_figures of mask_figures.py, which checks their key: MASK_FACTS_VERSION, checkpoint and image)
figure_reuse:
  - family: masks
