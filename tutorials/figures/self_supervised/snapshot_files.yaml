# Files of the SimCLR run and of the synthetic shapes dataset the self-supervised figures and storyboards read, copied
# into tutorials/run_snapshots by tutorials/make_run_snapshots.py (tutorials/MAINTAINING.md, section Run Snapshots).
# The representation figures (k-NN neighbourhood, InfoNCE matrix, colour cue, views similarity at every evaluated
# checkpoint) need the checkpoints of the run, which the snapshots never hold: their outputs are committed under
# figure_reuse/self_supervised/representations and restored when the checkpoints are absent
# (representation_figures.py); the mosaic of the nearest reference images is drawn again from the reduced manifests and
# the images committed under datasets/.
runs:
  - run: self_supervised
    files:
      - path: training_configuration.yaml
      - path: label_dictionary.json
      # Block of the last evaluation shown by the Results.txt scene
      - path: Results.txt
      # Per-class k-NN F1 of the last evaluation; those of every evaluation keep the Evaluation/Iteration_<n> folders
      # in git, whose names give the evaluated iterations
      - path: Evaluation/Iteration_*/class_metrics.csv
      # Sample images of the first and last evaluations shown under runs:, the star of the last one also compared with
      # the views drawn on the CPU
      - path: Evaluation/Iteration_500/Samples/test_000000.png
      - path: Evaluation/Iteration_500/Samples/test_000012.png
      - path: Evaluation/Iteration_20000/Samples/test_000000.png
      - path: Evaluation/Iteration_20000/Samples/test_000012.png
      # Training curves, first validations and test metrics
      - path: Tensorboard/Train/events.out.tfevents.*
        reduction: tensorboard_scalars
      - path: Tensorboard/Validation/events.out.tfevents.*
        reduction: tensorboard_scalars
      - path: Tensorboard/Test/events.out.tfevents.*
        reduction: tensorboard_scalars
      # Console log of the training, next to the run folder: the last console summary and the throughputs
      - path: ../self_supervised_tutorial.log
datasets:
  # Label mapping file read by the configuration checks
  - path: classifier_data/synthetic_shapes/label_mapping.json
  # Training manifest: the k-NN reference images of the run (select_reference_samples) and the first samples of the
  # labels listing of the classification series, with the count of the split; the same entry as in that series
  - path: classifier_data/synthetic_shapes/train/labels.json
    reduction: tutorials.figures.classification.snapshot_reductions:reduce_sample_manifest
    first_samples: 3
    reference_samples_per_category: 50
  # Test manifest and images of the four sample images whose views the figures draw (the star is also the k-NN query)
  - path: classifier_data/synthetic_shapes/test/labels.json
    reduction: tutorials.figures.classification.snapshot_reductions:reduce_sample_manifest
    samples: [test_000000.png, test_000006.png, test_000008.png, test_000012.png]
  - path: classifier_data/synthetic_shapes/test/data/test_00000[068].png
  - path: classifier_data/synthetic_shapes/test/data/test_000012.png
  # Nearest reference images of the star at the first and last evaluated checkpoints, drawn by the mosaic (the
  # knn.nearest_<iteration> indices of figure_reuse/self_supervised/representations/representation_facts.json)
  - path: classifier_data/synthetic_shapes/train/data/train_007897.png
  - path: classifier_data/synthetic_shapes/train/data/train_025801.png
  - path: classifier_data/synthetic_shapes/train/data/train_032586.png
  - path: classifier_data/synthetic_shapes/train/data/train_206679.png
  - path: classifier_data/synthetic_shapes/train/data/train_277854.png
  - path: classifier_data/synthetic_shapes/train/data/train_280257.png
  - path: classifier_data/synthetic_shapes/train/data/train_339831.png
  - path: classifier_data/synthetic_shapes/train/data/train_399014.png
  - path: classifier_data/synthetic_shapes/train/data/train_422157.png
  - path: classifier_data/synthetic_shapes/train/data/train_447599.png
figure_reuse:
  # Outputs of the checkpoints on the reference images, the star and the views (representation_figures.py)
  - family: representations
