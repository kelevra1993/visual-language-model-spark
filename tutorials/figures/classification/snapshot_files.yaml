# Files of the runs and of the synthetic shapes dataset the classification figures and storyboards read, copied into
# tutorials/run_snapshots by tutorials/make_run_snapshots.py. The
# model figures of the head (logits of the test star, correlation of the hidden features) need the checkpoint of the
# run, which the snapshots never hold: their outputs are committed under figure_reuse/classification/model and restored
# when the checkpoint is absent (classification_head.py). Files of the classification run also read by the foundations
# and deployment series keep the same entries in their snapshot_files.yaml.
runs:
  # Synthetic shapes classifier: its configuration (dataset paths, image settings, head, learning rate), classes,
  # checkpoint registry, class counts, evaluation logs and the outputs of its evaluations in training
  - run: classification
    files:
      - path: training_configuration.yaml
      - path: label_dictionary.json
      - path: Weights/full-checkpoint
      # Classes of the data.json listing and the class weights, without the file names of every split (19 MB)
      - path: data.json
        reduction: json_keys
        keys: [created, classes]
      # Headline metrics of every evaluation
      - path: Tensorboard/Test/events.out.tfevents.*
        reduction: tensorboard_scalars
      # Sample images of the first and last evaluations, the confusion matrices of every evaluation, and the per-class
      # metrics and thresholds of the last one
      - path: Evaluation/Iteration_500/Samples/*.png
      - path: Evaluation/Iteration_2000/Samples/*.png
      - path: Evaluation/Iteration_*/confusion_matrix.csv
      - path: Evaluation/Iteration_2000/class_metrics.csv
      - path: Evaluation/Iteration_2000/class_thresholds.json
      # Predictions of the eight sample images at the first evaluation, the errors the sample scene names
      - path: Evaluation/Iteration_500/predictions.csv
        reduction: tutorials.figures.classification.snapshot_reductions:reduce_predictions_file
        kept_classes: []
        samples: [test_000002.png, test_000007.png, test_000012.png, test_000017.png, test_000018.png,
                  test_000022.png, test_000036.png, test_000042.png]
      # Predictions of the 50,000 test images of the last evaluation (27 MB, 10 MB gzipped with the probability of
      # every class): the probability of the predicted class of every image and those of the pair of the largest
      # confusion of that evaluation, which the prediction confidence figure draws, gzipped; the figure scripts read
      # this copy, and the size of the CSV from the manifest of the series
      - path: Evaluation/Iteration_2000/predictions.csv
        reduction: tutorials.figures.classification.snapshot_reductions:reduce_predictions_file
        kept_classes: [hollow_parallelogram, hollow_trapezoid]
        compress: gzip
  # Standalone evaluation of the last checkpoint: the error images shown (the first of each of the four largest
  # confusions, the counts coming from Results.txt), its headline metrics, the report block, confusion matrix and
  # precision-recall curves the storyboards show under runs:, and the confusion matrix table whose accuracies the
  # report figures write (report_figures.py; their precision-recall figure needs class_logits.npz, 7.4 MB, left out)
  - run: classification_evaluation
    files:
      - path: Tensorboard/Test/events.out.tfevents.*
        reduction: tensorboard_scalars
      - path: Results.txt
      - path: Iteration_2000/confusion_matrix.csv
      - path: Iteration_2000/confusion_matrix.png
      - path: Iteration_2000/precision_recall_curves.png
      - path: Iteration_2000/Errors/hollow_parallelogram-TO-hollow_trapezoid/test_005285_0.604.png
      - path: Iteration_2000/Errors/trapezoid-TO-parallelogram/test_007906_0.506.png
      - path: Iteration_2000/Errors/rectangle-TO-square/test_010091_0.644.png
      - path: Iteration_2000/Errors/hollow_trapezoid-TO-hollow_parallelogram/test_001964_0.486.png
  # Classification run of the 9-class version of the synthetic shapes and its learning rate variants: their learning
  # rate, classes, validation curve and first test accuracy
  - run: classification_nine_classes
    files:
      - path: training_configuration.yaml
      - path: label_dictionary.json
      - path: Tensorboard/Validation/events.out.tfevents.*
        reduction: tensorboard_scalars
      - path: Tensorboard/Test/events.out.tfevents.*
        reduction: tensorboard_scalars
  - run: classification_learning_rates
    files:
      - path: training_configuration.yaml
      - path: label_dictionary.json
      - path: Tensorboard/Validation/events.out.tfevents.*
        reduction: tensorboard_scalars
      - path: Tensorboard/Test/events.out.tfevents.*
        reduction: tensorboard_scalars
datasets:
  # Label mapping file of the labels listing, also loaded by the configuration checks of the self-supervised series
  - path: classifier_data/synthetic_shapes/label_mapping.json
  # Training manifest reduced to the first samples of the labels listing, with the count of the 500,000 samples of
  # the split that the listing quotes
  - path: classifier_data/synthetic_shapes/train/labels.json
    reduction: tutorials.figures.classification.snapshot_reductions:reduce_sample_manifest
    first_samples: 3
figure_reuse:
  # Outputs of the trained head on the test star and the validation images (classification_head.py)
  - family: model
