# Shape pretrainer named after this file (~/Data/tutorial_runs/pretrained): the counted shapes classifier, 10,000
# iterations of 256 images at a constant rate, resumed to 15,000 under a cosine cooldown (26 % of the rate to 1 %).
ExperimentConfiguration:
  # Task trained by this configuration, selecting the trainer, the model and the checks of the task sections.
  # "classification" trains the image classifier, and requires the ClassificationHead section.
  task: "classification"
  # Root of the runs, a subfolder per model, data and optimizer settings (run_name.py), resumed if equal; this file
  # gives CLS_IN-KAR-256_SE-RES-BN-B1x16.2x16.2x16.4x32.5x32.5x32_HFLAT.96.96-HLN-CWB_ML35_counted-shapes.
  experiment_folder: "/home/robert_kelevra/Data/tutorial_runs/pretrained"
  # Last run name section, e.g. "v1" giving <run name>_v1, to start a new folder for the same settings with another
  # batch size, augmentation or learning rate. Letters, digits, '-' and '.', null for none.
  run_name_suffix: "counted-shapes"
  # Root directory containing the training dataset images and labels.json manifest.
  train_data_folder: "/home/robert_kelevra/Data/classifier_data/synthetic_counted_shapes/train"
  # Root directory containing the validation dataset images and labels.json manifest.
  validation_data_folder: "/home/robert_kelevra/Data/classifier_data/synthetic_counted_shapes/validation"
  # Root directory containing the test dataset images and labels.json manifest.
  test_data_folder: "/home/robert_kelevra/Data/classifier_data/synthetic_counted_shapes/test"
  # Number of images processed in a single forward/backward pass.
  batch_size: 256
  # Frequency (in iterations) to log performance metrics.
  information_dump: 250
  # Frequency (in iterations) to checkpoint the model weights and run the test evaluation on them.
  weight_saving_iterations: 2500
  # Interval (iterations) of extra checkpoints without test evaluation, below weight_saving_iterations, 0 for none.
  intermediate_weight_saving_iterations: 0
  # Total number of training iterations before stopping: 15,000 iterations of 256 images see the 512,000 training
  # images 7.5 times, 5 times in the first 10,000.
  number_iterations: 15000
  # Ratio controlling how often validation is run during training.
  # 0 = never run validation, 1 = run every iteration, 2 = every 2nd iteration, N = every Nth iteration.
  validation_iteration_ratio: 10
  # Test evaluation at every weight_saving_iterations checkpoint: accuracy, balanced accuracy, macro F1, top-k accuracy,
  # per-class metrics, confusion matrix and class thresholds in Evaluation/Iteration_<n>/.
  evaluation:
    # Reports every class: per-class and recall tables (console, Results.txt), TensorBoard scalars, confusion matrix,
    # ROC, precision-recall curves, temperature_explorer.html. False: global metrics only; CSV, JSON always saved.
    per_class_report: True
    # Test images drawn once, shown at every evaluation captioned with true and predicted class and probability (green
    # right, red wrong), in Evaluation/Iteration_<n>/Samples/ and TensorBoard, spread over classes. 0 disables.
    number_sample_images: 8
    # Precision every class threshold must reach (highest recall threshold saved for deployment), in [0, 1]; a list of
    # distinct precisions, e.g. [0.99, 0.95], deploys the first and reports the others (additional_targets).
    target_precision: 0.99
    # Saves 'predictions.csv' at every evaluation: true and predicted classes and every class probability per test
    # sample (labelled frame in sequence labelling). Grows with samples x classes.
    save_predictions: False
    # Saves every misclassified sample (image, window or pair frame grid) at every evaluation, multi-class only, as
    # 'Evaluation/Iteration_<n>/Errors/<TRUE>-TO-<PREDICTED>/<sample>_<score>.png', score: predicted class probability.
    error_dumps:
      # Turns the error images on.
      activated: False
      # Largest number of images saved for every pair of true and predicted classes, the first ones met.
      maximum_per_class_pair: 20
  # MLflow tracking next to TensorBoard: hyperparameters, metric averages, learning rate, test metrics, small artifacts
  # (configuration, confusion matrices, class metrics and thresholds, Results.txt); MLflow errors only warn.
  tracking:
    # Turns the MLflow tracking on.
    activated: False
    # MLflow server address (e.g. "http://192.168.1.20:5000"), null for <experiment_folder>/mlflow.db; credentials from
    # MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD; browse: mlflow ui --backend-store-uri sqlite:///<that file>
    tracking_uri: null
    # MLflow experiment grouping the runs, null for the task name (e.g. "classification").
    experiment_name: null
  # Base learning rate used by the optimizer.
  learning_rate: 1.0e-3
  # Lets a resumed run train on a changed labels.json (the previous data.json kept as data_until_iteration_<n>.json);
  # False refuses it, a new run (run_name_suffix) being needed. A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Choice to compute Receptive-Field
      compute_receptive_field: True
      # Shows the network input: Training and Validation windows with the images and their class. SPACE: next images,
      # ENTER: exit without training (set False to train). Needs a display; no run folder is created.
      view_input_images: False
      # Times the training step and the inference (PyTorch, TorchScript, ONNX Runtime, TensorRT) on one training batch,
      # at the configured and largest batch sizes that fit, then exits without training; no run folder is created.
      benchmark_speed: False

Optimization:
  # Optimizer of the model parameters: "adam", "adamw" (Adam with the weight decay decoupled from the gradients) or
  # "sgd" (stochastic gradient descent with Nesterov momentum 0.9), at ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Weight decay of the optimizer, 0 to disable.
  weight_decay: 0.0
  # Learning rate schedule after the warm-up: "constant", or "cosine" (decay to minimum_learning_rate_ratio times the
  # learning rate over decay_iterations, constant afterwards).
  learning_rate_schedule: "cosine"
  # Iterations of the linear warm-up of the learning rate from 0, 0 to disable.
  warmup_iterations: 0
  # Iterations of the cosine decay, counted after the warm-up (cosine schedule only).
  decay_iterations: 15000
  # Learning rate at the end of the cosine decay, as a fraction of the learning rate (cosine schedule only).
  minimum_learning_rate_ratio: 0.01
  # Moving average of the weights, ema = decay x ema + (1 - decay) x weights per step, scored at every test; 0.999:
  # the averaged backbone the sequence labelling launches load at 10000 is that of its last 1,000 iterations.
  exponential_moving_average:
    # Turns the moving average of the weights on.
    activated: True
    # Fraction of the average kept at every update, strictly between 0 and 1.
    decay: 0.999

Data:
  image_settings:
    # Target resolution to resize all input images: the 512 pixel images are resized to the 256 pixels of the frames
    # of the sequence labelling launches.
    size: 256
    # Flag to maintain the original aspect ratio when resizing.
    keep_ratio: True
  label_mapping:
    # Must be "multi_class" for the classification task: the mapping file gives the class index of every category
    # of the labels.json manifests, the classes being indexed 0 to K-1 (no background class).
    mode: "multi_class"
    # Path to a JSON file mapping raw dataset category IDs to sequential model class IDs.
    mapping_file_path: "/home/robert_kelevra/Data/classifier_data/synthetic_counted_shapes/label_mapping.json"
  data_augmentation:
    # Global switch to enable or disable all data augmentation (applied on the GPU to training batches only).
    activated: True
    # Probability that a training image is augmented at all. Each activated type below is then applied to that
    # image with its own probability. For image sequences, all frames of a sequence share the same augmentation.
    probability: 0.4
    # The types turned on are those of the sequence labelling launches (sequence_labelling/run-1.yaml).
    types:
      # Geometric augmentations : the class of an image does not change with them.
      # Random Crop : crop keeping 75% to 100% of each side (same aspect ratio), resized back to the input size
      random_crop: { activated: False, probability: 0.3 }
      # Random Aspect Crop : 75% to 100% of the width and, separately, of the height, resized back (x0.75 to x1.33
      # stretch; other camera proportions, for keep_ratio False)
      random_aspect_crop: { activated: False, probability: 0.3 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side (same aspect ratio) at a random position of a
      # black canvas of the input size, the objects then appearing smaller than in the dataset
      random_zoom_out: { activated: False, probability: 0.3 }
      # Random Translation : shift along x, y or both (drawn at random) of up to 25% of the image width and
      # height, the uncovered border filled with black
      random_translation: { activated: False, probability: 0.5 }
      # Random Left to Right Flip (mirror)
      random_left_right_flip: { activated: True, probability: 0.5 }
      # Random Up to Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation between -5° and 5°
      random_rotation: { activated: False, probability: 0.3 }
      # Random -90° or 90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.3 }
      # Random Perspective : corners moved inwards by up to 5% of half the width and height, border filled black;
      # refused for tasks with boxes, masks or keypoints
      random_perspective: { activated: False, probability: 0.3 }
      # Random Jigsaw : image cut into 2x2 pieces put back in a random order, breaking the global layout of the image;
      # moves the image only, so it is refused for the tasks with boxes, masks or keypoints
      random_jigsaw: { activated: False, probability: 0.3 }

      # Photometric augmentations.
      # Brightness (+-40 intensity levels), contrast and saturation (both x0.7 to x1.0) adjustments
      brightness_contrast_saturation: { activated: True, probability: 0.3 }
      # Random Hue : hue turned by up to 18 degrees (5% of the hue circle) in either direction
      random_hue: { activated: False, probability: 0.5 }
      # Contrast-limited Adaptive Histogram Equalization (CLAHE), clip limit 2.0 on a 4x4 grid of tiles
      clahe_augment: { activated: True, probability: 0.3 }
      # Image Sharpening with a Laplacian of Gaussian unsharp mask (sigma 1.5, strength 3)
      sharp_augment: { activated: True, probability: 0.3 }
      # Histogram Equalization of the luminance (Y channel of YUV)
      equalize_histogram_augment: { activated: True, probability: 0.3 }
      # Histogram Equalization of one random channel (B, G or R) or of all three channels
      equalize_bgr_histogram_augment: { activated: True, probability: 0.3 }
      # Random Noise : Gaussian noise with a standard deviation of 20 intensity levels
      random_noise: { activated: True, probability: 0.3 }
      # Grayscale conversion, kept on three channels
      gray_scale_augment: { activated: True, probability: 0.3 }
      # Random Colour augmentation : swap of the blue and red channels (BGR to RGB)
      random_colour_augmentation: { activated: True, probability: 0.3 }
      # Random Gamma : gamma correction with a gamma of 0.8 to 1.25, darkening or lightening the mid-tones
      random_gamma: { activated: False, probability: 0.3 }
      # Random Linear Illumination : ramp of 13 to 38 intensity levels growing from one side of the image to the
      # opposite one, brightening or darkening it, a light source on one side of the scene
      random_linear_illumination: { activated: False, probability: 0.3 }
      # Random Plasma Shadow : irregular shadows of a random fractal map darkening by up to 77 intensity levels
      random_plasma_shadow: { activated: False, probability: 0.3 }
      # Random Image Blurring : 9x9 Gaussian kernel with sigma 2.5
      random_blur: { activated: False, probability: 0.3 }
      # Random Motion Blurring : streak of 5 to 15 pixels at an angle of 0 to 180 degrees, trailing backward
      # or forward, the motion of the camera or of the objects during the exposure
      random_motion_blur: { activated: False, probability: 0.3 }
      # Random Haze : uniform grey airlight of 180 to 255 levels taking 20% to 60% of every pixel, a camera fog (after
      # the blurs, before solarization, black-out and erasing)
      random_haze: { activated: False, probability: 0.3 }
      # Random Solarize : every pixel at or above 128 intensity levels inverted
      random_solarize: { activated: False, probability: 0.2 }
      # Random Black Out : grid_size x grid_size cells, each blacked out with probability 0.2 (after the other
      # photometric types but the erasing); labels unchanged, so a hidden object keeps its label
      random_black_out: { activated: False, probability: 0.3, grid_size: 8 }
      # Random Erasing : one black rectangle of 2% to 15% of the image, height / width 0.3 to 3.3, applied last; labels
      # unchanged
      random_erasing: { activated: False, probability: 0.3 }

Backbone:
  # Number of input channels of the initial convolution block: must be 3, the loaders giving BGR images
  input_channels : 3

  # [convolutions, output filters] of every block, those of the sequence labelling launches so that this backbone can
  # initialise them.
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 16 ],
      "3": [ 2, 16 ],
      "4": [ 4, 32 ],
      "5": [ 5, 32 ],
      "6": [ 5, 32 ],
    }

  # Choice to add last max pooling layer on last* convolution layer
  last_max_pooling: False

  normalization:
    # Input Normalization : Setting image range values between [-0.5:0.5]
    input_normalization: True

    # Per Sample Input Normalization : Normalizing each image to zero mean and unit variance
    # Applied after input_normalization when both are activated
    per_sample_normalization: False

    # Strategy for normalizing the feature maps in the convolution blocks.
    # Options are: "batch" (Batch Normalization), "layer" (Layer Normalization over channels), or "none" (No normalization)
    feature_map_normalization: "batch"

  modules:
    # Residual shortcuts (https://arxiv.org/abs/1512.03385) around pairs of layers from block 2; a block
    # changing the channel count pairs its layers from the second one, so with 2 layers it gets none.
    residual_nets: True

    # Pre-activation shortcuts (https://arxiv.org/abs/1603.05027): normalization and ReLU before every convolution.
    # Requires residual_nets; RES2 token instead of RES.
    residual_nets_v2: False

    # Inception Modules : Paper "Going Deeper with Convolutions" https://arxiv.org/abs/1409.4842
    # Output channels of every block using inception must be multiples of 8
    inception: False

    # Squeeze and Excitation Nets : Paper "Squeeze and Excitation Networks" https://arxiv.org/pdf/1709.01507.pdf
    squeeze_and_excite: True

  # Backbone of another run (any task) initialising this one: input_channels, convolutions, modules, normalization and
  # last_max_pooling match, or one backbone has more blocks (extras random); detection levels, image size may differ.
  pretrained:
    # Run folder whose trained backbone initialises this run, null to start from random weights. A run resuming
    # from its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded backbone fixed (no gradient, batch normalization statistics frozen) so that only the heads of
    # the task learn. Requires an experiment_folder.
    freeze: False
    # Freezes the scale and shift of the loaded backbone normalizations while its convolutions learn; needs
    # experiment_folder, freeze False and a normalization.
    freeze_normalization_parameters: False
    # Multiplies the learning rate of the loaded backbone, e.g. 0.1 to fine-tune it ten times slower than the heads.
    learning_rate_multiplier: 1.0

ClassificationHead:
  # Feature map reduction: "average" or "max" (C values), or "flatten" (C x H x W values keeping positions, tied to
  # Data.image_settings.size and Backbone.last_max_pooling).
  global_pooling: "flatten"
  # Units of the hidden fully connected layers between the pooled features and the class logits, [] for none.
  fully_connected: [96, 96]
  # Hidden layer normalization before ReLU: "batch", "layer" or "none" (needs a hidden layer unless "none"); HBN or HLN
  # token.
  fully_connected_normalization: "layer"
  # Dropout applied before every fully connected layer, within [0, 1), 0 to disable.
  dropout_rate: 0.2
  # "multi_class" (softmax, one class per image) or "multi_label" (sigmoid, any number of classes per image, read
  # from the 'category_ids' of the manifest samples).
  output_mode: "multi_label"
  # Label smoothing of the classification loss, within [0, 1), 0 to disable.
  label_smoothing: 0.0
  # Weighting of the classes in the loss: "none" (every sample weighs the same) or "balanced" (every class weighs the
  # same, the weights being inversely proportional to the number of training samples of each class).
  class_weighting: "balanced"
  # DeCov loss on one hidden head layer (before ReLU): weighted sum of the squared off-diagonal correlations of its
  # batch-normalized features (floor about units x (units - 1) / (N - 1) above N images); no run name token.
  decorrelation:
    # Adds the decorrelation loss to the classification loss.
    activated: False
    # Weight of the sum of the squared off-diagonal correlations, above 0, e.g. giving the term about a tenth of the
    # classification loss when it is turned on.
    weight: 0.001
    # Hidden layer whose features are decorrelated, counted from 1 in fully_connected, at most its number of layers
    # when activated.
    hidden_layer: 1
  # Classification head of another run initialising this one: fully_connected, its normalization and the input size must
  # match; every source class must be in this run, first in order or by name (rows moved), others staying random.
  pretrained:
    # Run folder whose trained classification head initialises this run, null to start from random weights. A
    # run resuming from its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded classification head fixed (no gradient) so that only the other components learn.
    # Requires an experiment_folder.
    freeze: False
    # Multiplies the learning rate of the loaded classification head, e.g. 0.1 to fine-tune it ten times slower
    # than the new layers.
    learning_rate_multiplier: 1.0
