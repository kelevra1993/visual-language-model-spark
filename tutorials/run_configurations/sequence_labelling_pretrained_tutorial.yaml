# Synthetic changing shapes dataset of October 2026 the run was trained on (frames of 5 to 10 shapes redrawn every
# frame, each frame from the second adding, removing or keeping a shape; the generator of the repository keeps and moves
# the shapes), created by vision_training/data/synthetic/create_synthetic_dataset.py with the task "sequence_labelling".
# Every frame is labelled 'appearing_<class>', 'disappearing_<class>' or 'no_change' (always the first frame), 71
# labels for the 35 shape classes, a change being told by comparing the shape classes with the previous frame.
# Tutorial sequence_labelling run: the settings kept by the sequence labelling experiment plan (run_49, pretrained
# backbone fine-tuned, LSTM-BI, flatten pooling), 2000 iterations, in ~/Data/tutorial_runs; run with vision_training.main.
ExperimentConfiguration:
  # Task trained, selecting the trainer, model and checks. "sequence_labelling" trains the sequence labeller (one class
  # per frame, many to many); needs Data.sequence_settings, TemporalModel and ClassificationHead.
  task: "sequence_labelling"
  # Root of the training runs, each in a subfolder named after its settings (task, input, backbone, maximum sequence
  # length, temporal module, classification head, classes, optimizer and weight decay unless plain Adam): the same
  # settings resume, changed ones start a new folder, this file giving
  # M2M_IN-KAR-256_SE-RES-BN-B1x16.2x16.2x16.4x32.5x32.5x32-PT_T50_LSTM2x96-BI_HFLAT.96.96-HLN-CWB_MC71.
  # The augmentation, batch size, learning rate and its schedule, gradient clipping and dropout rates give no token and
  # can change on resume (format: vision_training/configuration_processing/run_name.py).
  experiment_folder: "/home/robert_kelevra/Data/tutorial_runs/tutorials"
  # Last run name section, e.g. "v1" giving <run name>_v1, to start a new folder for the same settings with another
  # batch size, augmentation or learning rate. Letters, digits, '-' and '.', null for none.
  run_name_suffix: null
  # Training sequences (frames in data/<sequence name>/) and labels.json manifest.
  train_data_folder: "/home/robert_kelevra/Data/sequence_data/synthetic_changing_shapes/train"
  # Validation sequences and labels.json manifest.
  validation_data_folder: "/home/robert_kelevra/Data/sequence_data/synthetic_changing_shapes/validation"
  # Test sequences and labels.json manifest.
  test_data_folder: "/home/robert_kelevra/Data/sequence_data/synthetic_changing_shapes/test_10000"
  # Sequences per forward/backward pass (fed whole, at most Data.sequence_settings.maximum_sequence_length frames); a
  # step runs the backbone on up to batch_size x maximum_sequence_length frames.
  batch_size: 64
  # Metric logging interval, in iterations.
  information_dump: 250
  # Checkpoint and test evaluation interval, in iterations.
  weight_saving_iterations: 500
  # Interval (iterations) of extra checkpoints without test evaluation, below weight_saving_iterations, 0 for none.
  intermediate_weight_saving_iterations: 250
  # Total training iterations.
  number_iterations: 2000
  # Validation interval in iterations: 0 never, 1 every iteration, N every Nth.
  validation_iteration_ratio: 0
  # Test evaluation at every weight_saving_iterations checkpoint on the labelled frames of every test sequence: frame
  # accuracy, balanced accuracy, macro F1, top-k accuracy, per-class precision / recall / F1, sequence exact match
  # (every frame right), confusion matrix and class thresholds saved in <run folder>/Evaluation/Iteration_<iteration>/.
  evaluation:
    # Reports every class: the per-class table (worst F1 first) in the console and Results.txt, per-class scalars in
    # TensorBoard, the frame confusion_matrix.png and the ROC and precision-recall curves of the frames. False keeps the
    # global metrics only (e.g. many classes); class_metrics.csv, class_thresholds.json and confusion_matrix.csv are
    # always saved.
    per_class_report: False
    # Test sequences drawn once and shown at every evaluation: the frame grid, every frame captioned 'true/predicted',
    # wrong ones marked 'X', under the count of right labelled frames (green when all right, red otherwise), saved in
    # Evaluation/Iteration_<n>/Samples/ and TensorBoard. Spread over the majority frame class, then evenly within each
    # class. 0 disables.
    number_sample_images: 8
    # Precision the threshold of every class must reach; the threshold of highest recall at that precision is saved for
    # deployment. Within [0, 1].
    target_precision: 0.99
    # Saves 'predictions.csv' at every evaluation: true and predicted classes and every class probability per test
    # sample (labelled frame in sequence labelling). Grows with samples x classes.
    save_predictions: False
    # Saves every misclassified test sample at every evaluation as
    # 'Evaluation/Iteration_<n>/Errors/<TRUE>-TO-<PREDICTED>/<sample>_<score>.png' (score: predicted class probability),
    # as an image or a sequence or pair frame grid. Multi-class only.
    error_dumps:
      # Saves error images.
      activated: False
      # Most images saved per (true, predicted) class pair.
      maximum_per_class_pair: 20
  # MLflow tracking next to TensorBoard: hyperparameters, metric averages per information_dump, learning rate, test
  # metrics and small artifacts (configuration, confusion matrices, class metrics and thresholds, Results.txt). An
  # MLflow error only prints a warning.
  tracking:
    # Turns MLflow tracking on.
    activated: False
    # MLflow server address (e.g. "http://192.168.1.20:5000"), or null for <experiment_folder>/mlflow.db, browsed with
    # "mlflow ui --backend-store-uri sqlite:///<experiment_folder>/mlflow.db". Credentials come from
    # MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD.
    tracking_uri: null
    # MLflow experiment, null for the task name ("sequence_labelling").
    experiment_name: null
  # Base learning rate.
  learning_rate: 1.0e-3
  # Lets a resumed run train on a changed labels.json (the previous data.json kept as data_until_iteration_<n>.json);
  # False refuses it, a new run (run_name_suffix) being needed. A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Computes the receptive field
      compute_receptive_field: True
      # Shows the network input: Training and Validation windows with the frames of a sequence on a grid, each captioned
      # with its class. SPACE: next sequences, ENTER: exit without training (set False to train). Needs a display; no
      # run folder is created.
      view_input_images: False
      # Times the training step and the inference (PyTorch, TorchScript, ONNX Runtime, TensorRT) on one training batch,
      # at the configured and largest batch sizes that fit, then exits without training; no run folder is created.
      benchmark_speed: False

Optimization:
  # Optimizer: "adam", "adamw" (decoupled weight decay) or "sgd" (Nesterov momentum 0.9), at
  # ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Optimizer weight decay, 0 to disable.
  weight_decay: 0.0
  # After the warm-up: "constant", or "cosine" (to minimum_learning_rate_ratio x learning rate over decay_iterations,
  # then constant).
  learning_rate_schedule: "constant"
  # Linear learning rate warm-up iterations from 0, 0 to disable.
  warmup_iterations: 0
  # Cosine decay iterations after the warm-up (cosine schedule only).
  decay_iterations: 100000
  # Final cosine learning rate, as a fraction of the learning rate (cosine only).
  minimum_learning_rate_ratio: 0.01
  # Exponential moving average (EMA) of the weights, updated after every optimizer step:
  #   ema_weights = decay × ema_weights + (1 − decay) × current_weights
  # It averages about the last 1 / (1 − decay) iterations (0.999: 1,000). Every test evaluation also scores it
  # (Evaluation/Iteration_<n>/EMA/, Test_EMA curves). Saved in the checkpoints, no run name token, can change on resume;
  # 'pretrained' transfers load the averaged weights when present.
  exponential_moving_average:
    # Turns the weight moving average on.
    activated: True
    # Share of the average kept per update, strictly between 0 and 1.
    decay: 0.9998

Data:
  image_settings:
    # Input resolution of every frame.
    size: 256
    # Keeps the original aspect ratio when resizing.
    keep_ratio: True
  sequence_settings:
    # Most frames of a sequence; sequences are fed whole, padded with black frames to the longest of the batch (masked
    # out). A longer one is left out of its split with a red warning at startup. Also the size of the transformer
    # positional embedding.
    maximum_sequence_length: 50
  label_mapping:
    # Must be "multi_class" (sequence tasks): the mapping file gives the class index, 0 to K-1 (no background), of every
    # labels.json category.
    mode: "multi_class"
    # JSON file mapping the dataset category IDs to sequential class IDs.
    mapping_file_path: "/home/robert_kelevra/Data/sequence_data/synthetic_changing_shapes/label_mapping.json"
  data_augmentation:
    # Global switch of the data augmentation (on the GPU, training batches only).
    activated: True
    # Probability that a training sequence is augmented; every activated type is then applied with its own probability,
    # shared by all its frames.
    probability: 0.4
    # Sequence tasks only: draws the photometric types frame by frame (own brightness, noise, colour...), the geometric
    # ones staying shared, as a crop or rotation per frame makes objects jump.
    independent_frames: False
    # Sequence tasks only: shuffles the real frames of a training sequence with this probability (independent of the one
    # above), padding staying last, each pair member shuffled on its own. For sequences whose order carries no
    # information (photo sets).
    shuffle_frames: { activated: False, probability: 0.5 }
    types:
      # Geometric augmentations : they do not change the class of a shape.
      # Random Crop : 75% to 100% of each side (same ratio), resized back
      random_crop: { activated: False, probability: 0.3 }
      # Random Aspect Crop : 75% to 100% of the width and, separately, of the height, resized back (x0.75 to x1.33
      # stretch; other camera proportions, for keep_ratio False)
      random_aspect_crop: { activated: False, probability: 0.3 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side on a black canvas, objects appearing smaller
      random_zoom_out: { activated: False, probability: 0.3 }
      # Random Translation : shift of up to 25% along x, y or both, border filled black
      random_translation: { activated: False, probability: 0.5 }
      # Random Left-Right Flip
      random_left_right_flip: { activated: True, probability: 0.5 }
      # Random Up-Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation of -5° to 5°
      random_rotation: { activated: False, probability: 0.3 }
      # Random +-90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.3 }
      # Random Perspective : corners moved inwards by up to 5% of half the width and height, border filled black;
      # refused for tasks with boxes, masks or keypoints
      random_perspective: { activated: False, probability: 0.3 }
      # Random Jigsaw : 2x2 pieces shuffled, breaking the global layout; refused for tasks with boxes, masks or
      # keypoints
      random_jigsaw: { activated: False, probability: 0.3 }

      # Photometric augmentations.
      # Brightness (+-40 levels), contrast and saturation (x0.7 to x1.0)
      brightness_contrast_saturation: { activated: True, probability: 0.3 }
      # Random Hue : hue turned by up to 18 degrees (5% of the circle) either way
      random_hue: { activated: False, probability: 0.5 }
      # CLAHE, clip limit 2.0 on a 4x4 tile grid
      clahe_augment: { activated: True, probability: 0.3 }
      # Laplacian of Gaussian unsharp mask sharpening (sigma 1.5, strength 3)
      sharp_augment: { activated: True, probability: 0.3 }
      # Histogram equalization of the luminance (Y of YUV)
      equalize_histogram_augment: { activated: True, probability: 0.3 }
      # Histogram equalization of one random channel (B, G or R) or all three
      equalize_bgr_histogram_augment: { activated: True, probability: 0.3 }
      # Random Noise : Gaussian noise, standard deviation 20 levels
      random_noise: { activated: True, probability: 0.3 }
      # Grayscale, kept on three channels
      gray_scale_augment: { activated: True, probability: 0.3 }
      # Random Colour augmentation : BGR to RGB channel swap
      random_colour_augmentation: { activated: True, probability: 0.3 }
      # Random Gamma : gamma 0.8 to 1.25, darkening or lightening the mid-tones
      random_gamma: { activated: False, probability: 0.3 }
      # Random Linear Illumination : 13 to 38 level ramp across the image, brightening or darkening one side
      random_linear_illumination: { activated: False, probability: 0.3 }
      # Random Plasma Shadow : irregular fractal shadows darkening by up to 77 levels
      random_plasma_shadow: { activated: False, probability: 0.3 }
      # Random Blur : 9x9 Gaussian kernel, sigma 2.5
      random_blur: { activated: False, probability: 0.3 }
      # Random Motion Blurring : 5 to 15 pixel streak at 0 to 180 degrees (camera or object motion)
      random_motion_blur: { activated: False, probability: 0.3 }
      # Random Haze : uniform grey airlight of 180 to 255 levels taking 20% to 60% of every pixel, a camera fog (after
      # the blurs, before solarization, black-out and erasing)
      # Kept off in the hyperparameter experiment, whose launches up to run_10 predate the haze
      random_haze: { activated: False, probability: 0.3 }
      # Random Solarize : pixels at or above 128 levels inverted
      random_solarize: { activated: False, probability: 0.2 }
      # Random Black Out : grid_size x grid_size cells, each blacked out with probability 0.2 (after the other
      # photometric types but the erasing); labels unchanged, so a hidden object keeps its label
      random_black_out: { activated: False, probability: 0.3, grid_size: 8 }
      # Random Erasing : one black rectangle of 2% to 15% of the image, height / width 0.3 to 3.3, applied last; labels
      # unchanged
      random_erasing: { activated: False, probability: 0.3 }

Backbone:
  # Input channels of the first convolution block: 3, the loaders giving BGR images
  input_channels : 3

  # [convolutions, output filters] of every block.
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 16 ],
      "3": [ 2, 16 ],
      "4": [ 4, 32 ],
      "5": [ 5, 32 ],
      "6": [ 5, 32 ],
    }

  # Max pooling after the last block.
  last_max_pooling: False

  normalization:
    # Scales the inputs to [-0.5, 0.5].
    input_normalization: True

    # Normalizes every image to zero mean and unit variance (after input_normalization).
    per_sample_normalization: False

    # Feature map normalization: "batch", "layer" (over channels), "none" or "sequence" (statistics of each sequence, in
    # training and inference).
    feature_map_normalization: "batch"

  modules:
    # Residual shortcuts (https://arxiv.org/abs/1512.03385) around pairs of layers from block 2; a block
    # changing the channel count pairs its layers from the second one, so with 2 layers it gets none.
    residual_nets: True

    # Pre-activation shortcuts (https://arxiv.org/abs/1603.05027): normalization and ReLU before every convolution.
    # Requires residual_nets; RES2 token instead of RES.
    residual_nets_v2: False

    # Inception modules (https://arxiv.org/abs/1409.4842), output channels multiples of 8.
    inception: False

    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True

  # Backbone of another run (any task) initialising this one: input_channels, convolutions, modules, normalization and
  # last_max_pooling match, or one backbone has more blocks (extras random); detection levels, image size may differ.
  pretrained:
    # Run folder of the loaded backbone, null for random weights (not reloaded on resume).
    experiment_folder: "/home/robert_kelevra/Data/tutorial_runs/pretrained/SE-RES-BN-B1x16.2x16.2x16.4x32.5x32.5x32"
    # Checkpoint iteration, null for the last one.
    iteration: 10000
    # Freezes the loaded backbone (no gradient, frozen batch statistics); needs experiment_folder.
    freeze: False
    # Freezes the scale and shift of the loaded backbone normalizations while its convolutions learn; needs
    # experiment_folder, freeze False and a normalization.
    freeze_normalization_parameters: False
    # Learning rate factor of the loaded backbone, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

TemporalModel:
  # Module relating every frame to the frames it may see, one vector per frame: "gru", "lstm", "transformer" or
  # "temporal_convolution".
  type: "lstm"
  # Recurrent state size (GRU, LSTM), model size (transformer, a multiple of number_heads) or channels (temporal
  # convolution).
  hidden_size: 96
  # Stacked layers (GRU, LSTM, transformer, temporal convolution).
  number_layers: 2
  # Attention heads per transformer layer.
  number_heads: 4
  # Odd frame span of a temporal convolution kernel, its dilation doubling every layer.
  kernel_size: 3
  # Dropout between stacked layers (GRU, LSTM), in attention and feed forward layers (transformer) or after every
  # convolution (temporal convolution), within [0, 1).
  dropout_rate: 0.0
  # Reads the sequence both ways (GRU, LSTM), every frame also seeing the later frames (offline use). False when causal.
  bidirectional: True
  # Every frame only sees the earlier frames (transformer, temporal convolution), for online use without future frames;
  # GRU and LSTM are causal unless bidirectional.
  causal: False
  # Learned position embedding added to every frame vector (transformer), so that the transformer uses the frame order.
  # False treats a sequence as a set (e.g. photos in any order): shuffling the frames only shuffles the outputs with
  # them, and the transformer weights no longer depend on Data.sequence_settings.maximum_sequence_length. A causal
  # transformer still sees the order through its attention mask.
  positional_embedding: True
  # Temporal module of another sequence task run initialising this one. Its type, the settings defining its weights
  # (hidden_size; number_layers and bidirectional for GRU and LSTM; number_layers, number_heads and positional_embedding
  # for the transformer; number_layers and kernel_size for the temporal convolution), the channels of the last backbone
  # block, the global pooling and image size when flattening and, for a transformer with positional embedding,
  # Data.sequence_settings.maximum_sequence_length must match. Weightless poolings (mean_pooling, max_pooling) transfer
  # nothing.
  pretrained:
    # Run folder of the loaded temporal module, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded temporal module (no gradient). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded temporal module, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

ClassificationHead:
  # Frame feature map reduction: "average", "max" or "flatten" (C x H x W values, keeping positions).
  global_pooling: "flatten"
  # Hidden layer units between every frame vector and its logits, [] for none.
  fully_connected: [96, 96]
  # Hidden layer normalization before ReLU: "batch", "layer" or "none" (needs a hidden layer unless "none"); HBN or HLN
  # token.
  fully_connected_normalization: "layer"
  # Dropout before every fully connected layer, in [0, 1).
  dropout_rate: 0.2
  # "multi_class" only (sequence tasks): one class per frame.
  output_mode: "multi_class"
  # Label smoothing, in [0, 1), 0 to disable.
  label_smoothing: 0.0
  # Loss class weights: "none" or "balanced" (inverse to the labelled training frames of each class).
  class_weighting: "balanced"
  # Classification head of another run initialising this one: fully_connected, its normalization and the input size must
  # match; every source class must be in this run, first in order or by name (rows moved), others staying random.
  pretrained:
    # Run folder of the loaded head, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded head (no gradient). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded head, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0
