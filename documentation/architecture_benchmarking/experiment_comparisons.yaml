# Comparisons of the hyperparameter experiments, one entry per stage of the experiment plans next to this file, read by
# scripts/evaluation/plot_experiment_comparisons.py to draw the figures of figures/<experiment>/.
# Each entry gives the results file of the stage, the iteration and weights the plan compares, the settings compared
# (arms, their launches as written in the results file, the reference being the setting kept so far) and the verdict.
# An arm trained without a moving average sets trained_as_averaged, its trained weights then standing in the column
# of the averaged weights; plan_lines run from the heading of the stage to the last line of its section.
# After every new stage, add its entry here, copy its results file next to the plans and draw its figure again.
comparisons:
  # Classification: experiment_plan.md and results.csv, accuracy_<iteration> columns.
  - experiment: classification
    results_file: results.csv
    stage: "1"
    title: Learning Rate
    plan_lines: "41-65"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "1e-4", launches: [run_1, run_2], reference: true, trained_as_averaged: false}
      - {label: "2e-4", launches: [run_3, run_4], reference: false, trained_as_averaged: false}
      - {label: "5e-4", launches: [run_9, run_10], reference: false, trained_as_averaged: false}
      - {label: "1e-3", launches: [run_5, run_6], reference: false, trained_as_averaged: false}
      - {label: "2e-3", launches: [run_7, run_8], reference: false, trained_as_averaged: false}
    kept: "2e-4"
    verdict: "2e-4 kept: the highest mean of the eight evaluations, 85.81 % against 84.86 % for 1e-4 (31.42 % for 5e-4, 30.30 % for 2e-3, 13.65 % for 1e-3), though 1e-4 ends higher over iterations 1250 to 2000 (98.02 % against 96.94 %)."
    notes: "Rows of run_1 to run_32 have an empty evaluated_weights (trained weights, recorded before the column existed). The launch numbers do not follow the plan order: 5e-4 is run_9 and run_10, 1e-3 run_5 and run_6, 2e-3 run_7 and run_8 (learning_rate column checked)."

  - experiment: classification
    results_file: results.csv
    stage: "2"
    title: Fully Connected Normalization
    plan_lines: "67-87"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "none", launches: [run_3, run_4], reference: true, trained_as_averaged: false}
      - {label: "batch", launches: [run_11, run_12], reference: false, trained_as_averaged: false}
      - {label: "layer", launches: [run_13, run_14], reference: false, trained_as_averaged: false}
    kept: "layer"
    verdict: "layer kept: the highest mean, 89.69 % against 85.81 % for none and 76.14 % for batch, and the highest mean of the last four evaluations, 97.93 % against 97.91 % for batch and 96.94 % for none."
    notes: "Reference none is run_3 and run_4 of stage 1. Rows have an empty evaluated_weights (trained weights)."

  - experiment: classification
    results_file: results.csv
    stage: "3"
    title: Backbone Batch Normalization Momentum
    plan_lines: "89-105"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "0.1", launches: [run_13, run_14], reference: true, trained_as_averaged: false}
      - {label: "0.01", launches: [run_15, run_16], reference: false, trained_as_averaged: false}
    kept: "0.1"
    verdict: "0.1 kept: the highest mean, 89.69 % against 78.20 % for 0.01, and the highest mean of the last four evaluations, 97.93 % against 93.53 %, the running statistics of 0.01 lagging behind the weights."
    notes: "Only backbone_batch_normalization_momentum changes (head_batch_normalization_momentum stays 0.1). Reference is run_13 and run_14 of stage 2. Rows have an empty evaluated_weights (trained weights)."

  - experiment: classification
    results_file: results.csv
    stage: "4"
    title: Feature Map Normalization
    plan_lines: "107-124"
    last_iteration: 500
    compared_weights: trained
    arms:
      - {label: "batch", launches: [run_13, run_14], reference: true, trained_as_averaged: false}
      - {label: "layer", launches: [run_17, run_18], reference: false, trained_as_averaged: false}
    kept: "batch"
    verdict: "batch kept, layer stopped by hand at iteration 500: both layer launches stay at the single-class accuracy (11.06 % and 11.00 % at iterations 250 and 500, against 53.46 % and 80.83 % for batch), training about three times slower (28 to 31 against 93 Images Per Second)."
    notes: "run_17 and run_18 stop at iteration 500: finished False, accuracy_750 to accuracy_2000 and accuracy_last_4_mean empty; the reference pair has every evaluation to 2000. Rows have an empty evaluated_weights (trained weights)."

  - experiment: classification
    results_file: results.csv
    stage: "5"
    title: Global Pooling
    plan_lines: "126-143"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "flatten", launches: [run_13, run_14], reference: true, trained_as_averaged: false}
      - {label: "average", launches: [run_19, run_20], reference: false, trained_as_averaged: false}
    kept: "flatten"
    verdict: "flatten kept: average reaches a mean of 88.59 % against 89.69 % and a mean of the last four evaluations of 97.50 % against 97.93 %, its two launches further apart (84.25 % and 92.93 %) than the two settings."
    notes: "Rows have an empty evaluated_weights (trained weights)."

  - experiment: classification
    results_file: results.csv
    stage: "6"
    title: Residual Connections
    plan_lines: "145-161"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "True", launches: [run_13, run_14], reference: true, trained_as_averaged: false}
      - {label: "False", launches: [run_21, run_22], reference: false, trained_as_averaged: false}
    kept: "True"
    verdict: "True kept: False does not learn, both launches staying at the single-class accuracy of about 11 % at every evaluation up to iteration 2000 (mean 11.22 % against 89.69 %)."
    notes: "Rows have an empty evaluated_weights (trained weights)."

  - experiment: classification
    results_file: results.csv
    stage: "7"
    title: Squeeze And Excitation
    plan_lines: "163-179"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "True", launches: [run_13, run_14], reference: true, trained_as_averaged: false}
      - {label: "False", launches: [run_23, run_24], reference: false, trained_as_averaged: false}
    kept: "False"
    verdict: "False kept: mean 90.05 % against 89.69 % for True and mean of the last four evaluations 98.47 % against 97.93 %, training faster and lighter (1 hour 49 minutes per pair against 2 hours 19 to 2 hours 25 minutes, 20.4 against 33.4 gigabytes per launch)."
    notes: "Rows have an empty evaluated_weights (trained weights). The repeat stage (lines 239-263) later finds the two settings level over six launches each."

  - experiment: classification
    results_file: results.csv
    stage: "8"
    title: Data Type
    plan_lines: "181-197"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "float32 (mixed_precision: True)", launches: [run_23, run_24], reference: true, trained_as_averaged: false}
      - {label: "float32 (mixed_precision: False)", launches: [run_25, run_26], reference: false, trained_as_averaged: false}
    kept: "float32 (mixed_precision: True)"
    verdict: "float32 (mixed_precision: True) kept, chosen by the user whatever the results for its speed (about 1.8 times faster): without mixed precision the mean is 87.87 % against 90.05 % and the mean of the last four evaluations 98.31 % against 98.47 %."
    notes: "The CSV tells the arms apart by mixed_precision, dtype being float32 for both. float64 was removed from the stage (run_27 measured over 10 iterations only): results.csv has no run_27 or run_28 row. Rows have an empty evaluated_weights (trained weights)."

  - experiment: classification
    results_file: results.csv
    stage: "9"
    title: Class Weighting
    plan_lines: "199-216"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "balanced", launches: [run_23, run_24], reference: true, trained_as_averaged: false}
      - {label: "none", launches: [run_29, run_30], reference: false, trained_as_averaged: false}
    kept: "balanced"
    verdict: "balanced kept: none reaches a mean of 88.14 % against 90.05 % and a mean of the last four evaluations of 97.51 % against 98.47 %, the gap between the two settings being the gap between launches (classes almost balanced)."
    notes: "The bullet of line 214 gives 0.8815 for the mean of none, its table row (line 210) 0.8814, results.csv 0.881417. Rows have an empty evaluated_weights (trained weights)."

  - experiment: classification
    results_file: results.csv
    stage: "10"
    title: Dropout
    plan_lines: "218-237"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "0.2", launches: [run_23, run_24], reference: true, trained_as_averaged: false}
      - {label: "0.0", launches: [run_31, run_32], reference: false, trained_as_averaged: false}
    kept: "0.2"
    verdict: "0.2 kept: 0.0 reaches a mean of 90.01 % against 90.05 % (90.0061 % against 90.0480 %) and a mean of the last four evaluations of 98.12 % against 98.47 %, a gap far smaller than the one between the two launches of 0.0 (88.36 % and 91.65 %)."
    notes: "Rows have an empty evaluated_weights (trained weights). Line 237 closes the ten stages with the settings they kept."

  - experiment: classification
    results_file: results.csv
    stage: "repeat"
    title: Squeeze And Excitation
    plan_lines: "239-263"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "False", launches: [run_23, run_24, run_23b, run_23c, run_24b, run_24c], reference: true, trained_as_averaged: false}
      - {label: "True", launches: [run_13, run_14, run_13b, run_13c, run_14b, run_14c], reference: false, trained_as_averaged: false}
    kept: "False"
    verdict: "No Kept line, False (kept by stage 7) stays: over six launches each, off and on are level, mean 89.29 % against 89.08 % (a difference of 0.21 points for a standard error of 1.11 points), mean of the last four evaluations 98.44 % against 97.76 % (not significant)."
    notes: "The plan gives no verdict for this stage; kept is False because the next stages stay copies of run-23.yaml and run-24.yaml (line 267). Each arm holds the two launches of stage 7 (False) or stage 2 (True) and their four repeats. Rows have an empty evaluated_weights (trained weights)."

  - experiment: classification
    results_file: results.csv
    stage: "11"
    title: Pre-Activation Residual Shortcuts
    plan_lines: "269-283"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "False", launches: [run_23, run_24], reference: true, trained_as_averaged: false}
      - {label: "True", launches: [run_33, run_34], reference: false, trained_as_averaged: false}
    kept: "False"
    verdict: "False kept: the pre-activation mean (89.25 %) is 0.80 points under the reference pair (90.05 %) and level with the mean of the 6 repeat launches (89.29 %), well inside the noise between two-launch means (about 3.6 points); its curves drop more often and a launch takes 28.1 GB instead of 20.4 GB."
    notes: "run_23 and run_24 rows have an empty evaluated_weights and an empty residual_nets_v2 (setting added later, False by the plan); run_33 and run_34 rows are trained (no moving average). The plan table also gives the mean of the 6 repeat launches (run_23, run_23b, run_23c, run_24, run_24b, run_24c) as a second reference row. The reference is set in the New Settings Stages introduction (line 267), whose launches shared the GPU with an ImageNet training."

  - experiment: classification
    results_file: results.csv
    stage: "12"
    title: Weight Initialisation
    plan_lines: "285-298"
    last_iteration: 2000
    compared_weights: trained
    arms:
      - {label: "default", launches: [run_23, run_24], reference: true, trained_as_averaged: false}
      - {label: "he", launches: [run_35, run_36], reference: false, trained_as_averaged: false}
    kept: "default"
    verdict: "default kept: the He mean (82.08 %) is 7.97 points under the reference pair (90.05 %) and 7.21 points under the mean of the 6 repeat launches, twice the noise (about 3.6 points); run_35 drops to 62.48 % at iteration 1000 and the final accuracy (97.95 %) stays under the reference (99.04 %)."
    notes: "results.csv has no weight_initialization column (the setting was removed from the code with run-35.yaml and run-36.yaml): run_35 and run_36 carry the setting columns of the reference and are told apart by launch name only. run_23 and run_24 rows have an empty evaluated_weights, run_35 and run_36 rows are trained."

  - experiment: classification
    results_file: results.csv
    stage: "13"
    title: Moving Average Of The Weights
    plan_lines: "300-318"
    last_iteration: 2000
    compared_weights: ema
    arms:
      - {label: "False", launches: [run_23, run_24], reference: true, trained_as_averaged: true}
      - {label: "True", launches: [run_37, run_38], reference: false, trained_as_averaged: false}
    kept: "True"
    verdict: "True kept: the averaged weights are ahead of the trained weights at all 16 evaluations of the two launches, mean 92.42 % against 89.24 % (90.05 % for the reference pair without average) and 99.63 % against 99.07 % at iteration 2000."
    notes: "The weights differ by arm: run_23 and run_24 have no ema row (moving average off, evaluated_weights empty), so the reference is their trained weights, while run_37 and run_38 are read from their ema rows. The plan also shows the trained weights of run_37 and run_38 (trained (EMA on), mean 89.24 %), held in their trained rows. Plan typo at line 314: the EMA row of run_37 names its launch 'run_37, source'; its values are those of the run_37 ema row."

  - experiment: classification
    results_file: results.csv
    stage: "14"
    title: Adding Classes
    plan_lines: "324-375"
    last_iteration: 2000
    compared_weights: ema
    arms:
      - {label: "random", launches: [run_39, run_40], reference: true, trained_as_averaged: false}
      - {label: "run_37, source", launches: [run_41, run_42], reference: false, trained_as_averaged: false}
      - {label: "run_37, random", launches: [run_43, run_44], reference: false, trained_as_averaged: false}
    kept: "run_37, random"
    verdict: "run_37 head with random new classes kept: on the 20 classes it matches the random head (mean 97.90 % against 98.07 % with the averaged weights, 95.28 % against 94.35 % with the trained ones) and beats the source initialisation at every evaluation (89.02 % averaged, 86.17 % trained), whose 11 new classes start far slower (38.90 % against 83.75 % at iteration 250, averaged weights)."
    notes: "Accuracy over 20 classes (synthetic_shapes_20 in train_data_folder), not comparable with the earlier stages. The plan compares both weights; the trained rows are in results.csv as well. The CSV tells the arms apart by pretrained_classification_head (empty for random) and new_class_initialisation (source, random; a setting removed since). The tables of the 9 classes of run_37 and of the 11 new classes come from the class_metrics.csv of every evaluation and cannot be drawn from results.csv."

  # Sequence labelling: sequence_labelling_experiment_plan.md and sequence_labelling_results.csv, macro_f1_<iteration> columns.
  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "1"
    title: Learning Rate
    plan_lines: "71-92"
    last_iteration: 2000
    compared_weights: ema
    arms:
      - {label: "1e-4", launches: [run_3, run_4], reference: false, trained_as_averaged: false}
      - {label: "2e-4", launches: [run_5, run_6], reference: false, trained_as_averaged: false}
      - {label: "1e-3", launches: [run_1, run_2], reference: true, trained_as_averaged: false}
      - {label: "2e-3", launches: [run_7, run_8], reference: false, trained_as_averaged: false}
    kept: "1e-3"
    verdict: "1e-3 kept: the highest mean of the eight evaluations, 1.36 % against 1.17 % for 2e-3, 1.12 % for 2e-4 and 0.86 % for 1e-4 (2.44 % at iteration 2000 against 1.81 % for 2e-3)."
    notes: "Stages 1 to 3 score the mean over all evaluations of the averaged weights (Strategy, line 13)."

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "2"
    title: Class Weighting
    plan_lines: "94-110"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "balanced", launches: [run_9, run_10], reference: true, trained_as_averaged: false}
      - {label: "none", launches: [run_11, run_12], reference: false, trained_as_averaged: false}
    kept: "balanced"
    verdict: "balanced kept: the highest mean of the 24 evaluations, 6.45 % against 1.39 % for none (12.07 % against 2.33 % at iteration 6000), run_12 staying at 0.90 % throughout."
    notes: "run_9 and run_10 train the stage 1 settings again for 6000 iterations (run_1 and run_2 trained 2000 only, line 9); they share every setting column with run_1 and run_2, which results.csv groups under one mean row, so they are told apart by launch name only."

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "3"
    title: Direction
    plan_lines: "112-128"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "unidirectional", launches: [run_9, run_10], reference: true, trained_as_averaged: false}
      - {label: "bidirectional", launches: [run_13, run_14], reference: false, trained_as_averaged: false}
    kept: "bidirectional"
    verdict: "bidirectional kept: the highest mean of the 24 evaluations, 6.59 % against 6.45 % for unidirectional, within the spread of the launches, but far higher at iteration 6000 (19.36 % against 12.07 %)."
    notes: "The plan table labels the reference 'uni'. The CSV tells the arms apart by bidirectional and causal (False and True for unidirectional, True and False for bidirectional)."

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "4"
    title: Temporal Module
    plan_lines: "130-153"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "lstm", launches: [run_13, run_14], reference: true, trained_as_averaged: false}
      - {label: "gru", launches: [run_15, run_16], reference: false, trained_as_averaged: false}
      - {label: "transformer", launches: [run_17, run_18], reference: false, trained_as_averaged: false}
      - {label: "temporal_convolution", launches: [run_19, run_20], reference: false, trained_as_averaged: false}
    kept: "lstm"
    verdict: "lstm kept: the highest value at iteration 6000, 19.36 % against 15.12 % for the GRU, 13.53 % for the transformer and 10.55 % for the temporal convolution (the mean over all evaluations would have kept the temporal convolution, 7.61 %)."
    notes: "From this stage on the score is the value at the last iteration (user decision of 2026-10-30, line 13). The transformer and temporal_convolution rows have bidirectional False and causal False, their non-causal form being the bidirectional direction (line 65)."

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "5"
    title: Temporal Layers
    plan_lines: "155-171"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "1", launches: [run_13, run_14], reference: true, trained_as_averaged: false}
      - {label: "2", launches: [run_21, run_22], reference: false, trained_as_averaged: false}
    kept: "1"
    verdict: "1 layer kept: 19.36 % at iteration 6000 against 8.91 % for 2 layers, the second layer slowing the start and levelling off from iteration 5500."
    notes: ""

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "6"
    title: Frame Pooling
    plan_lines: "173-192"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "flatten", launches: [run_13, run_14], reference: true, trained_as_averaged: false}
      - {label: "average", launches: [run_23, run_24], reference: false, trained_as_averaged: false}
      - {label: "max", launches: [run_25, run_26], reference: false, trained_as_averaged: false}
    kept: "max"
    verdict: "max kept: 21.47 % at iteration 6000 against 19.36 % for flatten and 11.32 % for average, also the highest mean over the evaluations (10.74 % against 6.59 % and 4.71 %); average loses on run_24, held at about 0.7 % for all 6000 iterations."
    notes: ""

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "7"
    title: Feature Map Normalization
    plan_lines: "194-210"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "batch", launches: [run_25, run_26], reference: true, trained_as_averaged: false}
      - {label: "sequence", launches: [run_27, run_28], reference: false, trained_as_averaged: false}
    kept: "batch"
    verdict: "batch kept: 21.47 % at iteration 6000 against 19.01 % for sequence, also the highest mean over the evaluations (10.74 % against 9.09 %); a sequence pair takes 7 hours 20 minutes against about 3 hours 25 minutes."
    notes: ""

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "8"
    title: Pretraining
    plan_lines: "212-234"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "none", launches: [run_25, run_26], reference: true, trained_as_averaged: false}
      - {label: "fine_tuned", launches: [run_29, run_30], reference: false, trained_as_averaged: false}
      - {label: "fine_tuned_slow", launches: [run_31, run_32], reference: false, trained_as_averaged: false}
    kept: "fine_tuned"
    verdict: "fine_tuned kept: 74.67 % at iteration 6000 against 64.40 % for fine_tuned_slow and 21.47 % from scratch, also the highest mean over the evaluations (62.66 % against 53.88 % and 10.74 %)."
    notes: "The CSV tells the arms apart by pretrained_backbone (empty for none) and backbone_learning_rate_multiplier (1.0 for fine_tuned, 0.1 for fine_tuned_slow). The per-label F1 of run_30 (98.15 % for the 50 labels of the 25 learned shapes, 15.64 % for the 20 others, line 234) cannot be drawn from the CSV."

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "9"
    title: Learning Rate, Pretrained
    plan_lines: "236-258"
    last_iteration: 4000
    compared_weights: ema
    arms:
      - {label: "1e-3", launches: [run_29, run_30], reference: true, trained_as_averaged: false}
      - {label: "2e-3", launches: [run_37, run_38], reference: false, trained_as_averaged: false}
      - {label: "2e-4", launches: [run_35, run_36], reference: false, trained_as_averaged: false}
      - {label: "1e-4", launches: [run_33, run_34], reference: false, trained_as_averaged: false}
    kept: "1e-3"
    verdict: "1e-3 kept: 71.49 % at iteration 4000 against 65.88 % for 2e-3, 51.80 % for 2e-4 and 33.27 % for 1e-4, also the highest mean over the 16 evaluations."
    notes: "run_29 and run_30 (stage 8) trained 6000 iterations under the constant learning rate and are read at 4000; the new launches stop at 4000. The plan's Mean column is taken over the 16 evaluations 250 to 4000, not the macro_f1_mean of the CSV (24 evaluations for run_29 and run_30)."

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "10"
    title: Class Weighting, Pretrained
    plan_lines: "260-275"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "balanced", launches: [run_29, run_30], reference: true, trained_as_averaged: false}
      - {label: "none", launches: [run_39, run_40], reference: false, trained_as_averaged: false}
    kept: "balanced"
    verdict: "balanced kept: 74.67 % at iteration 6000 against 40.94 % for none, also the highest mean over the evaluations (62.66 % against 27.91 %), the two none launches spreading apart (55.50 % and 26.38 %)."
    notes: "Reference is run_29 and run_30 of stage 8."

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "11"
    title: Temporal Module, Pretrained
    plan_lines: "277-296"
    last_iteration: 6000
    compared_weights: ema
    arms:
      - {label: "lstm", launches: [run_29, run_30], reference: true, trained_as_averaged: false}
      - {label: "gru", launches: [run_43, run_44], reference: false, trained_as_averaged: false}
      - {label: "transformer", launches: [run_45, run_46], reference: false, trained_as_averaged: false}
    kept: "lstm"
    verdict: "lstm kept: 74.67 % at iteration 6000 against 74.34 % for gru and 74.25 % for transformer, the three within 0.5 points, less than the gap between two launches; the transformer has the highest mean over the evaluations (66.37 % against 62.66 %)."
    notes: "Reference is run_29 and run_30 of stage 8. The transformer rows have bidirectional False and causal False, the non-causal transformer being the bidirectional form (line 65). run_41 and run_42, a pretrained direction stage stopped after 250 iterations and deleted (line 63), are not in the CSV."

  - experiment: sequence_labelling
    results_file: sequence_labelling_results.csv
    stage: "12"
    title: Temporal Layers, Pretrained
    plan_lines: "298-313"
    last_iteration: 6000
    compared_weights: ema
