# Triton Inference Server serving the exported detectors of the model repository.
# The repository is filled by deployment/export_model.py (one folder per model, holding its config.pbtxt and a
# version folder "1" with the exported model file):
#   served_models/object_detector_torchscript/1/model.pt    (TorchScript, PyTorch libtorch backend)
#   served_models/object_detector_onnx/1/model.onnx         (ONNX, ONNX Runtime backend accelerated by TensorRT)
# Start it from this folder with "docker compose up", keep it running, and query it with deployment/run_inference.py.
# Explicit project name, so that this server never collides with another compose project in a folder also
# named "triton" (compose derives the default project name from the folder name)
name: object-detection-triton
services:
  tritonserver:
    container_name: object-detection-triton-server
    # Triton 2.65 (arm64 build for the DGX Spark), with the pytorch, onnxruntime and tensorrt backends
    image: nvcr.io/nvidia/tritonserver:26.01-py3
    # Expose the GPU of the machine to the container
    runtime: nvidia
    ports:
      # HTTP endpoint (health checks: curl localhost:8000/v2/health/ready)
      - "8000:8000"
      # gRPC endpoint used by the inference client
      - "8001:8001"
      # Prometheus metrics endpoint
      - "8002:8002"
    volumes:
      # Local model repository : path inside the container
      - "./served_models:/served_models"
    # Large shared memory for the batched image tensors exchanged between Triton and its backends
    shm_size: "2g"
    command: tritonserver --model-repository=/served_models
