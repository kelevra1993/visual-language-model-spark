ExperimentConfiguration:
  # Directory where experiment artifacts, weights, and logs are saved.
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments/poseidon_experiment"
  # Root directory containing the dataset images.
  data_folder: ""
  # JSON file containing the training dataset split.
  train_split_file: ""
  # JSON file containing the validation dataset split.
  validation_split_file: ""
  # JSON file containing the test dataset split.
  test_split_file: ""
  # Number of images processed in a single forward/backward pass.
  batch_size: 8
  # Frequency (in iterations) to log performance metrics.
  information_dump: 5000
  # Frequency (in iterations) to checkpoint the model weights.
  weight_saving_iterations: 20000
  # Total number of training iterations before stopping.
  number_iterations: 1e10
  # Flag to determine whether validation metrics are computed during training.
  compute_validation_iteration: false
  # Base learning rate used by the optimizer.
  learning_rate: 2.0e-4
  # Global tensor data type (e.g., "float32" or "float16").
  dtype: "float32"
  # Flag to attempt loading the most recent checkpoint to resume training.
  resume_training: true
  precompute_data: true # Potentially usage of TFRecords
  diagnosis_modes:
      # Choice to print out everything about the model
      verbose: True
      # Choice to compute Receptive-Field
      compute_receptive_field: False
      # Choice to compute final model size
      compute_model_size: False
      # Choice to view what is being fed to the neural network
      view_input_images: False

Data:
  image_settings:
    # Target resolution to resize all input images.
    size: 1024
    # Flag to maintain the original aspect ratio when resizing.
    keep_ratio: True
  label_dictionary: # Always start with background as 0.
    background: 0
    foreground: 1
  data_augmentation:
    # Global switch to enable or disable all data augmentation.
    activated: False
    types:
      # Implementation of random flipping, horizontally, vertically ....
      # Random Flip (Up to Down)
      random_hflip: False
      # Random Flip (Left to Right)
      random_vflip: False
      # Random Crop of image : 90% of image kept
      random_crop: False
      # Random Noise : Adding Truncated Gaussian Noise
      random_noise: False
      # Color-Space Augmentation, 30% of images are converted to grayscale
      gray_scale_augment: False
      # Random Color augmentation : 30% of images in RGB
      random_colour_augmentation: False
      # Random Image Blurring augmentation : 30% of images are blurred
      random_blur: False
      # Random Rotation : Randomly rotate images between -5° and 5° : Applied on 30% of images
      random_rotation: False
      # Random -90° or 90° rotation  : Randomly rotate images with -90° or 90° degrees : Applied on 30% of images
      random_90_rotation: False
      # Histogram Equalization applied on 30% of sequences
      equalize_histogram_augment: False
      # BGR Histogram Equalization: Applied on 30% of sequences
      equalize_bgr_histogram_augment: False
      # Image Sharpening with Laplacian of Gaussian filter: Applied on 30% of sequences
      sharp_augment: False
      # Contrast-limited Adaptive Histogram Equalization (CLAHE): Applied on 30% of sequences
      clahe_augment: False

Backbone:
  # Number of input channels for the initial convolution block (e.g., 3 for RGB images)
  input_channels : 3

  # First axis : Number of convolution Kernel maps per Convolution Block
  # Second axis : Number of output filters per kernel per convolution Block
  convolutions:
    {
      "1": [ 1, 64 ],
      "2": [ 2, 64 ],
      "3": [ 2, 64 ],
      "4": [ 4, 64 ],
      "5": [ 5, 64 ],
      "6": [ 5, 64 ],
      "7": [ 5, 64 ],
    }

  # Choice to add last max pooling layer on last* convolution layer
  last_max_pooling: False

  normalization:
    # Input Normalization : Setting image range values between [-0.5:0.5]
    input_normalization: False

    # Strategy for normalizing the feature maps in the convolution blocks.
    # Options are: "batch" (Batch Normalization), "layer" (Layer Normalization over channels), or "none" (No normalization)
    feature_map_normalization: "batch"

  modules:
    # Residual Nets : Paper "Deep Residual Learning for Image Recognition" https://arxiv.org/abs/1512.03385
    residual_nets: False

    # Attention Modules : Paper "Residual Attention Network for Image Classification" https://arxiv.org/pdf/1704.06904.pdf
    attention: False

    # Inception Modules : Paper "Going Deeper with Convolutions" https://arxiv.org/abs/1409.4842
    inception: False

    # Squeeze and Excitation Nets : Paper "Squeeze and Excitation Networks" https://arxiv.org/pdf/1709.01507.pdf
    squeeze_and_excite: True

  # TODO See if we cannot just keep all of this in one place ?
  # Backbone spatial resolution block indices to branch out to the object detection heads.
  detection_convolution_block_indices: [5, 6, 7]

# Careful because here the number of proposals seems to be global
RegionProposal:
  head_configurations:
    {
      "5": [2, 64 ],
      "6": [2, 64 ],
      "7": [2, 64 ],
    }
  normalization:
    # Options: "batch" (Batch Normalization), "layer" (Layer Normalization over channels), or "none" (No normalization)
    feature_map_normalization: "batch"
  training:
    # Raw proposals to keep per image BEFORE Non-Maximum Suppression during training [Just top k proposals].
    pre_nms_proposals: 1000
    # Filtered proposals to keep per image AFTER Non-Maximum Suppression during training.
    post_nms_proposals: 500
  inference:
    # Raw proposals to keep per image BEFORE Non-Maximum Suppression during inference [Just top k proposals].
    pre_nms_proposals: 500
    # Filtered proposals to keep per image AFTER Non-Maximum Suppression during inference.
    post_nms_proposals: 250
  foreground_iou_threshold:
    # Minimum IoU required for an anchor to be a positive foreground match.
    min: 0.5
    # Maximum IoU limit for matching (capped at 1.0).
    max: 1.0
  background_iou_threshold:
    # Minimum IoU required for an anchor to be a strict background sample.
    min: 0.1
    # Maximum IoU allowed for an anchor to be a strict background sample.
    max: 0.3
  # IoU threshold for Non-Maximum Suppression to eliminate redundant overlapping proposals.
  nms_iou_threshold: 0.5
  # Force assign best-overlapping anchors as foreground even if below the min threshold.
  strict_fallback_assignment: False
  # Exact number of strictly positive foreground anchors sampled for loss calculation per image.
  number_training_positives: 128
  # Combined budget of positive and negative anchor samples evaluated per image.
  total_training_samples: 256
  # Beta scaling parameter for Smooth L1 Loss during bounding box regression.
  localisation_loss_beta: 1/9

Anchors:
  # Todo : Maybe keep it as a list ? Dictionary modification is cumbersome.
  # Dictionary mapping anchor scales and aspect ratios to specific feature map indices.
  scales_and_ratios:
    {
      "5":{"scales":[ 32, 64, 128], "aspect_ratios":[0.5, 1.0, 2.0]},
      "6":{"scales":[ 32, 64, 128], "aspect_ratios":[0.5, 1.0, 2.0]},
      "7":{"scales":[ 32, 64, 128], "aspect_ratios":[0.5, 1.0, 2.0]},
    }

Detector:
  # Todo : Maybe keep it as a list ? Dictonary modification is cumbersome.
  # Master configuration parameterizing the prediction heads assigned to each feature map scale.
  head_configurations:
    {
      "5": { "roi_align_pool_size" : 7, "convolutions": [ 2, 64 ], "fully_connected": [256,128] },
      "6": { "roi_align_pool_size" : 7, "convolutions": [ 2, 64 ], "fully_connected": [256,128] },
      "7": { "roi_align_pool_size" : 7, "convolutions": [ 2, 64 ], "fully_connected": [256,128] },
    }

  normalization:
    # Options: "batch" (Batch Normalization), "layer" (Layer Normalization over channels), or "none" (No normalization)
    feature_map_normalization: "batch"

  modules:
    # Residual Nets : Paper "Deep Residual Learning for Image Recognition" https://arxiv.org/abs/1512.03385
    residual_nets: False

    # Attention Modules : Paper "Residual Attention Network for Image Classification" https://arxiv.org/pdf/1704.06904.pdf
    attention: False

    # Inception Modules : Paper "Going Deeper with Convolutions" https://arxiv.org/abs/1409.4842
    inception: False

    # Squeeze and Excitation Nets : Paper "Squeeze and Excitation Networks" https://arxiv.org/pdf/1709.01507.pdf
    squeeze_and_excite: True

  # Minimum IoU required for a filtered proposal to be classified as a positive target.
  foreground_iou_threshold: 0.5
  # IoU overlap tolerance for the final Non-Maximum Suppression pass on predictions.
  nms_iou_threshold: 0.8
  # Upper limit of positive (foreground) region proposals sampled per image.
  number_training_positives: 64
  # Total budget of positive and negative region proposals sampled per image.
  total_training_samples: 128
  # Beta scalar for the Smooth L1 Loss bounding box regression transition.
  localisation_loss_beta: 1/9
