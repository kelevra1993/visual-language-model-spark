# Self-supervised training on the images of a classification dataset, here the ImageNet-1k manifests: classes are unused
# in training and only serve the k-NN evaluation of the test split. An unlabelled dataset lists its samples without
# 'category_id' with an empty label mapping ({}), its test split then scored by the effective rank of the
# representations only.
ExperimentConfiguration:
  # Task trained, selecting the trainer, model and checks. "self_supervised" trains the backbone without labels from two
  # random views of every image; needs ProjectionHead and Data.data_augmentation on. Its backbone then initialises any
  # task (Backbone.pretrained).
  task: "self_supervised"
  # Root of the training runs, each in a subfolder named after its settings (task, input, backbone, projection head,
  # method and its setting, optimizer and weight decay unless plain Adam): the same settings resume, changed ones start
  # a new folder, e.g. SSL_IN-KAR-256_SE-RES-BN-B1x64.2x64.2x64.4x64.5x64.5x64_PAVG.2048.2048.2048-PBN_BT-OD0.005. The
  # views, batch size, learning rate and its schedule, and gradient clipping give no token and can change on resume
  # (format: vision_training/configuration_processing/run_name.py).
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments"
  # Last run name section, e.g. "v1" giving <run name>_v1, to start a new folder for the same settings with another
  # batch size, augmentation or learning rate. Letters, digits, '-' and '.', null for none.
  run_name_suffix: null
  # Training images and labels.json manifest (ImageNet-1k: 1,271,167 images).
  train_data_folder: "/home/robert_kelevra/Data/classifier_data/imagenet-1k/manifests/train"
  # Validation images and labels.json manifest (10,000 images held out of the ImageNet-1k training split).
  validation_data_folder: "/home/robert_kelevra/Data/classifier_data/imagenet-1k/manifests/validation"
  # Test images and labels.json manifest (the 50,000 images of the official ImageNet-1k validation set).
  test_data_folder: "/home/robert_kelevra/Data/classifier_data/imagenet-1k/manifests/test"
  # Images per forward/backward pass.
  batch_size: 256
  # Metric logging interval, in iterations.
  information_dump: 1000
  # Checkpoint and test evaluation interval, in iterations.
  weight_saving_iterations: 10000
  # Interval (iterations) of extra checkpoints without test evaluation, below weight_saving_iterations, 0 for none.
  intermediate_weight_saving_iterations: 2500
  # Total training iterations.
  number_iterations: 1e10
  # Validation interval in iterations: 0 never, 1 every iteration, N every Nth.
  validation_iteration_ratio: 25
  # Test evaluation at every weight_saving_iterations checkpoint on the whole test split, training no classifier: every
  # labelled test image is classified by its nearest neighbours among the other labelled test images by cosine
  # similarity (k-NN accuracy, balanced accuracy, macro F1 and per-class precision / recall / F1 in <run
  # folder>/Evaluation/Iteration_<iteration>/class_metrics.csv); the effective rank and standard deviation of the test
  # representations watch for collapse. An unlabelled test split is scored by the effective rank, then the headline
  # metric.
  evaluation:
    # Reports every class: the k-NN class table (labelled test images, precision, recall, F1, worst F1 first) in the
    # console and Results.txt and the k-NN Precision / Recall / F1 Test scalars in TensorBoard. False keeps the global
    # metrics only; class_metrics.csv is always saved.
    per_class_report: False
    # Test images drawn once and shown at every evaluation next to two random views, captioned with the class and the
    # cosine similarity of both view representations (near 1 for a view-invariant backbone), saved in
    # Evaluation/Iteration_<n>/Samples/ and TensorBoard. Spread over the classes, unlabelled images forming their own
    # group. 0 disables.
    number_sample_images: 16
    # Nearest neighbours voting for the class of a labelled test image in the k-NN evaluation, each weighted by
    # exp(cosine similarity / 0.07); a positive integer, reduced to the labelled test images minus 1 for smaller splits.
    number_neighbours: 20
  # MLflow tracking next to TensorBoard: hyperparameters, metric averages per information_dump, learning rate, test
  # metrics and small artifacts (configuration, confusion matrices, class metrics and thresholds, Results.txt). An
  # MLflow error only prints a warning.
  tracking:
    # Turns MLflow tracking on.
    activated: False
    # MLflow server address (e.g. "http://192.168.1.20:5000"), or null for <experiment_folder>/mlflow.db, browsed with
    # "mlflow ui --backend-store-uri sqlite:///<experiment_folder>/mlflow.db". Credentials come from
    # MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD.
    tracking_uri: null
    # MLflow experiment, null for the task name ("self_supervised").
    experiment_name: null
  # Base learning rate.
  learning_rate: 2.0e-4
  # Lets a resumed run train on a changed labels.json (the previous data.json kept as data_until_iteration_<n>.json);
  # False refuses it, a new run (run_name_suffix) being needed. A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Computes the receptive field
      compute_receptive_field: True
      # Shows the network input: "View 1" and "View 2" windows with the two random views of a training image, each next
      # to its drawn transformations. With Data.grouped_batches on, every training batch is first shown whole in a
      # "Training Batch" window, cut into its blocks under their group values. SPACE: next images, ENTER: exit without
      # training (set False to train). Needs a display; no run folder is created.
      view_input_images: False

Optimization:
  # Optimizer: "adam", "adamw" (decoupled weight decay) or "sgd" (Nesterov momentum 0.9), at
  # ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Optimizer weight decay, 0 to disable.
  weight_decay: 0.0
  # After the warm-up: "constant", or "cosine" (to minimum_learning_rate_ratio x learning rate over decay_iterations,
  # then constant).
  learning_rate_schedule: "constant"
  # Linear learning rate warm-up iterations from 0, 0 to disable.
  warmup_iterations: 0
  # Cosine decay iterations after the warm-up (cosine schedule only).
  decay_iterations: 100000
  # Final cosine learning rate, as a fraction of the learning rate (cosine only).
  minimum_learning_rate_ratio: 0.01
  # Maximum global gradient norm, clipped before every step, null to disable.
  gradient_clipping_norm: null
  # Exponential moving average (EMA) of the weights, updated after every optimizer step:
  #   ema_weights = decay × ema_weights + (1 − decay) × current_weights
  # It averages about the last 1 / (1 − decay) iterations (0.999: 1,000). Every test evaluation also scores it
  # (Evaluation/Iteration_<n>/EMA/, Test_EMA curves). Saved in the checkpoints, no run name token, can change on resume;
  # 'pretrained' transfers load the averaged weights when present.
  exponential_moving_average:
    # Turns the weight moving average on.
    activated: False
    # Share of the average kept per update, strictly between 0 and 1.
    decay: 0.9998

Data:
  image_settings:
    # Input resolution of every image.
    size: 256
    # Keeps the original aspect ratio when resizing.
    keep_ratio: True
  label_mapping:
    # Must be "multi_class" (self-supervised): the mapping file gives the class of every category for the k-NN
    # evaluation, 0 to K-1 (no background), {} for an unlabelled dataset.
    mode: "multi_class"
    # JSON file mapping the dataset category IDs to sequential class IDs.
    mapping_file_path: "/home/robert_kelevra/Data/classifier_data/imagenet-1k/manifests/label_mapping.json"
  # Grouped batches (hard negatives): training and validation batches gather blocks of images sharing an attribute of
  # the optional "groups" dictionary of their labels.json sample (e.g. {"camera": "c042", "site": "s3"}), so that the
  # negatives of an image (its batch) include many of the same camera, scene or device type, which the views must still
  # tell apart. Rebuilt every pass: the images of every (batch value, block value) are shuffled and cut into blocks of
  # images_per_block, the blocks of every batch value joined into full batches, the leftovers shuffled into random
  # batches. A split without the keys keeps random batches (warning); one where only some samples hold them stops the
  # launch. The test split (k-NN evaluation) is not grouped. No run name token, can change on resume.
  grouped_batches:
    # Turns grouped batches on, random batches otherwise.
    activated: False
    # Attribute shared by the images of a block.
    block_key: "camera"
    # Images per block, an integer >= 2 dividing the batch size (batch_size / images_per_block blocks per batch).
    images_per_block: 32
    # Attribute shared by every image of a batch (e.g. "site", its blocks from cameras of one site), or null for blocks
    # of any value.
    batch_key: null
  # Data augmentation drawing the two views of the self-supervised task: every training and validation image is
  # transformed twice on the GPU before the forward pass, each view drawing every activated type with its probability
  # and own random values; the loss pulls the two views together. Strengths are hard-coded, mostly stronger than in the
  # supervised tasks (SELF_SUPERVISED_AUGMENTATION_STRENGTHS, vision_training/data/augmentations.py); the configuration
  # sets the types and probabilities, shared by both views except random_solarize and random_black_out (second view
  # only, as in BYOL and Barlow Twins). The views must change everything but the image content: a cue shared by both
  # (e.g. colour with the colour types off) lets the network match them without learning. No run name token, can change
  # on resume.
  data_augmentation:
    # Global switch, True for the self-supervised task (otherwise both views are the image itself).
    activated: True
    # Probability that a training image is augmented, ignored by the self-supervised task (every image gets two views).
    probability: 1.0
    types:
      # Geometric augmentations, drawn per view.
      # Random Crop : random resized crop of 50% to 100% of the area, aspect ratio x1/2 to x2, the main view
      # augmentation: probability 1.0 when activated, a crop missing the object leaving nothing to match
      random_crop: { activated: True, probability: 1.0 }
      # Random Aspect Crop : 75% to 100% of the width and, drawn separately, of the height, resized back, stretching one
      # side by x0.75 to x1.33
      random_aspect_crop: { activated: False, probability: 0.3 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side at a random place of a black canvas of the input size
      random_zoom_out: { activated: False, probability: 0.3 }
      # Random Translation : shift of up to 25% along x, y or both, border filled black
      random_translation: { activated: False, probability: 0.5 }
      # Random Left-Right Flip
      random_left_right_flip: { activated: True, probability: 0.5 }
      # Random Up-Down Flip, for images whose content keeps its meaning upside down
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation of -10° to 10°, corners filled black
      random_rotation: { activated: False, probability: 0.5 }
      # Random +-90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.5 }
      # Random Perspective : each corner moved inwards by up to 5% of half the width and height (viewpoint change),
      # border filled black
      random_perspective: { activated: True, probability: 0.5 }
      # Random Jigsaw, experimental : 2x2 pieces in a random order, breaking the global layout for datasets whose static
      # background lets the views match without learning their content
      random_jigsaw: { activated: False, probability: 0.2 }

      # Photometric augmentations, drawn per view.
      # Brightness, contrast and saturation each x0.6 to x1.2 (milder than the x0.2 to x1.8 of SimCLR)
      brightness_contrast_saturation: { activated: True, probability: 0.8 }
      # Random Hue : hue turned by up to 36 degrees (a tenth of the circle) either way
      random_hue: { activated: True, probability: 0.8 }
      # CLAHE, clip limit 2.0 on a 4x4 tile grid
      clahe_augment: { activated: False, probability: 0.5 }
      # Laplacian of Gaussian unsharp mask sharpening (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.5 }
      # Histogram equalization of the luminance (Y of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.5 }
      # Histogram equalization of one random channel (B, G or R) or all three
      equalize_bgr_histogram_augment: { activated: False, probability: 0.5 }
      # Random Noise : sensor Gaussian noise, standard deviation 30 levels
      random_noise: { activated: True, probability: 0.2 }
      # Grayscale, kept on three channels
      gray_scale_augment: { activated: True, probability: 0.2 }
      # Random Colour augmentation : BGR to RGB channel swap
      random_colour_augmentation: { activated: False, probability: 0.5 }
      # Random Gamma : gamma 0.8 to 1.25, darkening or lightening the mid-tones
      random_gamma: { activated: True, probability: 0.3 }
      # Random Linear Illumination : ramp of 13 to 38 levels across the image, brightening or darkening it, an uneven
      # lighting
      random_linear_illumination: { activated: True, probability: 0.3 }
      # Random Plasma Shadow : irregular fractal shadows darkening by up to 51 levels
      random_plasma_shadow: { activated: True, probability: 0.2 }
      # Random Blur : 9x9 Gaussian kernel, sigma 2.5
      random_blur: { activated: True, probability: 0.5 }
      # Random Motion Blurring : streak of 5 to 15 pixels at 0 to 180 degrees, trailing backward or forward (camera or
      # object motion)
      random_motion_blur: { activated: True, probability: 0.1 }
      # Random Haze : uniform grey airlight of 160 to 255 levels taking 20% to 70% of every pixel, a camera fog (after
      # the blurs)
      random_haze: { activated: True, probability: 0.3 }
      # Random Solarize : pixels at or above 191 levels inverted, second view only
      random_solarize: { activated: True, probability: 0.2 }
      # Random Black Out : grid_size x grid_size cells (smaller cells hide smaller parts), each blacked out with
      # probability 0.35, second view only
      random_black_out: { activated: True, probability: 0.3, grid_size: 8 }
      # Random Erasing : one black rectangle of 2% to 15% of the image, height / width 0.3 to 3.3 (applied last)
      random_erasing: { activated: True, probability: 0.25 }

Backbone:
  # Input channels of the first convolution block: 3, the loaders giving BGR images
  input_channels : 3

  # [convolutions, output filters] of every block.
  convolutions:
    {
      "1": [ 1, 64 ],
      "2": [ 2, 64 ],
      "3": [ 2, 64 ],
      "4": [ 4, 64 ],
      "5": [ 5, 64 ],
      "6": [ 5, 64 ]
    }

  # Max pooling after the last block.
  last_max_pooling: False

  normalization:
    # Scales the inputs to [-0.5, 0.5].
    input_normalization: True

    # Normalizes every image to zero mean and unit variance (after input_normalization).
    per_sample_normalization: False

    # Feature map normalization: "batch", "layer" (over channels) or "none".
    feature_map_normalization: "batch"

  modules:
    # Residual shortcuts every two convolutions from block 2 (https://arxiv.org/abs/1512.03385).
    residual_nets: True

    # Pre-activation shortcuts (https://arxiv.org/abs/1603.05027): normalization and ReLU before every convolution.
    # Requires residual_nets; RES2 token instead of RES.
    residual_nets_v2: False

    # Inception modules (https://arxiv.org/abs/1409.4842), output channels multiples of 8.
    inception: False

    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True

  # Backbone of another run (any task) initialising this one. The layer settings (input_channels, convolutions, modules,
  # normalization, last_max_pooling) must match; detection levels and image size may differ.
  pretrained:
    # Run folder of the loaded backbone, null for random weights (not reloaded on resume).
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded backbone (no gradient, frozen batch statistics); needs experiment_folder.
    freeze: False
    # Freezes the scale and shift of the loaded backbone normalizations while its convolutions learn; needs
    # experiment_folder, freeze False and a normalization.
    freeze_normalization_parameters: False
    # Learning rate factor of the loaded backbone, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

ProjectionHead:
  # Reduction of the final backbone feature map [C, H, W] to the image representation (compared by the k-NN evaluation,
  # returned by the exported encoder): "average" or "max" (C values whatever the image size), or "flatten" (C x H x W
  # values keeping positions, tied to Data.image_settings.size and Backbone.last_max_pooling).
  global_pooling: "average"
  # Layer units mapping the representation to the embedding compared by the loss, the last being the embedding size
  # (linear, normalization and ReLU before it, linear last). SimCLR uses one hidden layer and a small embedding (e.g.
  # [2048, 128]), Barlow Twins wide layers (e.g. [2048, 2048, 2048] or more, improving with the embedding size). Only
  # the self-supervised training uses the head: the backbone initialises the other tasks.
  fully_connected: [2048, 2048, 2048]
  # Normalization of every hidden layer output before its ReLU: "batch" (per feature over the batch, as SimCLR and
  # Barlow Twins), "layer" (per vector over its features) or "none". "none" when fully_connected holds the embedding
  # layer only; gives the PBN or PLN token.
  fully_connected_normalization: "batch"
  # Momentum of the batch normalization running statistics ("batch" only): 0.1 follows about the last 10 batches, 0.01
  # the last 100. No run name token, can change on resume.
  batch_normalization_momentum: 0.1
  # Self-supervised method, giving the SIMCLR or BT token:
  # - "simclr": InfoNCE over the 2N views of a batch of N images, every view finding the other view of its image among
  #   the 2N - 1 others by cosine similarity over the temperature; large batches give more views to tell apart. Tracks
  #   the positive pair accuracy (views whose most similar view is their partner).
  # - "barlow_twins": the cross-correlation matrix of the embedding features of both views (normalized over the batch)
  #   pushed to the identity, every feature equal on both views and the features decorrelated. Works with smaller
  #   batches than SimCLR; tracks the mean diagonal and off-diagonal correlations.
  # Both track the standard deviation of the normalized embeddings, about 1 when spread, 0 when collapsed.
  method: "barlow_twins"
  simclr:
    # Temperature dividing the cosine similarities before the softmax, e.g. 0.1 to 0.5, lower focusing the loss on the
    # views of other images most similar to the partner. Gives the T<temperature> token after SIMCLR.
    temperature: 0.1
  barlow_twins:
    # Weight of the off-diagonal terms (redundancy reduction) against the diagonal ones (invariance), e.g. 0.005 for
    # 8192 features. Gives the OD<weight> token after BT.
    off_diagonal_weight: 0.005
