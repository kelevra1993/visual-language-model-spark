# Configuration of the synthetic shapes classification dataset (one shape per image, of the 35 classes of
# SHAPE_CATEGORIES: square, circle, triangle, rectangle, pentagon, hexagon, plus sign, star, octagon, rhombus,
# parallelogram, trapezoid, kite, heptagon, nonagon, ellipse, semicircle, annulus, capsule, L-shape and the hollow
# counterparts of fifteen of them, hollow_square to hollow_capsule, from 64 pixels to a third of the image side, a
# dataset created before the last twenty-six were added keeping the first nine), created with
# vision_training/data/synthetic/create_synthetic_dataset.py and its task set to "classification". It is a trivial
# classification task, used to check that the classifier learns.
ExperimentConfiguration:
  # Task trained by this configuration, selecting the trainer, the model and the checks of the task sections.
  # "classification" trains the image classifier, and requires the ClassificationHead section.
  task: "classification"
  # Root folder of all the training runs. Every run is saved in a subfolder named after its settings (task, input,
  # backbone modules, normalization and blocks, classification head, classes, optimizer and weight decay unless plain
  # Adam), so that the same settings resume in the same folder and changed settings start a new one, e.g.
  # CLS_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_HAVG.128_MC4. The augmentation, batch size, learning rate
  # and its schedule, gradient clipping, mixed precision and dropout rates give no token, so that a run can be resumed
  # in its folder with changed values. The format is described in vision_training/configuration_processing/run_name.py.
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments"
  # Root directory containing the training dataset images and labels.json manifest.
  train_data_folder: "/home/robert_kelevra/Data/classifier_data/synthetic_shapes/train"
  # Root directory containing the validation dataset images and labels.json manifest.
  validation_data_folder: "/home/robert_kelevra/Data/classifier_data/synthetic_shapes/validation"
  # Root directory containing the test dataset images and labels.json manifest.
  test_data_folder: "/home/robert_kelevra/Data/classifier_data/synthetic_shapes/test"
  # Number of images processed in a single forward/backward pass.
  batch_size: 64
  # Frequency (in iterations) to log performance metrics.
  information_dump: 10
  # Frequency (in iterations) to checkpoint the model weights and run the test evaluation on them.
  weight_saving_iterations: 100
  # Frequency (in iterations) of additional checkpoints saved without running the test evaluation, between the
  # weight_saving_iterations checkpoints. Must be an integer strictly smaller than weight_saving_iterations.
  intermediate_weight_saving_iterations: 50
  # Total number of training iterations before stopping.
  number_iterations: 1e10
  # Ratio controlling how often validation is run during training.
  # 0 = never run validation, 1 = run every iteration, 2 = every 2nd iteration, N = every Nth iteration.
  validation_iteration_ratio: 1
  # Test evaluation run at every weight_saving_iterations checkpoint on the whole test split: accuracy, balanced
  # accuracy, macro F1, top-k accuracy, precision / recall / F1 of every class, and the confusion matrix and class
  # thresholds saved in <run folder>/Evaluation/Iteration_<iteration>/.
  evaluation:
    # Reports every class at every evaluation: the table of the classes (test samples, precision, recall, F1, ROC AUC,
    # average precision, and the threshold reaching target_precision with the recall it keeps, worst F1 first) in the
    # console and Results.txt, their Precision / Recall / F1 / ROC AUC / Average Precision Test scalars and the Macro
    # ROC AUC and Macro Average Precision in TensorBoard, the confusion matrix image (multi-class output mode,
    # confusion_matrix.png) and the ROC and precision-recall curves of every class, one against the rest, with the
    # thresholds marked (roc_curves.png and precision_recall_curves.png, one plot up to 10 classes and a grid of panels
    # above), also in TensorBoard. False keeps the global metrics only, e.g. for 1000 classes: class_metrics.csv,
    # class_thresholds.json and confusion_matrix.csv are saved either way.
    per_class_report: True
    # Number of test images drawn once and shown at every evaluation, each as its network input captioned with its
    # true class and its predicted class with its probability (multi-label: its true classes and its predicted classes
    # with their probabilities), in green when the prediction is right and in red when it is wrong, saved in
    # Evaluation/Iteration_<n>/Samples/ and sent to TensorBoard. The images are spread over the classes (one per class
    # when the number reaches the number of classes), then evenly over the images of each class. 0 to disable.
    number_sample_images: 8
    # Number of most probable classes among which the true class must be for the top-k accuracy. Must be a positive
    # integer, values above the number of classes counting every sample as right.
    top_k: 2
    # Precision that the score threshold of every class must reach, the threshold keeping the most samples of the
    # class (highest recall) at that precision being saved for deployment. Must be within [0, 1].
    target_precision: 0.99
    # Saves 'predictions.csv' in the evaluation folder of every evaluated checkpoint: one row per test sample (one per
    # labelled frame for sequence labelling) with its name, its true and predicted classes and the probability of
    # every class, to study the errors and the thresholds again without running the model. Its size grows with the
    # number of test samples times the number of classes, False to skip it on large test sets.
    save_predictions: True
    # Saves every misclassified test sample as an image at every evaluation, in
    # 'Evaluation/Iteration_<n>/Errors/<TRUE>-TO-<PREDICTED>/<sample>_<score>.png', the score being the probability
    # of the predicted class: the network input of an image, the frame grid of a window or of a pair (the before
    # member above the after member), or for sequence labelling the frame grid of the window of every wrong frame.
    # Multi-class output mode only.
    error_dumps:
      # Turns the error images on.
      activated: False
      # Largest number of images saved for every pair of true and predicted classes, the first ones met.
      maximum_per_class_pair: 20
  # Tracking of the run in MLflow, next to TensorBoard and Results.txt: the hyperparameters, the averages of the
  # training and validation metrics of every information_dump interval, the learning rate, the test metrics of every
  # evaluated checkpoint and a few small artifacts (configuration, confusion matrices, class metrics and thresholds,
  # Results.txt). The tracking never blocks nor stops the training: any MLflow error prints one warning and the
  # training continues without it.
  tracking:
    # Turns the MLflow tracking on.
    activated: False
    # Address of an MLflow tracking server, e.g. "http://192.168.1.20:5000", or null for the local database of the
    # experiments root folder (sqlite:///<experiment_folder>/mlflow.db, artifacts in <experiment_folder>/mlartifacts),
    # browsed with "mlflow ui --backend-store-uri sqlite:///<experiment_folder>/mlflow.db". The credentials of a
    # server are read from the MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD environment variables, never from
    # this file.
    tracking_uri: null
    # MLflow experiment grouping the runs, null for the task name (e.g. "classification").
    experiment_name: null
    # Sends the configuration, the confusion matrices, the class metrics and thresholds and Results.txt as artifacts.
    log_artifacts: True
  # Base learning rate used by the optimizer.
  learning_rate: 2.0e-4
  # Flag to attempt loading the most recent checkpoint to resume training.
  resume_training: true
  # Flag to let a resumed run train on data whose labels.json changed since its last start, the previous data.json
  # being kept as data_until_iteration_<n>.json. False stops such a resume with an error: changed data asks for a
  # new run (resume_training false, or another experiment_folder). A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Choice to print out everything about the model
      verbose: False
      # Choice to compute Receptive-Field
      compute_receptive_field: True
      # Choice to compute final model size
      compute_model_size: True
      # Choice to view what is being fed to the neural network : opens a Training and a Validation window showing the
      # input images captioned with their class. SPACE shows the next images, ENTER closes the viewer and exits the
      # program without training, so set it to False to train. Requires a display (skipped with a warning otherwise). No
      # run folder is created in this mode.
      view_input_images: False

Optimization:
  # Optimizer of the model parameters: "adam", "adamw" (Adam with the weight decay decoupled from the gradients) or
  # "sgd" (stochastic gradient descent with Nesterov momentum 0.9), at ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Weight decay of the optimizer, 0 to disable.
  weight_decay: 0.0
  # Learning rate schedule after the warm-up: "constant", or "cosine" (decay to minimum_learning_rate_ratio times the
  # learning rate over decay_iterations, constant afterwards).
  learning_rate_schedule: "constant"
  # Iterations of the linear warm-up of the learning rate from 0, 0 to disable.
  warmup_iterations: 0
  # Iterations of the cosine decay, counted after the warm-up (cosine schedule only).
  decay_iterations: 100000
  # Learning rate at the end of the cosine decay, as a fraction of the learning rate (cosine schedule only).
  minimum_learning_rate_ratio: 0.01
  # Maximum norm of all the gradients together, clipped before every step, null to disable.
  gradient_clipping_norm: null
  # Runs the training and validation forward passes in bfloat16 (faster and lighter on recent GPUs), the weights and
  # the test evaluation staying in float32 (the data type of every model).
  mixed_precision: True
  # Exponential moving average (EMA) of the weights: a second copy of the model, never trained itself, moved towards
  # the trained weights after every optimizer step:
  #   ema_weights = decay × ema_weights + (1 − decay) × current_weights
  # It averages roughly the last 1 / (1 − decay) iterations (0.999: 1,000, 0.9998: 5,000, 0.9999: 10,000), its n-th
  # update using min(decay, (1 + n) / (10 + n)) so that the random starting weights fade quickly. Every test
  # evaluation scores the trained weights, then the EMA weights, in Evaluation/Iteration_<n>/EMA/, the Test_EMA
  # TensorBoard curves and the "EMA Weights" blocks of Results.txt. Saved in the checkpoints, it gives no run name
  # token and can be turned on or off when a run resumes. When on, the components transferred from another run (their
  # 'pretrained' settings) load its averaged weights if its checkpoint holds them, otherwise its trained weights.
  exponential_moving_average:
    # Turns the moving average of the weights on.
    activated: False
    # Fraction of the average kept at every update, strictly between 0 and 1.
    decay: 0.9998

Data:
  loading:
    # Number of worker processes reading and resizing the images. They stay alive between epochs and evaluations,
    # each decodes with a single OpenCV thread, and the training, validation and test loaders each have their own
    # workers. 8 workers already feed the GPU of the example models; 0 loads in the main process (debugging).
    number_workers: 8
    # Number of batches prepared in advance by every worker.
    prefetch_batches: 2
  image_settings:
    # Target resolution to resize all input images.
    size: 512
    # Flag to maintain the original aspect ratio when resizing.
    keep_ratio: True
  label_mapping:
    # Must be "multi_class" for the classification task: the mapping file gives the class index of every category
    # of the labels.json manifests, the classes being indexed 0 to K-1 (no background class).
    mode: "multi_class"
    # Path to a JSON file mapping raw dataset category IDs to sequential model class IDs.
    mapping_file_path: "/home/robert_kelevra/Data/classifier_data/synthetic_shapes/label_mapping.json"
  data_augmentation:
    # Global switch to enable or disable all data augmentation (applied on the GPU to training batches only).
    activated: True
    # Probability that a training image is augmented at all. Each activated type below is then applied to that
    # image with its own probability. For image sequences, all frames of a sequence share the same augmentation.
    probability: 0.4
    # Sequence tasks only (False for the image tasks): draws the photometric augmentations below frame by frame,
    # every frame of an augmented sequence getting its own brightness, noise, colour... while the geometric
    # augmentations stay the same for all its frames, a crop or a rotation per frame making the objects jump.
    independent_frames: False
    # Sequence tasks only (activated False for the image tasks): shuffles the real frames of a training window with
    # this probability, independently of the probability above, the padding frames staying last and each member of
    # a pair being shuffled on its own. For the sequences whose frame order carries no information (sets of photos).
    shuffle_frames: { activated: False, probability: 0.5 }
    types:
      # Geometric augmentations : the class of an image does not change with them.
      # Random Crop : crop keeping 75% to 100% of each side (same aspect ratio), resized back to the input size
      random_crop: { activated: True, probability: 0.3 }
      # Random Aspect Crop : crop keeping 75% to 100% of the width and, drawn on its own, 75% to 100% of the height,
      # resized back to the input size, which stretches the content by x0.75 to x1.33 along one side (other camera
      # proportions, suited to the images stretched without padding, keep_ratio False)
      random_aspect_crop: { activated: False, probability: 0.3 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side (same aspect ratio) at a random position of a
      # black canvas of the input size, the objects then appearing smaller than in the dataset
      random_zoom_out: { activated: False, probability: 0.3 }
      # Random Translation : shift along x, y or both (drawn at random) of up to 25% of the image width and
      # height, the uncovered border filled with black
      random_translation: { activated: False, probability: 0.5 }
      # Random Left to Right Flip (mirror)
      random_left_right_flip: { activated: True, probability: 0.5 }
      # Random Up to Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation between -5° and 5°
      random_rotation: { activated: True, probability: 0.3 }
      # Random -90° or 90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.3 }

      # Photometric augmentations.
      # Brightness (+-40 intensity levels), contrast and saturation (both x0.7 to x1.0) adjustments
      brightness_contrast_saturation: { activated: True, probability: 0.3 }
      # Contrast-limited Adaptive Histogram Equalization (CLAHE), clip limit 2.0 on a 4x4 grid of tiles
      clahe_augment: { activated: False, probability: 0.3 }
      # Image Sharpening with a Laplacian of Gaussian unsharp mask (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.3 }
      # Histogram Equalization of the luminance (Y channel of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.3 }
      # Histogram Equalization of one random channel (B, G or R) or of all three channels
      equalize_bgr_histogram_augment: { activated: False, probability: 0.3 }
      # Random Noise : Gaussian noise with a standard deviation of 40 intensity levels
      random_noise: { activated: True, probability: 0.3 }
      # Grayscale conversion, kept on three channels
      gray_scale_augment: { activated: False, probability: 0.3 }
      # Random Colour augmentation : swap of the blue and red channels (BGR to RGB)
      random_colour_augmentation: { activated: False, probability: 0.3 }
      # Random Image Blurring : 9x9 Gaussian kernel with sigma 2.5
      random_blur: { activated: False, probability: 0.3 }
      # Random Motion Blurring : streak of 5 to 15 pixels at an angle of 0 to 180 degrees, trailing backward
      # or forward, the motion of the camera or of the objects during the exposure
      random_motion_blur: { activated: False, probability: 0.3 }
      # Random Haze : blend with a uniform grey airlight of 180 to 255 intensity levels taking 20% to 60% of every
      # pixel, the fog or condensation of a camera lowering the contrast (applied after the other photometric types)
      random_haze: { activated: True, probability: 0.3 }
      # Random Black Out : image cut into an 8x8 grid, every cell blacked out with a probability of 0.2 (applied
      # last); the boxes, masks and keypoints are left unchanged, so an object can be hidden while keeping its label
      random_black_out: { activated: False, probability: 0.3 }

Backbone:
  # Number of input channels of the initial convolution block: must be 3, the loaders giving BGR images
  input_channels : 3

  # First axis : Number of convolution Kernel maps per Convolution Block
  # Second axis : Number of output filters per kernel per convolution Block
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 32 ],
      "3": [ 2, 32 ],
      "4": [ 2, 64 ],
      "5": [ 2, 64 ],
      "6": [ 2, 128 ],
    }

  # Choice to add last max pooling layer on last* convolution layer
  last_max_pooling: False

  normalization:
    # Input Normalization : Setting image range values between [-0.5:0.5]
    input_normalization: True

    # Per Sample Input Normalization : Normalizing each image to zero mean and unit variance
    # Applied after input_normalization when both are activated
    per_sample_normalization: False

    # Strategy for normalizing the feature maps in the convolution blocks.
    # Options are: "batch" (Batch Normalization), "layer" (Layer Normalization over channels), or "none" (No normalization)
    feature_map_normalization: "batch"
    # Momentum of the running mean and variance of the batch normalization layers (PyTorch convention): every
    # training batch moves them by this fraction, 0.1 following about the last 10 batches and 0.01 about the last
    # 100. Unused by the other normalizations, it gives no run name token and can change when a run resumes.
    batch_normalization_momentum: 0.1

  modules:
    # Residual Nets : Paper "Deep Residual Learning for Image Recognition" https://arxiv.org/abs/1512.03385
    # Shortcuts are added every two convolution layers, starting from the second convolution block
    residual_nets: True

    # Residual Nets v2 : Paper "Identity Mappings in Deep Residual Networks" https://arxiv.org/abs/1603.05027
    # Pre-activation shortcuts: every layer applies its normalization and ReLU before its convolution and nothing
    # follows the addition, so that the shortcuts form an identity path through the block, whose output is normalized
    # and activated at its end. Requires residual_nets, starts from the second block like it, and gives the RES2 run
    # name token instead of RES.
    residual_nets_v2: False

    # Inception Modules : Paper "Going Deeper with Convolutions" https://arxiv.org/abs/1409.4842
    # Output channels of every block using inception must be multiples of 8
    inception: False

    # Convolution block (1-indexed) from which inception modules replace the plain convolutions
    inception_starting_block: 3

    # Squeeze and Excitation Nets : Paper "Squeeze and Excitation Networks" https://arxiv.org/pdf/1709.01507.pdf
    squeeze_and_excite: True

  # Backbone of another training run (of any task) initialising this run instead of random weights. Its settings
  # defining the layers (input_channels, convolutions, modules, normalization, last_max_pooling) must be identical to
  # the ones above, the detection levels, the image size and the batch normalization momentum may differ.
  pretrained:
    # Run folder whose trained backbone initialises this run, null to start from random weights. A run resuming
    # from its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded backbone fixed (no gradient, batch normalization statistics frozen) so that only the heads of
    # the task learn. Requires an experiment_folder.
    freeze: False
    # Keeps the scale and shift of the batch or layer normalization layers of the loaded backbone fixed while its
    # convolutions learn, the batch normalization statistics still following the data of this run. Requires an
    # experiment_folder, freeze False and a feature_map_normalization other than "none".
    freeze_normalization_parameters: False
    # Multiplies the learning rate of the loaded backbone, e.g. 0.1 to fine-tune it ten times slower than the heads.
    learning_rate_multiplier: 1.0

ClassificationHead:
  # Reduction of the final backbone feature map [C, H, W] to the feature vector of every image given to the head:
  # "average" or "max" (global pooling, C values whatever the image size), or "flatten" (its C x H x W values, which
  # keep where the features are in the image, e.g. 64 x 8 x 8 = 4096 for 256 pixel images and 6 blocks). A flattened
  # head is tied to Data.image_settings.size and Backbone.last_max_pooling, and its first layer is much larger.
  global_pooling: "flatten"
  # Units of the hidden fully connected layers between the pooled features and the class logits, [] for none.
  fully_connected: [128]
  # Normalization of the outputs of every hidden layer before its ReLU: "batch" (statistics of every feature over
  # the vectors of the batch), "layer" (statistics of every vector over its features) or "none". Needs at least one
  # hidden layer unless "none", and gives the HBN or HLN run name token.
  fully_connected_normalization: "layer"
  # Momentum of the running mean and variance of the batch normalization layers (PyTorch convention): every
  # training batch moves them by this fraction, 0.1 following about the last 10 batches and 0.01 about the last
  # 100. Unused unless "batch", it gives no run name token and can change when a run resumes.
  batch_normalization_momentum: 0.1
  # Dropout applied before every fully connected layer, within [0, 1), 0 to disable.
  dropout_rate: 0.2
  # "multi_class" (softmax, one class per image) or "multi_label" (sigmoid, any number of classes per image, read
  # from the 'category_ids' of the manifest samples).
  output_mode: "multi_class"
  # Label smoothing of the classification loss, within [0, 1), 0 to disable.
  label_smoothing: 0.0
  # Weighting of the classes in the loss: "none" (every sample weighs the same) or "balanced" (every class weighs the
  # same, the weights being inversely proportional to the number of training samples of each class).
  class_weighting: "balanced"
  # Decorrelation of the hidden features of the head, added to the classification loss in training and validation:
  # the features of one hidden layer, taken before its ReLU (after its normalization), are normalized over the batch,
  # and the squared off-diagonal terms of their correlation matrix are summed and multiplied by the weight (the
  # redundancy reduction term of Barlow Twins without its invariance term, the DeCov penalty). The correlation matrix
  # of a batch of N images has a rank of at most N - 1, so the sum keeps a floor with more units than images, and the
  # sampling noise alone gives about units x (units - 1) / (N - 1). Tracked as Decorrelation Loss and Hidden Feature
  # Correlation (mean absolute correlation of two different units). It gives no run name token and can be turned on
  # when a run resumes, e.g. after a warm-up of the classification loss.
  decorrelation:
    # Adds the decorrelation loss to the classification loss.
    activated: False
    # Weight of the sum of the squared off-diagonal correlations, above 0, e.g. giving the term about a tenth of the
    # classification loss when it is turned on.
    weight: 0.001
    # Hidden layer whose features are decorrelated, counted from 1 in fully_connected, at most its number of layers
    # when activated.
    hidden_layer: 1
  # View losses added to the classification loss in training and validation, comparing every image with a second
  # random view of it: the image goes through the classifier as usual (with the data augmentation of a training
  # image), and its second view, drawn on the GPU from the image before that augmentation with the transformations of
  # view_augmentation, goes through the backbone with it. The final feature maps of both views are pooled into their
  # representations (global_pooling), which the projector of every loss turned on maps to the embeddings the loss
  # compares: fully connected layers trained with the classifier but kept outside it, never exported nor transferred,
  # saved in the checkpoints with their own optimizer. The head classifies the images alone, so the predictions and
  # the exports are unchanged. Every loss is multiplied by its weight and summed with the classification loss into the
  # total loss, the weighted value being tracked. The view losses give no run name token and can be turned on or off
  # when a run resumes: a projector turned on starts from random weights, one turned off is left out of the next
  # checkpoints.
  view_losses:
    # Reduction of the final feature map of a view to its representation: "average" or "max" (global pooling, its
    # channels), or "flatten" (its channels x height x width values, which keep where the features are but differ
    # between two crops of an image, and make the first layer of every projector much larger).
    global_pooling: "average"
    # Random transformations of the second view, those of the views of the self-supervised task, applied to the image
    # before the data augmentation of the classifier. The view losses teach the backbone to ignore what changes between
    # the two views, so they must keep what defines the class of the image. A probability given per view, [first view,
    # second view], applies its second value; the transformations from the perspective to the random erasing are off.
    view_augmentation:
      # Crop of a random area (fraction of the image area within scale) and aspect ratio (width / height within
      # aspect_ratio), resized back to the input size. A crop missing the object of the class leaves nothing to match.
      random_resized_crop: { scale: [0.8, 1.0], aspect_ratio: [0.75, 1.3333] }
      # Mirror from left to right.
      left_right_flip: { probability: 0.5 }
      # Mirror from top to bottom, for images whose content keeps its meaning upside down.
      up_down_flip: { probability: 0.5 }
      # Rotation by a random angle within [-maximum_degrees, maximum_degrees], the uncovered corners filled with black.
      rotation: { probability: 0.5, maximum_degrees: 180.0 }
      # Perspective distortion, a change of viewpoint: every corner of the image moved by up to distortion_scale (within
      # [0, 1]) times half the image side, the uncovered borders filled with black.
      perspective: { probability: 0.0, distortion_scale: 0.2 }
      # Jigsaw, experimental: the image cut into a grid of [rows, columns] pieces put back in a random order, breaking
      # its global layout for the datasets whose static background lets the views match without learning their content.
      # Off by default, to try at 0.2 with [2, 2]; the grid must divide the input size.
      jigsaw: { probability: 0.0, grid: [2, 2] }
      # Brightness, contrast and saturation scaled by a random factor within [1 - strength, 1 + strength], and the hue
      # shifted by up to hue (0.5 being half a turn of the hue circle), in a random order drawn for every batch.
      colour_jitter: { probability: 0.8, brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.1 }
      # Grayscale conversion, kept on three channels.
      grayscale: { probability: 0.2 }
      # Gamma correction, a non-linear change of the exposure: every pixel raised to a power drawn within gamma.
      gamma: { probability: 0.0, gamma: [0.7, 1.5] }
      # Haze, the fog, condensation or low contrast of a camera: every pixel blended with a uniform airlight,
      # view x (1 - strength) + strength x airlight, the strength and the airlight (within [0, 1]) drawn within their
      # ranges.
      haze: { probability: 0.0, strength: [0.0, 0.5], airlight: [0.6, 1.0] }
      # Linear illumination, an uneven lighting: a ramp from 0 to a change drawn within gain (within [0, 1], brightening
      # or darkening) added from one side of the image to the opposite one.
      linear_illumination: { probability: 0.0, gain: [0.05, 0.25] }
      # Plasma shadow, irregular shadows: the pixels where a random fractal map, whose detail grows with a roughness
      # drawn within roughness, is below a level drawn within shade_quantity are darkened by a value drawn within
      # shade_intensity (within [-1, 0]). Its map is drawn on the GPU, so its views differ between devices for the same
      # seed.
      plasma_shadow: { probability: 0.0, shade_intensity: [-0.5, 0.0], shade_quantity: [0.0, 0.5],
                       roughness: [0.1, 0.7] }
      # Gaussian blur of an odd kernel_size, below twice the image size, its sigma drawn within the sigma range.
      gaussian_blur: { probability: 0.5, kernel_size: 9, sigma: [0.1, 2.0] }
      # Motion blur of a camera or an object in motion: a line of an odd length drawn within kernel_size, both bounds
      # included and the same length for every image of a batch, at an angle within [-maximum_angle, maximum_angle]
      # degrees, its weight moved towards one end by a direction drawn within direction (-1 the back, 0 even, 1 the
      # front).
      motion_blur: { probability: 0.0, kernel_size: [3, 9], maximum_angle: 180.0, direction: [-1.0, 1.0] }
      # Solarization, a strong photometric distortion so that the views cannot match by their exact intensities: a value
      # drawn within addition, strictly between -0.5 and 0.5, is added to every pixel, then the pixels above a threshold
      # drawn within threshold are inverted.
      solarize: { probability: 0.0, threshold: [0.5, 0.5], addition: [0.0, 0.0] }
      # Gaussian noise of a sensor, of standard deviation standard_deviation in RGB images in [0, 1] (0.03 is about 8 of
      # the 255 levels), after both blurs which would smooth it away. Drawn on the GPU, so its views differ between
      # devices for the same seed.
      gaussian_noise: { probability: 0.0, standard_deviation: 0.03 }
      # Black-out of the cells of an 8x8 grid, every cell blacked out with a probability of 0.2, as the
      # random_black_out type of the data augmentation, last with the random erasing so that the cells stay black.
      black_out: { probability: 0.0 }
      # Random erasing, an occlusion: a rectangle covering a fraction of the image drawn within scale, of aspect ratio
      # drawn within aspect_ratio, filled with black, last so that the erased area stays plainly filled.
      random_erasing: { probability: 0.0, scale: [0.02, 0.15], aspect_ratio: [0.3, 3.3] }
    # Barlow Twins: the cross-correlation matrix of the embedding features of both views, every feature normalized over
    # the batch, pushed to the identity, every feature equal on both views (diagonal to 1) and the features decorrelated
    # (off-diagonal to 0). Tracked as Barlow Twins Loss (weighted), Diagonal Correlation and Off-Diagonal Correlation.
    # The sampling noise of the correlations of a batch of N images keeps the unweighted loss above about
    # off_diagonal_weight x D x (D - 1) / N for an embedding of D features.
    barlow_twins:
      # Adds the Barlow Twins loss to the classification loss.
      activated: False
      # Weight of the Barlow Twins loss, above 0. Unweighted, it starts at about 300 for an embedding of 512 features,
      # its gradient on the final feature map being about 30 (synthetic shapes) to 150 (ImageNet) times the one of the
      # classification loss at initialisation (batches of 32 images), an eighth to three fifths of it with 0.004. A
      # wider embedding raises it: 177 to 544 times with [2048, 2048, 2048], for a weight of 0.001.
      weight: 0.004
      # Weight of the off-diagonal terms (redundancy reduction) against the diagonal terms (invariance), above 0.
      off_diagonal_weight: 0.005
      # Units of the fully connected layers of the projector, the last one being the embedding size: every layer before
      # it is linear, batch normalization, ReLU, the last one linear only. Barlow Twins improves with wide embeddings,
      # but the weights and the optimizer state of its projector are saved in every checkpoint, about 4 MB for
      # [512, 512] and about 100 MB for [2048, 2048, 2048].
      projector: [512, 512]
    # Contrastive loss, InfoNCE over the 2N views of a batch of N images: every view has to find its positives among
    # the 2N - 1 other views by cosine similarity divided by the temperature. Tracked as Contrastive Loss (weighted)
    # and Positive Pair Accuracy (share of the views whose most similar view is one of their positives).
    contrastive:
      # Adds the contrastive loss to the classification loss.
      activated: False
      # Weight of the contrastive loss, above 0. Unweighted, it starts at about log(2N - 1), its gradient on the final
      # feature map being 0.5 (synthetic shapes) to 1.6 (ImageNet) times the one of the classification loss at
      # initialisation (batches of 32 images), a quarter to four fifths of it with 0.5.
      weight: 0.5
      # Temperature dividing the cosine similarities, above 0, e.g. 0.1 to 0.5.
      temperature: 0.1
      # Positives of a view: "views" (the other view of its image only, SimCLR) or "classes" (also every view of an
      # image of the same class, supervised contrastive learning, SupCon), "views" with output_mode "multi_label"
      # when activated.
      positives: "classes"
      # Units of the fully connected layers of the projector, the last one being the embedding size, e.g. one hidden
      # layer and a small embedding as in SimCLR.
      projector: [2048, 128]
  # Classification head of another training run initialising this run instead of random weights. Its fully_connected
  # layers and fully_connected_normalization must be identical in both runs (the dropout rate and the batch
  # normalization momentum may differ), as well as the size of the vectors it reads. The classes of the source run, read
  # from its data.json, must be the first classes of this run, in the same order: classes may be appended after them,
  # keeping the random initialisation of this run.
  pretrained:
    # Run folder whose trained classification head initialises this run, null to start from random weights. A
    # run resuming from its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded classification head fixed (no gradient) so that only the other components learn.
    # Requires an experiment_folder.
    freeze: False
    # Multiplies the learning rate of the loaded classification head, e.g. 0.1 to fine-tune it ten times slower
    # than the new layers.
    learning_rate_multiplier: 1.0
