# Synthetic shapes semantic segmentation dataset (up to 6 shapes per image, of the 35 SHAPE_CATEGORIES classes (square,
# circle, triangle, rectangle, pentagon, hexagon, plus sign, star, octagon, rhombus, parallelogram, trapezoid, kite,
# heptagon, nonagon, ellipse, semicircle, annulus, capsule, L-shape and fifteen hollow versions, hollow_square to
# hollow_capsule), from 64 pixels to a third of the image side, a dataset made before the last twenty-six were added
# keeping the first nine, with the class mask of every image), created by
# vision_training/data/synthetic/create_synthetic_dataset.py with the task "semantic_segmentation". A trivial task
# checking that the segmenter learns.
ExperimentConfiguration:
  # Task trained, selecting the trainer, model and checks. "semantic_segmentation" trains the U-Net semantic segmenter
  # (one class per pixel); needs SegmentationDecoder and SegmentationLoss.
  task: "semantic_segmentation"
  # Root of the training runs, each in a subfolder named after its settings (task, input, backbone, decoder, classes,
  # optimizer and weight decay unless plain Adam): the same settings resume, changed ones start a new folder, e.g.
  # SEG_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x32.2x64.2x64.2x128_UTC-DBN-D2x64.2x64.2x32.2x32.1x16_MC20. The augmentation,
  # batch size, learning rate and its schedule, gradient clipping, dropout rates and SegmentationLoss settings give no
  # token and can change on resume (format: vision_training/configuration_processing/run_name.py).
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments"
  # Last run name section, e.g. "v1" giving <run name>_v1, to start a new folder for the same settings with another
  # batch size, augmentation or learning rate. Letters, digits, '-' and '.', null for none.
  run_name_suffix: null
  # Training images, masks and labels.json manifest.
  train_data_folder: "/home/robert_kelevra/Data/segmentation_data/synthetic_shapes/train"
  # Validation images, masks and labels.json manifest.
  validation_data_folder: "/home/robert_kelevra/Data/segmentation_data/synthetic_shapes/validation"
  # Test images, masks and labels.json manifest.
  test_data_folder: "/home/robert_kelevra/Data/segmentation_data/synthetic_shapes/test"
  # Images per forward/backward pass.
  batch_size: 16
  # Metric logging interval, in iterations.
  information_dump: 100
  # Checkpoint and test evaluation interval, in iterations.
  weight_saving_iterations: 1000
  # Interval (iterations) of extra checkpoints without test evaluation, below weight_saving_iterations, 0 for none.
  intermediate_weight_saving_iterations: 500
  # Total training iterations.
  number_iterations: 1e10
  # Validation interval in iterations: 0 never, 1 every iteration, N every Nth.
  validation_iteration_ratio: 25
  # Test evaluation at every weight_saving_iterations checkpoint on the whole test split at the network input resolution
  # (see original_resolution), padding and unlabelled pixels ignored: pixel accuracy, mean IoU, frequency-weighted IoU,
  # mean Dice, mean boundary IoU and boundary F1, per-class IoU / Dice / boundary IoU / boundary F1 / precision /
  # recall, the pixel confusion matrix and sample images saved in <run folder>/Evaluation/Iteration_<iteration>/.
  evaluation:
    # Reports every class: the class table (test pixels, IoU, Dice, boundary IoU, boundary F1, precision, recall, ROC
    # AUC, average precision, worst IoU first) in the console and Results.txt, the per-class and macro scalars in
    # TensorBoard, confusion_matrix.png and the one-against-rest ROC and precision-recall curves of the pixels from
    # probability histograms of 10,000 bins (roc_curves.png, precision_recall_curves.png, one plot up to 10 classes,
    # panels above), also in TensorBoard. False keeps the global metrics only (e.g. many classes); class_metrics.csv and
    # confusion_matrix.csv are always saved.
    per_class_report: True
    # Test images drawn once and shown at every evaluation as a grid of input, ground truth mask, predicted mask and
    # error map (right class pixels green, wrong class red, class missed as background yellow), saved in
    # Evaluation/Iteration_<n>/Samples/ and TensorBoard, evenly spread over the test images. 0 disables.
    number_sample_images: 8
    # Saves the predicted mask of every test image at every evaluation in Evaluation/Iteration_<n>/Predicted_Masks/
    # (single-channel PNG of class indices at the evaluated resolution, see original_resolution). Grows with the test
    # set; False skips it on large ones.
    save_predicted_masks: False
    # Computes the metrics at the original resolution of every test image against its original mask, the probabilities
    # resized back to the image (without keep_ratio padding), as deployed: thin structures lost by mask resizing are
    # then scored. False scores at the network resolution (or the tile scale with Data.tiling). Predicted masks are
    # saved at the same resolution.
    original_resolution: False
    # Pixels (at the evaluated resolution) within which a predicted contour counts as right for the boundary metrics
    # (boundary IoU of bands of that width inside the true and predicted regions, boundary F1 of their edges), at least
    # 1.
    boundary_tolerance: 2
  # MLflow tracking next to TensorBoard: hyperparameters, metric averages per information_dump, learning rate, test
  # metrics and small artifacts (configuration, confusion matrices, class metrics, Results.txt). An MLflow error only
  # prints a warning.
  tracking:
    # Turns MLflow tracking on.
    activated: False
    # MLflow server address (e.g. "http://192.168.1.20:5000"), or null for <experiment_folder>/mlflow.db, browsed with
    # "mlflow ui --backend-store-uri sqlite:///<experiment_folder>/mlflow.db". Credentials come from
    # MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD.
    tracking_uri: null
    # MLflow experiment, null for the task name ("semantic_segmentation").
    experiment_name: null
  # Base learning rate.
  learning_rate: 1.0e-3
  # Lets a resumed run train on a changed labels.json (the previous data.json kept as data_until_iteration_<n>.json);
  # False refuses it, a new run (run_name_suffix) being needed. A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Computes the receptive field
      compute_receptive_field: True
      # Shows the network input: Training and Validation windows with the images and their mask overlaid. SPACE: next
      # images, ENTER: exit without training (set False to train). Needs a display; no run folder is created.
      view_input_images: False

Optimization:
  # Optimizer: "adam", "adamw" (decoupled weight decay) or "sgd" (Nesterov momentum 0.9), at
  # ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Optimizer weight decay, 0 to disable.
  weight_decay: 0.0
  # After the warm-up: "constant", or "cosine" (to minimum_learning_rate_ratio x learning rate over decay_iterations,
  # then constant).
  learning_rate_schedule: "constant"
  # Linear learning rate warm-up iterations from 0, 0 to disable.
  warmup_iterations: 0
  # Cosine decay iterations after the warm-up (cosine schedule only).
  decay_iterations: 100000
  # Final cosine learning rate, as a fraction of the learning rate (cosine only).
  minimum_learning_rate_ratio: 0.01
  # Maximum global gradient norm, clipped before every step, null to disable.
  gradient_clipping_norm: null
  # Exponential moving average (EMA) of the weights, updated after every optimizer step:
  #   ema_weights = decay × ema_weights + (1 − decay) × current_weights
  # It averages about the last 1 / (1 − decay) iterations (0.999: 1,000). Every test evaluation also scores it
  # (Evaluation/Iteration_<n>/EMA/, Test_EMA curves). Saved in the checkpoints, no run name token, can change on resume;
  # 'pretrained' transfers load the averaged weights when present.
  exponential_moving_average:
    # Turns the weight moving average on.
    activated: False
    # Share of the average kept per update, strictly between 0 and 1.
    decay: 0.9998

Data:
  image_settings:
    # Input resolution of every image, masks resized with the nearest interpolation.
    size: 512
    # Keeps the original aspect ratio when resizing, mask padding being ignored.
    keep_ratio: True
  # Training on tiles, for images much larger than the network input holding small objects: images and masks are scaled
  # by 'scale', training samples are image_settings.size tiles at random places (fixed per image in validation), and
  # test images are segmented whole tile by tile, overlapping probabilities averaged, one image per batch. keep_ratio is
  # unused. Inference clients tile large images with vision_training/models/segmentation/sliding_window.py.
  tiling:
    activated: False
    # Image and mask scale before tiling, 1.0 for full resolution.
    scale: 1.0
    # Pixels shared by two neighbouring test tiles, below image_settings.size.
    overlap: 128
  label_mapping:
    # "binary" maps every mask category (pixel values 1 to 254) to the foreground class 1, next to the background 0.
    # "multi_class" uses the mapping file (class 0 being the background, pixel value 0); an unmapped category becomes
    # background, and the pixel value 255 marks unlabelled pixels, ignored by losses and metrics.
    mode: "multi_class"
    # JSON file mapping the dataset category IDs to sequential class IDs.
    mapping_file_path: "/home/robert_kelevra/Data/segmentation_data/synthetic_shapes/label_mapping.json"
  data_augmentation:
    # Global switch of the data augmentation (on the GPU, training batches only).
    activated: True
    # Probability that a training image is augmented, each activated type then applied with its own probability;
    # sequence frames share one augmentation.
    probability: 0.4
    types:
      # Geometric augmentations : masks too, nearest interpolation.
      # Random Crop : 75% to 100% of each side (same aspect ratio), resized back
      random_crop: { activated: True, probability: 0.3 }
      # Random Aspect Crop : 75% to 100% of the width and, separately, of the height, resized back (x0.75 to x1.33
      # stretch; other camera proportions, for keep_ratio False)
      random_aspect_crop: { activated: False, probability: 0.3 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side on a black canvas, objects appearing smaller
      random_zoom_out: { activated: False, probability: 0.3 }
      # Random Translation : shift of up to 25% along x, y or both, border filled black
      random_translation: { activated: False, probability: 0.5 }
      # Random Left-Right Flip
      random_left_right_flip: { activated: True, probability: 0.5 }
      # Random Up-Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation of -5° to 5°, uncovered mask pixels ignored
      random_rotation: { activated: True, probability: 0.3 }
      # Random +-90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.3 }
      # Random Perspective : corners moved inwards by up to 5% of half the width and height, border filled black;
      # refused for tasks with boxes, masks or keypoints
      random_perspective: { activated: False, probability: 0.3 }
      # Random Jigsaw : 2x2 pieces shuffled, breaking the global layout; refused for tasks with boxes, masks or
      # keypoints
      random_jigsaw: { activated: False, probability: 0.3 }

      # Photometric augmentations: images only.
      # Brightness (+-40 levels), contrast and saturation (x0.7 to x1.0)
      brightness_contrast_saturation: { activated: True, probability: 0.3 }
      # Random Hue : hue turned by up to 18 degrees (5% of the circle) either way
      random_hue: { activated: False, probability: 0.5 }
      # CLAHE, clip limit 2.0 on a 4x4 tile grid
      clahe_augment: { activated: False, probability: 0.3 }
      # Laplacian of Gaussian unsharp mask sharpening (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.3 }
      # Histogram equalization of the luminance (Y of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.3 }
      # Histogram equalization of one random channel (B, G or R) or all three
      equalize_bgr_histogram_augment: { activated: False, probability: 0.3 }
      # Random Noise : Gaussian noise, standard deviation 20 levels
      random_noise: { activated: True, probability: 0.3 }
      # Grayscale, kept on three channels
      gray_scale_augment: { activated: False, probability: 0.3 }
      # Random Colour augmentation : BGR to RGB channel swap
      random_colour_augmentation: { activated: False, probability: 0.3 }
      # Random Gamma : gamma 0.8 to 1.25, darkening or lightening the mid-tones
      random_gamma: { activated: False, probability: 0.3 }
      # Random Linear Illumination : 13 to 38 level ramp across the image, brightening or darkening one side
      random_linear_illumination: { activated: False, probability: 0.3 }
      # Random Plasma Shadow : irregular fractal shadows darkening by up to 77 levels
      random_plasma_shadow: { activated: False, probability: 0.3 }
      # Random Blur : 9x9 Gaussian kernel, sigma 2.5
      random_blur: { activated: False, probability: 0.3 }
      # Random Motion Blurring : 5 to 15 pixel streak at 0 to 180 degrees (camera or object motion)
      random_motion_blur: { activated: False, probability: 0.3 }
      # Random Haze : uniform grey airlight of 180 to 255 levels taking 20% to 60% of every pixel, a camera fog (after
      # the blurs, before solarization, black-out and erasing)
      random_haze: { activated: True, probability: 0.3 }
      # Random Solarize : pixels at or above 128 levels inverted
      random_solarize: { activated: False, probability: 0.2 }
      # Random Black Out : grid_size x grid_size cells, each blacked out with probability 0.2 (after the other
      # photometric types but the erasing); labels unchanged, so a hidden object keeps its label
      random_black_out: { activated: False, probability: 0.3, grid_size: 8 }
      # Random Erasing : one black rectangle of 2% to 15% of the image, height / width 0.3 to 3.3, applied last; labels
      # unchanged
      random_erasing: { activated: False, probability: 0.3 }

Backbone:
  # Input channels of the first convolution block: 3, the loaders giving BGR images
  input_channels : 3

  # [convolutions, output filters] of every block. Every block output before its pooling is a decoder skip connection,
  # each at half the resolution of the previous one.
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 32 ],
      "3": [ 2, 32 ],
      "4": [ 2, 64 ],
      "5": [ 2, 64 ],
      "6": [ 2, 128 ],
    }

  # Max pooling after the last block. With True, the last block output before it is one more decoder skip connection,
  # listed in the decoder convolutions.
  last_max_pooling: False

  normalization:
    # Scales the inputs to [-0.5, 0.5].
    input_normalization: True

    # Normalizes every image to zero mean and unit variance (after input_normalization).
    per_sample_normalization: False

    # Feature map normalization: "batch", "layer" (over channels) or "none".
    feature_map_normalization: "batch"

  modules:
    # Residual shortcuts every two convolutions from block 2 (https://arxiv.org/abs/1512.03385).
    residual_nets: True

    # Pre-activation shortcuts (https://arxiv.org/abs/1603.05027): normalization and ReLU before every convolution.
    # Requires residual_nets; RES2 token instead of RES.
    residual_nets_v2: False

    # Inception modules (https://arxiv.org/abs/1409.4842), output channels multiples of 8.
    inception: False

    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True

  # Backbone of another run (any task) initialising this one. The layer settings (input_channels, convolutions, modules,
  # normalization, last_max_pooling) must match; detection levels and image size may differ.
  pretrained:
    # Run folder of the loaded backbone, null for random weights (not reloaded on resume).
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded backbone (no gradient, frozen batch statistics); needs experiment_folder.
    freeze: False
    # Freezes the scale and shift of the loaded backbone normalizations while its convolutions learn; needs
    # experiment_folder, freeze False and a normalization.
    freeze_normalization_parameters: False
    # Learning rate factor of the loaded backbone, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

SegmentationDecoder:
  # Resolution doubling at every decoder level: "transposed" (learned 2x2 transposed convolution, stride 2) or
  # "bilinear" (bilinear upsampling then a 1x1 convolution to the level channels).
  upsampling: "transposed"
  # Convolution block of every decoder level, keyed by the backbone block whose skip connection it merges, as [3x3
  # convolutions, output channels], from the deepest level to the input resolution; the upsampled tensor is concatenated
  # with the skip connection before the block. Every skip connection needs its level: blocks 1 to N-1 of an N block
  # backbone, and block N with Backbone.last_max_pooling.
  convolutions:
    {
      "5": [ 2, 64 ],
      "4": [ 2, 64 ],
      "3": [ 2, 32 ],
      "2": [ 2, 32 ],
      "1": [ 1, 16 ],
    }
  # Backbone block options, applied to the decoder blocks.
  modules:
    # Squeeze and excitation in every decoder block
    squeeze_and_excite: False
    # Residual shortcuts every two decoder convolutions
    residual_nets: False
  # Decoder feature map normalization: "batch", "layer" or "none".
  feature_map_normalization: "batch"
  # Momentum of the batch normalization running statistics: 0.1 follows about the last 10 batches, 0.01 the last 100. No
  # run name token, can change on resume.
  batch_normalization_momentum: 0.1
  # Whole channel dropout before the final 1x1 class convolution, within [0, 1), 0 to disable.
  dropout_rate: 0.0
  # Deep supervision: a 1x1 head on every listed decoder level (keyed like convolutions), its class logits upsampled to
  # the input size and trained with the same losses times the level weight, to bring the gradient closer to the early
  # layers; training only, never in inference or exports. Intermediate levels only (the finest gives the segmentation),
  # e.g. { "5": 0.1, "4": 0.2, "3": 0.3, "2": 0.4 }; {} for none.
  deep_supervision_weights: {}
  # Decoder of another semantic segmentation run initialising this one. Upsampling, convolutions, modules, normalization
  # and the channels of the backbone blocks feeding its skip connections must match. The final 1x1 class convolution and
  # the deep supervision heads only transfer with load_class_layers, the classes being free otherwise.
  pretrained:
    # Run folder of the loaded decoder, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded decoder (no gradient, frozen batch statistics). Requires experiment_folder.
    freeze: False
    # Also loads the segmentation head and the deep supervision heads of the levels in both runs, which keep learning
    # when the decoder is frozen. The source classes (its data.json) must come first in this run, in order; appended
    # classes stay random. Requires experiment_folder; gives the DCL token.
    load_class_layers: False
    # Learning rate factor of the loaded decoder, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

SegmentationLoss:
  # Weight of the pixel cross entropy (unlabelled and padding pixels ignored), 0 to disable.
  cross_entropy_weight: 1.0
  # Gamma of the focal factor (1 - p)^gamma on the cross entropy of every pixel, lowering well classified pixels, 0 for
  # the plain cross entropy.
  focal_gamma: 0.0
  # Cross entropy label smoothing, within [0, 1), 0 to disable.
  label_smoothing: 0.0
  # Class weighting of the cross entropy: "none" (every pixel equal) or "balanced" (every class equal, inverse to its
  # training mask pixels, counted once and saved in the run folder).
  class_weighting: "none"
  # Weight of the soft Dice loss (one minus the mean Dice of the batch classes), counting every class equally whatever
  # its area, 0 to disable.
  dice_weight: 1.0
  # Weight of the Lovasz-Softmax loss, optimising the IoU of every class directly (a convex surrogate of 1 - IoU
  # averaged over the batch classes), often added late in training to push the mean IoU further, 0 to disable. The cross
  # entropy, Dice and Lovasz weights cannot all be 0.
  lovasz_weight: 0.0
  # Weight of the boundary loss, the cross entropy of the pixels near the true edges (with a neighbour of another
  # class), weighted 1 on the edges down to 0 beyond boundary_distance pixels, for precise contours; 0 disables.
  boundary_weight: 0.0
  # Pixels from the true edges over which the boundary loss weighs the pixels, at least 0 (edges only).
  boundary_distance: 3
