# Template configuration of a semantic segmentation dataset (one class per pixel). A split holds its images in
# <split>/data/, their masks in <split>/masks/ and a <split>/labels.json manifest listing the 'categories' and the
# 'samples', each sample giving its 'file_name' and its 'mask_file_name'. A mask is a single-channel uint8 PNG of the
# size of its image, every pixel holding the category identifier of the image pixel (0 for the background, 255 for
# the unlabelled pixels). The data folders below are to be pointed to an actual dataset.
ExperimentConfiguration:
  # Task trained by this configuration, selecting the trainer, the model and the checks of the task sections.
  # "semantic_segmentation" trains the U-Net semantic segmenter (one class per pixel), and requires the
  # SegmentationDecoder and SegmentationLoss sections.
  task: "semantic_segmentation"
  # Root folder of all the training runs. Every run is saved in a subfolder named after its settings (task, input,
  # backbone modules, normalization and blocks, decoder, classes, optimizer and weight decay unless plain Adam),
  # so that the same settings resume in the same folder and changed settings start a new one, e.g.
  # SEG_IN-KAR-512_SE-RES-BN-B1x32.2x64.2x64.2x128.2x128.2x256_UTC-DBN-D2x128.2x128.2x64.2x64.1x32_MC4. The
  # augmentation, batch size, learning rate and its schedule, gradient clipping, mixed precision, dropout rates and
  # SegmentationLoss settings give no token, so that a run can be resumed in its folder with changed values. The
  # format is described in vision_training/configuration_processing/run_name.py.
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments"
  # Root directory containing the training dataset images, masks and labels.json manifest.
  train_data_folder: "/home/robert_kelevra/Data/segmentation_data/semantic_segmentation/train"
  # Root directory containing the validation dataset images, masks and labels.json manifest.
  validation_data_folder: "/home/robert_kelevra/Data/segmentation_data/semantic_segmentation/validation"
  # Root directory containing the test dataset images, masks and labels.json manifest.
  test_data_folder: "/home/robert_kelevra/Data/segmentation_data/semantic_segmentation/test"
  # Number of images processed in a single forward/backward pass.
  batch_size: 16
  # Frequency (in iterations) to log performance metrics.
  information_dump: 500
  # Frequency (in iterations) to checkpoint the model weights and run the test evaluation on them.
  weight_saving_iterations: 5000
  # Frequency (in iterations) of additional checkpoints saved without running the test evaluation, between the
  # weight_saving_iterations checkpoints. Must be an integer strictly smaller than weight_saving_iterations.
  intermediate_weight_saving_iterations: 1000
  # Total number of training iterations before stopping.
  number_iterations: 1e10
  # Ratio controlling how often validation is run during training.
  # 0 = never run validation, 1 = run every iteration, 2 = every 2nd iteration, N = every Nth iteration.
  validation_iteration_ratio: 25
  # Test evaluation run at every weight_saving_iterations checkpoint on the whole test split, at the network input
  # resolution (see original_resolution), the padding and the unlabelled pixels being ignored: pixel accuracy, mean
  # IoU, frequency-weighted IoU, mean Dice, mean boundary IoU and boundary F1, IoU / Dice / boundary IoU / boundary F1
  # / precision / recall of every class, and the confusion matrix of the pixels and the sample images saved in
  # <run folder>/Evaluation/Iteration_<iteration>/.
  evaluation:
    # Reports every class at every evaluation: the table of the classes (test pixels, IoU, Dice, boundary IoU,
    # boundary F1, precision, recall, worst IoU first) in the console and Results.txt, their IoU / Dice / Boundary IoU /
    # Boundary F1 / Precision / Recall Test scalars in TensorBoard, and the confusion matrix image (confusion_matrix.png
    # and TensorBoard). False keeps the global metrics only, e.g. for many classes: class_metrics.csv and
    # confusion_matrix.csv are saved either way.
    per_class_report: True
    # Number of test images drawn once and shown at every evaluation, each as a grid of its input, its ground truth
    # mask, its predicted mask and its error map (correct pixels of the classes in green, pixels given a wrong class in
    # red, pixels of a class missed as background in yellow), saved in Evaluation/Iteration_<n>/Samples/ and sent to
    # TensorBoard. The images are evenly spread over the test images. 0 to disable.
    number_sample_images: 16
    # Saves the predicted mask of every test image at every evaluation in Evaluation/Iteration_<n>/Predicted_Masks/, a
    # single-channel PNG holding the class index of every pixel, at the evaluated resolution (see original_resolution).
    # Its size grows with the number of test images, False to skip it on large test sets.
    save_predicted_masks: False
    # Computes the metrics at the original resolution of every test image against its original mask, the predicted
    # probabilities being resized back to the image (without the padding of keep_ratio), as the deployed output is
    # used: thin structures lost by the resizing of the masks are then scored. False scores the masks at the network
    # resolution (or at the scale of the tiles with Data.tiling). The predicted masks are saved at the same resolution.
    original_resolution: False
    # Distance in pixels, at the evaluated resolution, within which a predicted contour counts as right for the
    # boundary metrics (boundary IoU of the bands of that width inside the true and predicted regions, boundary F1
    # of their edges), at least 1.
    boundary_tolerance: 2
  # Tracking of the run in MLflow, next to TensorBoard and Results.txt: the hyperparameters, the averages of the
  # training and validation metrics of every information_dump interval, the learning rate, the test metrics of every
  # evaluated checkpoint and a few small artifacts (configuration, confusion matrices, class metrics, Results.txt).
  # The tracking never blocks nor stops the training: any MLflow error prints one warning and the training
  # continues without it.
  tracking:
    # Turns the MLflow tracking on.
    activated: False
    # Address of an MLflow tracking server, e.g. "http://192.168.1.20:5000", or null for the local database of the
    # experiments root folder (sqlite:///<experiment_folder>/mlflow.db, artifacts in <experiment_folder>/mlartifacts),
    # browsed with "mlflow ui --backend-store-uri sqlite:///<experiment_folder>/mlflow.db". The credentials of a
    # server are read from the MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD environment variables, never from
    # this file.
    tracking_uri: null
    # MLflow experiment grouping the runs, null for the task name (e.g. "semantic_segmentation").
    experiment_name: null
    # Sends the configuration, the confusion matrices, the class metrics and Results.txt as artifacts.
    log_artifacts: True
  # Base learning rate used by the optimizer.
  learning_rate: 5.0e-4
  # Flag to attempt loading the most recent checkpoint to resume training.
  resume_training: true
  diagnosis_modes:
      # Choice to print out everything about the model
      verbose: False
      # Choice to compute Receptive-Field
      compute_receptive_field: True
      # Choice to compute final model size
      compute_model_size: True
      # Choice to view what is being fed to the neural network : opens a Training and a Validation window showing the
      # input images with their mask overlaid. SPACE shows the next images, ENTER closes the viewer and exits the
      # program without training, so set it to False to train. Requires a display (skipped with a warning otherwise). No
      # run folder is created in this mode.
      view_input_images: False

Optimization:
  # Optimizer of the model parameters: "adam", "adamw" (Adam with the weight decay decoupled from the gradients) or
  # "sgd" (stochastic gradient descent with Nesterov momentum 0.9), at ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Weight decay of the optimizer, 0 to disable.
  weight_decay: 0.0
  # Learning rate schedule after the warm-up: "constant", or "cosine" (decay to minimum_learning_rate_ratio times the
  # learning rate over decay_iterations, constant afterwards).
  learning_rate_schedule: "constant"
  # Iterations of the linear warm-up of the learning rate from 0, 0 to disable.
  warmup_iterations: 0
  # Iterations of the cosine decay, counted after the warm-up (cosine schedule only).
  decay_iterations: 100000
  # Learning rate at the end of the cosine decay, as a fraction of the learning rate (cosine schedule only).
  minimum_learning_rate_ratio: 0.01
  # Maximum norm of all the gradients together, clipped before every step, null to disable.
  gradient_clipping_norm: null
  # Runs the training and validation forward passes in bfloat16 (faster and lighter on recent GPUs), the weights and
  # the test evaluation staying in float32 (the data type of every model).
  mixed_precision: True

Data:
  loading:
    # Number of worker processes reading and resizing the images and masks. They stay alive between epochs and
    # evaluations, each decodes with a single OpenCV thread, and the training, validation and test loaders each have
    # their own workers. 0 loads in the main process (debugging).
    number_workers: 8
    # Number of batches prepared in advance by every worker.
    prefetch_batches: 2
  image_settings:
    # Target resolution to resize all input images, the masks being resized to it with the nearest interpolation.
    size: 512
    # Flag to maintain the original aspect ratio when resizing, the padding of the masks being ignored.
    keep_ratio: True
  # Training on tiles instead of whole images resized to the network input, for images much larger than the network
  # input holding small objects: the images and masks are scaled by 'scale', the training samples are tiles of
  # image_settings.size pixels cut at random places (at a place fixed per image for the validation), and the whole
  # test images are segmented tile by tile, the probabilities of the overlapping tiles being averaged, one image per
  # batch. keep_ratio is then unused. Inference clients segment large images the same way with
  # vision_training/models/segmentation/sliding_window.py.
  tiling:
    activated: False
    # Factor applied to the images and masks before cutting the tiles, 1.0 for their full resolution.
    scale: 1.0
    # Pixels shared by two neighbouring tiles of the test images, smaller than image_settings.size.
    overlap: 128
  label_mapping:
    # "binary" maps every category of the masks (pixel values 1 to 254) to the foreground class 1, next to the
    # background class 0. "multi_class" uses the mapping file, which gives the class index of every category, class 0
    # being the background (pixel value 0); an unmapped category becomes background, and the pixel value 255 marks
    # the unlabelled pixels, ignored by the losses and the metrics.
    mode: "multi_class"
    # Path to a JSON file mapping raw dataset category IDs to sequential model class IDs.
    mapping_file_path: "/home/robert_kelevra/Data/segmentation_data/semantic_segmentation/label_mapping.json"
  data_augmentation:
    # Global switch to enable or disable all data augmentation (applied on the GPU to training batches only).
    activated: True
    # Probability that a training image is augmented at all. Each activated type below is then applied to that
    # image with its own probability. For image sequences, all frames of a sequence share the same augmentation.
    probability: 0.3
    # Sequence tasks only (False for the image tasks): draws the photometric augmentations below frame by frame,
    # every frame of an augmented sequence getting its own brightness, noise, colour... while the geometric
    # augmentations stay the same for all its frames, a crop or a rotation per frame making the objects jump.
    independent_frames: False
    # Sequence tasks only (activated False for the image tasks): shuffles the real frames of a training window with
    # this probability, independently of the probability above, the padding frames staying last and each member of
    # a pair being shuffled on its own. For the sequences whose frame order carries no information (sets of photos).
    shuffle_frames: { activated: False, probability: 0.5 }
    types:
      # Geometric augmentations : applied to the masks too, with the nearest interpolation.
      # Random Crop : crop keeping 75% to 100% of each side (same aspect ratio), resized back to the input size
      random_crop: { activated: True, probability: 0.3 }
      # Random Left to Right Flip (mirror)
      random_left_right_flip: { activated: True, probability: 0.5 }
      # Random Up to Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation between -5° and 5°, the mask pixels uncovered by the rotation being ignored
      random_rotation: { activated: True, probability: 0.3 }
      # Random -90° or 90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.3 }

      # Photometric augmentations : applied to the images only.
      # Brightness (+-40 intensity levels), contrast and saturation (both x0.7 to x1.0) adjustments
      brightness_contrast_saturation: { activated: True, probability: 0.3 }
      # Contrast-limited Adaptive Histogram Equalization (CLAHE), clip limit 2.0 on a 4x4 grid of tiles
      clahe_augment: { activated: False, probability: 0.3 }
      # Image Sharpening with a Laplacian of Gaussian unsharp mask (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.3 }
      # Histogram Equalization of the luminance (Y channel of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.3 }
      # Histogram Equalization of one random channel (B, G or R) or of all three channels
      equalize_bgr_histogram_augment: { activated: False, probability: 0.3 }
      # Random Noise : Gaussian noise with a standard deviation of 40 intensity levels
      random_noise: { activated: True, probability: 0.3 }
      # Grayscale conversion, kept on three channels
      gray_scale_augment: { activated: False, probability: 0.3 }
      # Random Colour augmentation : swap of the blue and red channels (BGR to RGB)
      random_colour_augmentation: { activated: False, probability: 0.3 }
      # Random Image Blurring : 9x9 Gaussian kernel with sigma 2.5
      random_blur: { activated: False, probability: 0.3 }

Backbone:
  # Number of input channels for the initial convolution block (e.g., 3 for RGB images)
  input_channels : 3

  # First axis : Number of convolution Kernel maps per Convolution Block
  # Second axis : Number of output filters per kernel per convolution Block
  # The output of every block before its max pooling is a skip connection of the decoder, block 1 being at the input
  # resolution and every next block at half the resolution of the previous one.
  convolutions:
    {
      "1": [ 1, 32 ],
      "2": [ 2, 64 ],
      "3": [ 2, 64 ],
      "4": [ 2, 128 ],
      "5": [ 2, 128 ],
      "6": [ 2, 256 ],
    }

  # Choice to add last max pooling layer on last* convolution layer
  # With True, the output of the last block before this pooling is one more skip connection of the decoder, whose
  # convolutions then also list the last block.
  last_max_pooling: False

  normalization:
    # Input Normalization : Setting image range values between [-0.5:0.5]
    input_normalization: True

    # Per Sample Input Normalization : Normalizing each image to zero mean and unit variance
    # Applied after input_normalization when both are activated
    per_sample_normalization: False

    # Strategy for normalizing the feature maps in the convolution blocks.
    # Options are: "batch" (Batch Normalization), "layer" (Layer Normalization over channels), or "none" (No normalization)
    feature_map_normalization: "batch"
    # Momentum of the running mean and variance of the batch normalization layers (PyTorch convention): every
    # training batch moves them by this fraction, 0.1 following about the last 10 batches and 0.01 about the last
    # 100. Unused by the other normalizations, it gives no run name token and can change when a run resumes.
    batch_normalization_momentum: 0.1

  modules:
    # Residual Nets : Paper "Deep Residual Learning for Image Recognition" https://arxiv.org/abs/1512.03385
    # Shortcuts are added every two convolution layers, starting from the second convolution block
    residual_nets: True

    # Inception Modules : Paper "Going Deeper with Convolutions" https://arxiv.org/abs/1409.4842
    # Output channels of every block using inception must be multiples of 8
    inception: False

    # Convolution block (1-indexed) from which inception modules replace the plain convolutions
    inception_starting_block: 3

    # Squeeze and Excitation Nets : Paper "Squeeze and Excitation Networks" https://arxiv.org/pdf/1709.01507.pdf
    squeeze_and_excite: True

  # Backbone blocks branching out to the object detection heads. Must be [] for the semantic segmentation task, whose
  # decoder reads the output of every block.
  detection_convolution_block_indices: []

  # Backbone of another training run (of any task) initialising this run instead of random weights. Its settings
  # defining the layers (input_channels, convolutions, modules, normalization, last_max_pooling) must be identical to
  # the ones above, the detection blocks, the image size and the batch normalization momentum may differ.
  pretrained:
    # Run folder whose trained backbone initialises this run, null to start from random weights. A run resuming
    # from its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded backbone fixed (no gradient, batch normalization statistics frozen) so that only the heads of
    # the task learn. Requires an experiment_folder.
    freeze: False
    # Keeps the scale and shift of the batch or layer normalization layers of the loaded backbone fixed while its
    # convolutions learn, the batch normalization statistics still following the data of this run. Requires an
    # experiment_folder, freeze False and a feature_map_normalization other than "none".
    freeze_normalization_parameters: False
    # Multiplies the learning rate of the loaded backbone, e.g. 0.1 to fine-tune it ten times slower than the heads.
    learning_rate_multiplier: 1.0

SegmentationDecoder:
  # Upsampling doubling the resolution at every decoder level: "transposed" (2x2 transposed convolution with stride 2,
  # learned) or "bilinear" (bilinear upsampling followed by a 1x1 convolution to the channels of the level).
  upsampling: "transposed"
  # Convolution block of every decoder level, keyed by the backbone block whose skip connection it merges, as
  # [number of 3x3 convolutions, output channels], from the deepest level to the input resolution. The upsampled
  # tensor is concatenated with the skip connection, then goes through the block. Every skip connection must have its
  # level: the blocks 1 to N-1 of a backbone of N blocks, and the block N too with Backbone.last_max_pooling.
  convolutions:
    {
      "5": [ 2, 128 ],
      "4": [ 2, 128 ],
      "3": [ 2, 64 ],
      "2": [ 2, 64 ],
      "1": [ 1, 32 ],
    }
  # Same options as the backbone blocks, applied to the decoder blocks.
  modules:
    # Squeeze and Excitation in every decoder block
    squeeze_and_excite: False
    # Residual shortcuts every two convolution layers of the decoder blocks
    residual_nets: False
  # Normalization of the decoder feature maps: "batch", "layer" or "none".
  feature_map_normalization: "batch"
  # Momentum of the running mean and variance of the batch normalization layers (PyTorch convention): every
  # training batch moves them by this fraction, 0.1 following about the last 10 batches and 0.01 about the last
  # 100. Unused by the other normalizations, it gives no run name token and can change when a run resumes.
  batch_normalization_momentum: 0.1
  # Dropout of whole channels before the final 1x1 convolution giving the class logits, within [0, 1), 0 to disable.
  dropout_rate: 0.0
  # Deep supervision: a 1x1 head on every listed decoder level, keyed like convolutions, whose class logits are
  # upsampled to the input size and trained with the same losses times the weight of the level, so that the gradient
  # reaches the early layers more directly; the heads only serve the training, the inference and the exported models
  # never run them. Only the intermediate levels can be listed (the finest level gives the final segmentation), e.g.
  # { "5": 0.1, "4": 0.2, "3": 0.3, "2": 0.4 }. {} for no deep supervision.
  deep_supervision_weights: {}
  # Decoder of another semantic segmentation run initialising this run instead of random weights. Its upsampling,
  # convolutions, modules and normalization must be identical in both runs, as well as the channels of the backbone
  # blocks feeding its skip connections. The final 1x1 convolution giving the class logits is never transferred, so
  # the classes may differ.
  pretrained:
    # Run folder whose trained decoder initialises this run, null to start from random weights. A run resuming from
    # its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded decoder fixed (no gradient, batch normalization statistics frozen) so that only the other
    # components learn. Requires an experiment_folder.
    freeze: False
    # Multiplies the learning rate of the loaded decoder, e.g. 0.1 to fine-tune it ten times slower than the new
    # layers.
    learning_rate_multiplier: 1.0

SegmentationLoss:
  # Weight of the pixel cross entropy, the unlabelled and padding pixels being ignored, 0 to disable.
  cross_entropy_weight: 1.0
  # Focusing parameter of the focal factor (1 - p)^gamma applied to the cross entropy of every pixel, lowering the
  # weight of the well classified pixels, 0 for the plain cross entropy.
  focal_gamma: 0.0
  # Label smoothing of the cross entropy, within [0, 1), 0 to disable.
  label_smoothing: 0.0
  # Weighting of the classes in the cross entropy: "none" (every pixel weighs the same) or "balanced" (every class
  # weighs the same, the weights being inversely proportional to the number of pixels of each class in the training
  # masks, counted once and saved in the run folder).
  class_weighting: "none"
  # Weight of the soft Dice loss (one minus the mean Dice of the classes present in the batch), which counts every
  # class the same whatever its area, 0 to disable.
  dice_weight: 1.0
  # Weight of the Lovasz-Softmax loss, which optimises the IoU of every class directly (a convex surrogate of
  # 1 - IoU, averaged over the classes present in the batch), often added for the last part of a training to push
  # the mean IoU further, 0 to disable. The cross entropy, Dice and Lovasz weights cannot all be 0.
  lovasz_weight: 0.0
  # Weight of the boundary loss, the cross entropy of the pixels near the true edges (pixels with a neighbour of
  # another class), weighted 1 on the edges and decreasing linearly to 0 beyond boundary_distance pixels, for precise
  # contours, 0 to disable.
  boundary_weight: 0.0
  # Distance in pixels from the true edges over which the boundary loss weighs the pixels, at least 0 (the edges
  # only).
  boundary_distance: 3
