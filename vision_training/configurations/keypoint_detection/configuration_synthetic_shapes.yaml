# Synthetic keypoint dataset (the 35 SHAPE_CATEGORIES classes drawn upright, a stick figure and a house, 2 to 5 objects
# per image, each category with its own keypoints: polygon corners, star and plus sign tips, capsule ends and corners,
# stick figure joints, hollow shapes adding the corners of their hole...; the circle, ellipse, annulus and hollow
# ellipse are distractors without keypoints), created by vision_training/data/synthetic/create_synthetic_dataset.py with
# the "keypoint_detection" task. Every image is a training sample, all its objects detected at once. A simple task
# checking that the keypoint detector learns.
ExperimentConfiguration:
  # Task trained, selecting the trainer, model and checks. "keypoint_detection" trains the bottom-up keypoint detector
  # (HigherHRNet: a heatmap and a tag map per keypoint of every class on the whole image, keypoints grouped into objects
  # by their tags); needs HRNet and KeypointHead. Labels are COCO annotations with the 'keypoints' of every object and
  # the 'keypoints' names and 'skeleton' of every category.
  task: "keypoint_detection"
  # Root of the training runs, each in a subfolder named after its settings (task, input, backbone, high resolution
  # network, heatmap channels, hidden width and higher resolution branch, classes, optimizer and weight decay unless
  # plain Adam): the same settings resume, changed ones start a new folder, e.g.
  # KPT_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x64_HRSE-HRRES-HRBN-HR16.1.2.2x2_K243-KH256-HH_MC33. The augmentation, heatmap
  # sigma, tag loss weights, grouping settings, batch size, learning rate and its schedule, and gradient clipping give
  # no token and can change on resume (format: vision_training/configuration_processing/run_name.py).
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments"
  # Last run name section, e.g. "v1" giving <run name>_v1, to start a new folder for the same settings with another
  # batch size, augmentation or learning rate. Letters, digits, '-' and '.', null for none.
  run_name_suffix: null
  # Training images and labels.json annotations, which also give the keypoint names and skeleton of every category.
  train_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/train"
  # Validation images and labels.json annotations.
  validation_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/validation"
  # Test images and labels.json annotations. Objects without labelled keypoint (the distractors) are left out of the
  # labels of every split, their images kept: the heatmaps learn to find no keypoint on them.
  test_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/test"
  # Whole images per forward/backward pass.
  batch_size: 16
  # Metric logging interval, in iterations.
  information_dump: 500
  # Checkpoint and test evaluation interval, in iterations.
  weight_saving_iterations: 2000
  # Interval (iterations) of extra checkpoints without test evaluation, below weight_saving_iterations, 0 for none.
  intermediate_weight_saving_iterations: 1000
  # Total training iterations.
  number_iterations: 20000
  # Validation interval in iterations: 0 never, 1 every iteration, N every Nth.
  validation_iteration_ratio: 0
  # Test evaluation at every weight_saving_iterations checkpoint on the whole test split: the keypoints found are
  # grouped into objects with KeypointHead.inference (every object kept whatever its score), each scored against the
  # ground truth objects of its class by the object keypoint similarity (OKS), which replaces the IoU of the detection
  # average precisions (OKS mAP@0.5, @0.75, @0.95 and @0.5:0.95). Every ground truth object is then matched to at most
  # one found object (largest total OKS) for the matched share, PCK@0.05 (a keypoint within 0.05 of the longest box
  # side), the mean OKS and the mean pixel error, a missed object or keypoint counting as wrong.
  evaluation:
    # Reports every class and keypoint: the class table (objects, OKS average precisions, matched objects, PCK, mean OKS
    # and mean pixel error, worst AP@0.5 first) and the per-keypoint table of every class (labelled keypoints, PCK, mean
    # pixel error) in the console and Results.txt, and the per-class AP@0.5 Test scalar in TensorBoard. False keeps the
    # global metrics only; class_metrics.csv and keypoint_metrics.csv are always saved.
    per_class_report: True
    # Test images drawn once and shown at every evaluation: ground truth objects next to the objects found reaching
    # KeypointHead.inference.object_score_threshold, each with its keypoints and class skeleton, saved in
    # Evaluation/Iteration_<n>/Samples/ and TensorBoard. 0 disables.
    number_sample_images: 16
    # Standard deviation of every keypoint in the object keypoint similarity, as a fraction of the square root of the
    # object box area (the COCO sigma, half the keypoint constant): a keypoint 2 x sigma x sqrt(box area) from the
    # ground truth scores exp(-0.5) = 0.61. Used for the keypoints missing from keypoint_sigmas; > 0.
    default_keypoint_sigma: 0.05
    # Standard deviation of chosen keypoints, by category then keypoint name, the others keeping default_keypoint_sigma;
    # a loose keypoint (a joint under clothes) gets more than a sharp corner. Categories merged by the label mapping
    # must agree on their common keypoints; {} keeps the default. Below, the COCO sigmas of the matching human joints
    # (elbows, wrists, knees, ankles).
    keypoint_sigmas:
      stick_figure: { left_elbow: 0.072, right_elbow: 0.072, left_hand: 0.062, right_hand: 0.062, left_knee: 0.087,
                      right_knee: 0.087, left_foot: 0.089, right_foot: 0.089 }
  # MLflow tracking next to TensorBoard: hyperparameters, metric averages per information_dump, learning rate, test
  # metrics and small artifacts (configuration, class and keypoint metrics, Results.txt). An MLflow error only prints a
  # warning.
  tracking:
    # Turns MLflow tracking on.
    activated: False
    # MLflow server address (e.g. "http://192.168.1.20:5000"), or null for <experiment_folder>/mlflow.db, browsed with
    # "mlflow ui --backend-store-uri sqlite:///<experiment_folder>/mlflow.db". Credentials come from
    # MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD.
    tracking_uri: null
    # MLflow experiment, null for the task name ("keypoint_detection").
    experiment_name: null
  # Base learning rate.
  learning_rate: 1.0e-3
  # Lets a resumed run train on a changed labels.json (the previous data.json kept as data_until_iteration_<n>.json);
  # False refuses it, a new run (run_name_suffix) being needed. A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Computes the receptive field
      compute_receptive_field: True
      # Shows the network input: Training and Validation windows with the whole images, the boxes and keypoints of their
      # objects (left blue, right orange, others yellow, occluded as rings) and the class skeleton, next to a panel of
      # the objects per class, the keypoints by visibility and the drawn augmentations. SPACE: next images, ENTER: exit
      # without training (set False to train). Needs a display; no run folder is created.
      view_input_images: False

Optimization:
  # Optimizer: "adam", "adamw" (decoupled weight decay) or "sgd" (Nesterov momentum 0.9), at
  # ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Optimizer weight decay, 0 to disable.
  weight_decay: 0.0
  # After the warm-up: "constant", or "cosine" (to minimum_learning_rate_ratio x learning rate over decay_iterations,
  # then constant).
  learning_rate_schedule: "cosine"
  # Linear learning rate warm-up iterations from 0, 0 to disable.
  warmup_iterations: 500
  # Cosine decay iterations after the warm-up (cosine schedule only).
  decay_iterations: 19500
  # Final cosine learning rate, as a fraction of the learning rate (cosine only).
  minimum_learning_rate_ratio: 0.01
  # Maximum global gradient norm, clipped before every step, null to disable.
  gradient_clipping_norm: null
  # Exponential moving average (EMA) of the weights, updated after every optimizer step:
  #   ema_weights = decay × ema_weights + (1 − decay) × current_weights
  # It averages about the last 1 / (1 − decay) iterations (0.999: 1,000). Every test evaluation also scores it
  # (Evaluation/Iteration_<n>/EMA/, Test_EMA curves). Saved in the checkpoints, no run name token, can change on resume;
  # 'pretrained' transfers load the averaged weights when present.
  exponential_moving_average:
    # Turns the weight moving average on.
    activated: True
    # Share of the average kept per update, strictly between 0 and 1.
    decay: 0.999

Data:
  image_settings:
    # Input resolution of every image, the size of the synthetic keypoint images; a multiple of the stride of the lowest
    # HRNet branch (4 x 2 ** the number of stages of HRNet.modules_per_stage, 32 for 3 stages). The keypoints are
    # evaluated in its pixels.
    size: 512
    # Keeps the original aspect ratio when resizing.
    keep_ratio: True
  label_mapping:
    # "multi_class" (mapping file), the only keypoint detection mode: every class has its own keypoints.
    mode: "multi_class"
    # JSON file mapping the dataset category IDs to sequential class IDs (0 being the background). The synthetic
    # categories with keypoints are numbered from 1; the circle, ellipse, annulus and hollow ellipse are distractors
    # without keypoints, left unlabelled. Merged categories need the same keypoint names.
    mapping_file_path: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/label_mapping.json"
  data_augmentation:
    # Global switch of the data augmentation (on the GPU, training batches only).
    activated: True
    # Probability that a training image is augmented; every activated type is then applied with its own probability.
    probability: 0.4
    types:
      # Geometric augmentations : boxes and keypoints move with the image, keypoints leaving it become unlabelled, and
      # an object is removed when under 25% of its box and none of its labelled keypoints stay inside. Keypoints keep
      # their names and heatmap channels whatever the augmentation, so flips and large rotations only suit names free of
      # side and orientation (the tip of a flame), the choice of the user.
      # The synthetic keypoints are named by their place on the upright shape (top_left corner of a square), so flips
      # and 90 degree rotations are off.
      # Random Crop : 75% to 100% of each side (same ratio), resized back
      random_crop: { activated: True, probability: 0.3 }
      # Random Aspect Crop : 75% to 100% of the width and, separately, of the height, resized back (x0.75 to x1.33
      # stretch; other camera proportions, for keep_ratio False)
      random_aspect_crop: { activated: False, probability: 0.3 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side on a black canvas, objects appearing smaller
      random_zoom_out: { activated: True, probability: 0.3 }
      # Random Translation : shift of up to 25% along x, y or both, border filled black
      random_translation: { activated: True, probability: 0.5 }
      # Random Left-Right Flip
      random_left_right_flip: { activated: False, probability: 0.5 }
      # Random Up-Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation of -5° to 5°
      random_rotation: { activated: True, probability: 0.3 }
      # Random +-90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.3 }
      # Random Perspective : corners moved inwards by up to 5% of half the width and height, border filled black;
      # refused for tasks with boxes, masks or keypoints
      random_perspective: { activated: False, probability: 0.3 }
      # Random Jigsaw : 2x2 pieces shuffled, breaking the global layout; refused for tasks with boxes, masks or
      # keypoints
      random_jigsaw: { activated: False, probability: 0.3 }

      # Photometric augmentations: keypoints unchanged.
      # Brightness (+-40 levels), contrast and saturation (x0.7 to x1.0)
      brightness_contrast_saturation: { activated: True, probability: 0.3 }
      # Random Hue : hue turned by up to 18 degrees (5% of the circle) either way
      random_hue: { activated: False, probability: 0.5 }
      # CLAHE, clip limit 2.0 on a 4x4 tile grid
      clahe_augment: { activated: False, probability: 0.3 }
      # Laplacian of Gaussian unsharp mask sharpening (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.3 }
      # Histogram equalization of the luminance (Y of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.3 }
      # Histogram equalization of one random channel (B, G or R) or all three
      equalize_bgr_histogram_augment: { activated: False, probability: 0.3 }
      # Random Noise : Gaussian noise, standard deviation 20 levels
      random_noise: { activated: True, probability: 0.3 }
      # Grayscale, kept on three channels
      gray_scale_augment: { activated: True, probability: 0.3 }
      # Random Colour augmentation : BGR to RGB channel swap
      random_colour_augmentation: { activated: True, probability: 0.3 }
      # Random Gamma : gamma 0.8 to 1.25, darkening or lightening the mid-tones
      random_gamma: { activated: False, probability: 0.3 }
      # Random Linear Illumination : 13 to 38 level ramp across the image, brightening or darkening one side
      random_linear_illumination: { activated: False, probability: 0.3 }
      # Random Plasma Shadow : irregular fractal shadows darkening by up to 77 levels
      random_plasma_shadow: { activated: False, probability: 0.3 }
      # Random Blur : 9x9 Gaussian kernel, sigma 2.5
      random_blur: { activated: True, probability: 0.3 }
      # Random Motion Blurring : 5 to 15 pixel streak at 0 to 180 degrees (camera or object motion)
      random_motion_blur: { activated: False, probability: 0.3 }
      # Random Haze : uniform grey airlight of 180 to 255 levels taking 20% to 60% of every pixel, a camera fog (after
      # the blurs, before solarization, black-out and erasing)
      random_haze: { activated: True, probability: 0.3 }
      # Random Solarize : pixels at or above 128 levels inverted
      random_solarize: { activated: False, probability: 0.2 }
      # Random Black Out : grid_size x grid_size cells, each blacked out with probability 0.2 (after the other
      # photometric types but the erasing); labels unchanged, so a hidden object keeps its label
      random_black_out: { activated: False, probability: 0.3, grid_size: 8 }
      # Random Erasing : one black rectangle of 2% to 15% of the image, height / width 0.3 to 3.3, applied last; labels
      # unchanged
      random_erasing: { activated: False, probability: 0.3 }

# Keypoint stem: the first backbone blocks, bringing the image to a quarter of its resolution (highest HRNet branch,
# heatmaps). A 2x2 max pooling follows every block but the last: 3 blocks with last_max_pooling False, 2 with True.
Backbone:
  # Input channels of the first convolution block: 3, the loaders giving BGR images
  input_channels : 3

  # [convolutions, output filters] of every block.
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 32 ],
      "3": [ 2, 64 ],
    }

  # Max pooling after the last block.
  last_max_pooling: False

  normalization:
    # Scales the inputs to [-0.5, 0.5].
    input_normalization: True

    # Normalizes every image to zero mean and unit variance (after input_normalization).
    per_sample_normalization: False

    # Feature map normalization: "batch", "layer" (over channels) or "none".
    feature_map_normalization: "batch"

  modules:
    # Residual shortcuts every two convolutions from block 2 (https://arxiv.org/abs/1512.03385).
    residual_nets: True

    # Pre-activation shortcuts (https://arxiv.org/abs/1603.05027): normalization and ReLU before every convolution.
    # Requires residual_nets; RES2 token instead of RES.
    residual_nets_v2: False

    # Inception modules (https://arxiv.org/abs/1409.4842), output channels multiples of 8.
    inception: False

    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True

  # Backbone of another run (any task) loaded into the stem, as many first blocks as it has, e.g. from an ImageNet run.
  # The layer settings (input_channels, first convolutions, modules, normalization) must match; the image size may
  # differ.
  pretrained:
    # Run folder of the loaded backbone, null for random weights (not reloaded on resume).
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded stem (no gradient, frozen batch statistics), only HRNet and the keypoint head learning.
    # Requires experiment_folder.
    freeze: False
    # Freezes the scale and shift of the loaded stem normalizations while its convolutions learn. Requires
    # experiment_folder, freeze False and a normalization other than "none".
    freeze_normalization_parameters: False
    # Learning rate factor of the loaded stem, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

# High resolution network (HRNet, https://arxiv.org/abs/1902.09212) on the stem: a branch at a quarter of the image
# resolution through the whole network, plus a branch at half the resolution and twice the width per stage (1/4, 1/8,
# 1/16, 1/32 for 3 stages; base_width, 2 x base_width...), the branches exchanging features at the end of every module
# (each receiving the sum of all branches brought to its resolution and width). Only the highest resolution branch feeds
# the keypoint head.
HRNet:
  # Channels of the highest resolution branch, doubled per lower branch, e.g. 32 for HRNet-W32.
  base_width: 16
  # Exchange modules per stage, one branch added per stage: [1, 4, 3] gives the 4 branches and 8 modules of HRNet-W32.
  # Its length sets the lowest branch stride, 4 x 2 ** len, which Data.image_settings.size must be a multiple of.
  modules_per_stage: [1, 2, 2]
  # Residual pairs of 3x3 convolutions per branch and module, 4 in HRNet-W32.
  blocks_per_branch: 2
  modules:
    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True
    # Residual nets (https://arxiv.org/abs/1512.03385): a shortcut around every pair of branch convolutions
    residual_nets: True
  normalization:
    # "batch", "layer" (over channels) or "none"
    feature_map_normalization: "batch"
    # Momentum of the batch normalization running statistics: 0.1 follows about the last 10 batches, 0.01 the last 100.
    # No run name token, can change on resume.
    batch_normalization_momentum: 0.1
  # High resolution network of another KPT run initialising this one; base_width, modules_per_stage, blocks_per_branch,
  # modules, normalization and the channels of the last stem block must match.
  pretrained:
    # Run folder of the loaded network, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded network (no gradient, frozen batch statistics). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded network, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

# Keypoint head (HigherHRNet https://arxiv.org/abs/1908.10357, tags of Associative Embedding
# https://arxiv.org/abs/1611.05424): a 1x1 convolution of the highest resolution branch giving, at a quarter of the
# image resolution, a heatmap and a tag map per keypoint of every class (243 of each for the 33 synthetic classes).
# Heatmaps are the sigmoid of the logits, their targets Gaussians centred on the keypoints of every object with the
# keypoint cell at 1, every channel trained in every image (towards zero without keypoint). The keypoints found are the
# heatmap local maxima, placed in their cell at the peak of the parabola through the log-heatmap at the cell and its
# neighbours, scored by their cell value and grouped into objects by their tags.
KeypointHead:
  # Adds the HigherHRNet higher resolution branch: the highest resolution branch features and the heatmaps and tags
  # predicted from them are upsampled by a transposed convolution to half the image resolution, refined by
  # HRNet.blocks_per_branch residual blocks and turned into a second set of heatmaps with their own targets. Keypoints
  # are then found on the average of both heatmaps at half resolution, which helps small objects. Gives the HH token.
  higher_resolution: True
  # Channels of a 3x3 convolution (with normalization and ReLU) before the 1x1 convolution giving heatmaps and tags, in
  # the quarter resolution head and the higher resolution branch, 0 for none. The 1x1 convolution gives a linear
  # combination of its input channels per cell, which cannot raise every heatmap on its own keypoints while keeping the
  # others at zero when the heatmaps outnumber these channels: the hidden width should then reach the heatmap count (the
  # K token). Gives the KH<width> token when above 0.
  # The 243 heatmaps of the 33 classes far outnumber the 16 channels of HRNet-W16: on 4 images over 1500 iterations with
  # the squared error heatmap loss used before the focal loss, the 1x1 convolution alone raised the heatmaps of a few
  # classes only (heatmap loss 0.0115 at stride 4), against every keypoint of every object with a hidden width of 256
  # (0.0003).
  hidden_width: 256
  # Standard deviation of the target Gaussians in heatmap cells (a quarter of the image pixels, half with the higher
  # resolution branch), the same at both resolutions, 2 in HigherHRNet.
  heatmap_sigma: 2.0
  # Leaves the pixels of the objects without labelled keypoint out of the heatmap loss, as HigherHRNet with the COCO
  # crowds and persons without keypoints: heatmap cells at least half covered by them are left out at both resolutions
  # in every channel, so that the heatmaps learn neither keypoints nor their absence there, the keypoint cells of
  # labelled objects staying trained. The pixels come from the 'segmentation' of these objects, which all of them must
  # then have in the training and validation splits. The synthetic shapes have none, so their few shapes without
  # labelled keypoint stay trained towards 0. No run name token.
  ignore_unlabelled_objects: False
  # Weights of the tag losses next to the heatmap loss, the CornerNet focal loss (https://arxiv.org/abs/1808.01244)
  # summed over the cells of every channel and divided by the keypoint count: -(1 - p)^2 log(p) on the cells at 1, -(1 -
  # target)^4 p^2 log(1 - p) elsewhere, so that the many empty cells weigh little once below the keypoint cells and
  # cells near a keypoint are penalised less. The pull loss gathers the keypoint tags of every object around their mean,
  # the push loss separates the mean tags of the objects of one class in one image. CornerNet weights them by 0.1 next
  # to this heatmap loss.
  tag_pull_weight: 0.1
  tag_push_weight: 0.1
  # Grouping of keypoints into objects at inference (evaluation, sample images, deployment).
  inference:
    # Keypoint candidates per heatmap channel (its highest 3x3 local maxima), the most objects of a class per image.
    maximum_candidates: 30
    # Lowest heatmap score of a candidate grouped into an object, within ]0, 1[, the heatmaps being probabilities
    # starting at 0.01 on every cell.
    keypoint_threshold: 0.1
    # Largest distance between a keypoint tag and the mean tag of the object it joins, the keypoints of the class taken
    # in turn and matched to the objects of the previous ones, the others starting new objects. 1 in HigherHRNet.
    tag_threshold: 1.0
    # Lowest score of an object kept by the deployment and sample images, the score being the sum of its keypoint scores
    # over the keypoints of its class, so that an object missing keypoints scores lower. The evaluation keeps every
    # object, for the low-confidence end of the precision-recall curves.
    object_score_threshold: 0.2
  # Keypoint head of another KPT run initialising this one; the classes, their keypoints and HRNet.base_width must
  # match.
  pretrained:
    # Run folder of the loaded keypoint head, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded head (no gradient). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded head, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0
