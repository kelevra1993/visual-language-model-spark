# Synthetic keypoint dataset (create_synthetic_dataset.py "keypoint_detection"): 2 to 5 objects per image (35 upright
# shapes, stick figure, house), keypoints per category; circle, ellipse, annulus and hollow ellipse have none.
ExperimentConfiguration:
  # Task trained, selecting the trainer, model and checks. "keypoint_detection": bottom-up HigherHRNet keypoint
  # detector; needs HRNet, KeypointHead. Labels: COCO with object 'keypoints', category 'keypoints' and 'skeleton'.
  task: "keypoint_detection"
  # Root of the runs, a subfolder per model, data and optimizer settings (run_name.py), resumed if equal; augmentation,
  # heatmap sigma, tag loss, grouping, batch size, learning rate, schedule can change on resume.
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments"
  # Last run name section, e.g. "v1" giving <run name>_v1, to start a new folder for the same settings with another
  # batch size, augmentation or learning rate. Letters, digits, '-' and '.', null for none.
  run_name_suffix: null
  # Training images and labels.json annotations, which also give the keypoint names and skeleton of every category.
  train_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/train"
  # Validation images and labels.json annotations.
  validation_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/validation"
  # Test images and labels.json annotations. Objects without labelled keypoint (the distractors) are left out of the
  # labels of every split, their images kept: the heatmaps learn to find no keypoint on them.
  test_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/test"
  # Whole images per forward/backward pass.
  batch_size: 16
  # Metric logging interval, in iterations.
  information_dump: 500
  # Checkpoint and test evaluation interval, in iterations.
  weight_saving_iterations: 2000
  # Interval (iterations) of extra checkpoints without test evaluation, below weight_saving_iterations, 0 for none.
  intermediate_weight_saving_iterations: 1000
  # Total training iterations.
  number_iterations: 20000
  # Validation interval in iterations: 0 never, 1 every iteration, N every Nth.
  validation_iteration_ratio: 0
  # Test evaluation at every weight_saving_iterations checkpoint: KeypointHead.inference objects scored by OKS (mAP@0.5,
  # @0.75, @0.95, @0.5:0.95); at most one match per ground truth for matched share, PCK@0.05, mean OKS, pixel error.
  evaluation:
    # Reports every class and keypoint: class, OKS recall and per-keypoint tables (console, Results.txt), AP@0.5 in
    # TensorBoard. False: global metrics only; class_metrics.csv and keypoint_metrics.csv always saved.
    per_class_report: True
    # Test images drawn once, shown at every evaluation: ground truth objects next to those above
    # KeypointHead.inference.object_score_threshold, in Evaluation/Iteration_<n>/Samples/ and TensorBoard. 0 disables.
    number_sample_images: 16
    # Keypoint standard deviation in the object keypoint similarity, a fraction of sqrt(box area): a keypoint 2 x sigma
    # x sqrt(box area) away scores exp(-0.5) = 0.61. For the keypoints missing from keypoint_sigmas; > 0.
    default_keypoint_sigma: 0.05
    # Standard deviation of chosen keypoints by category then name, others (all with {}) default_keypoint_sigma; merged
    # categories must agree on shared keypoints. Below, COCO sigmas of matching joints (elbows, wrists, knees, ankles)
    keypoint_sigmas:
      stick_figure: { left_elbow: 0.072, right_elbow: 0.072, left_hand: 0.062, right_hand: 0.062, left_knee: 0.087,
                      right_knee: 0.087, left_foot: 0.089, right_foot: 0.089 }
  # MLflow tracking next to TensorBoard: hyperparameters, metric averages, learning rate, test metrics, small artifacts
  # (configuration, class and keypoint metrics, Results.txt); MLflow errors only warn.
  tracking:
    # Turns MLflow tracking on.
    activated: False
    # MLflow server address (e.g. "http://192.168.1.20:5000"), null for <experiment_folder>/mlflow.db; credentials from
    # MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD; browse: mlflow ui --backend-store-uri sqlite:///<that file>
    tracking_uri: null
    # MLflow experiment, null for the task name ("keypoint_detection").
    experiment_name: null
  # Base learning rate.
  learning_rate: 1.0e-3
  # Lets a resumed run train on a changed labels.json (the previous data.json kept as data_until_iteration_<n>.json);
  # False refuses it, a new run (run_name_suffix) being needed. A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Computes the receptive field
      compute_receptive_field: True
      # Shows the network input: Training and Validation windows, boxes, keypoints (left blue, right orange), skeleton.
      # SPACE: next images, ENTER: exit without training (False to train); needs a display, creates no run folder.
      view_input_images: False
      # Times the training step and the inference (PyTorch, TorchScript, ONNX Runtime, TensorRT) on one training batch,
      # at the configured and largest batch sizes that fit, then exits without training; no run folder is created.
      benchmark_speed: False

Optimization:
  # Optimizer: "adam", "adamw" (decoupled weight decay) or "sgd" (Nesterov momentum 0.9), at
  # ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Optimizer weight decay, 0 to disable.
  weight_decay: 0.0
  # After the warm-up: "constant", or "cosine" (to minimum_learning_rate_ratio x learning rate over decay_iterations,
  # then constant).
  learning_rate_schedule: "cosine"
  # Linear learning rate warm-up iterations from 0, 0 to disable.
  warmup_iterations: 500
  # Cosine decay iterations after the warm-up (cosine schedule only).
  decay_iterations: 19500
  # Final cosine learning rate, as a fraction of the learning rate (cosine only).
  minimum_learning_rate_ratio: 0.01
  # Exponential moving average of the weights, ema = decay x ema + (1 - decay) x weights per step (about 1 / (1 - decay)
  # iterations); scored at every test (Test_EMA), can change on resume; when on, 'pretrained' prefers the source EMA.
  exponential_moving_average:
    # Turns the weight moving average on.
    activated: True
    # Share of the average kept per update, strictly between 0 and 1.
    decay: 0.999

Data:
  image_settings:
    # Input resolution, the synthetic image size; a multiple of the lowest HRNet branch stride (4 x 2 ** the stages of
    # HRNet.modules_per_stage, 32 for 3 stages). Keypoints are evaluated in its pixels.
    size: 512
    # Keeps the original aspect ratio when resizing.
    keep_ratio: True
  label_mapping:
    # "multi_class" (mapping file), the only keypoint detection mode: every class has its own keypoints.
    mode: "multi_class"
    # JSON file mapping category IDs to sequential class IDs (0 background); keypoint categories from 1, the circle,
    # ellipse, annulus and hollow ellipse distractors left unlabelled. Merged categories need the same keypoint names.
    mapping_file_path: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/label_mapping.json"
  data_augmentation:
    # Global switch of the data augmentation (on the GPU, training batches only).
    activated: True
    # Probability that a training image is augmented; every activated type is then applied with its own probability.
    probability: 0.4
    types:
      # Geometric augmentations : outside keypoints unlabelled, objects under 25% of box with none inside dropped; flips
      # and 90° rotations off (names never swap). Random Crop : 75% to 100% of each side (same ratio), resized back
      random_crop: { activated: True, probability: 0.25 }
      # Random Aspect Crop : 75% to 100% of the width and, separately, of the height, resized back (x0.75 to x1.33
      # stretch; other camera proportions, for keep_ratio False)
      random_aspect_crop: { activated: False, probability: 0.25 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side on a black canvas, objects appearing smaller
      random_zoom_out: { activated: True, probability: 0.25 }
      # Random Translation : shift of up to 25% along x, y or both, border filled black
      random_translation: { activated: True, probability: 0.25 }
      # Random Left-Right Flip
      random_left_right_flip: { activated: False, probability: 0.5 }
      # Random Up-Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation of -5° to 5°
      random_rotation: { activated: True, probability: 0.25 }
      # Random +-90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.25 }
      # Random Perspective : corners moved inwards by up to 5% of half the width and height, border filled black;
      # refused for tasks with boxes, masks or keypoints
      random_perspective: { activated: False, probability: 0.25 }
      # Random Jigsaw : 2x2 pieces shuffled, breaking the global layout; refused for tasks with boxes, masks or
      # keypoints
      random_jigsaw: { activated: False, probability: 0.25 }

      # Photometric augmentations: keypoints unchanged.
      # Brightness (+-40 levels), contrast and saturation (x0.7 to x1.0)
      brightness_contrast_saturation: { activated: True, probability: 0.25 }
      # Random Hue : hue turned by up to 18 degrees (5% of the circle) either way
      random_hue: { activated: False, probability: 0.25 }
      # CLAHE, clip limit 2.0 on a 4x4 tile grid
      clahe_augment: { activated: False, probability: 0.25 }
      # Laplacian of Gaussian unsharp mask sharpening (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.25 }
      # Histogram equalization of the luminance (Y of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.25 }
      # Histogram equalization of one random channel (B, G or R) or all three
      equalize_bgr_histogram_augment: { activated: False, probability: 0.25 }
      # Random Noise : Gaussian noise, standard deviation 20 levels
      random_noise: { activated: True, probability: 0.25 }
      # Grayscale, kept on three channels
      gray_scale_augment: { activated: True, probability: 0.25 }
      # Random Colour augmentation : BGR to RGB channel swap
      random_colour_augmentation: { activated: True, probability: 0.25 }
      # Random Gamma : gamma 0.8 to 1.25, darkening or lightening the mid-tones
      random_gamma: { activated: False, probability: 0.25 }
      # Random Linear Illumination : 13 to 38 level ramp across the image, brightening or darkening one side
      random_linear_illumination: { activated: False, probability: 0.25 }
      # Random Plasma Shadow : irregular fractal shadows darkening by up to 77 levels
      random_plasma_shadow: { activated: False, probability: 0.25 }
      # Random Blur : 9x9 Gaussian kernel, sigma 2.5
      random_blur: { activated: True, probability: 0.25 }
      # Random Motion Blurring : 5 to 15 pixel streak at 0 to 180 degrees (camera or object motion)
      random_motion_blur: { activated: False, probability: 0.25 }
      # Random Haze : uniform grey airlight of 180 to 255 levels taking 20% to 60% of every pixel, a camera fog (after
      # the blurs, before solarization, black-out and erasing)
      random_haze: { activated: True, probability: 0.25 }
      # Random Solarize : pixels at or above 128 levels inverted
      random_solarize: { activated: False, probability: 0.25 }
      # Random Black Out : grid_size x grid_size cells, each blacked out with probability 0.2 (after the other
      # photometric types but the erasing); labels unchanged, so a hidden object keeps its label
      random_black_out: { activated: False, probability: 0.25, grid_size: 8 }
      # Random Erasing : one black rectangle of 2% to 15% of the image, height / width 0.3 to 3.3, applied last; labels
      # unchanged
      random_erasing: { activated: False, probability: 0.25 }

# Keypoint stem: the first backbone blocks, bringing the image to a quarter of its resolution (highest HRNet branch,
# heatmaps). A 2x2 max pooling follows every block but the last: 3 blocks with last_max_pooling False, 2 with True.
Backbone:
  # Input channels of the first convolution block: 3, the loaders giving BGR images
  input_channels : 3

  # [convolutions, output filters] of every block.
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 32 ],
      "3": [ 2, 64 ],
    }

  # Max pooling after the last block.
  last_max_pooling: False

  normalization:
    # Scales the inputs to [-0.5, 0.5].
    input_normalization: True

    # Normalizes every image to zero mean and unit variance (after input_normalization).
    per_sample_normalization: False

    # Feature map normalization: "batch", "layer" (over channels) or "none".
    feature_map_normalization: "batch"

  modules:
    # Residual shortcuts every two convolutions from block 2 (https://arxiv.org/abs/1512.03385).
    residual_nets: True

    # Pre-activation shortcuts (https://arxiv.org/abs/1603.05027): normalization and ReLU before every convolution.
    # Requires residual_nets; RES2 token instead of RES.
    residual_nets_v2: False

    # Inception modules (https://arxiv.org/abs/1409.4842), output channels multiples of 8.
    inception: False

    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True

  # Backbone of another run (any task) loaded into the stem, as many first blocks as it has; input_channels, first
  # convolutions, modules and normalization must match, the image size may differ.
  pretrained:
    # Run folder of the loaded backbone, null for random weights (not reloaded on resume).
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded stem (no gradient, frozen batch statistics), only HRNet and the keypoint head learning.
    # Requires experiment_folder.
    freeze: False
    # Freezes the scale and shift of the loaded stem normalizations while its convolutions learn. Requires
    # experiment_folder, freeze False and a normalization other than "none".
    freeze_normalization_parameters: False
    # Learning rate factor of the loaded stem, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

# High resolution network (HRNet, https://arxiv.org/abs/1902.09212) on the stem: a 1/4 resolution branch, each stage
# adding one at half resolution, twice the width (1/4 to 1/32 for 3 stages); only the 1/4 branch feeds the head.
HRNet:
  # Channels of the highest resolution branch, doubled per lower branch, e.g. 32 for HRNet-W32.
  base_width: 16
  # Exchange modules per stage, one branch added per stage: [1, 4, 3] gives the 4 branches and 8 modules of HRNet-W32.
  # Its length sets the lowest branch stride, 4 x 2 ** len, which Data.image_settings.size must be a multiple of.
  modules_per_stage: [1, 2, 2]
  # Residual pairs of 3x3 convolutions per branch and module, 4 in HRNet-W32.
  blocks_per_branch: 2
  modules:
    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True
    # Residual nets (https://arxiv.org/abs/1512.03385): a shortcut around every pair of branch convolutions
    residual_nets: True
  normalization:
    # "batch", "layer" (over channels) or "none"
    feature_map_normalization: "batch"
  # High resolution network of another KPT run initialising this one; base_width, modules_per_stage, blocks_per_branch,
  # modules, normalization and the channels of the last stem block must match.
  pretrained:
    # Run folder of the loaded network, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded network (no gradient, frozen batch statistics). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded network, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

# Keypoint head (HigherHRNet https://arxiv.org/abs/1908.10357, tags of https://arxiv.org/abs/1611.05424): a 1x1
# convolution of the 1/4 branch gives a heatmap and a tag map per keypoint of every class (243 each, 33 classes).
KeypointHead:
  # HigherHRNet branch: features, heatmaps and tags upsampled to half resolution, refined by HRNet.blocks_per_branch
  # residual blocks into second heatmaps, averaged with the first, which helps small objects. Gives the HH token.
  higher_resolution: True
  # Channels of a 3x3 convolution before the 1x1 heatmap and tag convolution of both heads, 0 for none; needed (at least
  # the K heatmap count) when heatmaps outnumber the HRNet channels, here 243 > 16. KH<width> token above 0.
  hidden_width: 256
  # Standard deviation of the target Gaussians in heatmap cells (a quarter of the image pixels, half with the higher
  # resolution branch), the same at both resolutions, 2 in HigherHRNet.
  heatmap_sigma: 2.0
  # Leaves out of the heatmap loss the cells at least half covered by objects without labelled keypoints, in every
  # channel; they then need a 'segmentation'. Off here (none): such shapes train towards 0. No run name token.
  ignore_unlabelled_objects: False
  # Weights of the tag losses next to the CornerNet heatmap focal loss (https://arxiv.org/abs/1808.01244, which uses
  # 0.1): pull gathers the tags of an object around their mean, push separates the mean tags of same-class objects.
  tag_pull_weight: 0.1
  tag_push_weight: 0.1
  # Grouping of keypoints into objects at inference (evaluation, sample images, deployment).
  inference:
    # Keypoint candidates per heatmap channel (its highest 3x3 local maxima), the most objects of a class per image.
    maximum_candidates: 30
    # Lowest heatmap score of a candidate grouped into an object, within ]0, 1[, the heatmaps being probabilities
    # starting at 0.01 on every cell.
    keypoint_threshold: 0.1
    # Largest distance between a keypoint tag and the mean tag of the object it joins, the keypoints of the class taken
    # in turn and matched to the objects of the previous ones, the others starting new objects. 1 in HigherHRNet.
    tag_threshold: 1.0
    # Lowest object score (sum of its keypoint scores over its class keypoints) kept by deployment and sample images;
    # the evaluation keeps every object for the precision-recall curves.
    object_score_threshold: 0.2
  # Keypoint head of another KPT run initialising this one; the classes, their keypoints and HRNet.base_width must
  # match.
  pretrained:
    # Run folder of the loaded keypoint head, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded head (no gradient). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded head, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0
