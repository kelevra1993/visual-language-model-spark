# Configuration of the synthetic keypoint dataset (the 35 shape classes of SHAPE_CATEGORIES drawn upright, a stick
# figure and a house, 2 to 5 objects per image, each category with its own keypoints: the corners of the polygons, the
# tips of the star and of the plus sign, the ends and corners of the capsule, the joints of the stick figure, the hollow
# polygons and capsule adding the corners of their hole to those of their filled shape..., the circle, the ellipse,
# the annulus and the hollow ellipse being distractors without keypoints), created with
# vision_training/data/synthetic/create_synthetic_dataset.py with the "keypoint_detection" task. Every object of an
# image is one training sample, cut out of the image around its ground truth box. It is a trivial keypoint detection
# task, used to check that the keypoint detector learns.
ExperimentConfiguration:
  # Task trained by this configuration, selecting the trainer, the model and the checks of the task sections.
  # "keypoint_detection" trains the top-down keypoint detector (one crop per object box, one heatmap per keypoint), and
  # requires the Data.crop_settings, Data.crop_augmentation, HRNet and KeypointHead sections. The labels are COCO
  # annotations with the 'keypoints' of every object and the 'keypoints' names and 'skeleton' of every category.
  task: "keypoint_detection"
  # Root folder of all the training runs. Every run is saved in a subfolder named after its settings (task, input,
  # backbone modules, normalization and blocks, crop size, high resolution network, heatmap channels, classes,
  # optimizer and weight decay unless plain Adam), so that the same settings resume in the same folder and changed
  # settings start a new one, e.g. KPT_IN-KAR-512_SE-RES-BN-B1x16.2x32.2x64_C192x192_HRSE-HRRES-HRBN-HR16.1.2.2x2_K243_
  # MC33 (without the line break). The augmentation, crop augmentation, heatmap sigma, batch size, learning rate and its
  # schedule, gradient clipping and mixed precision give no token, so that a run can be resumed in its folder with
  # changed values. The format is described in vision_training/configuration_processing/run_name.py.
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments"
  # Root directory containing the training dataset images and labels.json annotation file. The keypoint names,
  # skeleton and crop rotation limit of every category are read from its labels.json.
  train_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/train"
  # Root directory containing the validation dataset images and labels.json annotation file.
  validation_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/validation"
  # Root directory containing the test dataset images and labels.json annotation file. The objects without any
  # labelled keypoint are left out of every split, having nothing to learn from nor to evaluate.
  test_data_folder: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/test"
  # Number of object crops processed in a single forward/backward pass, the objects of an image being separate
  # samples.
  batch_size: 64
  # Frequency (in iterations) to log performance metrics.
  information_dump: 500
  # Frequency (in iterations) to checkpoint the model weights and run the test evaluation on them.
  weight_saving_iterations: 2000
  # Frequency (in iterations) of additional checkpoints saved without running the test evaluation, between the
  # weight_saving_iterations checkpoints. Must be an integer strictly smaller than weight_saving_iterations.
  intermediate_weight_saving_iterations: 1000
  # Total number of training iterations before stopping.
  number_iterations: 20000
  # Ratio controlling how often validation is run during training.
  # 0 = never run validation, 1 = run every iteration, 2 = every 2nd iteration, N = every Nth iteration.
  validation_iteration_ratio: 0
  # Test evaluation run at every weight_saving_iterations checkpoint on the ground truth boxes of the whole test split
  # (no detector in the loop): the predicted keypoints of every crop are brought back to the network input image, and
  # every object is scored against the ground truth objects of its image with the object keypoint similarity (OKS),
  # which replaces the intersection over union of the detection average precisions (OKS mAP@0.5, @0.75, @0.95 and
  # @0.5:0.95, the score of an object being the mean score of its keypoints). The percentage of correct keypoints
  # (PCK@0.05: a keypoint within 0.05 of the longest box side), the mean OKS and the mean pixel error are computed too.
  evaluation:
    # Reports every class and every keypoint at every evaluation: the table of the classes (objects, OKS average
    # precisions, PCK, mean OKS and mean pixel error, worst AP@0.5 first) and the table of every keypoint of every class
    # (labelled keypoints, PCK and mean pixel error) in the console and Results.txt, and the AP@0.5 Test scalar of every
    # class in TensorBoard. False keeps the global metrics only: class_metrics.csv and keypoint_metrics.csv are saved
    # either way.
    per_class_report: True
    # Number of test objects drawn once and shown at every evaluation, each as its crop with the ground truth keypoints
    # next to the same crop with the predicted keypoints and the skeleton of its category, the caption giving its OKS,
    # its correct keypoints and its score, saved in Evaluation/Iteration_<n>/Samples/ and sent to TensorBoard. The
    # classes receive one object each in turn, in class order, so 33 shows one object of every synthetic class.
    # 0 to disable.
    number_sample_images: 33
    # Standard deviation of every keypoint of the object keypoint similarity, as a fraction of the square root of the
    # box area of the object (the COCO sigma, the constant of the keypoint being twice this value): a keypoint at a
    # distance of 2 x sigma x sqrt(box area) from the ground truth has a similarity of exp(-0.5) = 0.61. Used for the
    # keypoints not given in keypoint_sigmas. Must be > 0.
    default_keypoint_sigma: 0.05
    # Standard deviation of chosen keypoints, by category name and then keypoint name, the keypoints left out keeping
    # default_keypoint_sigma. A loosely defined keypoint (a joint under the clothes) gets a larger value than a sharp
    # corner. The categories merged into one class by the label mapping must give the same values to their common
    # keypoints. {} keeps the default for every keypoint. The values below are the COCO sigmas of the matching human
    # joints (elbows, wrists, knees and ankles).
    keypoint_sigmas:
      stick_figure: { left_elbow: 0.072, right_elbow: 0.072, left_hand: 0.062, right_hand: 0.062, left_knee: 0.087,
                      right_knee: 0.087, left_foot: 0.089, right_foot: 0.089 }
  # Tracking of the run in MLflow, next to TensorBoard and Results.txt: the hyperparameters, the averages of the
  # training and validation metrics of every information_dump interval, the learning rate, the test metrics of every
  # evaluated checkpoint and a few small artifacts (configuration, class and keypoint metrics, Results.txt). The
  # tracking never blocks nor stops the training: any MLflow error prints one warning and the training continues
  # without it.
  tracking:
    # Turns the MLflow tracking on.
    activated: False
    # Address of an MLflow tracking server, e.g. "http://192.168.1.20:5000", or null for the local database of the
    # experiments root folder (sqlite:///<experiment_folder>/mlflow.db, artifacts in <experiment_folder>/mlartifacts),
    # browsed with "mlflow ui --backend-store-uri sqlite:///<experiment_folder>/mlflow.db". The credentials of a
    # server are read from the MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD environment variables, never from
    # this file.
    tracking_uri: null
    # MLflow experiment grouping the runs, null for the task name (e.g. "keypoint_detection").
    experiment_name: null
    # Sends the configuration, the class and keypoint metrics and Results.txt as artifacts.
    log_artifacts: True
  # Base learning rate used by the optimizer.
  learning_rate: 1.0e-3
  # Flag to attempt loading the most recent checkpoint to resume training.
  resume_training: true
  diagnosis_modes:
      # Choice to print out everything about the model
      verbose: False
      # Choice to compute Receptive-Field
      compute_receptive_field: True
      # Choice to compute final model size
      compute_model_size: True
      # Choice to view what is being fed to the neural network : opens a Training and a Validation window showing the
      # object crops with their keypoints (left keypoints blue, right keypoints orange, the others yellow, the occluded
      # ones as rings) and the skeleton of their category, next to a panel giving the class, the labelled keypoints and
      # the drawn crop and photometric augmentations. SPACE shows the next crops, ENTER closes the viewer and exits the
      # program without training, so set it to False to train. Requires a display (skipped with a warning otherwise). No
      # run folder is created in this mode.
      view_input_images: False

Optimization:
  # Optimizer of the model parameters: "adam", "adamw" (Adam with the weight decay decoupled from the gradients) or
  # "sgd" (stochastic gradient descent with Nesterov momentum 0.9), at ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Weight decay of the optimizer, 0 to disable.
  weight_decay: 0.0
  # Learning rate schedule after the warm-up: "constant", or "cosine" (decay to minimum_learning_rate_ratio times the
  # learning rate over decay_iterations, constant afterwards).
  learning_rate_schedule: "cosine"
  # Iterations of the linear warm-up of the learning rate from 0, 0 to disable.
  warmup_iterations: 500
  # Iterations of the cosine decay, counted after the warm-up (cosine schedule only).
  decay_iterations: 19500
  # Learning rate at the end of the cosine decay, as a fraction of the learning rate (cosine schedule only).
  minimum_learning_rate_ratio: 0.01
  # Maximum norm of all the gradients together, clipped before every step, null to disable.
  gradient_clipping_norm: null
  # Runs the training and validation forward passes in bfloat16 (faster and lighter on recent GPUs), the weights and
  # the test evaluation staying in float32 (the data type of every model).
  mixed_precision: False
  # Exponential moving average (EMA) of the weights: a second copy of the model, never trained itself, moved towards
  # the trained weights after every optimizer step:
  #   ema_weights = decay × ema_weights + (1 − decay) × current_weights
  # It averages roughly the last 1 / (1 − decay) iterations (0.999: 1,000, 0.9998: 5,000, 0.9999: 10,000), its n-th
  # update using min(decay, (1 + n) / (10 + n)) so that the random starting weights fade quickly. Every test
  # evaluation scores the trained weights, then the EMA weights, in Evaluation/Iteration_<n>/EMA/, the Test_EMA
  # TensorBoard curves and the "EMA Weights" blocks of Results.txt. Saved in the checkpoints, it gives no run name
  # token and can be turned on or off when a run resumes. When on, the components transferred from another run (their
  # 'pretrained' settings) load its averaged weights if its checkpoint holds them, otherwise its trained weights.
  exponential_moving_average:
    # Turns the moving average of the weights on.
    activated: True
    # Fraction of the average kept at every update, strictly between 0 and 1.
    decay: 0.999

Data:
  loading:
    # Number of worker processes reading and resizing the images. They stay alive between epochs and evaluations,
    # each decodes with a single OpenCV thread, and the training, validation and test loaders each have their own
    # workers. 0 loads in the main process (debugging).
    number_workers: 8
    # Number of batches prepared in advance by every worker.
    prefetch_batches: 2
  image_settings:
    # Target resolution to resize all input images, the size of the synthetic keypoint images. The crops are cut out
    # of the resized images, and the evaluation measures the keypoints in their pixels.
    size: 512
    # Flag to maintain the original aspect ratio when resizing.
    keep_ratio: True
  label_mapping:
    # "multi_class" uses a specific mapping file, the only mode of the keypoint detection: every class has its own
    # keypoints.
    mode: "multi_class"
    # Path to a JSON file mapping raw dataset category IDs to sequential model class IDs (class 0 being the background).
    # The synthetic dataset numbers the categories with keypoints from 1 and leaves out the circle, the ellipse, the
    # annulus and the hollow ellipse, distractors without keypoints whose objects are never cut into crops. Categories merged into one class must have
    # the same keypoint names.
    mapping_file_path: "/home/robert_kelevra/Data/keypoint_data/synthetic_shapes/label_mapping.json"
  # Crops every object is cut to before the keypoint detector, the input of the network: the ground truth box centred,
  # widened along its short side to the aspect ratio of the crop (no distortion) and enlarged by box_enlargement, then
  # warped to height x width pixels. The heatmaps are a quarter of the crop size.
  crop_settings:
    # Height of the crops in pixels, a multiple of the stride of the lowest resolution branch of the high resolution
    # network (4 x 2 ** the number of stages of HRNet.modules_per_stage, 32 for 3 stages).
    height: 192
    # Width of the crops in pixels, a multiple of the same stride.
    width: 192
    # Factor applied to both sides of the region of the crop, keeping some context around the object, >= 1.
    box_enlargement: 1.25
  # Geometric augmentation of the training crops, drawn crop by crop and applied in the single warp that cuts the crop
  # out of the image, the keypoints being moved with it (the geometric types of data_augmentation would move the crops
  # without their keypoints, so they must be off). It is always applied to the training crops, whatever
  # data_augmentation.activated, the validation and test crops being cut without it. Keypoints leaving the crop are not
  # trained.
  crop_augmentation:
    # Range [minimum, maximum] of the scale of the crop region, drawn uniformly: above 1 the region grows and the
    # object looks smaller, below 1 it is cut more tightly.
    scale_range: [0.75, 1.25]
    # Largest rotation of the crops in degrees, either way, within [0, 180], the same for every class. The keypoints
    # keep their names whatever the rotation, and the synthetic keypoints are named by their place on the upright
    # shape: 20 degrees keeps every shape recognisably upright, the vertices of a nonagon being 40 degrees apart.
    maximum_rotation_degrees: 20.0
    # Probability that a training crop is rotated.
    rotation_probability: 0.6
    # Probability that a training crop is mirrored left to right. The keypoints keep their names and their heatmap
    # channels, so a flip only suits keypoints whose names do not depend on the side; 0 here, the top_left corner of a
    # mirrored square being where its top_right corner was.
    flip_probability: 0.0
    # Largest shift of the centre of the crop region, as a fraction of its sides, within [0, 0.5].
    maximum_shift_fraction: 0.1
  data_augmentation:
    # Global switch to enable or disable the photometric augmentations below (applied on the GPU to the training crops
    # only, after their warp). The crop augmentation is applied either way.
    activated: True
    # Probability that a training crop is augmented at all. Each activated type below is then applied to that crop
    # with its own probability.
    probability: 0.4
    # Sequence tasks only (False for the image tasks): draws the photometric augmentations below frame by frame,
    # every frame of an augmented sequence getting its own brightness, noise, colour... while the geometric
    # augmentations stay the same for all its frames, a crop or a rotation per frame making the objects jump.
    independent_frames: False
    # Sequence tasks only (activated False for the image tasks): shuffles the real frames of a training window with
    # this probability, independently of the probability above, the padding frames staying last and each member of
    # a pair being shuffled on its own. For the sequences whose frame order carries no information (sets of photos).
    shuffle_frames: { activated: False, probability: 0.5 }
    types:
      # Geometric augmentations : must all be off for the keypoint detection, the geometry of the crops being drawn by
      # crop_augmentation.
      # Random Crop : crop keeping 75% to 100% of each side (same aspect ratio), resized back to the input size
      random_crop: { activated: False, probability: 0.3 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side (same aspect ratio) at a random position of a
      # black canvas of the input size, the objects then appearing smaller than in the dataset
      random_zoom_out: { activated: False, probability: 0.3 }
      # Random Translation : shift along x, y or both (drawn at random) of up to 25% of the image width and
      # height, the uncovered border filled with black
      random_translation: { activated: False, probability: 0.5 }
      # Random Left to Right Flip (mirror)
      random_left_right_flip: { activated: False, probability: 0.5 }
      # Random Up to Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation between -5° and 5°
      random_rotation: { activated: False, probability: 0.3 }
      # Random -90° or 90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.3 }

      # Photometric augmentations : the keypoints are unchanged.
      # Brightness (+-40 intensity levels), contrast and saturation (both x0.7 to x1.0) adjustments
      brightness_contrast_saturation: { activated: True, probability: 0.3 }
      # Contrast-limited Adaptive Histogram Equalization (CLAHE), clip limit 2.0 on a 4x4 grid of tiles
      clahe_augment: { activated: False, probability: 0.3 }
      # Image Sharpening with a Laplacian of Gaussian unsharp mask (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.3 }
      # Histogram Equalization of the luminance (Y channel of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.3 }
      # Histogram Equalization of one random channel (B, G or R) or of all three channels
      equalize_bgr_histogram_augment: { activated: False, probability: 0.3 }
      # Random Noise : Gaussian noise with a standard deviation of 40 intensity levels
      random_noise: { activated: True, probability: 0.3 }
      # Grayscale conversion, kept on three channels
      gray_scale_augment: { activated: True, probability: 0.3 }
      # Random Colour augmentation : swap of the blue and red channels (BGR to RGB)
      random_colour_augmentation: { activated: True, probability: 0.3 }
      # Random Image Blurring : 9x9 Gaussian kernel with sigma 2.5
      random_blur: { activated: True, probability: 0.3 }

# Stem of the keypoint detector: the first blocks of the backbone of the other tasks, bringing the crop down to a
# quarter of its resolution, the resolution of the highest resolution branch of the HRNet section and of the
# heatmaps. Every block but the last one is followed by a 2x2 max pooling, so the stem needs 3 blocks with
# last_max_pooling False, or 2 blocks with last_max_pooling True.
Backbone:
  # Number of input channels of the initial convolution block: must be 3, the loaders giving BGR images
  input_channels : 3

  # First axis : Number of convolution Kernel maps per Convolution Block
  # Second axis : Number of output filters per kernel per convolution Block
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 32 ],
      "3": [ 2, 64 ],
    }

  # Choice to add last max pooling layer on last* convolution layer
  last_max_pooling: False

  normalization:
    # Input Normalization : Setting image range values between [-0.5:0.5]
    input_normalization: True

    # Per Sample Input Normalization : Normalizing each image to zero mean and unit variance
    # Applied after input_normalization when both are activated
    per_sample_normalization: False

    # Strategy for normalizing the feature maps in the convolution blocks.
    # Options are: "batch" (Batch Normalization), "layer" (Layer Normalization over channels), or "none" (No normalization)
    feature_map_normalization: "batch"
    # Momentum of the running mean and variance of the batch normalization layers (PyTorch convention): every
    # training batch moves them by this fraction, 0.1 following about the last 10 batches and 0.01 about the last
    # 100. Unused by the other normalizations, it gives no run name token and can change when a run resumes.
    batch_normalization_momentum: 0.1

  modules:
    # Residual Nets : Paper "Deep Residual Learning for Image Recognition" https://arxiv.org/abs/1512.03385
    # Shortcuts are added every two convolution layers, starting from the second convolution block
    residual_nets: True

    # Residual Nets v2 : Paper "Identity Mappings in Deep Residual Networks" https://arxiv.org/abs/1603.05027
    # Pre-activation shortcuts: every layer applies its normalization and ReLU before its convolution and nothing
    # follows the addition, so that the shortcuts form an identity path through the block, whose output is normalized
    # and activated at its end. Requires residual_nets, starts from the second block like it, and gives the RES2 run
    # name token instead of RES.
    residual_nets_v2: False

    # Inception Modules : Paper "Going Deeper with Convolutions" https://arxiv.org/abs/1409.4842
    # Output channels of every block using inception must be multiples of 8
    inception: False

    # Convolution block (1-indexed) from which inception modules replace the plain convolutions
    inception_starting_block: 3

    # Squeeze and Excitation Nets : Paper "Squeeze and Excitation Networks" https://arxiv.org/pdf/1709.01507.pdf
    squeeze_and_excite: True

  # Backbone of another training run (of any task) initialising the stem instead of random weights: its first blocks
  # are loaded, as many as the stem has, so that the stem can start from the backbone of an ImageNet classification
  # run. The settings defining those layers (input_channels, the first convolutions, modules, normalization) must be
  # identical to the ones above, the image size and the batch normalization momentum may differ.
  pretrained:
    # Run folder whose trained backbone initialises this run, null to start from random weights. A run resuming
    # from its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded stem fixed (no gradient, batch normalization statistics frozen) so that only the high resolution
    # network and the keypoint head learn. Requires an experiment_folder.
    freeze: False
    # Keeps the scale and shift of the batch or layer normalization layers of the loaded stem fixed while its
    # convolutions learn, the batch normalization statistics still following the data of this run. Requires an
    # experiment_folder, freeze False and a feature_map_normalization other than "none".
    freeze_normalization_parameters: False
    # Multiplies the learning rate of the loaded stem, e.g. 0.1 to fine-tune it ten times slower than the new layers.
    learning_rate_multiplier: 1.0

# High resolution network (HRNet, paper "Deep High-Resolution Representation Learning for Human Pose Estimation"
# https://arxiv.org/abs/1902.09212) on the stem: it keeps a branch at a quarter of the crop resolution through the whole
# network and adds a branch at half the resolution and twice the width at every stage (1/4, 1/8, 1/16, 1/32 of the crop
# for 3 stages, base_width, 2 x base_width...), the branches exchanging their features at the end of every module
# (every branch receiving the sum of all the branches brought to its resolution and width). Only the highest resolution
# branch feeds the keypoint head.
HRNet:
  # Width (channels) of the highest resolution branch, doubled by every lower resolution branch, e.g. 32 for HRNet-W32.
  base_width: 16
  # Number of exchange modules of every stage, one branch being added per stage: [1, 4, 3] gives the 4 branches and
  # 8 modules of HRNet-W32. Its length sets the stride of the lowest resolution branch, 4 x 2 ** len, which the crop
  # sides must be multiples of.
  modules_per_stage: [1, 2, 2]
  # Number of residual pairs of 3x3 convolutions of every branch in every module, 4 in HRNet-W32.
  blocks_per_branch: 2
  modules:
    # Squeeze and Excitation Nets : Paper "Squeeze and Excitation Networks" https://arxiv.org/pdf/1709.01507.pdf
    squeeze_and_excite: True
    # Residual Nets : Paper "Deep Residual Learning for Image Recognition" https://arxiv.org/abs/1512.03385
    # A shortcut around every pair of convolutions of the branches
    residual_nets: True
  normalization:
    # Options: "batch" (Batch Normalization), "layer" (Layer Normalization over channels), or "none" (No normalization)
    feature_map_normalization: "batch"
    # Momentum of the running mean and variance of the batch normalization layers (PyTorch convention): every
    # training batch moves them by this fraction, 0.1 following about the last 10 batches and 0.01 about the last
    # 100. Unused by the other normalizations, it gives no run name token and can change when a run resumes.
    batch_normalization_momentum: 0.1
  # High resolution network of another KPT run initialising this run. Its base_width, modules_per_stage,
  # blocks_per_branch, modules and normalization must be identical in both runs, as well as the channels of the last
  # block of the stem.
  pretrained:
    # Run folder whose trained high resolution network initialises this run, null to start from random weights. A run
    # resuming from its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded network fixed (no gradient, batch normalization statistics frozen) so that only the other
    # components learn. Requires an experiment_folder.
    freeze: False
    # Multiplies the learning rate of the loaded network, e.g. 0.1 to fine-tune it ten times slower than the new
    # layers.
    learning_rate_multiplier: 1.0

# Keypoint head: a 1x1 convolution of the highest resolution branch giving one heatmap per keypoint of every class
# (243 channels for the 33 synthetic classes), only the channels of the class of the crop being trained and decoded.
# The targets are Gaussians centred on the keypoints, the loss the mean squared error of the trained keypoints, and the
# keypoint of a heatmap its highest cell moved by a quarter of a cell towards its higher neighbour, its score the value
# of that cell.
KeypointHead:
  # Standard deviation of the target Gaussians in heatmap cells (a quarter of the crop pixels), 2 in HRNet.
  heatmap_sigma: 2.0
  # Keypoint head of another KPT run initialising this run. Both runs must have the same classes with the same
  # keypoints, as well as the same HRNet.base_width.
  pretrained:
    # Run folder whose trained keypoint head initialises this run, null to start from random weights. A run resuming
    # from its own checkpoints does not load it again.
    experiment_folder: null
    # Checkpoint iteration of that run, null for its last saved checkpoint.
    iteration: null
    # Keeps the loaded head fixed (no gradient) so that only the other components learn. Requires an
    # experiment_folder.
    freeze: False
    # Multiplies the learning rate of the loaded head, e.g. 0.1 to fine-tune it ten times slower than the new layers.
    learning_rate_multiplier: 1.0
