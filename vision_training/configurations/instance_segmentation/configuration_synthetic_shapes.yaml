# Synthetic shapes dataset (the 35 SHAPE_CATEGORIES classes (square, circle, triangle, rectangle, pentagon, hexagon,
# plus sign, star, octagon, rhombus, parallelogram, trapezoid, kite, heptagon, nonagon, ellipse, semicircle, annulus,
# capsule, L-shape and fifteen hollow versions, hollow_square to hollow_capsule), from 64 pixels to a third of the image
# side, a dataset made before the last twenty-six were added keeping the first nine), created by
# vision_training/data/synthetic/create_synthetic_dataset.py with the "instance_segmentation" task, whose objects carry
# the run length encoding of their visible part. A trivial task checking that the instance segmenter learns.
ExperimentConfiguration:
  # Task trained, selecting the trainer, model and checks. "instance_segmentation" trains the instance segmenter (the
  # two-stage detector with a mask head per detection level, as Mask R-CNN); needs RegionProposal, DetectionLevels,
  # Detector and MaskHead. Labels are COCO annotations whose objects have a 'segmentation' (polygons or run length
  # encoding), crowd annotations (iscrowd 1) being ordinary objects.
  task: "instance_segmentation"
  # Root of the training runs, each in a subfolder named after its settings (task, input, backbone, levels, anchors,
  # heads, classes, optimizer and weight decay unless plain Adam): the same settings resume, changed ones start a new
  # folder, e.g. (without the line break)
  #   INS_IN-KAR-1024_SE-RES-BN-B1x16.2x32.2x32.4x64.4x64.6x128.6x128_L567_A9.32-512.598295_RBN-R2x64_
  #   DSE-DRES-DBN-D7.2x64.256.128_MRES-MBN-M14.4x64_BIN
  # The augmentation, batch size, learning rate and its schedule, gradient clipping and mask threshold give no token and
  # can change on resume (format: vision_training/configuration_processing/run_name.py).
  experiment_folder: "/home/robert_kelevra/Projects/visual-language-model-spark/experiments"
  # Last run name section, e.g. "v1" giving <run name>_v1, to start a new folder for the same settings with another
  # batch size, augmentation or learning rate. Letters, digits, '-' and '.', null for none.
  run_name_suffix: null
  # Training images and labels.json annotations.
  train_data_folder: "/home/robert_kelevra/Data/instance_segmentation_data/synthetic_shapes/train"
  # Validation images and labels.json annotations.
  validation_data_folder: "/home/robert_kelevra/Data/instance_segmentation_data/synthetic_shapes/validation"
  # Test images and labels.json annotations.
  test_data_folder: "/home/robert_kelevra/Data/instance_segmentation_data/synthetic_shapes/test"
  # Images per forward/backward pass.
  batch_size: 64
  # Metric logging interval, in iterations.
  information_dump: 1000
  # Checkpoint and test evaluation interval, in iterations.
  weight_saving_iterations: 250
  # Interval (iterations) of extra checkpoints without test evaluation, below weight_saving_iterations, 0 for none.
  intermediate_weight_saving_iterations: 125
  # Total training iterations.
  number_iterations: 2000
  # Validation interval in iterations: 0 never, 1 every iteration, N every Nth.
  validation_iteration_ratio: 0
  # Test evaluation at every weight_saving_iterations checkpoint: mask and box mean average precisions (mAP) on the
  # whole test split, the mask mAP@0.5 of the area method comparing checkpoints, at the network input or original test
  # image resolution (see original_resolution).
  evaluation:
    # Reports every class: the mask and box class tables (ground truth objects, area method AP at IoU 0.5, 0.75, 0.95
    # and 0.5:0.95, worst AP@0.5 first, and in the mask table the threshold reaching target_precision with the recall it
    # keeps) and the mask and box recall tables (recall at IoU 0.5 and 0.75 with their 95% intervals, worst recall at
    # 0.5 first) in the console and Results.txt, the Mask AP@0.5 and AP@0.5 Test scalars in TensorBoard, and
    # confusion_matrix.png (also in TensorBoard). False keeps the mean average precisions only; class_metrics.csv,
    # class_thresholds.json and confusion_matrix.csv are always saved.
    per_class_report: True
    # Test images drawn once and shown at every evaluation: ground truth boxes and masks next to the detections reaching
    # Detector.inference.score_threshold (the deployment threshold, not evaluation.score_threshold) with their masks
    # above MaskHead.inference.mask_threshold, in the colour of their class, saved in Evaluation/Iteration_<n>/Samples/
    # and TensorBoard, evenly spread over the test images. 0 disables.
    number_sample_images: 8
    # Minimum class probability of the detections kept for the mAP, replacing Detector.inference.score_threshold during
    # evaluation only: the mAP needs low-confidence detections too, or the end of the precision-recall curve is cut and
    # the mAP underestimated. Within [0, 1].
    score_threshold: 0.05
    # Precision the score threshold of every class must reach, saved in class_thresholds.json for a class-by-class
    # deployment: from the most confident, the detections of a class are right when their mask finds an object mask of
    # the class at IoU 0.5 (mask AP@0.5 matching), and the lowest score keeping the precision (highest recall) is saved
    # with its recall. Only detections reaching score_threshold give a threshold. Within [0, 1].
    target_precision: 0.99
    # Scores boxes and masks at the original resolution of every test image, as deployed: detection boxes restored to
    # the image (without keep_ratio padding), masks pasted into them at that size and compared with the annotation masks
    # at that size, keeping every annotated object, also those too thin to survive resizing, then missed unless
    # detected. Object sizes (small, medium, large) are in original pixels, as in COCO. Proposal recall, sample and
    # error images stay at the network resolution. False scores everything at the network resolution, objects whose mask
    # vanishes once resized being left out of the test ground truth.
    original_resolution: False
    # Saves the errors of the detections reaching Detector.inference.score_threshold (as deployed, matched by masks at
    # IoU 0.5, right class first, as in confusion_matrix.csv) as images at every evaluation:
    # 'Evaluation/Iteration_<n>/Errors/FALSE-POSITIVE/<class>/' for a detection without object, 'Errors/MISSED/<class>/'
    # for an undetected object and 'Errors/<TRUE>-TO-<PREDICTED>/' for a wrong class. Drawn like the sample images with
    # the masks, the boxes in error in red dashes and the errors first in the caption, named '<image>_<score>.png' after
    # the highest error score ('<image>.png' for missed objects).
    error_dumps:
      # Saves error images.
      activated: False
      # Most images saved per error folder, the first met.
      maximum_per_class_pair: 20
  # MLflow tracking next to TensorBoard: hyperparameters, metric averages per information_dump, learning rate, test
  # metrics and small artifacts (configuration, confusion matrices, class metrics and thresholds, Results.txt). An
  # MLflow error only prints a warning.
  tracking:
    # Turns MLflow tracking on.
    activated: False
    # MLflow server address (e.g. "http://192.168.1.20:5000"), or null for <experiment_folder>/mlflow.db, browsed with
    # "mlflow ui --backend-store-uri sqlite:///<experiment_folder>/mlflow.db". Credentials come from
    # MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD.
    tracking_uri: null
    # MLflow experiment, null for the task name ("instance_segmentation").
    experiment_name: null
  # Base learning rate.
  learning_rate: 2.0e-4
  # Lets a resumed run train on a changed labels.json (the previous data.json kept as data_until_iteration_<n>.json);
  # False refuses it, a new run (run_name_suffix) being needed. A moved data folder with the same labels resumes.
  allow_data_change_on_resume: false
  diagnosis_modes:
      # Computes the receptive field
      compute_receptive_field: True
      # Shows the network input: Training and Validation windows with the images and their ground truth boxes and masks.
      # SPACE: next images, ENTER: exit without training (set False to train). Needs a display; no run folder is
      # created.
      view_input_images: False
      # Prints the share of the training, validation and test objects with an anchor overlapping them by
      # iou_threshold, per level and size, then exits without training; no run folder is created.
      compute_anchor_coverage: { activated: False, iou_threshold: 0.5 }

Optimization:
  # Optimizer: "adam", "adamw" (decoupled weight decay) or "sgd" (Nesterov momentum 0.9), at
  # ExperimentConfiguration.learning_rate.
  optimizer: "adam"
  # Optimizer weight decay, 0 to disable.
  weight_decay: 0.0
  # After the warm-up: "constant", or "cosine" (to minimum_learning_rate_ratio x learning rate over decay_iterations,
  # then constant).
  learning_rate_schedule: "constant"
  # Linear learning rate warm-up iterations from 0, 0 to disable.
  warmup_iterations: 0
  # Cosine decay iterations after the warm-up (cosine schedule only).
  decay_iterations: 100000
  # Final cosine learning rate, as a fraction of the learning rate (cosine only).
  minimum_learning_rate_ratio: 0.01
  # Maximum global gradient norm, clipped before every step, null to disable.
  gradient_clipping_norm: null
  # Exponential moving average (EMA) of the weights, updated after every optimizer step:
  #   ema_weights = decay × ema_weights + (1 − decay) × current_weights
  # It averages about the last 1 / (1 − decay) iterations (0.999: 1,000). Every test evaluation also scores it
  # (Evaluation/Iteration_<n>/EMA/, Test_EMA curves). Saved in the checkpoints, no run name token, can change on resume;
  # 'pretrained' transfers load the averaged weights when present.
  exponential_moving_average:
    # Turns the weight moving average on.
    activated: True
    # Share of the average kept per update, strictly between 0 and 1.
    decay: 0.9998
  # Weight of every detector loss in the total loss, e.g. above 1 on the mask loss when the masks lag behind the boxes.
  # Losses are tracked unweighted, the total weighted. Numbers >= 0, not all 0, a loss at 0 leaving the layers only it
  # trains unchanged. No run name token, can change on resume.
  loss_weights:
    # Objectness of the sampled region proposal anchors.
    region_proposal_classification_loss: 1.0
    # Box offsets of the positive region proposal anchors.
    region_proposal_localisation_loss: 1.0
    # Class of the sampled detection proposals, background included.
    detection_classification_loss: 1.0
    # Box offsets of the positive detection proposals.
    detection_regression_loss: 1.0
    # Masks of the positive mask head proposals.
    mask_loss: 1.0

Data:
  image_settings:
    # Input resolution of every image, the size of the synthetic instance segmentation images.
    size: 512
    # Keeps the original aspect ratio when resizing.
    keep_ratio: True
  label_mapping:
    # "binary" maps every foreground object to 1; "multi_class" uses the mapping file.
    mode: "multi_class"
    # JSON file mapping the dataset category IDs to sequential class IDs.
    mapping_file_path: "/home/robert_kelevra/Data/instance_segmentation_data/synthetic_shapes/label_mapping.json"
  data_augmentation:
    # Global switch of the data augmentation (on the GPU, training batches only).
    activated: True
    # Probability that a training image is augmented, each activated type then applied with its own probability;
    # sequence frames share one augmentation.
    probability: 0.4
    types:
      # Geometric augmentations : instance masks move with the image, every box becomes the tight box of its mask,
      # objects leaving the image are removed.
      # Random Crop : 75% to 100% of each side (same ratio), resized back
      random_crop: { activated: False, probability: 0.3 }
      # Random Aspect Crop : 75% to 100% of the width and, separately, of the height, resized back (x0.75 to x1.33
      # stretch; other camera proportions, for keep_ratio False)
      random_aspect_crop: { activated: False, probability: 0.3 }
      # Random Zoom Out : image shrunk to 50% to 100% of each side on a black canvas, objects appearing smaller
      random_zoom_out: { activated: False, probability: 0.3 }
      # Random Translation : shift of up to 25% along x, y or both, border filled black
      random_translation: { activated: False, probability: 0.5 }
      # Random Left-Right Flip
      random_left_right_flip: { activated: False, probability: 0.5 }
      # Random Up-Down Flip
      random_up_down_flip: { activated: False, probability: 0.5 }
      # Random Rotation of -5° to 5°, uncovered corners being background in the masks
      random_rotation: { activated: False, probability: 0.3 }
      # Random +-90° rotation (square images only)
      random_90_rotation: { activated: False, probability: 0.3 }
      # Random Perspective : corners moved inwards by up to 5% of half the width and height, border filled black;
      # refused for tasks with boxes, masks or keypoints
      random_perspective: { activated: False, probability: 0.3 }
      # Random Jigsaw : 2x2 pieces shuffled, breaking the global layout; refused for tasks with boxes, masks or
      # keypoints
      random_jigsaw: { activated: False, probability: 0.3 }

      # Photometric augmentations: boxes and masks unchanged.
      # Brightness (+-40 levels), contrast and saturation (x0.7 to x1.0)
      brightness_contrast_saturation: { activated: False, probability: 0.3 }
      # Random Hue : hue turned by up to 18 degrees (5% of the circle) either way
      random_hue: { activated: False, probability: 0.5 }
      # CLAHE, clip limit 2.0 on a 4x4 tile grid
      clahe_augment: { activated: False, probability: 0.3 }
      # Laplacian of Gaussian unsharp mask sharpening (sigma 1.5, strength 3)
      sharp_augment: { activated: False, probability: 0.3 }
      # Histogram equalization of the luminance (Y of YUV)
      equalize_histogram_augment: { activated: False, probability: 0.3 }
      # Histogram equalization of one random channel (B, G or R) or all three
      equalize_bgr_histogram_augment: { activated: False, probability: 0.3 }
      # Random Noise : Gaussian noise, standard deviation 20 levels
      random_noise: { activated: False, probability: 0.3 }
      # Grayscale, kept on three channels
      gray_scale_augment: { activated: False, probability: 0.3 }
      # Random Colour augmentation : BGR to RGB channel swap
      random_colour_augmentation: { activated: False, probability: 0.3 }
      # Random Gamma : gamma 0.8 to 1.25, darkening or lightening the mid-tones
      random_gamma: { activated: False, probability: 0.3 }
      # Random Linear Illumination : 13 to 38 level ramp across the image, brightening or darkening one side
      random_linear_illumination: { activated: False, probability: 0.3 }
      # Random Plasma Shadow : irregular fractal shadows darkening by up to 77 levels
      random_plasma_shadow: { activated: False, probability: 0.3 }
      # Random Blur : 9x9 Gaussian kernel, sigma 2.5
      random_blur: { activated: False, probability: 0.3 }
      # Random Motion Blurring : 5 to 15 pixel streak at 0 to 180 degrees (camera or object motion)
      random_motion_blur: { activated: False, probability: 0.3 }
      # Random Haze : uniform grey airlight of 180 to 255 levels taking 20% to 60% of every pixel, a camera fog (after
      # the blurs, before solarization, black-out and erasing)
      random_haze: { activated: True, probability: 0.3 }
      # Random Solarize : pixels at or above 128 levels inverted
      random_solarize: { activated: False, probability: 0.2 }
      # Random Black Out : grid_size x grid_size cells, each blacked out with probability 0.2 (after the other
      # photometric types but the erasing); labels unchanged, so a hidden object keeps its label
      random_black_out: { activated: False, probability: 0.3, grid_size: 8 }
      # Random Erasing : one black rectangle of 2% to 15% of the image, height / width 0.3 to 3.3, applied last; labels
      # unchanged
      random_erasing: { activated: False, probability: 0.3 }

Backbone:
  # Input channels of the first convolution block: 3, the loaders giving BGR images
  input_channels : 3

  # [convolutions, output filters] of every block.
  convolutions:
    {
      "1": [ 1, 16 ],
      "2": [ 2, 16 ],
      "3": [ 2, 16 ],
      "4": [ 3, 32 ],
      "5": [ 3, 32 ],
      "6": [ 5, 32 ],
      "7": [ 5, 32 ],
    }

  # Max pooling after the last block.
  last_max_pooling: False

  normalization:
    # Scales the inputs to [-0.5, 0.5].
    input_normalization: True

    # Normalizes every image to zero mean and unit variance (after input_normalization).
    per_sample_normalization: False

    # Feature map normalization: "batch", "layer" (over channels) or "none".
    feature_map_normalization: "batch"

  modules:
    # Residual shortcuts every two convolutions from block 2 (https://arxiv.org/abs/1512.03385).
    residual_nets: True

    # Pre-activation shortcuts (https://arxiv.org/abs/1603.05027): normalization and ReLU before every convolution.
    # Requires residual_nets; RES2 token instead of RES.
    residual_nets_v2: False

    # Inception modules (https://arxiv.org/abs/1409.4842), output channels multiples of 8.
    inception: False

    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True

  # Backbone of another run (any task) initialising this one. The layer settings (input_channels, convolutions, modules,
  # normalization, last_max_pooling) must match; detection levels and image size may differ.
  pretrained:
    # Run folder of the loaded backbone, null for random weights (not reloaded on resume).
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded backbone (no gradient, frozen batch statistics); needs experiment_folder.
    freeze: False
    # Freezes the scale and shift of the loaded backbone normalizations while its convolutions learn; needs
    # experiment_folder, freeze False and a normalization.
    freeze_normalization_parameters: False
    # Learning rate factor of the loaded backbone, e.g. 0.1 to train it 10x slower.
    learning_rate_multiplier: 1.0

# Detection levels: every key is the quoted number of a Backbone.convolutions block (from "1") whose feature map feeds
# the heads of the level, from the finest map to the coarsest. Every level has its own anchors, region proposal,
# detection and mask heads; the shared settings are in RegionProposal, Detector and MaskHead. Every proposal, detection
# and mask uses the heads and feature map of the level of its anchor.
DetectionLevels:
  "5":
    # Anchors per feature map position, one per scale and aspect ratio: a scale is the side in input pixels of a square
    # anchor, an aspect ratio the height / width at the same area. scales x aspect_ratios gives the outputs of the
    # region proposal head.
    anchors: { scales: [32, 64], aspect_ratios: [0.5, 1.0, 2.0] }
    # Region proposal head: [number_layers, output_channels] of its convolutions, before its objectness and box
    # regression layers.
    region_proposal: { convolutions: [2, 32] }
    # Detection head: RoIAlign grid side pooled per proposal, [number_layers, output_channels] of its convolutions
    # (multiples of 8 with Detector.modules.inception) and its fully connected sizes before the classifier and box
    # regressor.
    detector: { roi_align_pool_size: 7, convolutions: [2, 32], fully_connected: [64, 32] }
    # Mask head: RoIAlign grid side pooled per box (at most MaskHead.mask_resolution) and [number_layers,
    # output_channels] of its convolutions (multiples of 8 with MaskHead.modules.inception).
    mask_head: { roi_align_pool_size: 14, convolutions: [3, 32] }
  "6":
    anchors: { scales: [64, 128], aspect_ratios: [0.5, 1.0, 2.0] }
    region_proposal: { convolutions: [2, 32] }
    detector: { roi_align_pool_size: 7, convolutions: [2, 32], fully_connected: [64, 32] }
    mask_head: { roi_align_pool_size: 14, convolutions: [3, 32] }
  "7":
    anchors: { scales: [128, 256], aspect_ratios: [0.5, 1.0, 2.0] }
    region_proposal: { convolutions: [2, 32] }
    detector: { roi_align_pool_size: 7, convolutions: [2, 32], fully_connected: [64, 32] }
    mask_head: { roi_align_pool_size: 14, convolutions: [3, 32] }

RegionProposal:
  normalization:
    # "batch", "layer" (over channels) or "none"
    feature_map_normalization: "batch"
    # Momentum of the batch normalization running statistics: 0.1 follows about the last 10 batches, 0.01 the last 100.
    # No run name token, can change on resume.
    batch_normalization_momentum: 0.1
  training:
    # Top raw proposals kept per image before non-maximum suppression in training.
    pre_nms_proposals: 1000
    # Proposals kept per image after non-maximum suppression in training.
    post_nms_proposals: 500
  inference:
    # Top raw proposals kept per image before non-maximum suppression at inference.
    pre_nms_proposals: 500
    # Proposals kept per image after non-maximum suppression at inference.
    post_nms_proposals: 250
  foreground_iou_threshold:
    # Minimum IoU of a positive foreground anchor.
    min: 0.5
    # Maximum matching IoU (capped at 1.0).
    max: 1.0
  background_iou_threshold:
    # Minimum IoU of a strict background anchor. At 0.0 any anchor overlapping no object can be background; above it,
    # those are ignored and only hard negatives (anchors touching an object) are sampled, allowed with a yellow warning.
    min: 0.0
    # Maximum IoU of a strict background anchor.
    max: 0.3
  # IoU threshold of the non-maximum suppression of overlapping proposals.
  nms_iou_threshold: 0.7
  # Assigns the best-overlapping anchors as foreground even below the minimum threshold.
  strict_fallback_assignment: False
  # Positive foreground anchors sampled per image for the loss.
  number_training_positives: 128
  # Positive and negative anchors sampled per image.
  total_training_samples: 256
  # Smooth L1 beta of the box regression loss.
  localisation_loss_beta: 1/9
  # Region proposal heads of another DET or INS run initialising this one. Levels, per-level region_proposal and anchors
  # per position (scales x aspect_ratios), normalization and the channels of the feeding backbone blocks must match;
  # other anchor scales or ratios of the same counts are reported, not refused.
  pretrained:
    # Run folder of the loaded region proposal heads, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded heads (no gradient, frozen batch statistics). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded heads, e.g. 0.1 to train them 10x slower.
    learning_rate_multiplier: 1.0

Detector:
  normalization:
    # "batch", "layer" (over channels) or "none"
    feature_map_normalization: "batch"
    # Momentum of the batch normalization running statistics: 0.1 follows about the last 10 batches, 0.01 the last 100.
    # No run name token, can change on resume.
    batch_normalization_momentum: 0.1

  modules:
    # Residual nets (https://arxiv.org/abs/1512.03385)
    residual_nets: True

    # Inception modules (https://arxiv.org/abs/1409.4842); detection head output channels must be multiples of 8
    inception: False

    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: True

  inference:
    # Minimum class probability of a returned detection
    score_threshold: 0.5
    # Detections returned per image (padded), fixed for exportable outputs; at most
    # RegionProposal.inference.post_nms_proposals x the foreground classes.
    maximum_detections: 100
  # Minimum IoU for a sampled proposal to be a positive target.
  foreground_iou_threshold: 0.5
  # IoU threshold of the final per-class non-maximum suppression.
  nms_iou_threshold: 0.5
  # Most positive proposals sampled per image; the ground truth boxes fill its last proposal slots first, so every
  # object has a positive to sample.
  number_training_positives: 64
  # Positive and negative proposals sampled per image.
  total_training_samples: 128
  # Smooth L1 beta of the box regression loss.
  localisation_loss_beta: 1/9
  # Detection heads of another DET or INS run initialising this one, with their classification and per-class box layers.
  # Levels, per-level detectors, normalization, modules and the channels of the feeding backbone blocks must match. The
  # source classes (its data.json) must come first in this run, in order; appended classes stay random.
  pretrained:
    # Run folder of the loaded detection heads, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded heads (no gradient, frozen batch statistics), e.g. to train only the mask heads of an instance
    # segmentation run. Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded heads, e.g. 0.1 to train them 10x slower.
    learning_rate_multiplier: 1.0

MaskHead:
  # Side M of the square masks predicted per box, equal on every level since the level masks are concatenated for the
  # loss and the export (28 gives the 28 x 28 masks of Mask R-CNN), one mask per class, the detected class channel being
  # kept. Every level doubles its pooled features as often as fits in M, resizing bilinearly to M when one more doubling
  # would exceed it: a pool size of 14 doubles once, 7 twice, 10 once to 20 then resized to 28.
  mask_resolution: 28
  # Pooled feature doubling: "transposed" (learned 2x2 transposed convolution) or "bilinear" (bilinear upsampling then a
  # 3x3 convolution), each followed by a ReLU.
  upsampling: "transposed"
  normalization:
    # "batch", "layer" (over channels) or "none"
    feature_map_normalization: "batch"
    # Momentum of the batch normalization running statistics: 0.1 follows about the last 10 batches, 0.01 the last 100.
    # No run name token, can change on resume.
    batch_normalization_momentum: 0.1
  modules:
    # Residual nets (https://arxiv.org/abs/1512.03385)
    residual_nets: True
    # Inception modules (https://arxiv.org/abs/1409.4842); mask head output channels must be multiples of 8
    inception: False
    # Squeeze and excitation (https://arxiv.org/abs/1709.01507).
    squeeze_and_excite: False
  inference:
    # Mask probability from which a pixel belongs to its object, for the mask AP, the sample images and the clients
    # pasting the exported masks; within [0, 1].
    mask_threshold: 0.5
  # Mask heads of another INS run initialising this one. Mask resolution, upsampling, normalization, modules, per-level
  # mask_head, levels and the channels of the feeding backbone blocks must match. The source classes (its data.json)
  # must come first in this run, in order; appended classes keep random mask channels.
  pretrained:
    # Run folder of the loaded mask heads, null for random weights; not reloaded when the run resumes.
    experiment_folder: null
    # Checkpoint iteration, null for the last one.
    iteration: null
    # Freezes the loaded heads (no gradient, frozen batch statistics). Requires experiment_folder.
    freeze: False
    # Learning rate factor of the loaded heads, e.g. 0.1 to train them 10x slower.
    learning_rate_multiplier: 1.0
