# Triton Inference Server serving the exported models of the model repository, of every task.
# The repository is filled by vision_training/deployment/export_model.py (one folder per model, holding its
# config.pbtxt and a version folder "1" with the exported model file), e.g. for the object detector:
#   served_models/object_detector_torchscript/1/model.pt    (TorchScript, PyTorch libtorch backend)
#   served_models/object_detector_onnx/1/model.onnx         (ONNX, ONNX Runtime backend accelerated by TensorRT)
# and likewise image_classifier_*, sequence_classifier_*, sequence_labeller_* and sequence_comparator_* for the other
# tasks.
# Start it from this folder with "docker compose up", keep it running, and query it with
# vision_training/deployment/run_inference.py.
# Explicit project name, so that this server never collides with another compose project in a folder also
# named "triton" (compose derives the default project name from the folder name)
name: object-detection-triton
services:
  tritonserver:
    container_name: object-detection-triton-server
    # Triton 2.65 (arm64 build for the DGX Spark), with the pytorch, onnxruntime and tensorrt backends
    image: nvcr.io/nvidia/tritonserver:26.01-py3
    # Expose the GPU of the machine to the container
    runtime: nvidia
    ports:
      # HTTP endpoint (health checks: curl localhost:8000/v2/health/ready)
      - "8000:8000"
      # gRPC endpoint used by the inference client
      - "8001:8001"
      # Prometheus metrics endpoint
      - "8002:8002"
    volumes:
      # Local model repository : path inside the container
      - "./served_models:/served_models"
    # Share the inter-process communication namespace (and so /dev/shm) of the machine, so that Triton reads the image
    # batches the inference client writes to system shared memory instead of receiving them over gRPC. It also gives
    # Triton and its backends the whole shared memory of the machine for the tensors they exchange
    ipc: host
    command: tritonserver --model-repository=/served_models
